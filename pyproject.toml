[project]
name = "bodhi"
version = "0.1.0"
description = "Bodhi: Knowledge graph extraction and resolution system."
authors = [
    { name = "Prophet System Team" }
]
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }

dependencies = [
    "networkx>=3.0",
    "pyyaml>=6.0",
    "omegaconf>=2.3.0",
    "langgraph>=0.0.1",
    "spacy>=3.0.0",
    "sentence-transformers>=2.2.2",
    "pymupdf4llm>=0.0.27",
    "Sanchayam>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"