# LLM configurations
fast_model: "gemini-2.5-flash-lite"
general_model: "gemini-2.5-flash-lite"
thinking_model: "gemini-2.5-pro"
inference_engine: "vertexai"

# Storage configurations
storage_backend: "LocalStorage"
storage_dir: "tests/storage"

# KG Extraction configurations
max_num_threads: 18 # Maximum number of parallel threads for KG extraction
token_limit: 300 # Text unit token length

# Ablation parameters
priming: True # Default value
generic_type_allowance: True # Default value

# seed variable for multi sampling 
seed: 0
