chunk_indices:
- 0
entities:
- description: A novel deep generative model for computer-aided drug discovery that
    generates 'hit-like' molecules from gene expression profiles by leveraging two
    joint variational autoencoders (ProfileVAE and MolVAE).
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: A component of GxVAEs that extracts latent features from gene expression
    data.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: A component of GxVAEs that generates molecules conditioned on features
    extracted by ProfileVAE.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Molecules with potential bioactivity and drug-likeness, generated by
    GxVAEs.
  name: hit-like molecules
  source_chunk_index: 0
  type: generic
- description: Data reflecting cellular activity, used as input for GxVAEs to generate
    molecules.
  name: gene expression profiles
  source_chunk_index: 0
  type: dataset
- description: A baseline model used for comparison with GxVAEs, particularly in generating
    ligand-like molecules from gene expression profiles.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: A state-of-the-art model compared against GxVAEs for generating therapeutic
    molecules from patient gene expression profiles.
  name: DRAGONET
  source_chunk_index: 0
  type: method
- description: A measure of structural similarity used to evaluate the quality of
    generated molecules, comparing GxVAEs to baseline models.
  name: Tanimoto coefficients
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the proportion of generated molecules that
    are chemically valid.
  name: validity
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the proportion of generated molecules that
    are unique within a generated set.
  name: uniqueness
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the proportion of generated molecules that
    are not present in the training dataset.
  name: novelty
  source_chunk_index: 0
  type: generic
- description: A disease for which GxVAEs generated candidate therapeutic molecules,
    showing structural similarity to approved drugs.
  name: atopic dermatitis
  source_chunk_index: 0
  type: generic
- description: A disease for which GxVAEs generated candidate therapeutic molecules
    with structural features similar to known approved drugs.
  name: gastric cancer
  source_chunk_index: 0
  type: generic
- description: A disease for which GxVAEs generated candidate therapeutic molecules
    with structural features similar to known approved drugs.
  name: Alzheimer's disease
  source_chunk_index: 0
  type: generic
- description: A string-based representation of molecular structures used in the GxVAEs
    model.
  name: SMILES strings
  source_chunk_index: 0
  type: generic
