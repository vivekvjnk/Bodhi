chunk_indices:
- 0
entities:
- description: A database used to collect chemically induced gene expression profiles,
    specifically profiles of MCF7 cell line treated with molecules.
  name: LINCS L1000 database
  source_chunk_index: 0
  type: DATASET
- description: A database used to collect disease-specific gene expression profiles.
  name: CREEDS database
  source_chunk_index: 0
  type: DATASET
- description: 'A novel deep generative model for computer-aided drug discovery that
    generates ''hit-like'' molecules from gene expression profiles by leveraging two
    joint variational autoencoders (VAEs): ProfileVAE and MolVAE.'
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: One of the two joint VAEs in GxVAEs, responsible for extracting latent
    features from gene expression data.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second joint VAE in GxVAEs, which uses features extracted by ProfileVAE
    as conditions to generate molecules.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Data reflecting cellular activity, used as input for ProfileVAE to
    extract features.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Molecules with potential bioactivity and drug-likeness, the target
    output of GxVAEs.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: A linear notation for describing the structure of chemical molecules,
    used by MolVAE for molecular generation.
  name: SMILES Strings
  source_chunk_index: 0
  type: generic
- description: A state-of-the-art deep generative model that bridges systems biology
    and molecular design, but has limitations in molecule validity and reproducing
    known ligands.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A state-of-the-art deep generative model that calculates ligand-target
    interaction correlations and uses a VAE for molecule generation, but its VAE is
    not involved in the generation process.
  name: TRI-OMPHE
  source_chunk_index: 0
  type: method
- description: A metric evaluating the ratio of chemically valid molecules generated,
    verifiable using tools like RDKit.
  name: Validity
  source_chunk_index: 0
  type: generic
- description: Metrics used to measure structural similarity between generated molecules
    and known molecules.
  name: Tanimoto Coefficients
  source_chunk_index: 0
  type: generic
- description: A baseline model used for comparison with GxVAEs, demonstrating GxVAEs'
    ability to generate molecules with therapeutic potential.
  name: DRAGONET
  source_chunk_index: 0
  type: method
- description: Variant SMILES strings used by MolVAE, conditioned on gene expression
    profile features for molecule generation.
  name: Non-canonical SMILES
  source_chunk_index: 0
  type: generic
