entities:
- description: A traditional experimental approach for identifying molecules with
    desired bioactivity, often characterized by a low hit rate and labor-intensive
    processes.
  name: High-Throughput Screening (HTS)
  source_chunk_index: 0
  type: METHOD
- description: A novel deep generative model for computer-aided drug discovery that
    generates 'hit-like' molecules from gene expression profiles by leveraging two
    joint variational autoencoders (VAEs).
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first variational autoencoder (VAE) in GxVAEs, responsible for
    extracting latent features from gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second variational autoencoder (VAE) in GxVAEs, which uses latent
    features from ProfileVAE as conditions to generate molecules.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Data reflecting cellular activity, used as input for ProfileVAE to
    extract latent features.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Molecules with potential bioactivity and drug-likeness, the target
    output of GxVAEs.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: The field of study focused on using computational methods to discover
    new drugs, which GxVAEs contributes to.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: A class of deep generative models used in GxVAEs for feature extraction
    and molecule generation.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: Simplified Molecular Input Line Entry System strings, a common representation
    for molecules used in de novo molecular generation.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: The biological context of a cell, which GxVAEs aims to bridge with
    molecular generation to produce biologically meaningful molecules.
  name: Cellular Environment
  source_chunk_index: 0
  type: generic
- description: The ability of a molecule to produce a biological effect, a desired
    characteristic of 'hit-like' molecules.
  name: Bioactivity
  source_chunk_index: 0
  type: generic
- description: The degree to which a molecule possesses properties that make it suitable
    as a drug, a desired characteristic of 'hit-like' molecules.
  name: Drug-likeness
  source_chunk_index: 0
  type: generic
- description: A category of AI models, including GANs and VAEs, used to generate
    new data, such as molecules with specific properties.
  name: Deep Generative Models
  source_chunk_index: 0
  type: method
- description: A database used to collect chemically induced gene expression profiles,
    specifically profiles of MCF7 cell line treated with molecules.
  name: LINCS L1000 database
  source_chunk_index: 1
  type: DATASET
- description: A database used to collect disease-specific gene expression profiles.
  name: CREEDS database
  source_chunk_index: 1
  type: DATASET
- description: 'A novel deep generative model for computer-aided drug discovery that
    generates ''hit-like'' molecules from gene expression profiles by leveraging two
    joint variational autoencoders (VAEs): ProfileVAE and MolVAE.'
  name: GxVAEs
  source_chunk_index: 1
  type: method
- description: One of the two joint VAEs in GxVAEs, responsible for extracting latent
    features from gene expression data.
  name: ProfileVAE
  source_chunk_index: 1
  type: method
- description: The second joint VAE in GxVAEs, which uses features extracted by ProfileVAE
    as conditions to generate molecules.
  name: MolVAE
  source_chunk_index: 1
  type: method
- description: Data reflecting cellular activity, used as input for ProfileVAE to
    extract features.
  name: Gene Expression Profiles
  source_chunk_index: 1
  type: dataset
- description: Molecules with potential bioactivity and drug-likeness, the target
    output of GxVAEs.
  name: Hit-like Molecules
  source_chunk_index: 1
  type: generic
- description: A linear notation for describing the structure of chemical molecules,
    used by MolVAE for molecular generation.
  name: SMILES Strings
  source_chunk_index: 1
  type: generic
- description: A state-of-the-art deep generative model that bridges systems biology
    and molecular design, but has limitations in molecule validity and reproducing
    known ligands.
  name: ExpressionGAN
  source_chunk_index: 1
  type: method
- description: A state-of-the-art deep generative model that calculates ligand-target
    interaction correlations and uses a VAE for molecule generation, but its VAE is
    not involved in the generation process.
  name: TRI-OMPHE
  source_chunk_index: 1
  type: method
- description: A metric evaluating the ratio of chemically valid molecules generated,
    verifiable using tools like RDKit.
  name: Validity
  source_chunk_index: 1
  type: generic
- description: Metrics used to measure structural similarity between generated molecules
    and known molecules.
  name: Tanimoto Coefficients
  source_chunk_index: 1
  type: generic
- description: A baseline model used for comparison with GxVAEs, demonstrating GxVAEs'
    ability to generate molecules with therapeutic potential.
  name: DRAGONET
  source_chunk_index: 1
  type: method
- description: Variant SMILES strings used by MolVAE, conditioned on gene expression
    profile features for molecule generation.
  name: Non-canonical SMILES
  source_chunk_index: 1
  type: generic
- description: A novel deep generative model for computer-aided drug discovery that
    generates 'hit-like' molecules from gene expression profiles by leveraging two
    joint variational autoencoders (ProfileVAE and MolVAE).
  name: GxVAEs
  source_chunk_index: 2
  type: method
- description: A component of GxVAEs that extracts latent features from gene expression
    data.
  name: ProfileVAE
  source_chunk_index: 2
  type: method
- description: A component of GxVAEs that generates molecules conditioned on features
    extracted by ProfileVAE.
  name: MolVAE
  source_chunk_index: 2
  type: method
- description: Molecules with potential bioactivity and drug-likeness, generated by
    GxVAEs.
  name: hit-like molecules
  source_chunk_index: 2
  type: generic
- description: Data reflecting cellular activity, used as input for GxVAEs to generate
    molecules.
  name: gene expression profiles
  source_chunk_index: 2
  type: dataset
- description: A baseline model used for comparison with GxVAEs, particularly in generating
    ligand-like molecules from gene expression profiles.
  name: TRIOMPHE
  source_chunk_index: 2
  type: method
- description: A state-of-the-art model compared against GxVAEs for generating therapeutic
    molecules from patient gene expression profiles.
  name: DRAGONET
  source_chunk_index: 2
  type: method
- description: A measure of structural similarity used to evaluate the quality of
    generated molecules, comparing GxVAEs to baseline models.
  name: Tanimoto coefficients
  source_chunk_index: 2
  type: generic
- description: A metric used to evaluate the proportion of generated molecules that
    are chemically valid.
  name: validity
  source_chunk_index: 2
  type: generic
- description: A metric used to evaluate the proportion of generated molecules that
    are unique within a generated set.
  name: uniqueness
  source_chunk_index: 2
  type: generic
- description: A metric used to evaluate the proportion of generated molecules that
    are not present in the training dataset.
  name: novelty
  source_chunk_index: 2
  type: generic
- description: A disease for which GxVAEs generated candidate therapeutic molecules,
    showing structural similarity to approved drugs.
  name: atopic dermatitis
  source_chunk_index: 2
  type: generic
- description: A disease for which GxVAEs generated candidate therapeutic molecules
    with structural features similar to known approved drugs.
  name: gastric cancer
  source_chunk_index: 2
  type: generic
- description: A disease for which GxVAEs generated candidate therapeutic molecules
    with structural features similar to known approved drugs.
  name: Alzheimer's disease
  source_chunk_index: 2
  type: generic
- description: A string-based representation of molecular structures used in the GxVAEs
    model.
  name: SMILES strings
  source_chunk_index: 2
  type: generic
