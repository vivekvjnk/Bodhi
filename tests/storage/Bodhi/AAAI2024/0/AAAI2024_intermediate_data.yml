entities:
- description: A traditional experimental approach for identifying molecules with
    desired bioactivity, often characterized by a low hit rate and labor-intensive
    processes.
  name: High-Throughput Screening (HTS)
  source_chunk_index: 0
  type: METHOD
- description: A novel deep generative model for computer-aided drug discovery that
    generates 'hit-like' molecules from gene expression profiles by leveraging two
    joint variational autoencoders (VAEs).
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first variational autoencoder (VAE) in GxVAEs, responsible for
    extracting latent features from gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second variational autoencoder (VAE) in GxVAEs, which uses latent
    features from ProfileVAE as conditions to generate molecules.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Data reflecting cellular activity, used as input for ProfileVAE to
    extract latent features.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Molecules with potential bioactivity and drug-likeness, the target
    output of GxVAEs.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: The field of study focused on using computational methods to discover
    new drugs, which GxVAEs contributes to.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: A class of deep generative models used in GxVAEs for feature extraction
    and molecule generation.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: Simplified Molecular Input Line Entry System strings, a common representation
    for molecules used in de novo molecular generation.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: The biological context of a cell, which GxVAEs aims to bridge with
    molecular generation to produce biologically meaningful molecules.
  name: Cellular Environment
  source_chunk_index: 0
  type: generic
- description: The ability of a molecule to produce a biological effect, a desired
    characteristic of 'hit-like' molecules.
  name: Bioactivity
  source_chunk_index: 0
  type: generic
- description: The degree to which a molecule possesses properties that make it suitable
    as a drug, a desired characteristic of 'hit-like' molecules.
  name: Drug-likeness
  source_chunk_index: 0
  type: generic
- description: A category of AI models, including GANs and VAEs, used to generate
    new data, such as molecules with specific properties.
  name: Deep Generative Models
  source_chunk_index: 0
  type: method
