chunk_indices:
- 0
entities:
- description: The process of creating new molecules with desired chemical properties
    and bioactivity, a key task in computer-aided drug discovery, which GxVAEs aims
    to improve by incorporating biological context.
  name: De Novo Molecular Generation
  source_chunk_index: 0
  type: TASK
- description: 'A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments, specifically gene expression
    profiles, into the molecular generation process. It comprises two joint Variational
    Autoencoders (VAEs): ProfileVAE and MolVAE.'
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first Variational Autoencoder (VAE) in the GxVAEs architecture,
    responsible for processing high-dimensional gene expression profiles to derive
    low-dimensional latent features.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second Variational Autoencoder (VAE) in the GxVAEs architecture,
    which utilizes the latent features extracted by ProfileVAE as conditional inputs
    to generate hit-like molecules. It employs bidirectional GRUs and non-canonical
    SMILES strings.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: High-dimensional biological data representing the activity of genes,
    used as input for the ProfileVAE in GxVAEs to derive latent features that guide
    molecular generation.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Low-dimensional representations derived from gene expression profiles
    by ProfileVAE, used as conditional inputs for MolVAE to guide the generation of
    biologically meaningful molecules.
  name: Latent Features
  source_chunk_index: 0
  type: dataset
- description: A field that utilizes computational methods and artificial intelligence
    to accelerate the process of discovering new drugs, including tasks like de novo
    molecular generation.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: A class of deep generative models used in GxVAEs, consisting of an
    encoder and a decoder, that learn a probabilistic mapping from input data to a
    latent space and then reconstruct the data from the latent space.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: A linear notation for describing the structure of chemical molecules,
    used by the MolVAE component of GxVAEs for molecular representation.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: A state-of-the-art deep generative model that is a baseline for comparison
    with GxVAEs, which calculates the correlation of ligand-target interactions between
    transcriptome profiles and uses a VAE for molecule generation.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: A GAN model that bridges systems biology and molecular design to produce
    molecules with a high probability of inducing desired transcriptome features from
    gene expression profiles, serving as a baseline for comparison.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: Molecules generated by GxVAEs that exhibit desired bioactivity and
    drug-like properties, making them promising candidates for further drug development.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: The biological context, specifically represented by gene expression
    profiles, that GxVAEs considers during molecular generation to produce molecules
    that are biologically meaningful for specific diseases.
  name: Cellular Environment
  source_chunk_index: 0
  type: generic
