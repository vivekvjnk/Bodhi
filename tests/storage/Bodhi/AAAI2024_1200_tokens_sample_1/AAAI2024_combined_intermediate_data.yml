entities:
- description: The process of creating new molecules with desired chemical properties
    and bioactivity, a key task in computer-aided drug discovery, which GxVAEs aims
    to improve by incorporating biological context.
  name: De Novo Molecular Generation
  source_chunk_index: 0
  type: TASK
- description: 'A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments, specifically gene expression
    profiles, into the molecular generation process. It comprises two joint Variational
    Autoencoders (VAEs): ProfileVAE and MolVAE.'
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first Variational Autoencoder (VAE) in the GxVAEs architecture,
    responsible for processing high-dimensional gene expression profiles to derive
    low-dimensional latent features.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second Variational Autoencoder (VAE) in the GxVAEs architecture,
    which utilizes the latent features extracted by ProfileVAE as conditional inputs
    to generate hit-like molecules. It employs bidirectional GRUs and non-canonical
    SMILES strings.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: High-dimensional biological data representing the activity of genes,
    used as input for the ProfileVAE in GxVAEs to derive latent features that guide
    molecular generation.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Low-dimensional representations derived from gene expression profiles
    by ProfileVAE, used as conditional inputs for MolVAE to guide the generation of
    biologically meaningful molecules.
  name: Latent Features
  source_chunk_index: 0
  type: dataset
- description: A field that utilizes computational methods and artificial intelligence
    to accelerate the process of discovering new drugs, including tasks like de novo
    molecular generation.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: A class of deep generative models used in GxVAEs, consisting of an
    encoder and a decoder, that learn a probabilistic mapping from input data to a
    latent space and then reconstruct the data from the latent space.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: A linear notation for describing the structure of chemical molecules,
    used by the MolVAE component of GxVAEs for molecular representation.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: A state-of-the-art deep generative model that is a baseline for comparison
    with GxVAEs, which calculates the correlation of ligand-target interactions between
    transcriptome profiles and uses a VAE for molecule generation.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: A GAN model that bridges systems biology and molecular design to produce
    molecules with a high probability of inducing desired transcriptome features from
    gene expression profiles, serving as a baseline for comparison.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: Molecules generated by GxVAEs that exhibit desired bioactivity and
    drug-like properties, making them promising candidates for further drug development.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: The biological context, specifically represented by gene expression
    profiles, that GxVAEs considers during molecular generation to produce molecules
    that are biologically meaningful for specific diseases.
  name: Cellular Environment
  source_chunk_index: 0
  type: generic
- description: A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments (gene expression profiles)
    into the molecular generation process.
  name: GxVAEs
  source_chunk_index: 1
  type: method
- description: One of the two joint Variational Autoencoders (VAEs) in GxVAEs, acting
    as a feature extractor for gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 1
  type: method
- description: The second joint Variational Autoencoder (VAE) in GxVAEs, which generates
    hit-like molecules conditioned on latent features from ProfileVAE, utilizing bidirectional
    GRUs and non-canonical SMILES strings.
  name: MolVAE
  source_chunk_index: 1
  type: method
- description: High-dimensional biological data representing the activity of genes,
    used by GxVAEs to inform molecular generation based on cellular environments.
  name: Gene Expression Profiles
  source_chunk_index: 1
  type: dataset
- description: Simplified Molecular Input Line Entry System, a linear notation for
    describing the structure of chemical molecules. GxVAEs uses non-canonical SMILES
    strings.
  name: SMILES
  source_chunk_index: 1
  type: generic
- description: A database used to collect chemically induced gene expression profiles,
    specifically profiles of MCF7 cell line treated with various molecules.
  name: LINCS L1000 database
  source_chunk_index: 1
  type: dataset
- description: Crowd extracted expression of differential signatures database, used
    to collect disease-specific gene expression profiles.
  name: CREEDS database
  source_chunk_index: 1
  type: dataset
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs.
  name: TRIOMPHE
  source_chunk_index: 1
  type: method
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs, particularly for disease reversal profiles.
  name: DRAGONET
  source_chunk_index: 1
  type: method
- description: A metric for molecular generation, referring to the ratio of chemically
    valid molecules that can be verified in practice using tools like RDKit.
  name: Validity
  source_chunk_index: 1
  type: task
- description: A metric for molecular generation, measuring the proportion of generated
    molecules that are distinct from each other.
  name: Uniqueness
  source_chunk_index: 1
  type: task
- description: A metric for molecular generation, assessing the extent to which generated
    molecules are new and not present in existing datasets.
  name: Novelty
  source_chunk_index: 1
  type: task
- description: A measure of similarity between two molecular structures, used to evaluate
    the quality and similarity of generated molecules to known ligands or approved
    drugs.
  name: Tanimoto Coefficient
  source_chunk_index: 1
  type: task
- description: The field of using computational methods to assist in the discovery
    and design of new drugs, which GxVAEs contributes to.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 1
  type: task
- description: 'A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) into the molecular
    generation process. It comprises two joint Variational Autoencoders (VAEs): ProfileVAE
    and MolVAE.'
  name: GxVAEs
  source_chunk_index: 2
  type: method
- description: One of the two joint Variational Autoencoders (VAEs) in GxVAEs. It
    acts as a feature extractor, processing high-dimensional gene expression profiles
    to derive low-dimensional latent features.
  name: ProfileVAE
  source_chunk_index: 2
  type: method
- description: The second of the two joint Variational Autoencoders (VAEs) in GxVAEs.
    It utilizes latent features from ProfileVAE as conditional inputs to generate
    hit-like molecules, employing bidirectional GRUs and non-canonical SMILES strings.
  name: MolVAE
  source_chunk_index: 2
  type: method
- description: High-dimensional biological data representing the activity of genes
    in cellular environments. GxVAEs uses these profiles to guide molecular generation,
    considering disease-specific contexts.
  name: Gene Expression Profiles
  source_chunk_index: 2
  type: dataset
- description: A specific disease for which GxVAEs generated molecules with structural
    features similar to known approved drugs, indicating potential therapeutic properties.
  name: Gastric Cancer
  source_chunk_index: 2
  type: task
- description: A specific disease for which GxVAEs generated molecules with structural
    features similar to known approved drugs, indicating potential therapeutic properties.
  name: Alzheimer's Disease
  source_chunk_index: 2
  type: task
- description: A state-of-the-art baseline model for molecular generation. GxVAEs
    demonstrated superior performance compared to DRAGONET in generating molecules
    with higher therapeutic properties.
  name: DRAGONET
  source_chunk_index: 2
  type: method
- description: The representation space within the VAE architecture. The size of the
    latent space in GxVAEs can influence the diversity of the generated molecules.
  name: Latent Space
  source_chunk_index: 2
  type: generic
- description: A type of recurrent neural network architecture used within MolVAE
    for processing sequential molecular data (SMILES strings).
  name: Bidirectional GRUs
  source_chunk_index: 2
  type: method
- description: Simplified Molecular Input Line Entry System strings, a linear notation
    for describing the structure of chemical molecules. GxVAEs uses non-canonical
    SMILES strings for molecular representation.
  name: SMILES Strings
  source_chunk_index: 2
  type: dataset
- description: The potential of generated molecules to be effective in treating diseases.
    GxVAEs aims to generate molecules with higher therapeutic properties by considering
    cellular environments.
  name: Therapeutic Properties
  source_chunk_index: 2
  type: generic
- description: Molecules that exhibit desirable properties, often identified in early
    stages of drug discovery. GxVAEs is designed to generate these types of molecules.
  name: Hit-like Molecules
  source_chunk_index: 2
  type: generic
