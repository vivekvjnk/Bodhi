chunk_indices:
- 0
entities:
- description: 'A novel deep generative model for computer-aided drug discovery that
    generates ''hit-like'' molecules from gene expression profiles by leveraging two
    joint variational autoencoders (VAEs): ProfileVAE and MolVAE.'
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: A component of GxVAEs responsible for extracting latent features from
    gene expression data.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: A component of GxVAEs that uses latent features from ProfileVAE as
    conditions to generate molecules.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: A baseline model used for comparison with GxVAEs, particularly in generating
    ligand-like molecules from gene expression profiles.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: A model developed by Yamanaka et al. (2023) used for comparison with
    GxVAEs in generating therapeutic molecules from patient gene expression profiles.
  name: DRAGONET
  source_chunk_index: 0
  type: method
- description: Data reflecting cellular activity, used as input for GxVAEs to generate
    biologically relevant molecules.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: A linear notation for describing the structure of chemical molecules,
    used for molecular representation in the study.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: Molecules with potential bioactivity and drug-likeness, generated by
    GxVAEs.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: A performance metric for generative models, indicating the proportion
    of generated molecules that are chemically valid.
  name: Validity
  source_chunk_index: 0
  type: generic
- description: A performance metric for generative models, measuring the proportion
    of distinct molecules generated.
  name: Uniqueness
  source_chunk_index: 0
  type: generic
- description: A performance metric for generative models, assessing the proportion
    of generated molecules that are not present in the training dataset.
  name: Novelty
  source_chunk_index: 0
  type: generic
- description: A measure of structural similarity between molecules, used to evaluate
    the quality of generated molecules.
  name: Tanimoto Coefficient
  source_chunk_index: 0
  type: generic
- description: A disease for which GxVAEs has demonstrated the ability to generate
    therapeutic molecules.
  name: Atopic Dermatitis
  source_chunk_index: 0
  type: task
- description: A disease for which GxVAEs has demonstrated the ability to generate
    therapeutic molecules.
  name: Gastric Cancer
  source_chunk_index: 0
  type: task
- description: A disease for which GxVAEs has demonstrated the ability to generate
    therapeutic molecules.
  name: Alzheimer's Disease
  source_chunk_index: 0
  type: task
