chunk_indices:
- 0
entities:
- description: A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments (gene expression profiles)
    into the molecular generation process, aiming to produce biologically meaningful
    molecules.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first Variational Autoencoder (VAE) in GxVAEs, responsible for
    processing high-dimensional gene expression profiles to derive low-dimensional
    latent features that encapsulate biological information.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second Variational Autoencoder (VAE) in GxVAEs, guided by latent
    features from ProfileVAE, which generates hit-like molecules using non-canonical
    SMILES strings and bidirectional GRUs.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: High-dimensional biological data representing the activity of genes,
    used by GxVAEs to inform molecular generation based on cellular environments and
    disease states.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Low-dimensional representations derived from gene expression profiles
    by ProfileVAE, serving as conditional inputs for MolVAE to guide molecule generation.
  name: Latent Features
  source_chunk_index: 0
  type: dataset
- description: Molecules generated by GxVAEs that exhibit potential bioactivity and
    drug-like properties, relevant for drug discovery.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: The field focused on using computational methods and AI to accelerate
    the process of discovering new drugs.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: A class of AI models, including GANs and VAEs, capable of learning
    data distributions and generating new data samples, applied here for molecular
    generation.
  name: Deep Generative Models
  source_chunk_index: 0
  type: method
- description: A type of deep generative model that learns a probabilistic mapping
    from input data to a latent space and back, used as core components in GxVAEs.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: A linear notation for describing the structure of chemical molecules,
    used by MolVAE for molecular representation and generation.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: A type of recurrent neural network architecture used within MolVAE,
    capable of processing sequential data in both forward and backward directions.
  name: Bidirectional GRUs
  source_chunk_index: 0
  type: method
- description: A training strategy for recurrent neural networks where the ground
    truth output from the previous time step is fed as input to the current time step,
    used to stabilize MolVAE training.
  name: Teacher Forcing
  source_chunk_index: 0
  type: method
- description: A state-of-the-art deep generative model that bridges systems biology
    and molecular design using GANs to produce molecules from gene expression profiles,
    serving as a baseline for comparison with GxVAEs.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A state-of-the-art deep generative model that utilizes gene expression
    profiles and VAEs for molecular generation, particularly for target proteins,
    serving as a baseline for comparison with GxVAEs.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
