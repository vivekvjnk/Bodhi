chunk_indices:
- 0
- 1
entities:
- description: A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments (gene expression profiles)
    into the molecular generation process, aiming to produce biologically meaningful
    molecules.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first Variational Autoencoder (VAE) in GxVAEs, responsible for
    processing high-dimensional gene expression profiles to derive low-dimensional
    latent features that encapsulate biological information.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second Variational Autoencoder (VAE) in GxVAEs, guided by latent
    features from ProfileVAE, which generates hit-like molecules using non-canonical
    SMILES strings and bidirectional GRUs.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: High-dimensional biological data representing the activity of genes,
    used by GxVAEs to inform molecular generation based on cellular environments and
    disease states.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Low-dimensional representations derived from gene expression profiles
    by ProfileVAE, serving as conditional inputs for MolVAE to guide molecule generation.
  name: Latent Features
  source_chunk_index: 0
  type: dataset
- description: Molecules generated by GxVAEs that exhibit potential bioactivity and
    drug-like properties, relevant for drug discovery.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: The field focused on using computational methods and AI to accelerate
    the process of discovering new drugs.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: A class of AI models, including GANs and VAEs, capable of learning
    data distributions and generating new data samples, applied here for molecular
    generation.
  name: Deep Generative Models
  source_chunk_index: 0
  type: method
- description: A type of deep generative model that learns a probabilistic mapping
    from input data to a latent space and back, used as core components in GxVAEs.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: A linear notation for describing the structure of chemical molecules,
    used by MolVAE for molecular representation and generation.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: A type of recurrent neural network architecture used within MolVAE,
    capable of processing sequential data in both forward and backward directions.
  name: Bidirectional GRUs
  source_chunk_index: 0
  type: method
- description: A training strategy for recurrent neural networks where the ground
    truth output from the previous time step is fed as input to the current time step,
    used to stabilize MolVAE training.
  name: Teacher Forcing
  source_chunk_index: 0
  type: method
- description: A state-of-the-art deep generative model that bridges systems biology
    and molecular design using GANs to produce molecules from gene expression profiles,
    serving as a baseline for comparison with GxVAEs.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A state-of-the-art deep generative model that utilizes gene expression
    profiles and VAEs for molecular generation, particularly for target proteins,
    serving as a baseline for comparison with GxVAEs.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: 'A novel deep generative method for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) into the molecular
    generation process. It comprises two joint Variational Autoencoders (VAEs): ProfileVAE
    and MolVAE.'
  name: GxVAEs
  source_chunk_index: 1
  type: method
- description: One of the two joint Variational Autoencoders (VAEs) in GxVAEs. It
    acts as a feature extractor, processing high-dimensional gene expression profiles
    to derive low-dimensional latent features that encapsulate biological information
    relevant to specific cellular environments or diseases.
  name: ProfileVAE
  source_chunk_index: 1
  type: method
- description: The second of the two joint Variational Autoencoders (VAEs) in GxVAEs.
    Guided by latent features from ProfileVAE, it generates hit-like molecules using
    non-canonical SMILES strings and bidirectional GRUs, with teacher forcing for
    stable training.
  name: MolVAE
  source_chunk_index: 1
  type: method
- description: A database used to collect chemically induced gene expression profiles,
    specifically from MCF7 cell lines treated with various molecules.
  name: LINCS L1000 database
  source_chunk_index: 1
  type: dataset
- description: A database used to collect disease-specific gene expression profiles,
    specifically differential signatures.
  name: CREEDS database
  source_chunk_index: 1
  type: dataset
- description: A metric used to evaluate generated molecules, referring to the ratio
    of chemically valid molecules that can be verified in practice using tools like
    RDKit.
  name: Validity
  source_chunk_index: 1
  type: method
- description: A metric used to evaluate generated molecules, indicating the proportion
    of generated molecules that are distinct from each other.
  name: Uniqueness
  source_chunk_index: 1
  type: method
- description: A measure of similarity between two molecules, used to assess the structural
    similarity of generated molecules to known ligands or approved drugs.
  name: Tanimoto Coefficients
  source_chunk_index: 1
  type: method
- description: A quantitative estimate of how likely a molecule is to be a drug, used
    as a metric for evaluating generated molecules.
  name: Drug-likeness (QED)
  source_chunk_index: 1
  type: method
- description: A state-of-the-art method used for comparison with GxVAEs in therapeutic
    molecule generation, particularly for disease reversal profiles.
  name: DRAGONET
  source_chunk_index: 1
  type: method
- description: A state-of-the-art method used for comparison with GxVAEs, particularly
    in generating valid molecules from gene expression profiles.
  name: ExpressionGAN
  source_chunk_index: 1
  type: method
- description: A baseline method used for comparison with GxVAEs, demonstrating GxVAEs'
    superior performance in generating valid and unique molecules with high Tanimoto
    coefficients.
  name: TRIOMPHE
  source_chunk_index: 1
  type: method
- description: High-dimensional biological data representing the activity of genes
    in specific cellular environments or diseases. Used as input for ProfileVAE to
    extract relevant biological features.
  name: Gene Expression Profiles
  source_chunk_index: 1
  type: dataset
- description: A linear notation for describing the structure of chemical molecules.
    GxVAEs generates molecules represented by SMILES strings, aiming for hit-like
    and therapeutic properties.
  name: SMILES Strings
  source_chunk_index: 1
  type: dataset
