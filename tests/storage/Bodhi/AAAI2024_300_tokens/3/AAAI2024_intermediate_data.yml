chunk_indices:
- 0
entities:
- description: A novel deep generative model for de novo molecular generation in computer-aided
    drug discovery, incorporating disease-related cellular environments (gene expression
    profiles) into the generation process.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: One of the two joint Variational Autoencoders (VAEs) in GxVAEs, acting
    as a feature extractor that learns latent representations from gene expression
    profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: One of the two joint Variational Autoencoders (VAEs) in GxVAEs, which
    is conditioned by features extracted from gene expression profiles to generate
    hit-like molecules.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Biological data representing the activity of genes, used to condition
    molecular generation in GxVAEs and guide the discovery of therapeutic molecules
    for specific diseases.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: A model that generates molecules from a molecular graph by first creating
    a tree-structured scaffold and then combining it into a molecule using a graphical
    message-passing network.
  name: JTVAE
  source_chunk_index: 0
  type: method
- description: A discrete GAN that uses reinforcement learning to generate molecular
    graphs.
  name: MolGAN
  source_chunk_index: 0
  type: method
- description: A discrete GAN that uses reinforcement learning to generate SMILES
    strings.
  name: TransORGAN
  source_chunk_index: 0
  type: method
- description: A GAN model that bridges systems biology and molecular design to produce
    molecules with a high probability of inducing desired transcriptome features automatically
    from gene expression profiles.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A VAE-based model that first calculates the correlation of ligand-target
    interactions between chemically induced transcriptome profiles and gene perturbation
    transcriptome profiles, then uses a VAE to generate molecules with desired transcriptome
    profiles.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: A class of AI models used for de novo molecular generation, including
    GxVAEs, ExpressionGAN, and TRIOMPHE, which aim to produce biologically meaningful
    molecules.
  name: Deep Generative Models
  source_chunk_index: 0
  type: method
- description: The field that utilizes computational methods, including deep generative
    models like GxVAEs, to accelerate the process of discovering new drugs.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: Molecules generated by models like GxVAEs that exhibit desired bioactivity
    and drug-likeness, aiming to overcome the low hit rates of traditional experimental
    methods.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: Profiles reflecting cellular responses to molecular treatment or gene
    perturbations, used by models like TRIOMPHE to guide molecular generation.
  name: Transcriptome Profiles
  source_chunk_index: 0
  type: dataset
