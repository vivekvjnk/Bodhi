chunk_indices:
- 0
entities:
- description: A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) to generate biologically
    meaningful molecules. It comprises ProfileVAE and MolVAE.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: A component of GxVAEs that acts as a feature extractor, learning latent
    representations from gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: A component of GxVAEs that generates hit-like molecules, conditioned
    by features extracted from gene expression profiles by ProfileVAE.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs. It has limited ability to generate valid molecules.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs. GxVAEs show higher validity and comparable novelty to
    TRIOMPHE.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: Biological data, including chemically induced, target perturbation,
    and disease-specific profiles, used to guide the molecular generation process
    in GxVAEs.
  name: Gene expression profiles
  source_chunk_index: 0
  type: dataset
- description: A string representation of molecular structures, used to evaluate the
    data distributions learned by GxVAEs. The generated SMILES strings were consistent
    with the original validation set.
  name: SMILES strings
  source_chunk_index: 0
  type: dataset
- description: A metric used to evaluate the quality of generated molecules, indicating
    the proportion of chemically valid molecules. GxVAEs demonstrate significantly
    higher validity compared to TRIOMPHE.
  name: Validity
  source_chunk_index: 0
  type: task
- description: A metric assessing the diversity of generated molecules, measuring
    the proportion of distinct molecules. GxVAEs generally exceed TRIOMPHE in uniqueness.
  name: Uniqueness
  source_chunk_index: 0
  type: task
- description: A metric evaluating the originality of generated molecules, indicating
    how different they are from known molecules. GxVAEs show comparable novelty to
    TRIOMPHE.
  name: Novelty
  source_chunk_index: 0
  type: task
- description: A measure of molecular similarity, used to compare the generated molecules
    with known ligands. GxVAEs achieve much higher Tanimoto coefficients than baseline
    models.
  name: Tanimoto coefficients
  source_chunk_index: 0
  type: task
- description: Molecules generated by GxVAEs that are similar in structure to known
    ligands and possess desired bioactivity and drug-likeness.
  name: Hit-like molecules
  source_chunk_index: 0
  type: generic
- description: Proteins for which GxVAEs generate candidate ligands. Gene expression
    profiles of ten target proteins were used in experiments.
  name: Target proteins
  source_chunk_index: 0
  type: generic
- description: A specific target protein for which GxVAEs demonstrated significantly
    higher Tanimoto coefficients compared to baseline models.
  name: AKT1
  source_chunk_index: 0
  type: generic
- description: A target protein for which GxVAEs achieved a validity of at least 78.0%
    when generating ligand-like molecules.
  name: HDAC1
  source_chunk_index: 0
  type: generic
relationships:
