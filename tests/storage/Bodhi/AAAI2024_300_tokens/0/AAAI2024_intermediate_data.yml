chunk_indices:
- 0
entities:
- description: The process of creating new molecules with desired chemical properties
    and biological activity, a key task in computer-aided drug discovery addressed
    by GxVAEs.
  name: De Novo Molecular Generation
  source_chunk_index: 0
  type: TASK
- description: A traditional experimental approach used in drug discovery to identify
    hit molecules with desired bioactivity, contrasted with the AI-driven approach
    of GxVAEs.
  name: High-Throughput Screening (HTS)
  source_chunk_index: 0
  type: METHOD
- description: A novel deep generative model for de novo molecular generation, comprising
    two joint Variational Autoencoders (ProfileVAE and MolVAE), designed to generate
    hit-like molecules from gene expression profiles by incorporating disease-related
    cellular environments.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first Variational Autoencoder (VAE) within GxVAEs, responsible
    for extracting latent features from gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second Variational Autoencoder (VAE) within GxVAEs, which is conditioned
    by features extracted from ProfileVAE to generate hit-like molecules.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Biological data representing the activity of genes, used by GxVAEs
    to condition molecular generation and bridge the gap between molecular generation
    and cellular environments.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: A field that utilizes computational methods to aid in the discovery
    and design of new drugs, where GxVAEs is applied.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: Molecules identified in drug discovery that exhibit desired bioactivity
    and therapeutic effects, which GxVAEs aims to generate.
  name: Hit Molecules
  source_chunk_index: 0
  type: generic
- description: The ability of a molecule to produce a biological effect, a desired
    property for molecules generated by GxVAEs.
  name: Bioactivity
  source_chunk_index: 0
  type: generic
- description: A set of desirable physicochemical properties that predict whether
    a compound will have good pharmacokinetic properties, a target characteristic
    for molecules generated by GxVAEs.
  name: Drug-Likeness
  source_chunk_index: 0
  type: generic
- description: The surrounding conditions of cells, including gene expression profiles,
    which GxVAEs incorporates to generate biologically meaningful molecules.
  name: Cellular Environments
  source_chunk_index: 0
  type: generic
- description: Abstract representations learned by ProfileVAE from gene expression
    profiles, used to guide the generation process in MolVAE.
  name: Latent Features
  source_chunk_index: 0
  type: generic
