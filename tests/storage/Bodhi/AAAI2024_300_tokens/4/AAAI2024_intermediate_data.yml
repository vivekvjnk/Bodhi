chunk_indices:
- 0
entities:
- description: A novel deep generative model for de novo molecular generation, comprising
    two joint Variational Autoencoders (ProfileVAE and MolVAE) that incorporate disease-related
    cellular environments (gene expression profiles) to generate biologically meaningful
    molecules.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: One of the two joint Variational Autoencoders in GxVAEs, acting as
    a feature extractor to learn latent representations from gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second joint Variational Autoencoder in GxVAEs, conditioned on
    features extracted by ProfileVAE to generate hit-like molecules using non-canonical
    SMILES strings.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: High-dimensional biological data, including chemically induced, target
    perturbation, and disease-specific profiles, used by GxVAEs to condition molecular
    generation and bridge the gap between cellular environment and therapeutic molecules.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: A baseline model for molecular generation that generates hit-like molecules
    with low validity and limited ability to reproduce known ligands, serving as a
    comparison point for GxVAEs.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A baseline model for molecular generation that utilizes gene expression
    profiles only in correlation calculations, without its VAE being involved in molecular
    generation, serving as a comparison point for GxVAEs.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: Simplified Molecular Input Line Entry System, a string notation for
    representing chemical structures. GxVAEs uses non-canonical SMILES, specifically
    variant SMILES, for molecular generation.
  name: SMILES
  source_chunk_index: 0
  type: generic
- description: A training technique used to stabilize the training and accelerate
    the convergence of the MolVAE component within GxVAEs during its training phase.
  name: Teacher Forcing
  source_chunk_index: 0
  type: method
- description: The Thirty-Eighth AAAI Conference on Artificial Intelligence, where
    the research on GxVAEs was presented.
  name: AAAI-24
  source_chunk_index: 0
  type: generic
- description: Molecules that exhibit desired bioactivity and drug-likeness, which
    GxVAEs aims to generate, overcoming the limitations of traditional experimental
    methods.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the quality of generated molecules, referring
    to the proportion of chemically valid molecules produced. ExpressionGAN has low
    validity.
  name: Validity
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the diversity of generated molecules, referring
    to the proportion of distinct molecules produced.
  name: Uniqueness
  source_chunk_index: 0
  type: generic
- description: A similarity metric used to assess how structurally similar generated
    molecules are to known ligands, indicating relevance. GxVAEs show improved Tanimoto
    coefficients compared to baselines.
  name: Tanimoto Coefficients
  source_chunk_index: 0
  type: generic
