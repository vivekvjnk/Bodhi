  id: TRANSORGAN
- type: METHOD, METHOD, METHOD
  description: A GAN model that bridges systems biology and molecular design to produce
    molecules with a high probability of inducing desired transcriptome features automatically
    from gene expression profiles. ; A baseline model for molecular generation that
    generates hit-like molecules with low validity and limited ability to reproduce
    known ligands, serving as a comparison point for GxVAEs. ; A state-of-the-art
    baseline model for molecular generation, used for comparison with GxVAEs. It has
    limited ability to generate valid molecules.
  source_index:
  - 3
  - 4
  - 7
  id: EXPRESSIONGAN
- type: METHOD, METHOD, METHOD
  description: A VAE-based model that first calculates the correlation of ligand-target
    interactions between chemically induced transcriptome profiles and gene perturbation
    transcriptome profiles, then uses a VAE to generate molecules with desired transcriptome
    profiles. ; A baseline model for molecular generation that utilizes gene expression
    profiles only in correlation calculations, without its VAE being involved in molecular
    generation, serving as a comparison point for GxVAEs. ; A state-of-the-art baseline
    model for molecular generation, used for comparison with GxVAEs. GxVAEs show higher
    validity and comparable novelty to TRIOMPHE.
  source_index:
  - 3
  - 4
  - 7
  id: TRIOMPHE
- type: METHOD
  description: A class of AI models used for de novo molecular generation, including
    GxVAEs, ExpressionGAN, and TRIOMPHE, which aim to produce biologically meaningful
    molecules.
  source_index:
