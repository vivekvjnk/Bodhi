- type: METHOD, METHOD, METHOD, METHOD, METHOD, METHOD, METHOD, METHOD, METHOD
  description: 'A novel deep generative model for de novo molecular generation, comprising
    two joint Variational Autoencoders (ProfileVAE and MolVAE), designed to generate
    hit-like molecules from gene expression profiles by incorporating disease-related
    cellular environments. ; A novel deep generative model for de novo molecular generation,
    incorporating disease-related cellular environments (gene expression profiles)
    into the generation process. ; A novel deep generative model for de novo molecular
    generation that incorporates disease-related cellular environments, specifically
    gene expression profiles, into the generation process. It comprises two joint
    Variational Autoencoders (VAEs): ProfileVAE and MolVAE. ; A novel deep generative
    model for de novo molecular generation in computer-aided drug discovery, incorporating
    disease-related cellular environments (gene expression profiles) into the generation
    process. ; A novel deep generative model for de novo molecular generation, comprising
    two joint Variational Autoencoders (ProfileVAE and MolVAE) that incorporate disease-related
    cellular environments (gene expression profiles) to generate biologically meaningful
    molecules. ; A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) into the generation
    process. ; A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) to generate biologically
    meaningful molecules. It comprises ProfileVAE and MolVAE. ; A novel deep generative
    model for de novo molecular generation, comprising two joint Variational Autoencoders
    (ProfileVAE and MolVAE), designed to incorporate disease-related cellular environments
    (gene expression profiles) into the generation process to produce biologically
    meaningful molecules. ; A novel deep generative model for de novo molecular generation,
    incorporating disease-related cellular environments (gene expression profiles)
    to produce biologically meaningful molecules with desired bioactivity and drug-likeness.'
