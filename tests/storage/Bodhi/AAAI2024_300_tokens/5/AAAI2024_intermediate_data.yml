chunk_indices:
- 0
entities:
- description: An unobserved variable in the generative process of ProfileVAE, denoted
    by 'C', which captures essential features of the gene expression profiles.
  name: Latent Variable
  source_chunk_index: 0
  type: GENERIC
- description: The probability of observing the gene expression profile given the
    latent variable, denoted as p_phi(X|C) for ProfileVAE.
  name: Likelihood Function
  source_chunk_index: 0
  type: GENERIC
- description: The probability distribution of the latent variable given the gene
    expression profile, denoted as q_theta(C|X) for ProfileVAE.
  name: Posterior Distribution
  source_chunk_index: 0
  type: GENERIC
- description: A database containing gene expression profiles from cellular experiments,
    used to collect chemically induced and target perturbation profiles.
  name: LINCS L1000 Database
  source_chunk_index: 0
  type: DATASET
- description: A component of GxVAEs that acts as a feature extractor, learning latent
    representations from gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: A component of GxVAEs that generates hit-like molecules, conditioned
    on features extracted by ProfileVAE.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) into the generation
    process.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: Biological data representing the activity of genes, used to condition
    molecular generation in GxVAEs. Includes chemically induced, target perturbation,
    and disease-specific profiles.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: A measure of how one probability distribution diverges from a second,
    expected probability distribution. Used in the loss function of ProfileVAE and
    MolVAE.
  name: KL Divergence
  source_chunk_index: 0
  type: generic
- description: Gene expression profiles collected from experiments where cells are
    treated with various molecules, sourced from the LINCS L1000 database.
  name: Chemically Induced Profiles
  source_chunk_index: 0
  type: dataset
- description: Gene expression profiles obtained by altering the activity of specific
    biological targets, sourced from the LINCS database.
  name: Target Perturbation Profiles
  source_chunk_index: 0
  type: dataset
- description: A human breast cancer cell line used in experiments to generate chemically
    induced gene expression profiles.
  name: MCF7 Cell Line
  source_chunk_index: 0
  type: generic
