chunk_indices:
- 0
entities:
- description: A novel deep generative model for de novo molecular generation, comprising
    two joint Variational Autoencoders (ProfileVAE and MolVAE), designed to incorporate
    disease-related cellular environments (gene expression profiles) into the generation
    process to produce biologically meaningful molecules.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: One of the two joint Variational Autoencoders in GxVAEs, responsible
    for acting as a feature extractor by learning latent representations from gene
    expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second of the two joint Variational Autoencoders in GxVAEs, which
    takes features extracted by ProfileVAE as conditions to generate hit-like molecules.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Biological data, including chemically induced, target perturbation,
    and disease-specific profiles, used by GxVAEs to guide the molecular generation
    process and condition the MolVAE.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: A baseline model used for comparison with GxVAEs, which also generates
    molecules from patient gene expression profiles and molecule chemical structures.
  name: DRAGONET
  source_chunk_index: 0
  type: method
- description: A measure used to quantify the structural similarity between generated
    molecules and known approved drugs, employed to evaluate the performance of GxVAEs
    and DRAGONET.
  name: Tanimoto Coefficients
  source_chunk_index: 0
  type: generic
- description: A specific disease for which GxVAEs generated candidate therapeutic
    molecules, demonstrating a Tanimoto coefficient of 1.0 with hydrocortisone, indicating
    effective capture of structural features of approved drugs for this condition.
  name: Atopic Dermatitis
  source_chunk_index: 0
  type: task
- description: A disease for which GxVAEs generated molecules exhibiting structural
    similarities to known approved drugs, contributing to the model's demonstrated
    therapeutic potential.
  name: Gastric Cancer
  source_chunk_index: 0
  type: task
- description: A disease for which GxVAEs generated molecules showing structural features
    similar to known approved drugs, highlighting the model's capability in generating
    therapeutically relevant compounds.
  name: Alzheimer's Disease
  source_chunk_index: 0
  type: task
- description: A known approved drug used as a reference point for evaluating the
    structural similarity of molecules generated by GxVAEs for atopic dermatitis.
  name: Hydrocortisone
  source_chunk_index: 0
  type: generic
- description: The overall process undertaken by GxVAEs to generate candidate therapeutic
    molecules by inputting disease reversal profiles into the model.
  name: Therapeutic Molecular Generation
  source_chunk_index: 0
  type: task
- description: The type of molecules that GxVAEs aims to generate, characterized by
    desired bioactivity and drug-likeness, overcoming limitations of traditional methods.
  name: Hit-like Molecules
  source_chunk_index: 0
  type: generic
