  type: task
- description: The process of producing new molecules with specific chemical properties,
    aiming to create biologically meaningful molecules that overcome limitations of
    traditional methods.
  name: De Novo Molecular Generation
  source_chunk_index: 2
  type: TASK
- description: 'A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments, specifically gene expression
    profiles, into the generation process. It comprises two joint Variational Autoencoders
    (VAEs): ProfileVAE and MolVAE.'
  name: GxVAEs
  source_chunk_index: 2
  type: method
- description: One of the two joint Variational Autoencoders (VAEs) in GxVAEs. It
    functions as a feature extractor, learning latent representations from gene expression
    profiles.
  name: ProfileVAE
  source_chunk_index: 2
  type: method
- description: One of the two joint Variational Autoencoders (VAEs) in GxVAEs. It
    generates hit-like molecules, conditioned by features extracted from gene expression
    profiles by ProfileVAE.
  name: MolVAE
  source_chunk_index: 2
  type: method
- description: Biological data representing the activity of genes. GxVAEs uses these
    profiles, including chemically induced, target perturbation, and disease-specific
    profiles, to guide molecular generation.
  name: Gene Expression Profiles
  source_chunk_index: 2
  type: dataset
- description: Molecules that exhibit desired bioactivity and drug-likeness, which
    GxVAEs aims to generate.
  name: Hit-like Molecules
  source_chunk_index: 2
  type: generic
- description: The biological context, specifically disease-related cellular environments
    represented by gene expression profiles, that GxVAEs incorporates into the molecular
    generation process.
  name: Cellular Environment
  source_chunk_index: 2
  type: generic
- description: A class of deep generative models that GxVAEs is based on, specifically
    utilizing two joint VAEs (ProfileVAE and MolVAE) for its functionality.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 2
  type: method
- description: Simplified Molecular Input Line Entry System strings, a data structure
