nodes:
- type: TASK
  description: The process of creating new molecules from scratch, often with desired
    chemical or biological properties, which is the core task addressed by GxVAEs.
  source_index:
  - 0
  id: DE NOVO MOLECULAR GENERATION
- type: METHOD, METHOD, METHOD
  description: 'A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments, specifically gene expression
    profiles, into the generation process by leveraging two joint Variational Autoencoders
    (VAEs). ; A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) into the generation
    process. It comprises two joint Variational Autoencoders (VAEs): ProfileVAE and
    MolVAE. ; A novel deep generative model for de novo molecular generation, comprising
    two joint Variational Autoencoders (ProfileVAE and MolVAE), designed to incorporate
    disease-related cellular environments (gene expression profiles) into the generation
    process.'
  source_index:
  - 0
  - 1
  - 2
  id: GXVAES
- type: METHOD, METHOD, METHOD
  description: The first Variational Autoencoder (VAE) in the GxVAEs model, responsible
    for acting as a feature extractor by learning latent representations from gene
    expression profiles. ; The first VAE in GxVAEs, acting as a feature extractor
    to learn low-dimensional feature vectors from high-dimensional gene expression
    profiles. ; One of the two joint Variational Autoencoders in GxVAEs, responsible
    for acting as a feature extractor by learning latent representations from gene
    expression profiles.
  source_index:
  - 0
  - 1
  - 2
  id: PROFILEVAE
- type: METHOD, METHOD, METHOD
  description: The second Variational Autoencoder (VAE) in the GxVAEs model, which
    is conditioned by features extracted from gene expression profiles by ProfileVAE
    to generate hit-like molecules represented by SMILES strings. ; The second VAE
    in GxVAEs, conditioned on features extracted by ProfileVAE, which generates hit-like
    molecules represented by SMILES strings. ; The second joint Variational Autoencoder
    in GxVAEs, which takes features extracted by ProfileVAE as conditions to generate
    hit-like molecules represented by SMILES strings.
  source_index:
  - 0
  - 1
  - 2
  id: MOLVAE
- type: DATASET, DATASET, DATASET
  description: Biological data representing the activity of genes, used by GxVAEs
    to condition molecular generation and make produced molecules biologically meaningful
    for specific diseases. ; High-dimensional biological data representing the activity
    of genes, used by GxVAEs to condition molecular generation and bridge the gap
    between cellular environment and therapeutic molecules. ; Biological data representing
    the activity of genes in cellular environments, used by GxVAEs to condition molecular
    generation and bridge the gap between molecular generation and biological context.
  source_index:
  - 0
  - 1
  - 2
  id: GENE EXPRESSION PROFILES
- type: DATASET, DATASET, DATASET
  description: Simplified Molecular Input Line Entry System strings, a common representation
    for molecules used by MolVAE to generate hit-like molecules. ; A linear notation
    for describing the structure of chemical molecules, used by MolVAE to represent
    generated molecules. ; A linear notation for describing the structure of chemical
    molecules, used by MolVAE to represent the generated hit-like molecules.
  source_index:
  - 0
  - 1
  - 2
  id: SMILES STRINGS
- type: TASK
  description: The field of study focused on using computational methods to assist
    in the discovery of new drugs, which is the primary application area for GxVAEs.
  source_index:
  - 0
  id: COMPUTER-AIDED DRUG DISCOVERY
- type: GENERIC
  description: The ability of a molecule to produce a specific biological effect,
    a key property that GxVAEs aims to achieve in the generated molecules.
  source_index:
  - 0
  id: BIOACTIVITY
- type: METHOD, METHOD
  description: A class of deep generative models that learn a compressed latent representation
    of data and can generate new data samples. GxVAEs utilizes a dual-VAE architecture.
    ; A class of generative models used in GxVAEs, comprising ProfileVAE and MolVAE,
    to learn latent representations and generate molecules.
  source_index:
  - 0
  - 1
  id: VARIATIONAL AUTOENCODERS (VAES)
- type: METHOD, METHOD
  description: A state-of-the-art baseline model for molecular generation that uses
    a GAN architecture and bridges systems biology with molecular design, but is noted
    to have low validity and limited ability to reproduce known ligands compared to
    GxVAEs. ; A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs.
  source_index:
  - 0
  - 1
  id: EXPRESSIONGAN
- type: METHOD, METHOD
  description: A state-of-the-art baseline model for molecular generation that utilizes
    gene expression profiles in correlation calculations but does not involve a VAE
    in the molecular generation process itself, and is outperformed by GxVAEs. ; A
    state-of-the-art baseline model for molecular generation, used for comparison
    with GxVAEs, particularly in generating ligand-like molecules.
  source_index:
  - 0
  - 1
  id: TRIOMPHE
- type: DATASET
  description: A database used to collect chemically induced gene expression profiles,
    specifically profiles of MCF7 cell line treated with molecules.
  source_index:
  - 1
  id: LINCS L1000 DATABASE
- type: DATASET
  description: A database used to collect disease-specific gene expression profiles,
    specifically crowd-extracted expression of differential signatures.
  source_index:
  - 1
  id: CREEDS DATABASE
- type: METHOD
  description: A measure used to quantify the similarity between two molecules, employed
    to evaluate the structural similarity of generated molecules to known approved
    drugs.
  source_index:
  - 1
  id: TANIMOTO COEFFICIENT
- type: METHOD
  description: A metric representing the ratio of chemically valid molecules generated
    by the model, verifiable using tools like RDKit.
  source_index:
  - 1
  id: VALIDITY
- type: METHOD
  description: A metric that measures the proportion of distinct molecules generated
    by the model.
  source_index:
  - 1
  id: UNIQUENESS
- type: METHOD, METHOD
  description: A model used for comparison with GxVAEs in generating therapeutic molecules
    from disease reversal profiles. ; A baseline model against which GxVAEs is compared,
    with GxVAEs demonstrating superior performance in generating molecules with higher
    therapeutic properties.
  source_index:
  - 1
  - 2
  id: DRAGONET
