entities:
- description: The process of creating new molecules from scratch, often with desired
    chemical or biological properties, which is the core task addressed by GxVAEs.
  name: De Novo Molecular Generation
  source_chunk_index: 0
  type: TASK
- description: A novel deep generative model for de novo molecular generation that
    incorporates disease-related cellular environments, specifically gene expression
    profiles, into the generation process by leveraging two joint Variational Autoencoders
    (VAEs).
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first Variational Autoencoder (VAE) in the GxVAEs model, responsible
    for acting as a feature extractor by learning latent representations from gene
    expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second Variational Autoencoder (VAE) in the GxVAEs model, which
    is conditioned by features extracted from gene expression profiles by ProfileVAE
    to generate hit-like molecules represented by SMILES strings.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Biological data representing the activity of genes, used by GxVAEs
    to condition molecular generation and make produced molecules biologically meaningful
    for specific diseases.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: Simplified Molecular Input Line Entry System strings, a common representation
    for molecules used by MolVAE to generate hit-like molecules.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: The field of study focused on using computational methods to assist
    in the discovery of new drugs, which is the primary application area for GxVAEs.
  name: Computer-Aided Drug Discovery
  source_chunk_index: 0
  type: task
- description: The ability of a molecule to produce a specific biological effect,
    a key property that GxVAEs aims to achieve in the generated molecules.
  name: Bioactivity
  source_chunk_index: 0
  type: generic
- description: The degree to which a molecule possesses properties that make it suitable
    for use as a drug, a characteristic that GxVAEs aims to imbue in its generated
    molecules.
  name: Drug-Likeness
  source_chunk_index: 0
  type: generic
- description: A class of deep generative models that learn a compressed latent representation
    of data and can generate new data samples. GxVAEs utilizes a dual-VAE architecture.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: A state-of-the-art baseline model for molecular generation that uses
    a GAN architecture and bridges systems biology with molecular design, but is noted
    to have low validity and limited ability to reproduce known ligands compared to
    GxVAEs.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A state-of-the-art baseline model for molecular generation that utilizes
    gene expression profiles in correlation calculations but does not involve a VAE
    in the molecular generation process itself, and is outperformed by GxVAEs.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: The biological context, specifically represented by gene expression
    profiles, that influences molecular generation and is a key innovation of GxVAEs.
  name: Cellular Environment
  source_chunk_index: 0
  type: generic
- description: A database used to collect chemically induced gene expression profiles,
    specifically profiles of MCF7 cell line treated with molecules.
  name: LINCS L1000 database
  source_chunk_index: 1
  type: DATASET
- description: A database used to collect disease-specific gene expression profiles,
    specifically crowd-extracted expression of differential signatures.
  name: CREEDS database
  source_chunk_index: 1
  type: DATASET
- description: 'A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) into the generation
    process. It comprises two joint Variational Autoencoders (VAEs): ProfileVAE and
    MolVAE.'
  name: GxVAEs
  source_chunk_index: 1
  type: method
- description: The first VAE in GxVAEs, acting as a feature extractor to learn low-dimensional
    feature vectors from high-dimensional gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 1
  type: method
- description: The second VAE in GxVAEs, conditioned on features extracted by ProfileVAE,
    which generates hit-like molecules represented by SMILES strings.
  name: MolVAE
  source_chunk_index: 1
  type: method
- description: High-dimensional biological data representing the activity of genes,
    used by GxVAEs to condition molecular generation and bridge the gap between cellular
    environment and therapeutic molecules.
  name: Gene Expression Profiles
  source_chunk_index: 1
  type: dataset
- description: A linear notation for describing the structure of chemical molecules,
    used by MolVAE to represent generated molecules.
  name: SMILES Strings
  source_chunk_index: 1
  type: dataset
- description: A class of generative models used in GxVAEs, comprising ProfileVAE
    and MolVAE, to learn latent representations and generate molecules.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 1
  type: method
- description: A measure used to quantify the similarity between two molecules, employed
    to evaluate the structural similarity of generated molecules to known approved
    drugs.
  name: Tanimoto Coefficient
  source_chunk_index: 1
  type: method
- description: A metric representing the ratio of chemically valid molecules generated
    by the model, verifiable using tools like RDKit.
  name: Validity
  source_chunk_index: 1
  type: method
- description: A metric that measures the proportion of distinct molecules generated
    by the model.
  name: Uniqueness
  source_chunk_index: 1
  type: method
- description: A quantitative estimate of how likely a molecule is to be a drug, used
    to evaluate the generated molecules.
  name: Drug-likeness (QED)
  source_chunk_index: 1
  type: method
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs.
  name: ExpressionGAN
  source_chunk_index: 1
  type: method
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs, particularly in generating ligand-like molecules.
  name: TRIOMPHE
  source_chunk_index: 1
  type: method
- description: A model used for comparison with GxVAEs in generating therapeutic molecules
    from disease reversal profiles.
  name: DRAGONET
  source_chunk_index: 1
  type: method
- description: A novel deep generative model for de novo molecular generation, comprising
    two joint Variational Autoencoders (ProfileVAE and MolVAE), designed to incorporate
    disease-related cellular environments (gene expression profiles) into the generation
    process.
  name: GxVAEs
  source_chunk_index: 2
  type: method
- description: One of the two joint Variational Autoencoders in GxVAEs, responsible
    for acting as a feature extractor by learning latent representations from gene
    expression profiles.
  name: ProfileVAE
  source_chunk_index: 2
  type: method
- description: The second joint Variational Autoencoder in GxVAEs, which takes features
    extracted by ProfileVAE as conditions to generate hit-like molecules represented
    by SMILES strings.
  name: MolVAE
  source_chunk_index: 2
  type: method
- description: Biological data representing the activity of genes in cellular environments,
    used by GxVAEs to condition molecular generation and bridge the gap between molecular
    generation and biological context.
  name: Gene Expression Profiles
  source_chunk_index: 2
  type: dataset
- description: A linear notation for describing the structure of chemical molecules,
    used by MolVAE to represent the generated hit-like molecules.
  name: SMILES Strings
  source_chunk_index: 2
  type: dataset
- description: A specific disease for which GxVAEs has demonstrated the ability to
    generate molecules with structural features similar to known approved drugs.
  name: Gastric Cancer
  source_chunk_index: 2
  type: task
- description: Another specific disease for which GxVAEs has shown capability in generating
    molecules with structural similarities to approved drugs.
  name: Alzheimer's Disease
  source_chunk_index: 2
  type: task
- description: A baseline model against which GxVAEs is compared, with GxVAEs demonstrating
    superior performance in generating molecules with higher therapeutic properties.
  name: DRAGONET
  source_chunk_index: 2
  type: method
- description: A parameter of GxVAEs that can influence the diversity of generated
    molecules, identified as a potential limitation.
  name: Latent Space Size
  source_chunk_index: 2
  type: generic
- description: A characteristic of generated molecules indicating their potential
    effectiveness in treating diseases, which GxVAEs aims to enhance.
  name: Therapeutic Properties
  source_chunk_index: 2
  type: generic
- description: The type of molecules that GxVAEs is designed to generate, characterized
    by desired bioactivity and drug-like properties.
  name: Hit-like Molecules
  source_chunk_index: 2
  type: generic
- description: The biological context, specifically represented by gene expression
    profiles, that GxVAEs incorporates into the molecular generation process.
  name: Cellular Environments
  source_chunk_index: 2
  type: generic
