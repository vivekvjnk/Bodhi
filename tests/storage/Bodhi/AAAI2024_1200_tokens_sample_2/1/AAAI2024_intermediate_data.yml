chunk_indices:
- 0
entities:
- description: A database used to collect chemically induced gene expression profiles,
    specifically profiles of MCF7 cell line treated with molecules.
  name: LINCS L1000 database
  source_chunk_index: 0
  type: DATASET
- description: A database used to collect disease-specific gene expression profiles,
    specifically crowd-extracted expression of differential signatures.
  name: CREEDS database
  source_chunk_index: 0
  type: DATASET
- description: 'A novel deep generative model for de novo molecular generation, incorporating
    disease-related cellular environments (gene expression profiles) into the generation
    process. It comprises two joint Variational Autoencoders (VAEs): ProfileVAE and
    MolVAE.'
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: The first VAE in GxVAEs, acting as a feature extractor to learn low-dimensional
    feature vectors from high-dimensional gene expression profiles.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: The second VAE in GxVAEs, conditioned on features extracted by ProfileVAE,
    which generates hit-like molecules represented by SMILES strings.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: High-dimensional biological data representing the activity of genes,
    used by GxVAEs to condition molecular generation and bridge the gap between cellular
    environment and therapeutic molecules.
  name: Gene Expression Profiles
  source_chunk_index: 0
  type: dataset
- description: A linear notation for describing the structure of chemical molecules,
    used by MolVAE to represent generated molecules.
  name: SMILES Strings
  source_chunk_index: 0
  type: dataset
- description: A class of generative models used in GxVAEs, comprising ProfileVAE
    and MolVAE, to learn latent representations and generate molecules.
  name: Variational Autoencoders (VAEs)
  source_chunk_index: 0
  type: method
- description: A measure used to quantify the similarity between two molecules, employed
    to evaluate the structural similarity of generated molecules to known approved
    drugs.
  name: Tanimoto Coefficient
  source_chunk_index: 0
  type: method
- description: A metric representing the ratio of chemically valid molecules generated
    by the model, verifiable using tools like RDKit.
  name: Validity
  source_chunk_index: 0
  type: method
- description: A metric that measures the proportion of distinct molecules generated
    by the model.
  name: Uniqueness
  source_chunk_index: 0
  type: method
- description: A quantitative estimate of how likely a molecule is to be a drug, used
    to evaluate the generated molecules.
  name: Drug-likeness (QED)
  source_chunk_index: 0
  type: method
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs.
  name: ExpressionGAN
  source_chunk_index: 0
  type: method
- description: A state-of-the-art baseline model for molecular generation, used for
    comparison with GxVAEs, particularly in generating ligand-like molecules.
  name: TRIOMPHE
  source_chunk_index: 0
  type: method
- description: A model used for comparison with GxVAEs in generating therapeutic molecules
    from disease reversal profiles.
  name: DRAGONET
  source_chunk_index: 0
  type: method
