- description: Recurrent neural network units used within MolVAE to process information
    bidirectionally, capturing dependencies in both directions of the input sequence
    (SMILES strings in this case).
  name: Bidirectional GRUs
  source_chunk_index: 0
  type: method
- description: Gene expression profiles collected from the LINCS L1000 database, specifically
    from the MCF7 cell line treated with various molecules.
  name: Chemically induced profiles
  source_chunk_index: 0
  type: dataset
- description: Gene expression profiles obtained from the LINCS database, focusing
    on the perturbation of specific target proteins, such as AKT1, AKT2, AURKB, CTSK,
    EGFR, HDAC1, MTOR, PIK3CA, SMAD3, and TP53.
  name: Target perturbation profiles
  source_chunk_index: 0
  type: dataset
- description: Gene expression profiles collected from the CREEDS database, representing
    expression signatures associated with specific diseases.
  name: Disease-specific profiles
  source_chunk_index: 0
  type: dataset
- description: "The loss function of the ProfileVAE, formulated as: L G ( \u03B8 ,\
    \ \u03D5 , X , C , \u03B2 ) = E q \u03B8 ( C | X ) [ log p \u03D5 ( X | C ) ]\
    \ ( 2 ) - \u03B2 \u2022 D KL ( q \u03B8 ( C | X ) | | p \u03D5 ( C ) ) , where\
    \ \u03B2 denotes the weight of the KL divergence."
  name: ProfileVAE Loss Function
  source_chunk_index: 0
  type: method
- description: The loss function used by MolVAE, which aims to maximize the lower
    bound of the true logmarginal likelihood. The exact formulation is provided in
    the text as an equation.
  name: MolVAE Loss Function
  source_chunk_index: 0
  type: method
- description: The diseases for which GxVAEs are designed to generate therapeutic
