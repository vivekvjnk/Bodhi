entities:
- description: A novel deep generative model for computer-aided drug discovery, designed
    to generate "hit-like" molecules from gene expression profiles.
  name: GxVAEs
  source_chunk_index: 0
  type: method
- description: A joint variational autoencoder (VAE) within GxVAEs that extracts latent
    features from gene expression data.
  name: ProfileVAE
  source_chunk_index: 0
  type: method
- description: A joint variational autoencoder (VAE) within GxVAEs that uses features
    from ProfileVAE to generate molecules, conditioned on those features.
  name: MolVAE
  source_chunk_index: 0
  type: method
- description: Molecules with potential bioactivity and drug-likeness, generated by
    GxVAEs.
  name: Hit-like molecules
  source_chunk_index: 0
  type: generic
- description: Data used as input for GxVAEs, representing the activity of genes within
    a cell.
  name: Gene expression profiles
  source_chunk_index: 0
  type: dataset
- description: Low-dimensional feature vectors extracted by ProfileVAE from gene expression
    profiles.
  name: Latent features
  source_chunk_index: 0
  type: generic
- description: A string representation of the molecular structure, used by MolVAE
    to generate molecules.
  name: SMILES strings
  source_chunk_index: 0
  type: generic
- description: A database providing gene expression profiles, used to validate the
    effectiveness of GxVAEs.
  name: LINCS L1000 database
  source_chunk_index: 0
  type: dataset
- description: A database providing disease-specific gene expression profiles, used
    to validate the effectiveness of GxVAEs.
  name: CREEDS database
  source_chunk_index: 0
  type: dataset
- description: A human breast cancer cell line, used in experiments with the LINCS
    L1000 database.
  name: MCF7 cell line
  source_chunk_index: 0
  type: generic
- description: "RAC-\u03B1 serine / threonine-protein kinase, a therapeutic protein\
