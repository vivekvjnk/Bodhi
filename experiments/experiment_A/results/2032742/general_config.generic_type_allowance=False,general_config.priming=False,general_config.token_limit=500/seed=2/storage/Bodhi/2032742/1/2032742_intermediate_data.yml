    in convolution layers.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: A factor that affects the performance of sparse convolution, with lower
    intensity leading to higher overhead.
  name: Arithmetic intensity
  source_chunk_index: 0
  type: method
- description: Convolutional Neural Network, a type of deep learning model.
  name: CNN
  source_chunk_index: 0
  type: method
- description: The characteristic of having a large number of zero-valued parameters
    or connections in a neural network.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: The performance improvement achieved by the optimized sparse CNN implementation,
    specifically 3.4x and 7.3x speedups on Xeon and Atom processors, respectively,
    for convolution layers in AlexNet.
  name: Speedup of convolution layers
  source_chunk_index: 0
  type: method
- description: The size of the filters used in the CNN, specifically mentioning small
    filters like 3x3 and large filters like 9x9.
  name: Filter Types
  source_chunk_index: 0
  type: method
- description: A performance metric representing the number of images processed per
    second, indicating the classification speed of a CNN.
  name: Images per second throughput
  source_chunk_index: 0
  type: method
- description: The performance improvement achieved in convolution layers, expressed
    as a multiple (e.g., 3.4x or 7.3x), when using a sparse CNN implementation compared
    to the best dense direct convolution performance.
  name: Speedups of convolution layers
  source_chunk_index: 0
  type: method
- description: The change in accuracy when using sparse CNN methods. The text mentions
    "no accuracy drop" indicating that the sparse method maintains the same accuracy
    as the dense method.
  name: Accuracy drop
  source_chunk_index: 0
