entities:
- description: A collection of techniques designed to optimize the accuracy, speed,
    and size of Convolutional Neural Networks (CNNs) by simultaneously learning the
    sparsity of convolution and fully connected layers.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: Convolutional Neural Networks, a type of deep learning model, are the
    focus of optimization for size, speed, and accuracy.
  name: CNNs
  source_chunk_index: 0
  type: method
- description: A specific CNN architecture used to demonstrate the effectiveness of
    Holistic SparseCNN.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: Techniques used to reduce the number of parameters in a model, leading
    to smaller model sizes and faster inference speeds.
  name: Sparse methods
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform convolutional operations, which are
    a key area for applying sparse methods to improve speed.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: Layers within a CNN where each neuron is connected to all neurons in
    the previous layer, also targeted for sparsity optimization.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: The ability of a model to correctly classify or predict outcomes, a
    key performance metric optimized by Holistic SparseCNN.
  name: Accuracy
  source_chunk_index: 0
  type: task
- description: The rate at which a model can classify images or data, a key performance
    metric optimized by Holistic SparseCNN.
  name: Classification speed
  source_chunk_index: 0
  type: task
- description: The number of parameters in a model, a key performance metric optimized
    by Holistic SparseCNN.
  name: Model size
  source_chunk_index: 0
  type: task
- description: A regularization technique used to control the complexity of the model
    and promote sparsity.
  name: Weight decay
  source_chunk_index: 0
  type: method
- description: A platform used for evaluating the performance of Holistic SparseCNN.
  name: BDW
  source_chunk_index: 0
  type: method
- description: A highly optimized dense matrix multiplication operation used as a
    proxy for dense convolution performance.
  name: SGEMM
  source_chunk_index: 0
  type: method
- description: The rate at which the model can classify images, measured in images
    per second.
  name: Classification Speed
  source_chunk_index: 0
  type: task
