entities:
- description: A type of Convolutional Neural Network (CNN) that employs sparsity
    to reduce model size and improve classification speed.
  name: Sparse CNN
  source_chunk_index: 0
  type: method
- description: A CNN architecture used as a benchmark for evaluating the performance
    of sparse CNN methods.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: Layers within a CNN responsible for feature extraction, where sparse
    methods are applied to reduce compute requirements.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that typically have a large number of parameters, and
    where sparsity is often applied to reduce model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: The objective of improving the rate at which a CNN can classify images
    or data.
  name: Classification speed
  source_chunk_index: 0
  type: task
- description: The objective of decreasing the number of parameters in a CNN, often
    achieved through sparsity.
  name: Model size reduction
  source_chunk_index: 0
  type: task
- description: A type of processor on which the performance of sparse CNN implementations
    is evaluated.
  name: Xeon processors
  source_chunk_index: 0
  type: method
- description: Another type of processor on which the performance of sparse CNN implementations
    is evaluated.
  name: Atom processors
  source_chunk_index: 0
  type: method
- description: A technique used in sparse CNNs to reduce computational requirements
    in convolution layers.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: A factor that affects the performance of sparse convolution, with lower
    intensity leading to higher overhead.
  name: Arithmetic intensity
  source_chunk_index: 0
  type: method
- description: Convolutional Neural Network, a type of deep learning model.
  name: CNN
  source_chunk_index: 0
  type: method
- description: The characteristic of having a large number of zero-valued parameters
    or connections in a neural network.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: The performance improvement achieved by the optimized sparse CNN implementation,
    specifically 3.4x and 7.3x speedups on Xeon and Atom processors, respectively,
    compared to the best dense direct convolution performance.
  name: Speedup of convolution layers
  source_chunk_index: 0
  type: method
- description: The size of filters used in the CNN, including large filters (e.g.,
    9x9) and small filters (e.g., 3x3).
  name: Filter types
  source_chunk_index: 0
  type: method
- description: The performance improvement achieved in convolution layers, specifically
    3.4x and 7.3x speedups in AlexNet on Xeon and Atom processors, respectively.
  name: Speedup of convolution layers
  source_chunk_index: 0
  type: method
- description: The overall performance of a CNN, considering all layers, not just
    individual components like fully connected or convolutional layers. The text highlights
    that the speedup of end-to-end performance is limited because fully connected
    layers account for a small portion of the total computation in most CNNs.
  name: End-to-end performance
  source_chunk_index: 0
  type: task
- description: The number of images per second that AlexNet can classify, specifically
    2,371 and 120 images per second, representing a performance metric.
  name: AlexNet classification throughput
  source_chunk_index: 0
  type: method
- description: The use of small filters, such as 3x3, in modern CNNs, which is a relevant
    detail for sparse convolution methods.
  name: Small filters (3x3)
  source_chunk_index: 0
  type: method
