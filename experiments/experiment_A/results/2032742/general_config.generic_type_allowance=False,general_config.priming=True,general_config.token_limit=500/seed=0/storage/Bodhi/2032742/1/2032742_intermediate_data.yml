entities:
- description: A type of deep learning model widely used in image recognition and
    other applications, the focus of optimization in the paper.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: The primary objective of the paper, focusing on improving speed, reducing
    model size, and maintaining accuracy of CNNs.
  name: Optimize CNNs
  source_chunk_index: 0
  type: task
- description: A technique used to reduce model size and/or accelerate classification
    speed in CNNs.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that are pruned to affect model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that are pruned to impact computation and speed.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: CNNs that incorporate sparsity to reduce model size and/or accelerate
    classification speed.
  name: Sparse CNNs
  source_chunk_index: 0
  type: method
- description: An approach that applies sparse methods to both convolution and fully
    connected layers to optimize speed, size, and accuracy simultaneously.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: An algorithm discussed in the paper for performing sparse convolution.
  name: Direct sparse convolution algorithm
  source_chunk_index: 0
  type: method
- description: One of the goals of the paper, achieved through techniques like sparsity
    and pruning.
  name: Reduce model size
  source_chunk_index: 0
  type: task
- description: Another goal of the paper, achieved through techniques like sparsity
    and pruning.
  name: Accelerate classification speed
  source_chunk_index: 0
  type: task
- description: The computational intensity of sparse convolution, which can be lower
    than dense convolution, leading to increased data transfer overhead.
  name: Arithmetic Intensity
  source_chunk_index: 0
  type: method
- description: The size of the convolutional filters used in CNNs. Some sparse convolution
    methods are limited to large filter sizes, restricting their applicability to
    modern CNNs that often use small filters.
  name: Filter Sizes
  source_chunk_index: 0
  type: method
- description: A method to reduce compute requirements and improve classification
    speed by applying sparsity to convolution layers.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: The processor on which the direct sparse convolution algorithm's performance
    was evaluated, achieving a 3.4x speedup over the best dense direct convolution
    performance in AlexNet.
  name: Xeon processors
  source_chunk_index: 0
  type: method
- description: The processor on which the direct sparse convolution algorithm's performance
    was evaluated, achieving a 7.3x speedup over the best dense direct convolution
    performance in AlexNet.
  name: Atom processors
  source_chunk_index: 0
  type: method
- description: The task of classifying images using the AlexNet CNN model, with a
    throughput of 2,371 images per second on one platform and 120 images per second
    on another, as a result of the direct sparse convolution algorithm.
  name: AlexNet classification throughput
  source_chunk_index: 0
  type: task
- description: A method used to reduce the computational requirements and improve
    classification speed in CNNs by applying sparsity to the convolution layers.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a case study to
    demonstrate the performance of sparse CNNs.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: The objective of applying sparse convolution methods to CNNs with small
    filter sizes (e.g., 3x3), which are common in modern CNNs.
  name: Small Kernel Size
  source_chunk_index: 0
  type: task
