entities:
- description: A type of deep learning model widely used in image recognition and
    other applications. The paper focuses on optimizing CNNs for speed and size.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: The primary objective of the paper, focusing on improving speed, reducing
    model size, and maintaining accuracy of CNNs.
  name: Optimize CNNs
  source_chunk_index: 0
  type: task
- description: A technique used to reduce model size and/or accelerate classification
    speed in CNNs.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: CNNs that incorporate sparsity to reduce model size and/or improve
    speed. The paper investigates sparse CNNs in both fully connected and convolutional
    layers.
  name: Sparse CNNs
  source_chunk_index: 0
  type: method
- description: An approach that applies sparse methods to both convolutional and fully
    connected layers to simultaneously optimize speed, size, and accuracy.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: A specific algorithm discussed in the paper for performing sparse convolution.
  name: Direct sparse convolution algorithm
  source_chunk_index: 0
  type: method
- description: A method to reduce model size by removing connections or weights, applied
    to fully connected and convolutional layers.
  name: Pruning
  source_chunk_index: 0
  type: method
- description: The standard convolution operation, used as a baseline for comparison
    with sparse convolution.
  name: Dense convolution
  source_chunk_index: 0
  type: method
- description: One of the goals of the paper, achieved through techniques like sparsity
    and pruning.
  name: Reduce model size
  source_chunk_index: 0
  type: task
- description: Another goal of the paper, achieved through techniques like sparsity
    and optimized convolution algorithms.
  name: Accelerate classification speed
  source_chunk_index: 0
  type: task
- description: Floating point operations per second, a metric used to measure the
    computational performance of a system, particularly relevant in the context of
    sparse convolution and its speedup over dense convolution.
  name: FLOP/s
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform convolution operations, which are
    significantly impacted by sparsity and directly affect computation and speed.
    The text discusses the impact of sparsity on these layers.
  name: Convolution Layers
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that are fully connected, primarily affecting model
    size. The text discusses the synergies between sparse convolution and sparse methods
    on these layers.
  name: Fully Connected Layers
  source_chunk_index: 0
  type: method
- description: A specific algorithm introduced in the paper to speed up CNNs by directly
    performing sparse convolution operations.
  name: Direct Sparse Convolution Algorithm
  source_chunk_index: 0
  type: method
- description: The objective of the direct sparse convolution algorithm, aiming to
    improve the computational efficiency of CNNs.
  name: Speeding up CNNs
  source_chunk_index: 0
  type: task
- description: A method that leverages sparsity in convolutional layers to reduce
    computation and accelerate CNNs.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: A specific algorithm introduced in the paper to speed up CNNs by directly
    performing sparse convolution operations.
  name: Direct Sparse Convolution Algorithm
  source_chunk_index: 0
  type: method
- description: Sparse Matrix-Vector multiplication, a computational kernel used in
    the context of sparse convolution, particularly relevant for memory bandwidth
    considerations.
  name: SpMV
  source_chunk_index: 0
  type: method
