entities:
- description: A type of deep learning model widely used in image recognition and
    other applications. The paper focuses on optimizing CNNs for speed and size.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: The primary objective of the paper, focusing on improving speed, reducing
    model size, and maintaining accuracy of CNNs.
  name: Optimize CNNs
  source_chunk_index: 0
  type: task
- description: A technique used to reduce model size and/or accelerate classification
    speed in CNNs.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: CNNs that incorporate sparsity to reduce model size and/or improve
    speed. The paper investigates sparse CNNs in both fully connected and convolutional
    layers.
  name: Sparse CNNs
  source_chunk_index: 0
  type: method
- description: An approach that applies sparse methods to both convolutional and fully
    connected layers to simultaneously optimize speed, size, and accuracy.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: An algorithm discussed in the paper, used for sparse convolution and
    its performance analysis.
  name: Direct sparse convolution algorithm
  source_chunk_index: 0
  type: method
- description: The standard convolution operation, used as a baseline for comparison
    with sparse convolution algorithms.
  name: Dense convolution
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that are fully connected, often comprising a significant
    portion of the model's parameters and affecting model size.
  name: Fully Connected Layers
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that perform convolutional operations, impacting computation
    and classification speed.
  name: Convolution Layers
  source_chunk_index: 0
  type: method
- description: A method used to reduce compute requirements and improve classification
    speed by applying sparsity to convolution layers.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: A method that involves the overhead of transforming tensors to matrices,
    which can impact performance.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: A type of processor on which the sparse CNN implementation achieved
    speedups.
  name: Xeon Processors
  source_chunk_index: 0
  type: method
- description: A type of processor on which the sparse CNN implementation achieved
    speedups.
  name: Atom Processors
  source_chunk_index: 0
  type: method
- description: A method used in sparse CNNs that has lower arithmetic intensity, potentially
    leading to performance limitations.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: A CNN architecture used as a test case, where the text mentions specific
    speedups achieved for convolution layers.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform the convolution operation. The text
    mentions speedups achieved for these layers.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: The speedup of convolution layers in AlexNet over the best dense direct
    convolution performance on Xeon processors.
  name: 3.4x speedup
  source_chunk_index: 0
  type: method
- description: The speedup of convolution layers in AlexNet over the best dense direct
    convolution performance on Atom processors.
  name: 7.3x speedup
  source_chunk_index: 0
  type: method
- description: Filters with small sizes (e.g., 3x3) used in modern CNNs. Some sparse
    convolution methods are not applicable to these.
  name: Small filters
  source_chunk_index: 0
  type: method
