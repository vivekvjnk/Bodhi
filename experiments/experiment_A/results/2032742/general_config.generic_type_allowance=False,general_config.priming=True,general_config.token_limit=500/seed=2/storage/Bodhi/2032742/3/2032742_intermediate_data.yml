entities:
- description: A type of deep learning model widely used in image recognition and
    other applications. The paper focuses on optimizing CNNs for speed and size.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: The primary objective of the paper, focusing on improving speed, reducing
    model size, and maintaining accuracy of CNNs.
  name: Optimize CNNs
  source_chunk_index: 0
  type: task
- description: A technique used to reduce model size and/or accelerate classification
    speed in CNNs.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: Layers in a neural network that are pruned to affect model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: Layers in a neural network that are pruned to impact computation and
    speed.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: CNNs that incorporate sparsity to reduce model size and/or accelerate
    classification speed.
  name: Sparse CNNs
  source_chunk_index: 0
  type: method
- description: An approach that applies sparse methods to both convolution and fully
    connected layers to optimize speed, size, and accuracy simultaneously.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: An algorithm discussed in the paper for performing sparse convolution.
  name: Direct sparse convolution algorithm
  source_chunk_index: 0
  type: method
- description: One of the goals of the paper, achieved through techniques like sparsity
    and pruning.
  name: Reduce model size
  source_chunk_index: 0
  type: task
- description: Another key objective, achieved through methods like sparsity and optimized
    convolution algorithms.
  name: Accelerate classification speed
  source_chunk_index: 0
  type: task
- description: The proposed method, a collection of techniques for sparse CNNs, achieving
    a classification speed of 2,371 images per second on BDW without accuracy drop
    compared to the reference Caffe model.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: The platform on which the Holistic SparseCNN achieves a classification
    speed of 2,371 images per second.
  name: BDW
  source_chunk_index: 0
  type: task
- description: The proposed method, achieving a classification speed of 120 images
    per second with no accuracy loss, about 2.8x higher than a best case dense CNN
    implementation.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: The CNN architecture used to demonstrate the Holistic SparseCNN, showing
    3.4x and 7.3x speedups of convolution layers over the best dense convolution on
    representative server and mobile platforms.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A regularization technique used to prevent overfitting, with specific
    values of 1e-5, 5e-5, and 6e-5 applied to different layers.
  name: Weight decay
  source_chunk_index: 0
  type: method
- description: A parameter used in conjunction with weight decay, with values of 1,
    0.1, and 0.01, respectively, applied to fully connected (FC) layers.
  name: FC decay multiplier
  source_chunk_index: 0
  type: method
- description: A specific CNN architecture used as a test case in the paper to demonstrate
    the performance of the Holistic SparseCNN approach.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: The proposed method, a collection of techniques for optimizing CNNs,
    aiming for simultaneous optimization of speed, size, and accuracy by applying
    sparse methods to both convolution and fully connected layers.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: A specific hardware platform (likely a processor) on which the Holistic
    SparseCNN's performance was evaluated.
  name: BDW
  source_chunk_index: 0
  type: method
- description: A highly optimized implementation of a dense matrix multiplication,
    used as a proxy for dense convolution performance to quantify layer-wise speedups.
  name: SGEMM
  source_chunk_index: 0
  type: method
