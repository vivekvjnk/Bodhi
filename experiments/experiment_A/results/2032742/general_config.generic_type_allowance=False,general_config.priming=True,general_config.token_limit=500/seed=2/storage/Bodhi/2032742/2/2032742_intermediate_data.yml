  type: method
- description: A measure of the ratio of arithmetic operations to memory operations
    in a computation. In the context of sparse convolution, it is higher than SpMV
    (Sparse Matrix-vector multiplication) but lower than dense convolution, influencing
    the performance of the algorithm.
  name: Arithmetic Intensity
  source_chunk_index: 0
  type: method
