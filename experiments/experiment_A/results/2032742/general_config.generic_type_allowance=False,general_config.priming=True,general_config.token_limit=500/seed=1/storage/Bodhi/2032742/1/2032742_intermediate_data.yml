entities:
- description: A type of deep learning model widely used in image recognition and
    other applications, the focus of optimization in the paper.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: The primary objective of the paper, focusing on improving speed, reducing
    model size, and maintaining accuracy of CNNs.
  name: Optimizing CNNs
  source_chunk_index: 0
  type: task
- description: A technique used to reduce model size and/or accelerate classification
    speed in CNNs.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that are pruned to affect model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that are pruned to impact computation and speed.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: CNNs that incorporate sparsity to reduce model size and/or accelerate
    classification speed.
  name: Sparse CNNs
  source_chunk_index: 0
  type: method
- description: An approach aiming for simultaneous optimization of speed, size, and
    accuracy across both fully connected and convolution layers.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: A key algorithm presented in the paper.
  name: Direct sparse convolution
  source_chunk_index: 0
  type: method
- description: A goal of the paper, with examples of 3.4x and 7.3x speedups on platforms
    like Xeon and Atom processors.
  name: Achieving significant speedups
  source_chunk_index: 0
  type: task
- description: A goal of the paper, achieved through techniques like sparsity.
  name: Reducing model size
  source_chunk_index: 0
  type: task
- description: A critical consideration when optimizing CNNs, as the paper explores
    the trade-offs between sparsity, speed, and accuracy.
  name: Maintaining accuracy
  source_chunk_index: 0
  type: task
- description: A type of processor on which the optimized sparse CNN implementation
    achieves a 3.4x speedup of convolution layers in AlexNet.
  name: Xeon processors
  source_chunk_index: 0
  type: method
- description: A type of processor on which the optimized sparse CNN implementation
    achieves a 7.3x speedup of convolution layers in AlexNet.
  name: Atom processors
  source_chunk_index: 0
  type: method
- description: The rate at which AlexNet classifications are processed, measured at
    2,371 and 120 images per second on Xeon and Atom processors, respectively.
  name: AlexNet classification throughput
  source_chunk_index: 0
  type: task
- description: A factor that influences the efficiency of sparse convolution, where
    lower arithmetic intensity can lead to increased data transfer overhead.
  name: Arithmetic Intensity
  source_chunk_index: 0
  type: method
- description: A technique used in sparse CNNs to reduce compute requirements and
    improve classification speed, but can face challenges like lower arithmetic intensity
    and limitations on filter sizes.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: The dimensions of the convolutional filters, with smaller filter sizes
    (e.g., 3x3) being common in modern CNNs. Some sparse convolution methods are limited
    in their applicability to small filter sizes.
  name: Filter Size
  source_chunk_index: 0
  type: method
- description: A method used in sparse CNNs that involves transforming tensors to
    matrices, which can introduce overhead and potentially limit performance.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: The use of small filters (e.g., 3x3) in modern CNNs, which poses a
    challenge for some sparse convolution methods that are only applicable to larger
    filters.
  name: Small Kernel Size
  source_chunk_index: 0
  type: method
