    like Xeon and Atom processors.
  name: Achieving significant speedups
  source_chunk_index: 0
  type: task
- description: A goal of the paper, achieved through techniques like sparsity.
  name: Reducing model size
  source_chunk_index: 0
  type: task
- description: A critical consideration when optimizing CNNs, as the paper explores
    the trade-offs between sparsity, speed, and accuracy.
  name: Maintaining accuracy
  source_chunk_index: 0
  type: task
- description: A collection of techniques presented in the paper to unleash the full
    potential of sparse CNNs, optimizing accuracy, speed, and size together.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: The objective of achieving a classification speed of 2,371 images per
    second on BDW without accuracy drop compared to the reference Caffe model.
