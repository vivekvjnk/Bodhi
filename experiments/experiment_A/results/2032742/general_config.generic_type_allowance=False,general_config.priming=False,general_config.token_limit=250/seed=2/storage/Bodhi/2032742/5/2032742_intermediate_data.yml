entities:
- description: A convolutional technique that exploits sparsity in weight tensors
    to potentially achieve computational speedups.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: A standard convolutional technique used as a baseline for comparison
    with sparse convolution.
  name: Dense convolution
  source_chunk_index: 0
  type: method
- description: The proportion of zero-valued elements in a weight tensor, which is
    exploited by sparse convolution to achieve speedups.
  name: Sparsity
  source_chunk_index: 0
  type: task
- description: The improvement in computational speed achieved by sparse convolution
    compared to dense convolution.
  name: Speedup
  source_chunk_index: 0
  type: task
- description: Processors where sparse convolution outperforms dense convolution across
    a wider range of sparsity levels.
  name: Atom processors
  source_chunk_index: 0
  type: method
- description: Layers in a neural network that can become a bottleneck after sparse
    convolution optimizations.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: General Matrix Multiplication, used in the implementation of fully
    connected layers.
  name: GEMM
  source_chunk_index: 0
  type: method
- description: Techniques that can be leveraged to exploit sparsity in fully connected
    layers.
  name: Sparse matrix and dense matrix multiplication (SpMDM)
  source_chunk_index: 0
  type: method
- description: Layers where a bulk of computation belongs to.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: The minimum level of sparsity required for sparse convolution to provide
    a speedup over dense convolution.
  name: Lower bound of useful sparsity
  source_chunk_index: 0
  type: task
- description: A computational process that introduces overhead, particularly for
    dense convolution, as mentioned in the text.
  name: Lowering and Lifting Process
  source_chunk_index: 0
  type: method
- description: The effect of the proportion of non-zeros in filters (sparsity) on
    the speedup of sparse convolution compared to dense convolution. Lower sparsity
    (higher proportion of non-zeros) leads to lower speedup.
  name: Impact of Sparsity on Speedup
  source_chunk_index: 0
  type: task
- description: The computational cost associated with the lowering and lifting process,
    which is particularly problematic for sparse convolution due to its already lower
    intensity compared to dense convolution.
  name: Overhead of Lowering and Lifting Process
  source_chunk_index: 0
  type: task
