chunk_indices:
- 0
entities:
- description: A type of Convolutional Neural Network that aims to reduce model size
    and improve classification speed by sparsifying or compressing layers.
  name: Sparse CNN
  source_chunk_index: 0
  type: method
- description: The objective of sparse CNN, achieved by sparsifying/compressing fully
    connected layers.
  name: Reducing model size
  source_chunk_index: 0
  type: task
- description: Another objective of sparse CNN, achieved by reducing compute requirements
    in convolution layers.
  name: Improving classification speed
  source_chunk_index: 0
  type: task
- description: A Convolutional Neural Network architecture used as an example to illustrate
    the distribution of parameters and computation in CNNs.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A method used in sparse CNNs to reduce compute requirements, but faces
    challenges like lower arithmetic intensity.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that have a large number of parameters and are often
    targeted for sparsification.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that perform the majority of the computation (FLOPS)
    and are also targeted for sparsification in sparse CNNs.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: The degree to which a model is sparse, and guidelines are provided
    for the range of sparsity to target during training.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: Additional data transfers involved in lowering tensors to matrices,
    which can add overhead in sparse convolution.
  name: Data transfers
  source_chunk_index: 0
  type: method
- description: Some sparse convolution methods are only applicable to large filters,
    which limits their usage for modern CNNs.
  name: "Large filters (e.g., 9 \xD7 9)"
  source_chunk_index: 0
  type: method
- description: Popular in modern CNNs, and sparse convolution methods should be applicable
    to them.
  name: "Small filters (e.g., 3 \xD7 3)"
  source_chunk_index: 0
  type: method
- description: The objective of the first research thrust in sparse CNN, focusing
    on decreasing the model size by making fully connected layers more sparse or compressed.
  name: Reducing model size by sparsifying/compressing fully connected layers
  source_chunk_index: 0
  type: task
- description: The objective of the second research thrust in sparse CNN, focusing
    on convolution layers to reduce computational demands and enhance the speed of
    classification.
  name: Reducing compute requirements and improving classification speed in convolution
    layers
  source_chunk_index: 0
  type: task
- description: The characteristic of sparse convolution that results in a lower ratio
    of arithmetic operations to memory accesses, leading to increased data transfer
    overhead.
  name: Lower Arithmetic Intensity
  source_chunk_index: 0
  type: method
- description: The constraint of some sparse convolution methods, restricting their
    applicability to large filter sizes (e.g., 9x9), which limits their use in modern
    CNNs that often employ smaller filters (e.g., 3x3).
  name: Limitation to Large Filters
  source_chunk_index: 0
  type: method
- description: The characteristic of sparse convolution that results in additional
    data transfers, increasing overhead.
  name: Lower Arithmetic Intensity
  source_chunk_index: 0
  type: method
- description: The constraint of some sparse convolution methods, restricting their
    applicability to large filters (e.g., 9x9) and limiting their use in modern CNNs
    that favor small filters (e.g., 3x3).
  name: Limitation to Large Filters
  source_chunk_index: 0
  type: method
