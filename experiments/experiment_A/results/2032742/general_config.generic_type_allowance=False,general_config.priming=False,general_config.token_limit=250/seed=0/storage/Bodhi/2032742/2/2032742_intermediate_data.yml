entities:
- description: A type of Convolutional Neural Network that aims to reduce model size
    and improve classification speed by sparsifying or compressing layers.
  name: Sparse CNN
  source_chunk_index: 0
  type: method
- description: Layers within a Convolutional Neural Network that perform the majority
    of the computation (FLOPS).
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as an example to illustrate
    the computational distribution in CNNs.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A technique used in sparse CNNs to reduce compute requirements by applying
    sparsity to convolution operations.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: The speed at which a CNN can classify inputs, a key performance metric
    targeted for improvement in sparse CNN research.
  name: Classification speed
  source_chunk_index: 0
  type: task
- description: The objective of reducing the number of parameters in a CNN model,
    often achieved through sparsification or compression techniques.
  name: Model size reduction
  source_chunk_index: 0
  type: task
- description: Layers in a CNN that have a large number of parameters and are often
    targeted for sparsification.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: The degree to which a neural network's parameters are set to zero,
    a key factor in sparse CNNs.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: A measure of the ratio of computation to data movement, relevant to
    the efficiency of sparse convolution.
  name: Arithmetic intensity
  source_chunk_index: 0
  type: method
- description: Convolutional Neural Network, a type of deep learning model.
  name: CNN
  source_chunk_index: 0
  type: method
- description: A challenge for sparse CNNs, where sparse convolution operations have
    a lower ratio of arithmetic operations to memory accesses, leading to increased
    data transfer overhead.
  name: Sparse convolution has lower arithmetic intensity
  source_chunk_index: 0
  type: method
- description: The overhead caused by additional data transfers involved in lowering
    tensors to matrices, which is a challenge for sparse CNNs.
  name: Additional data transfers
  source_chunk_index: 0
  type: method
- description: Some prior sparse convolution methods are only applicable to large
    filters (e.g., 9x9), which limits their usage for modern CNNs where small filters
    (e.g., 3x3) are popular.
  name: Limitation to large filters
  source_chunk_index: 0
  type: method
- description: A challenge in sparse convolution where the reduced number of operations
    leads to lower arithmetic intensity, increasing data transfer overhead.
  name: Lower Arithmetic Intensity
  source_chunk_index: 0
  type: method
- description: A challenge where some sparse convolution methods are only applicable
    to large filters (e.g., 9x9), limiting their use in modern CNNs that often use
    small filters (e.g., 3x3).
  name: Limitation to Large Filters
  source_chunk_index: 0
  type: method
- description: The objective of the first research thrust in sparse CNN, which focuses
    on reducing the model size by sparsifying or compressing the fully connected layers.
  name: Reducing model size by sparsifying/compressing fully connected layers
  source_chunk_index: 0
  type: task
- description: The objective of the second research thrust in sparse CNN, which focuses
    on convolution layers to reduce compute requirements and thus to improve classification
    speed.
  name: Reducing compute requirements and improving classification speed in convolution
    layers
  source_chunk_index: 0
  type: task
