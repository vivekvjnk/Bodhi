    model size and improve classification speed.
  name: Sparse CNN
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a benchmark for
    evaluating sparse CNN implementations.
  name: AlexNet
  source_chunk_index: 0
