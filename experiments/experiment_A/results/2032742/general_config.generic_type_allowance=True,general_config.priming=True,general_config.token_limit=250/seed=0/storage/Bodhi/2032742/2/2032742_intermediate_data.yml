entities:
- description: A technique used to reduce model size and improve classification speed
    in CNNs by reducing the number of parameters or computations.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: The amount of memory required to store a CNN model, a key performance
    indicator that sparse CNNs aim to reduce.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: The speed at which a CNN can classify images, a key performance indicator
    that sparse CNNs aim to improve.
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: A challenge in sparse convolution, where the lower intensity can lead
    to higher overhead due to additional data transfers.
  name: Arithmetic intensity
  source_chunk_index: 0
  type: GENERIC
- description: A type of convolution that utilizes sparsity to reduce computational
    requirements and improve classification speed.
  name: Sparse convolution
  source_chunk_index: 0
  type: GENERIC
- description: Used in convolution layers, and the size of filters can impact the
    applicability of sparse convolution methods.
  name: Filters
  source_chunk_index: 0
  type: GENERIC
- description: The simultaneous application of sparse methods to both fully connected
    and convolution layers.
  name: Holistic optimization
  source_chunk_index: 0
  type: GENERIC
- description: Convolutional Neural Networks optimized for sparsity to reduce model
    size and improve classification speed.
  name: Sparse CNN
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that often contain a large number of parameters
    and are targeted for sparsity to reduce model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: generic
- description: Layers within a CNN that perform the majority of the computation (FLOPS)
    and are targeted for sparsity to improve classification speed.
  name: Convolution layers
  source_chunk_index: 0
  type: generic
- description: A specific CNN architecture used as an example to illustrate the distribution
    of parameters and computation across different layers.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A key performance indicator (KPI) for CNNs, representing the correctness
    of the model's classifications.
  name: Accuracy
  source_chunk_index: 0
  type: GENERIC
- description: A key performance indicator (KPI) for CNNs, often measured in images
    per second, indicating the classification speed.
  name: Speed
  source_chunk_index: 0
  type: GENERIC
- description: A key performance indicator (KPI) for CNNs, representing the number
    of parameters in the model, which affects storage and computational requirements.
  name: Model Size
  source_chunk_index: 0
  type: GENERIC
- description: Sparse matrix and dense matrix multiplication, a technique used for
    fully connected layers in CNNs to reduce computational cost.
  name: SpMDM
  source_chunk_index: 0
  type: method
- description: The objective of reducing model size by sparsifying/compressing fully
    connected layers in CNNs.
  name: Research Thrust on Sparse CNN for Fully Connected Layers
  source_chunk_index: 0
  type: task
- description: The objective of reducing compute requirements and improving classification
    speed by focusing on convolution layers in CNNs.
  name: Research Thrust on Sparse CNN for Convolution Layers
  source_chunk_index: 0
  type: task
- description: A challenge where sparse convolution has lower arithmetic intensity,
    leading to additional data transfers and overhead.
  name: Lower Arithmetic Intensity in Sparse Convolution
  source_chunk_index: 0
  type: generic
- description: A challenge where some sparse convolution methods are only applicable
    to large filters, limiting their use in modern CNNs with small filters.
  name: Limited Applicability to Large Filters
  source_chunk_index: 0
  type: generic
- description: A performance metric used to evaluate the speed of CNNs, indicating
    the number of images processed per second.
  name: Images per second
  source_chunk_index: 0
  type: generic
- description: A key performance indicator for CNNs, representing the correctness
