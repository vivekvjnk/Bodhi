  name: Accuracy
  source_chunk_index: 0
  type: generic
- description: A key performance indicator for CNNs, representing the rate at which
    the model processes data, often measured in images per second.
  name: Speed
  source_chunk_index: 0
  type: generic
- description: A key performance indicator for CNNs, representing the amount of memory
