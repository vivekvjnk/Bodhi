  type: GENERIC
- description: A key performance indicator for CNNs, measured in images per second,
    and a primary focus of optimization efforts.
  name: Speed
  source_chunk_index: 0
  type: GENERIC
- description: A key performance indicator for CNNs, representing the amount of memory
