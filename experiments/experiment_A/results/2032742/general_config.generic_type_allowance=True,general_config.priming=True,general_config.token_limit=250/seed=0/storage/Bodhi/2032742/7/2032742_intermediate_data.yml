entities:
- description: A novel method that simultaneously optimizes both fully connected and
    convolution layers in CNNs to improve speed, reduce size, and maintain accuracy.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: GENERIC
- description: Convolutional Neural Networks, a type of deep learning model, are under
    pressure to be smaller, faster, and more accurate.
  name: CNNs
  source_chunk_index: 0
  type: GENERIC
- description: A key performance indicator for CNNs, representing the correctness
    of the model's classifications.
  name: Accuracy
