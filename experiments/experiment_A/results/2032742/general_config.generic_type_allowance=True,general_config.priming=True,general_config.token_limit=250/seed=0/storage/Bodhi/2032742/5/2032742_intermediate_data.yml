entities:
- description: A convolution operation that utilizes sparse weight tensors to reduce
    computational complexity and potentially accelerate CNNs.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: A standard convolution operation that uses dense weight tensors.
  name: Dense convolution
  source_chunk_index: 0
  type: method
- description: The proportion of zero-valued elements in a weight tensor, used to
    reduce model size and accelerate computation.
  name: Sparsity
  source_chunk_index: 0
  type: generic
- description: A method used for implementing fully connected layers, leveraging sparse
    matrix multiplication to exploit sparsity.
  name: SpMDM (sparse matrix and dense matrix multiplication)
  source_chunk_index: 0
  type: method
- description: General Matrix Multiplication, a fundamental operation used in implementing
    fully connected layers.
  name: GEMM
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform convolution operations, a key component
    for feature extraction.
  name: Convolution layers
  source_chunk_index: 0
  type: generic
- description: Layers in a CNN where each neuron is connected to all neurons in the
    previous layer; can become a bottleneck after sparse convolution optimizations.
  name: Fully connected layers
  source_chunk_index: 0
  type: generic
- description: The improvement in processing speed achieved by using sparse convolution
    compared to dense convolution.
  name: Speedup
  source_chunk_index: 0
  type: generic
- description: A multi-dimensional array of weights used in convolutional layers.
  name: Weight tensor
  source_chunk_index: 0
  type: generic
- description: A specific type of processor where sparse convolution can outperform
    dense convolution.
  name: Atom processors
  source_chunk_index: 0
  type: generic
- description: Floating point operations per second, a measure of computational performance.
  name: FLOP/s
  source_chunk_index: 0
  type: generic
- description: A key performance indicator (KPI) in the "golden trident" of CNN optimization,
    representing the model's ability to correctly classify or predict outcomes. The
    document aims to optimize CNNs while maintaining or improving accuracy.
  name: Accuracy
  source_chunk_index: 0
  type: task
- description: A component or layer in a neural network that limits the overall processing
    speed, often becoming a performance constraint after optimizations in other areas,
    such as sparse convolution.
  name: Bottleneck
  source_chunk_index: 0
  type: GENERIC
