chunk_indices:
- 0
entities:
- description: The correctness of the classification results, a critical metric in
    evaluating CNN performance.
  name: Accuracy
  source_chunk_index: 0
  type: GENERIC
- description: The speed at which a CNN can classify images, often measured in images
    per second (throughput).
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: The amount of memory required to store a CNN's parameters, a factor
    in deployment on resource-constrained platforms.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor used for evaluating the performance of CNN implementations.
  name: Xeon processors
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor used for evaluating the performance of CNN implementations.
  name: Atom processors
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to reduce the number of parameters and computations
    in a CNN, leading to smaller model sizes and faster speeds.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: Layers in a CNN that connect all neurons from the previous layer to
    all neurons in the current layer.
  name: Fully connected layers
  source_chunk_index: 0
  type: GENERIC
- description: A metric used to measure the classification speed of a CNN, indicating
    the number of images processed per second.
  name: Images per second (throughput)
  source_chunk_index: 0
  type: GENERIC
- description: The improvement in performance (e.g., classification speed) of a sparse
    CNN compared to a dense implementation.
  name: Speedups
  source_chunk_index: 0
  type: GENERIC
- description: A Convolutional Neural Network optimized for sparsity to reduce model
    size and accelerate classification speed.
  name: Sparse CNN
  source_chunk_index: 0
  type: method
- description: A specific CNN architecture used as a benchmark for evaluating the
    performance of sparse CNN implementations.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform convolution operations, a key area
    for optimization through sparsity.
  name: Convolution layers
  source_chunk_index: 0
  type: generic
- description: A method used to reduce the computational cost of convolution layers
    in CNNs by exploiting sparsity in the weight matrices.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: A cross-layer methodology that simultaneously optimizes both fully
    connected and convolution layers in CNNs to improve speed and reduce model size.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: Floating point operations per second, a measure of computational performance.
  name: FLOPS
  source_chunk_index: 0
  type: generic
- description: Sparse Matrix-Vector multiplication, a fundamental operation in sparse
    linear algebra.
  name: SpMV
  source_chunk_index: 0
  type: generic
- description: General Matrix Multiplication, a core operation in dense linear algebra
    and deep learning.
  name: GEMM
  source_chunk_index: 0
  type: generic
- description: Single-precision General Matrix Multiplication, a variant of GEMM using
    single-precision floating-point numbers.
  name: SGEMM
  source_chunk_index: 0
  type: generic
- description: The improvement in processing speed, specifically for convolution layers
    in AlexNet, measured as a multiple of the performance of the best dense direct
    convolution implementation. The text mentions speedups of 3.4x and 7.3x on Xeon
    and Atom processors, respectively.
  name: Speedups
  source_chunk_index: 0
  type: task
- description: The rate at which AlexNet classifications are performed, measured in
    images per second. The text specifies throughput values of 2, 371, and 120 images
    per second on respective platforms.
  name: Throughput
  source_chunk_index: 0
  type: task
