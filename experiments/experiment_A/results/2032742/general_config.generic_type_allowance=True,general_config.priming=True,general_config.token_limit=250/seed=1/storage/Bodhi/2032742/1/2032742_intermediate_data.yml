    the network.
  name: Pruning CNNs
  source_chunk_index: 0
  type: method
- description: Layers in a neural network where each neuron is connected to all neurons
    in the previous layer. These layers are often used for classification tasks in
    CNNs.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: Layers in a CNN that apply convolutional filters to the input data,
    extracting features. They are a core component of CNNs, responsible for feature
    extraction.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: A convolution operation that exploits sparsity to reduce computational
    cost.
