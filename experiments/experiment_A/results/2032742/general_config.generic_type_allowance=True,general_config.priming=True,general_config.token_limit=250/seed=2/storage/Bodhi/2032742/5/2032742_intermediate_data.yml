entities:
- description: A convolution operation optimized for sparse weight tensors, aiming
    to reduce computational cost and accelerate CNNs.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: Standard convolution operation, serving as a baseline for comparison
    with sparse convolution.
  name: Dense convolution
  source_chunk_index: 0
  type: method
- description: The proportion of zero-valued elements in a weight tensor, a key factor
    in determining the effectiveness of sparse convolution.
  name: Sparsity
  source_chunk_index: 0
  type: generic
- description: The tensor containing the weights of a convolutional layer, where sparsity
    is applied.
  name: Weight tensor W
  source_chunk_index: 0
  type: generic
- description: Layers in a neural network where each neuron is connected to every
    neuron in the previous layer; can become a bottleneck after sparse convolution
    optimizations.
  name: Fully connected layers
  source_chunk_index: 0
  type: generic
- description: Layers in a CNN that perform convolution operations, a primary focus
    for optimization.
  name: Convolution layers
  source_chunk_index: 0
  type: generic
- description: The improvement in processing speed achieved by using sparse convolution
    compared to dense convolution.
  name: Speedup
  source_chunk_index: 0
  type: generic
- description: A specific type of processor where sparse convolution is shown to outperform
    dense convolution.
  name: Atom processors
  source_chunk_index: 0
  type: generic
- description: A technique used to implement fully connected layers, leveraging sparse
    matrix multiplication to exploit sparsity.
  name: Sparse matrix and dense matrix multiplication (SpMDM)
  source_chunk_index: 0
  type: method
- description: General Matrix Multiplication, a fundamental operation used in implementing
    fully connected layers.
  name: GEMM
  source_chunk_index: 0
  type: method
- description: Floating point operations per second, a key performance indicator (KPI)
    used to evaluate the speed of sparse convolution.
  name: FLOP/s
  source_chunk_index: 0
  type: generic
- description: A challenge in sparse convolution, referring to the ratio of computation
    to memory access. Lower arithmetic intensity can limit the performance gains of
    sparse convolution.
  name: Arithmetic Intensity
  source_chunk_index: 0
  type: generic
- description: A key performance indicator (KPI) for CNNs, representing the rate at
    which the model processes data, often measured in images per second or FLOP/s.
  name: Speed
  source_chunk_index: 0
  type: task
- description: A key performance indicator (KPI) for CNNs, representing the amount
    of memory the model occupies, often measured in parameters or megabytes.
  name: Model Size
  source_chunk_index: 0
  type: task
- description: A component or layer in a neural network that limits the overall processing
    speed, often becoming a performance constraint after optimizations in other areas,
    such as sparse convolution.
  name: Bottleneck
  source_chunk_index: 0
  type: GENERIC
