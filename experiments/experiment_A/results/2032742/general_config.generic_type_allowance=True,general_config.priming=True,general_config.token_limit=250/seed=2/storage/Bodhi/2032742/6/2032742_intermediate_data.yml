  strength: 8.0
  target_entity: Convolution layers
- description: The text mentions that lower convolution layers are harder to sparsify,
    implying a relationship between convolution layers and sparsity.
  source_chunk_index: 0
  source_entity: Convolution layers
  strength: 7.0
  target_entity: Sparsity
- description: Trading off a small increase in model size of fully connected layers
    for a large speedup of convolution layers can be beneficial for optimizing accuracy,
    speed, and model size.
  source_chunk_index: 0
  source_entity: Fully connected layers
  strength: 8.0
  target_entity: Convolution layers
