- description: The metrics used to evaluate the performance of sparse CNNs, including
    classification accuracy, inference speed (e.g., images per second), model size,
    and computational efficiency (e.g., FLOPS).
  name: Performance Metrics
  source_chunk_index: 0
  type: generic
- description: The computational cost and overhead associated with transforming tensors
    into matrices, a step often required in sparse convolution methods, which can
    negatively impact performance.
  name: Tensor-to-Matrix Transformation Overhead
  source_chunk_index: 0
  type: method
- description: The constraint that some sparse convolution methods are not applicable
    to small kernel sizes (e.g., 3x3), which are commonly used in modern CNN architectures,
    thus limiting their applicability and potential for speedup.
  name: Small Kernel Size Limitation
  source_chunk_index: 0
  type: method
- description: Floating-point operations per second, a measure of computational performance,
    which is missing from the extracted entities.
  name: FLOPS
  source_chunk_index: 0
  type: generic
- description: The computational cost and data transfer overhead associated with transforming
    tensors into matrices, a common step in some sparse convolution methods. This
    overhead can negatively impact the overall performance and speedup of sparse CNNs.
  name: Tensor-to-Matrix Transformation Overhead
  source_chunk_index: 0
  type: generic
- description: The restriction of some sparse convolution methods to large filter
    sizes (e.g., 9x9), which limits their applicability to modern CNN architectures
    that often utilize smaller filters (e.g., 3x3). This constraint hinders the ability
    of these methods to fully exploit the potential of sparse convolution in current
    CNN designs.
  name: Limitation on Small Kernel Sizes
  source_chunk_index: 0
  type: generic
- description: The specific measurements used to evaluate the effectiveness of the
    method, such as speedups of convolution layers in AlexNet over the best dense
    direct convolution performance on Xeon and Atom processors, and AlexNet classification
    throughput.
  name: Performance Metrics
  source_chunk_index: 0
  type: generic
