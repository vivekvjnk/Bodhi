      \ on BDW .We use highly optimized SGEMM performance as a proxy of dense convolution\
      \ performance to quantify layer - wise speedups of our Holistic SparseCNN .As\
      \ a centerpiece of deep learning , CNNs are under relentless pressure to be\
      \ smaller , faster , and with higher evaluation/classification accuracy .In\
      \ this paper , we present Holistic SparseCNN , a collection of techniques that\
      \ pave the road to unleash the full potential of sparse CNNs .Secondly , unlike\
      \ prior research focusing on using sparse methods on convolution layers or fully\
      \ connected layers in isolation , our new cross - layer holistic methodology\
      \ not only exploits the synergies of sparse methods on convolution layers and\
      \ fully connected layers but also enables optimizing accuracy , speed , and\
      \ size together .Ourresults on AlexNet demonstrated 3. 4 \xD7 and 7. 3 \xD7\
      \ speedups of convolution layers over the best dense convolution on representative\
      \ server and mobile platforms as well as the best classification throughputs\
