    text_unit: "Phenomenally successful in practical inference problems , convolutional\
      \ neural networks ( CNN ) are widely deployed in mobile devices , data centers\
      \ , and even supercomputers .While pruning the fully connected layers reduces\
      \ a CNN 's size considerably , it does not improve inference speed noticeably\
      \ as the compute heavy parts lie in convolutions .Pruning CNNs in a way that\
      \ increase inference speed often imposes specific sparsity structures , thus\
      \ limiting the achievable sparsity levels . We present a method to realize simultaneously\
      \ size economy and speed improvement while pruning CNNs .Deep neural networks\
      \ , especially CNNs , have been pervasive in computer vision recently and served\
      \ as a foundation for many critical applications ranging from image recognition\
      \ [ 1 7 ] and video analytics [ 2 1 ] to autonomous driving [ 1 ] .The trained\
      \ CNN models are deployed broadly for classification on a large variety of platforms\
      \ , covering the spectrum of data center servers to mobile clients such as smart\
      \ phones and autonomous - driving cars .When the trained CNN models perform\
      \ classification on these platforms , especially on resource constraint mobile\
      \ platforms , accuracy , ( classification ) speed , and model size are the three\
      \ key requirements that together form the threepronged \" golden trident \"\
      \ .Exploiting or imposing sparsity in CNNs [ 1 2 , 1 1 , 7 , 1 9 , 8 , 1 4 ]\
      \ have been recently studied to reduce model size and/or accelerate classification\
      \ speed with minimal or zero accuracy loss .One research thrust [ 1 2 , 1 1\
      \ , 7 ] of sparse CNN has been focusing on reducing model size by sparsifying/compressing\
      \ fully connected layers that have most of the parameters of the entire CNN\
      \ model .However , such designs provide limited benefits to the classification\
      \ speed of CNN , because the majority of the computation , i.e. , FLOPS , are\
      \ within the convolution layers instead .For example , in AlexNet , while fully\
      \ connected layers comprise more than 9 0 % of the total model size , it is\
      \ the convolution layers that comprise more than 9 0 % of the total computation\
      \ .Therefore , another research thrust [ 1 9 , 8 , 1 4 ] of sparse CNN focuses\
      \ on convolution layers to reduce compute requirements and thus to improve classification\
      \ speed .However , there are challenges for sparse CNN to achieve its full potential\
      \ , including 1 ) sparse convolution has lower arithmetic intensity , thus additional\
      \ data transfers involved in lowering tensors to matrices used in [ 1 9 , 8\
      \ , 1 4 ] add higher overhead , 2 ) some prior sparse convolution methods [\
      \ 8 , 1 4 ] are only applicable to large filters ( e.g. , 9 \xD7 9 ) , which\
      \ limits their usage for modern CNNs where small filters ( e.g. , 3 \xD7 3 )\
      \ are popular .Moreover , while current sparse CNN methods focus mostly on either\
      \ fully connected layers or convolution layers , it is desirable to apply sparse\
      \ methods to both layers simultaneously .We also provide guidelines for the\
      \ range of sparsity that should be targeted during training . \u2022 A highly\
      \ - optimized sparse CNN implementation that provides 3. 4 \xD7 and 7. 3 \xD7\
      \ speedups of convolution layers in AlexNet over the best dense direct convolution\
      \ performance on Xeon and Atom processors , respectively , with no accuracy\
      \ drop .We also show 2, 3 7 1 and 1 2 0 images per second AlexNet classification\
      \ throughput , which are significantly higher than the best published performance\
      \ on respective platforms .Sparse methods have been popular to reduce model\
      \ size and accelerate classification speed of CNNs with minimal or zero accuracy\
      \ loss .However , the speedup of end - to - end performance is limited , because\
      \ the fully connected layers only account for less than 1 0 % total computation\
      \ in most CNNs such as AlexNet [ 1 7 ] .Another research thrust [ 1 9 , 8 ,\
