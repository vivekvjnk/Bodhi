      outperform dense convolution in a wider range of sparsity and the speedups are
      higher as will be shown in Section 5 .The lowering and lifting process has demonstrated
      overhead for dense convolution [ 1 0 ] , and it is particularly problematic
      for sparse convolution with intensity already much lower than its dense counter
      part .Even though a bulk of computation belongs to convolution layers , fully
      connected layers can become a bottleneck after sparse convolution optimizations
      .Exploiting sparsity in fully connected layers is actually simpler than convolution
      layers , because fully connected layers are implemented as GEMM and we can leverage
      work done before on sparse matrix and dense matrix multiplication ( SpMDM )
      .Simultaneously learning the sparsity of convolution and fully connected layers
      is beneficial in amortizing the training cost and in performing holistic trade
      - off among accuracy , classification speed , and model size .However , when
      targeting no accuracy loss from sparse models , we find that using the same
      regularization parameters across all layers tends to provide a high sparsity
      on fully connected ( fc ) layers but not enough sparsity on convolution layers
      to obtain speedups from sparse convolutions .Therefore , trading off a small
      increase in model size of fc layers for a large speedup of convolution layers
      can be often beneficial for holistically optimizing the accuracy - speed - size
      of CNN .The lower convolution layers such as conv 1 in AlexNet are much harder
      to sparsify than higher layers such as conv 2 and above unless we can tolerate
