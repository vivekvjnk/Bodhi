summary: 'This paper focuses on improving Convolutional Neural Networks (CNNs) for
  practical inference, particularly addressing the trade-offs between model size,
  classification speed, and accuracy. Key concepts include: **CNNs**, **fully connected
  layers**, and **convolution layers**. The paper explores **sparsity** as a technique
  to reduce model size and accelerate classification.  It introduces **Holistic SparseCNN**,
  a method that simultaneously optimizes both convolution and fully connected layers.  The
  core challenge is balancing the computational demands of convolution layers (where
  most computation occurs) with the parameter count of fully connected layers.  The
  paper defines **sparse convolution**, its advantages and limitations (e.g., lower
  arithmetic intensity, overhead from tensor transformations).  It also discusses
  the impact of **sparsity levels** on speedup, the use of **weight decay**, and the
  importance of holistic optimization across layers to achieve optimal performance.  The
  goal is to achieve significant speedups (e.g., 3.4x, 7.3x) in convolution layers
  and improve classification throughput.  The paper uses AlexNet as a case study.

  '
