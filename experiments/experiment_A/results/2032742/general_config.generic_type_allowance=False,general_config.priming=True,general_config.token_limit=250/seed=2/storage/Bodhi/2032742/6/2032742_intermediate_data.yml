- description: A regularization technique used to penalize large weights in the neural
    network, promoting sparsity.
  name: Weight Decay
  source_chunk_index: 0
  type: method
- description: A parameter used to adjust the weight decay applied to fully connected
    (FC) layers, influencing their sparsity level.
  name: FC Decay Multiplier
  source_chunk_index: 0
  type: method
- description: A regularization technique used to penalize large weights in the model,
    preventing overfitting. Specific values (1e-5, 5e-5, and 6e-5) are used for different
    layers in the Holistic SparseCNN.
  name: Weight Decay
  source_chunk_index: 0
  type: method
- description: A multiplier applied to the weight decay parameter, used to control
    the regularization strength in fully connected (FC) layers. Values of 1, 0.1,
    and 0.01 are used in the Holistic SparseCNN.
  name: FC Decay Multiplier
  source_chunk_index: 0
  type: method
- description: The objective of achieving a high rate of image classification, measured
    in images per second.
  name: Classification Speed
