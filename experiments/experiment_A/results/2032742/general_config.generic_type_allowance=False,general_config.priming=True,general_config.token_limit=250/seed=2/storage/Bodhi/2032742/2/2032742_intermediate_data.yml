entities:
- description: A type of artificial neural network used for image recognition and
    other tasks, and a core component of the study.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: The objective of improving the speed and reducing the size of Convolutional
    Neural Networks.
  name: Optimizing CNNs
  source_chunk_index: 0
  type: task
- description: A technique used to reduce the size and accelerate the speed of CNNs,
    applied to both fully connected and convolution layers.
  name: Sparsity
  source_chunk_index: 0
  type: method
- description: CNNs that utilize sparsity to reduce model size and accelerate classification
    speed.
  name: Sparse CNNs
  source_chunk_index: 0
  type: method
- description: A key performance indicator and objective of the study, achieved through
    methods like sparsity.
  name: Accelerating classification speed
  source_chunk_index: 0
  type: task
- description: A key performance indicator and objective of the study, achieved through
    methods like sparsity.
  name: Reducing model size
  source_chunk_index: 0
  type: task
- description: A novel method that simultaneously optimizes both fully connected and
    convolution layers in CNNs.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: A technique used for fully connected layers in the context of sparse
    CNNs.
  name: Sparse matrix and dense matrix multiplication (SpMDM)
  source_chunk_index: 0
  type: method
- description: The goal of the study, measured by performance metrics such as images
    per second.
  name: Achieving speedups over dense convolution
  source_chunk_index: 0
  type: task
- description: A method used to reduce the computational requirements of convolution
    layers by introducing sparsity. This involves techniques that reduce the number
    of non-zero elements in the convolutional filters or feature maps.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: The ratio of computation to data movement in a computational task.
    Sparse convolution methods can have lower arithmetic intensity, which can lead
    to performance bottlenecks due to increased data transfer overhead.
  name: Arithmetic Intensity
  source_chunk_index: 0
  type: task
- description: Convolutional filters with small sizes (e.g., 3x3). The text highlights
    that some sparse convolution methods are not applicable to small filters, which
    are commonly used in modern CNNs.
  name: Small Filters
  source_chunk_index: 0
  type: method
- description: A method used in sparse CNNs that has lower arithmetic intensity, potentially
    leading to additional data transfers and overhead.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: Filters with small sizes (e.g., 3x3) used in modern CNNs, which pose
    a challenge for some sparse convolution methods that are only applicable to large
    filters.
  name: Small Filters
  source_chunk_index: 0
  type: method
- description: A technique used in Convolutional Neural Networks (CNNs) to reduce
    computational requirements and improve classification speed by introducing sparsity
    in the convolution layers.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: A challenge associated with sparse convolution, referring to the ratio
    of computation to data movement. Lower arithmetic intensity in sparse convolution
    can lead to increased overhead due to additional data transfers.
  name: Arithmetic Intensity
  source_chunk_index: 0
  type: task
- description: The dimensions of the filters used in convolutional layers. Some sparse
    convolution methods are limited in their applicability to specific filter sizes,
    such as large filters (e.g., 9x9), which restricts their use in modern CNNs that
    often employ smaller filters (e.g., 3x3).
  name: Filter Sizes
  source_chunk_index: 0
  type: task
