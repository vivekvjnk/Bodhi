- description: A method used to reduce compute requirements in CNNs by applying sparsity
    to convolution layers.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: The difficulties associated with sparse convolution, including lower
    arithmetic intensity and limitations in filter size applicability.
  name: Challenges of Sparse Convolution
  source_chunk_index: 0
  type: generic
- description: The initial research thrust of sparse CNN, focused on decreasing the
    size of the model by making fully connected layers sparse or compressed.
  name: Reducing model size by sparsifying/compressing fully connected layers
  source_chunk_index: 0
  type: task
- description: The second research thrust of sparse CNN, which aims to reduce the
    computational load and enhance the speed of classification by concentrating on
    convolution layers.
  name: Reducing compute requirements and improving classification speed by focusing
    on convolution layers
  source_chunk_index: 0
  type: task
- description: The challenge of sparse convolution having lower arithmetic intensity,
    leading to additional data transfers and overhead.
  name: LOWER ARITHMETIC INTENSITY
  source_chunk_index: 0
  type: generic
- description: The challenge that some sparse convolution methods are only applicable
    to large filters, limiting their usage for modern CNNs with small filters.
  name: LIMITATION TO LARGE FILTERS
  source_chunk_index: 0
  type: generic
