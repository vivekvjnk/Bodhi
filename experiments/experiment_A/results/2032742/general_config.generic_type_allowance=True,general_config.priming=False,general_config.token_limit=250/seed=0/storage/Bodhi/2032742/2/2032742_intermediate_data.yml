- description: A method used to reduce compute requirements in CNNs by applying sparsity
    to convolution layers.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
- description: A challenge of sparse convolution, referring to the reduced efficiency
    of arithmetic operations, leading to increased data transfer overhead.
  name: Lower Arithmetic Intensity
  source_chunk_index: 0
  type: generic
- description: A challenge associated with sparse convolution, where additional data
    transfers are required, increasing computational cost.
  name: Data Transfer Overhead
  source_chunk_index: 0
  type: generic
- description: A challenge where some sparse convolution methods are only applicable
    to large filters (e.g., 9x9), limiting their use in modern CNNs with small filters
    (e.g., 3x3).
  name: Limitation to Large Filters
  source_chunk_index: 0
  type: generic
- description: The challenge of sparse convolution having lower arithmetic intensity,
    leading to additional data transfers and overhead.
  name: LOWER ARITHMETIC INTENSITY
  source_chunk_index: 0
  type: generic
- description: The constraint where some sparse convolution methods are only applicable
    to large filters, limiting their use in modern CNNs with small filters.
  name: LIMITATION TO LARGE FILTERS
  source_chunk_index: 0
  type: generic
- description: The need to apply sparse methods to both fully connected and convolution
    layers simultaneously, which is a desirable feature not fully addressed by current
    methods.
  name: SIMULTANEOUS APPLICATION TO BOTH LAYERS
  source_chunk_index: 0
  type: generic
- description: The challenge that sparse convolution has lower arithmetic intensity,
    leading to additional data transfers and overhead.
  name: Lower Arithmetic Intensity
  source_chunk_index: 0
  type: generic
- description: The challenge that some prior sparse convolution methods are only applicable
    to large filters, limiting their usage for modern CNNs with small filters.
  name: Limited Applicability to Filter Sizes
  source_chunk_index: 0
  type: generic
- description: The challenge that current sparse CNN methods mostly focus on either
    fully connected layers or convolution layers, while it is desirable to apply sparse
    methods to both layers simultaneously.
  name: Simultaneous Sparsity Application
  source_chunk_index: 0
  type: generic
