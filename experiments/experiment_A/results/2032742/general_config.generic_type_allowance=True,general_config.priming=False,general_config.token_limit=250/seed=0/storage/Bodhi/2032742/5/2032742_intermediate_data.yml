entities:
- description: A convolutional technique that exploits sparsity in the weight tensor
    to potentially achieve speedups over dense convolution.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: A standard convolutional technique used as a baseline for comparison
    with sparse convolution.
  name: Dense convolution
  source_chunk_index: 0
  type: method
- description: The proportion of zero-valued elements in a weight tensor, influencing
    the performance of sparse convolution.
  name: Sparsity
  source_chunk_index: 0
  type: generic
- description: Processors where sparse convolution outperforms dense convolution in
    a wider range of sparsity.
  name: Atom processors
  source_chunk_index: 0
  type: generic
- description: Floating point operations per second, a metric used to measure the
    computational speed of convolution operations.
  name: FLOP/s
  source_chunk_index: 0
  type: generic
- description: Layers in a neural network that can become a bottleneck after sparse
    convolution optimizations.
  name: Fully connected layers
  source_chunk_index: 0
  type: generic
- description: General Matrix Multiplication, used in the implementation of fully
    connected layers.
  name: GEMM
  source_chunk_index: 0
  type: method
- description: Sparse matrix and dense matrix multiplication, a technique that can
    be leveraged to exploit sparsity in fully connected layers.
  name: SpMDM
  source_chunk_index: 0
  type: method
- description: The performance improvement achieved by using sparse convolution compared
    to dense convolution.
  name: Speedup
  source_chunk_index: 0
  type: generic
- description: A multi-dimensional array of weights used in convolutional layers.
