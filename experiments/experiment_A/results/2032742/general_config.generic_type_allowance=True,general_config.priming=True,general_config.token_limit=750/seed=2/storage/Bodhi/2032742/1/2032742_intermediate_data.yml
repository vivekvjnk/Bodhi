entities:
- description: A technique to reduce model size and accelerate classification by eliminating
    redundant computations or connections in neural networks.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: A method that simultaneously optimizes both fully connected and convolution
    layers for speed and size.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: GENERIC
- description: A type of convolution that exploits sparsity to reduce computation,
    aiming for faster classification speed.
  name: Sparse convolution
  source_chunk_index: 0
  type: GENERIC
- description: Standard convolution operation, used as a baseline for comparison with
    sparse convolution.
  name: Dense convolution
  source_chunk_index: 0
  type: GENERIC
- description: A measure of the ratio of computation to memory access, relevant for
    understanding the performance of sparse convolution.
  name: Arithmetic intensity
  source_chunk_index: 0
  type: GENERIC
- description: Floating point operations per second, a measure of computational performance.
  name: FLOPS
  source_chunk_index: 0
  type: GENERIC
- description: General Matrix Multiplication, a fundamental operation in fully connected
    layers.
  name: GEMM
  source_chunk_index: 0
  type: GENERIC
- description: The number of parameters in a neural network, a key factor in memory
    usage and a target for reduction through sparsity.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: The rate at which a model can classify inputs, a key performance metric
    targeted for improvement.
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: The correctness of the model's predictions, a critical factor in the
    "golden trident" trade-off.
  name: Accuracy
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor where sparse convolution is shown to outperform
    dense convolution in a wider range of sparsity.
  name: Atom processors
  source_chunk_index: 0
  type: GENERIC
- description: A type of deep neural network used for image recognition and other
    tasks, the focus of this research for improving inference.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform convolution operations, crucial for
    feature extraction and a key area for speed optimization through sparsity.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: Layers in a CNN where each neuron is connected to all neurons in the
    previous layer, impacting model size and also targeted for sparsity optimization.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: Sparse Matrix-Vector multiplication, a fundamental operation in sparse
    linear algebra, relevant for sparse convolution performance analysis.
  name: SpMV
  source_chunk_index: 0
  type: method
- description: General Matrix Multiplication, a core operation used in fully connected
    layers and relevant for understanding the computational bottlenecks in CNNs.
  name: GEMM
  source_chunk_index: 0
  type: method
- description: Sparse General Matrix Multiplication, a variant of GEMM optimized for
    sparse matrices, relevant to the implementation of fully connected layers.
  name: SGEMM
  source_chunk_index: 0
  type: method
- description: A specific algorithm introduced in the paper to improve the classification
    speed of CNNs by directly implementing sparse convolution.
  name: Direct Sparse Convolution Algorithm
  source_chunk_index: 0
  type: method
- description: A regularization technique used to prevent overfitting in machine learning
    models, particularly in the context of training neural networks. It adds a penalty
    term to the loss function that discourages large weights.
  name: Weight Decay
  source_chunk_index: 0
  type: METHOD
- description: Values used to control the strength of regularization techniques like
    weight decay. These parameters are tuned to optimize model performance, balancing
    accuracy and generalization.
  name: Regularization Parameters
  source_chunk_index: 0
  type: GENERIC
