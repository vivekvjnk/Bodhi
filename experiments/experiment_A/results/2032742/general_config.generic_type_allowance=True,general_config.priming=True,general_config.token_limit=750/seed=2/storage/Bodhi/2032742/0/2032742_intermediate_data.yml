entities:
- description: Layers in CNNs that are often pruned to reduce model size, but pruning
    them alone does not significantly improve inference speed.
  name: Fully connected layers
  source_chunk_index: 0
  type: GENERIC
- description: A method used to reduce model size and accelerate classification speed
    in CNNs by reducing the number of parameters or computations.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: A method that simultaneously optimizes both fully connected and convolution
    layers to achieve size economy and speed improvement.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: GENERIC
- description: A key factor in CNNs, targeted for reduction through sparsity techniques,
    impacting the "golden trident" of accuracy, speed, and model size.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: A critical performance metric for CNNs, targeted for improvement through
    sparsity techniques, forming part of the "golden trident".
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: A key requirement for CNNs, forming part of the "golden trident", and
    a factor that sparsity methods aim to maintain.
  name: Accuracy
  source_chunk_index: 0
  type: GENERIC
- description: Floating point operations per second, a measure of computational load,
    particularly relevant in convolution layers.
  name: FLOPS
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor where the optimized sparse CNN implementation provides
    speedups.
  name: Xeon
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor where the optimized sparse CNN implementation provides
    speedups.
  name: Atom processors
  source_chunk_index: 0
  type: GENERIC
- description: A technique to reduce compute requirements and improve classification
    speed by applying sparsity to convolution layers.
  name: Sparse convolution
  source_chunk_index: 0
  type: GENERIC
- description: The speed at which a CNN performs classification, a key performance
    metric.
  name: Inference speed
  source_chunk_index: 0
  type: GENERIC
- description: Deep learning models widely used for practical inference, deployed
    in various platforms, and central to the paper's focus on improving model efficiency.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: Layers in CNNs that perform the majority of the computation, and are
    the focus of efforts to improve inference speed through sparsity.
  name: Convolution layers
  source_chunk_index: 0
  type: method
- description: Sparse Matrix-Vector multiplication, a fundamental operation in sparse
    linear algebra, relevant to sparse CNNs as it is used in sparse convolution implementations.
  name: SpMV
  source_chunk_index: 0
  type: method
- description: General Matrix-Matrix Multiplication, a core operation in dense linear
    algebra, often used as a baseline for comparison with sparse convolution methods.
  name: GEMM
  source_chunk_index: 0
  type: method
- description: Single-precision General Matrix-Matrix Multiplication, a specific implementation
    of GEMM, often used in the context of CNNs due to the prevalence of single-precision
    floating-point arithmetic.
  name: SGEMM
  source_chunk_index: 0
  type: method
- description: A measure of the ratio of computation to data access in a computation,
    relevant to the efficiency of sparse convolution.
  name: ARITHMETIC INTENSITY
  source_chunk_index: 0
  type: GENERIC
- description: The movement of data between different parts of a computer system,
    such as between memory and the processor, which can introduce overhead in sparse
    CNNs.
  name: DATA TRANSFERS
  source_chunk_index: 0
  type: GENERIC
- description: The additional computational cost and data transfer overhead associated
    with sparse convolution, particularly the transformation of tensors to matrices.
  name: Sparse Convolution Overhead
  source_chunk_index: 0
  type: generic
- description: The limitation of some sparse convolution methods in their applicability
    to small filter sizes (e.g., 3x3), which are commonly used in modern CNN architectures.
  name: Small Filters
  source_chunk_index: 0
  type: generic
