entities:
- description: A method used to reduce model size and accelerate classification in
    CNNs. The paper explores its application in both fully connected and convolution
    layers.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: A method that simultaneously optimizes both fully connected and convolution
    layers in CNNs.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: GENERIC
- description: A measure of the ratio of computation to memory access, relevant to
    the performance of sparse convolution algorithms.
  name: Arithmetic intensity
  source_chunk_index: 0
  type: GENERIC
- description: Floating point operations per second, a measure of computational performance.
  name: FLOPS
  source_chunk_index: 0
  type: GENERIC
- description: Sparse Matrix-Vector multiplication, relevant to the arithmetic intensity
    of sparse convolution.
  name: SpMV
  source_chunk_index: 0
  type: GENERIC
- description: General Matrix Multiplication, relevant to the implementation of fully
    connected layers.
  name: GEMM
  source_chunk_index: 0
  type: GENERIC
- description: Single-precision General Matrix Multiplication, relevant to the implementation
    of fully connected layers.
  name: SGEMM
  source_chunk_index: 0
  type: GENERIC
- description: The amount of memory required to store a model, a key factor in the
    trade-off being addressed.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: The speed at which a model can classify data, a key factor in the trade-off
    being addressed.
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: The correctness of a model's classifications, a key factor in the trade-off
    being addressed.
  name: Accuracy
  source_chunk_index: 0
  type: GENERIC
- description: A type of deep neural network, the focus of the paper, with the goal
    of improving their practical inference, particularly addressing the trade-off
    between model size, classification speed, and accuracy.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform convolutional operations, impacting
    classification speed. The paper explores sparsifying these layers to improve performance.
  name: Convolution layers
  source_chunk_index: 0
  type: generic
- description: Layers within a CNN that are fully connected, impacting model size.
    The paper explores sparsifying these layers to reduce model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: generic
- description: A technique to accelerate CNNs by performing convolution operations
    on sparse data, aiming for speedups over dense convolution.
  name: Sparse convolution
  source_chunk_index: 0
  type: method
- description: Standard convolution operations, used as a baseline for comparison
    with sparse convolution.
  name: Dense convolution
  source_chunk_index: 0
  type: generic
- description: A specific algorithm introduced in the paper to accelerate CNNs by
    directly performing sparse convolution operations.
  name: DIRECT SPARSE CONVOLUTION ALGORITHM
  source_chunk_index: 0
  type: method
- description: A type of processor mentioned as a target platform for the sparse CNN
    implementation.
  name: Atom processors
  source_chunk_index: 0
  type: generic
- description: Sparse Matrix and Dense Matrix Multiplication, a method used for implementing
    fully connected layers, leveraging prior work on sparse and dense matrix multiplication.
  name: SpMDM
  source_chunk_index: 0
  type: method
- description: A regularization technique used to prevent overfitting in machine learning
    models, specifically applied with different multipliers to fully connected (FC)
    layers and convolution layers to control sparsity.
  name: Weight decay
  source_chunk_index: 0
  type: method
- description: Refers to a specific hardware platform, likely a processor, where the
    Holistic SparseCNN achieves a classification speed of 2,371 images per second.
  name: BDW
  source_chunk_index: 0
  type: GENERIC
