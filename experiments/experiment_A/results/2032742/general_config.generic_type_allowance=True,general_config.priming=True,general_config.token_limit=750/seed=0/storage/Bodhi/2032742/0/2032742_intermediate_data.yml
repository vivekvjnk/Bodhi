  type: method
- description: Sparse Matrix-Vector multiplication, a fundamental operation in sparse
    linear algebra, relevant to sparse CNNs as it is used in sparse convolution implementations.
  name: SpMV
  source_chunk_index: 0
  type: method
- description: General Matrix-Matrix Multiplication, a core linear algebra operation,
    often used in dense convolution implementations and relevant for comparison with
    sparse methods.
  name: GEMM
  source_chunk_index: 0
  type: method
- description: Single-precision General Matrix-Matrix Multiplication, a specific implementation
    of GEMM, often used in the context of CNNs due to the prevalence of single-precision
    floating-point arithmetic.
  name: SGEMM
  source_chunk_index: 0
  type: method
- description: A measure of the ratio of computation to data movement in a computation,
    relevant to the efficiency of sparse convolution.
  name: ARITHMETIC INTENSITY
  source_chunk_index: 0
  type: GENERIC
- description: The performance cost associated with moving data between memory and
    processing units, particularly relevant in sparse CNNs due to the lower arithmetic
    intensity of sparse convolution.
  name: DATA TRANSFER OVERHEAD
  source_chunk_index: 0
  type: GENERIC
- description: Specific patterns or arrangements of zero and non-zero weights within
    a neural network, often imposed to enable efficient sparse computation and reduce
    model size.
  name: SPARSITY STRUCTURES
  source_chunk_index: 0
  type: GENERIC
- description: A method used to reduce compute requirements and improve classification
    speed in CNNs by exploiting sparsity in the convolution layers. However, it faces
    challenges such as lower arithmetic intensity and overhead from data transfers.
  name: Sparse Convolution
  source_chunk_index: 0
  type: method
