entities:
- description: Layers within a CNN that are often pruned to reduce model size, but
    pruning them alone does not significantly improve inference speed.
  name: Fully connected layers
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to reduce model size and accelerate classification
    speed in CNNs by reducing the number of parameters or computations.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: A method that simultaneously optimizes both fully connected and convolution
    layers to achieve size economy and speed improvement.
  name: Holistic SparseCNN
