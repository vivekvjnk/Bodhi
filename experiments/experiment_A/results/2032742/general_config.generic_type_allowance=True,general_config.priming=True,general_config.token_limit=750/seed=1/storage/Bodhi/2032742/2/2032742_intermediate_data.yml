entities:
- description: A method that simultaneously optimizes convolution and fully connected
    layers in CNNs, aiming to improve speed and reduce model size.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: GENERIC
- description: Convolutional Neural Networks, a core component of deep learning, subject
    to pressure for improvements in size, speed, and accuracy.
  name: CNNs
  source_chunk_index: 0
  type: GENERIC
- description: Layers within a CNN that perform convolutional operations, and are
    a key focus for optimization in the paper.
  name: Convolution layers
  source_chunk_index: 0
  type: GENERIC
- description: Layers within a CNN that are fully connected, and are also a target
    for optimization through sparsity.
  name: Fully connected layers
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to reduce model size and accelerate classification
    in CNNs, applied to both convolution and fully connected layers.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: A type of convolution that leverages sparsity to potentially improve
    performance, but can be slower than dense convolution under certain conditions.
  name: Sparse convolution
  source_chunk_index: 0
  type: GENERIC
- description: A highly optimized matrix multiplication operation used as a proxy
    for dense convolution performance.
  name: SGEMM
  source_chunk_index: 0
  type: GENERIC
- description: The rate at which a model can classify images, a key metric for evaluating
    the performance of CNNs.
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: A specific CNN architecture used to demonstrate the performance improvements
    of Holistic SparseCNN.
  name: AlexNet
  source_chunk_index: 0
  type: GENERIC
- description: A methodology that optimizes both convolution and fully connected layers
    simultaneously to improve accuracy, speed, and size.
  name: Cross-layer optimization
  source_chunk_index: 0
  type: GENERIC
- description: The improvement in processing speed, e.g., 3.4x and 7.3x, achieved
    by Holistic SparseCNN on different platforms.
  name: Speedup
  source_chunk_index: 0
  type: GENERIC
- description: The overarching objective of the paper, focusing on enhancing Convolutional
    Neural Networks to achieve better performance in real-world applications, considering
    factors like model size, speed, and accuracy.
  name: Improving CNNs for Practical Inference
  source_chunk_index: 0
  type: task
- description: A type of processor platform where speedups were demonstrated.
  name: Xeon
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor platform where speedups were demonstrated.
  name: Atom
  source_chunk_index: 0
  type: GENERIC
