entities:
- description: A key performance metric for CNNs, representing the correctness of
    the model's predictions.
  name: Accuracy
  source_chunk_index: 0
  type: GENERIC
- description: The speed at which a CNN can classify data, a critical factor in real-world
    applications.
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: The amount of memory required to store a CNN, a factor in deployment
    on resource-constrained platforms.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to reduce model size and/or accelerate classification
    speed in CNNs by reducing the number of active parameters.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: Layers in a CNN that are fully connected, and whose sparsity affects
    model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: GENERIC
- description: Layers in a CNN that perform convolutional operations, and whose sparsity
    impacts computation and speed.
  name: Convolution layers
  source_chunk_index: 0
  type: GENERIC
- description: An approach that aims for simultaneous optimization of speed, size,
    and accuracy across both fully connected and convolutional layers in CNNs.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: GENERIC
- description: A specific CNN architecture used as a test case in the paper.
  name: AlexNet
  source_chunk_index: 0
  type: GENERIC
- description: The improvement in classification speed achieved through techniques
    like sparsity.
  name: Speedups
  source_chunk_index: 0
  type: GENERIC
- description: A platform where the Holistic SparseCNN was tested.
  name: BDW
  source_chunk_index: 0
  type: GENERIC
- description: Deep learning models widely used in image recognition and other applications,
    with a focus on optimizing their speed, size, and accuracy.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: A regularization technique used to prevent overfitting in machine learning
    models, specifically applied with different multipliers (1e-5, 5e-5, and 6e-5)
    for different layers (FC and convolution).
  name: Weight Decay
  source_chunk_index: 0
  type: METHOD
- description: A highly optimized Basic Linear Algebra Subprograms (BLAS) routine
    used as a proxy for dense convolution performance, representing the speed of dense
    matrix multiplication.
  name: SGEMM
  source_chunk_index: 0
  type: METHOD
- description: A speedup factor achieved for convolution layers over the best dense
    convolution on representative server platforms.
  name: 3.4x
  source_chunk_index: 0
  type: GENERIC
- description: A speedup factor achieved for convolution layers over the best dense
    convolution on mobile platforms.
  name: 7.3x
  source_chunk_index: 0
  type: GENERIC
- description: A collection of techniques that pave the road to unleash the full potential
    of sparse CNNs, aiming for simultaneous optimization of speed, size, and accuracy
    across both layer types.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: method
- description: The primary objective of the Holistic SparseCNN approach, focusing
    on achieving the best possible balance between these three key aspects of CNN
    performance.
  name: Optimizing Accuracy, Speed, and Size
  source_chunk_index: 0
  type: task
- description: A key algorithm presented in the paper, used within the Holistic SparseCNN
    approach to optimize CNNs.
  name: Direct Sparse Convolution
  source_chunk_index: 0
  type: method
