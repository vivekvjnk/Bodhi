- description: The ratio of arithmetic operations to memory operations in a computation.
    Sparse convolution has lower arithmetic intensity, which can lead to performance
    bottlenecks due to increased data transfer overhead.
  name: ARITHMETIC INTENSITY
  source_chunk_index: 0
  type: generic
- description: Convolutional filters with small kernel sizes (e.g., 3x3), which are
    commonly used in modern CNNs. Some sparse convolution methods are not applicable
    to small filters, limiting their applicability.
  name: SMALL FILTERS
  source_chunk_index: 0
  type: generic
- description: The objective of sparse CNNs to decrease the number of parameters in
    the model, leading to a smaller model footprint.
  name: Reduce Model Size
  source_chunk_index: 0
  type: task
- description: The objective of sparse CNNs to accelerate the process of classifying
    inputs, leading to faster inference times.
  name: Improve Classification Speed
  source_chunk_index: 0
  type: task
- description: The speedup achieved in convolution layers of AlexNet on Xeon processors
    using a highly-optimized sparse CNN implementation, compared to the best dense
    direct convolution performance.
  name: 3.4x Speedup
  source_chunk_index: 0
  type: method
- description: The speedup achieved in convolution layers of AlexNet on Atom processors
    using a highly-optimized sparse CNN implementation, compared to the best dense
    direct convolution performance.
  name: 7.3x Speedup
  source_chunk_index: 0
  type: method
