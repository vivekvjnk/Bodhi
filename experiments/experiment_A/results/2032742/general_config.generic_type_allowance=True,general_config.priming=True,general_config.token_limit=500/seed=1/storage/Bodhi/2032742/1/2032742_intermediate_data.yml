entities:
- description: Layers within CNNs that have a large number of parameters and are often
    targeted for sparsification to reduce model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: GENERIC
- description: Layers within CNNs that perform the majority of the computation (FLOPS)
    and are targeted for sparsification to improve classification speed.
  name: Convolution layers
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to reduce model size and/or accelerate classification
    speed in CNNs.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: The amount of memory required to store a trained neural network model.
    Sparsity is used to reduce model size.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: The speed at which a CNN can classify inputs, often measured in images
    per second. Sparsity is used to improve classification speed.
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: A specific CNN architecture used as an example to demonstrate the impact
    of sparsification on model size and classification speed.
  name: AlexNet
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor used as a hardware platform for evaluating the
    performance of sparse CNN implementations.
  name: Xeon
  source_chunk_index: 0
  type: GENERIC
- description: A type of processor used as a hardware platform for evaluating the
    performance of sparse CNN implementations.
  name: Atom
  source_chunk_index: 0
  type: GENERIC
- description: A technique to reduce the computational cost of convolution operations
    by exploiting sparsity in the convolutional layers.
  name: Sparse convolution
  source_chunk_index: 0
  type: GENERIC
- description: Widely used in applications like image recognition, CNNs are the focus
    of optimization efforts for speed and size.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: The objective of sparse CNNs to decrease the number of parameters in
    the model, leading to a smaller model size.
  name: Reducing Model Size
  source_chunk_index: 0
  type: task
- description: The objective of sparse CNNs to accelerate the process of image classification.
  name: Improving Classification Speed
  source_chunk_index: 0
  type: task
- description: Achieving 3.4x and 7.3x speedups of convolution layers in AlexNet over
    the best dense direct convolution performance on Xeon and Atom processors, respectively.
  name: Speedups of Convolution Layers
  source_chunk_index: 0
  type: task
- description: A specific algorithm introduced in the paper for performing sparse
    convolution operations directly, contributing to improved speed and efficiency.
  name: Direct Sparse Convolution Algorithm
  source_chunk_index: 0
  type: method
- description: A Basic Linear Algebra Subprograms (BLAS) routine used as a proxy to
    evaluate the performance of dense convolution.
  name: SGEMM
  source_chunk_index: 0
  type: method
- description: The challenges faced when implementing sparse convolution, including
    lower arithmetic intensity and limited applicability to small filters.
  name: Sparse Convolution Challenges
  source_chunk_index: 0
  type: GENERIC
- description: The importance of carefully distributing sparsity across different
    layers within a CNN to optimize performance.
  name: Balancing Sparsity Levels
  source_chunk_index: 0
  type: GENERIC
