entities:
- description: The speed at which a CNN can classify data, a key performance metric.
  name: Classification speed
  source_chunk_index: 0
  type: GENERIC
- description: Layers in a neural network that connect all neurons from the previous
    layer to all neurons in the current layer; their size impacts model size.
  name: Fully connected layers
  source_chunk_index: 0
  type: GENERIC
- description: Layers in a CNN that perform convolution operations; their computational
    complexity impacts speed.
  name: Convolution layers
  source_chunk_index: 0
  type: GENERIC
- description: An approach aiming for simultaneous optimization of speed, size, and
    accuracy across both convolution and fully connected layers in sparse CNNs.
  name: Holistic SparseCNN
  source_chunk_index: 0
  type: GENERIC
- description: A specific algorithm presented in the paper to speed up sparse convolution
    operations.
  name: Direct sparse convolution
  source_chunk_index: 0
  type: GENERIC
- description: The proportion of zero-valued elements in a tensor, used to reduce
    model size and/or accelerate computation.
  name: Sparsity
  source_chunk_index: 0
  type: GENERIC
- description: A measure of the ratio of computation to memory access, relevant to
    the performance of sparse convolution.
  name: Arithmetic intensity
  source_chunk_index: 0
  type: GENERIC
- description: The number of parameters in a neural network, a key factor in deployment
    and efficiency.
  name: Model size
  source_chunk_index: 0
  type: GENERIC
- description: The improvement in speed achieved by using sparse convolution compared
    to dense convolution.
  name: Speedups
  source_chunk_index: 0
  type: GENERIC
