    the paper focuses on optimizing their speed and size.
  name: Convolutional Neural Networks (CNNs)
  source_chunk_index: 0
  type: method
- description: CNNs that utilize sparsity to reduce model size and/or accelerate classification
    speed.
  name: Sparse CNNs
  source_chunk_index: 0
  type: method
- description: A specific algorithm presented in the paper to speed up CNNs by eliminating
    redundant computations in convolution layers.
  name: Direct Sparse Convolution Algorithm
  source_chunk_index: 0
  type: METHOD
- description: The objective of achieving improved classification speed in CNNs, particularly
    through the use of sparse convolution methods.
  name: Speedups
  source_chunk_index: 0
  type: TASK
- description: Sparse Matrix-Vector Multiplication, a computational method relevant
    to sparse matrix operations.
  name: SpMV
  source_chunk_index: 0
  type: method
- description: Sparse Matrix and Dense Matrix Multiplication, a method used in fully
    connected layers to exploit sparsity.
  name: SpMDM
  source_chunk_index: 0
  type: method
- description: A specific algorithm presented in the paper to speed up CNNs by directly
    performing sparse convolution operations.
  name: Direct Sparse Convolution Algorithm
  source_chunk_index: 0
  type: METHOD
- description: A method to accelerate CNNs by reducing computations in convolution
    layers, leveraging sparsity in the weight tensors.
  name: Sparse Convolution
  source_chunk_index: 0
  type: METHOD
- description: The objective of achieving faster computation in CNNs, specifically
    through the use of sparse methods and algorithms like direct sparse convolution.
  name: Speedups
  source_chunk_index: 0
  type: TASK
- description: The objective of decreasing the size of CNN models, often achieved
    through techniques like pruning and sparsity, particularly in fully connected
    layers.
  name: Model Size Reduction
  source_chunk_index: 0
  type: TASK
