entities:
- description: The task of determining the emotional tone or attitude expressed in
    a piece of text, specifically within the context of financial news.
  name: sentiment analysis
  source_chunk_index: 0
  type: task
- description: A BERT-based language model specifically designed for financial NLP
    tasks, particularly sentiment analysis of financial texts.
  name: FinBERT
  source_chunk_index: 0
  type: method
- description: A transformer-based machine learning model used for various NLP tasks,
    serving as the foundation for FinBERT.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A machine learning technique where knowledge gained from solving one
    problem is applied to a different but related problem, used in the development
    of FinBERT.
  name: transfer learning
  source_chunk_index: 0
  type: method
- description: A fine-tuning strategy used to adapt pre-trained language models to
    specific tasks, such as sentiment analysis in finance.
  name: discriminative fine-tuning
  source_chunk_index: 0
  type: method
- description: A learning rate schedule used during fine-tuning to optimize model
    performance.
  name: slanted triangular learning rates
  source_chunk_index: 0
  type: method
- description: A fine-tuning technique where layers of a pre-trained model are unfrozen
    sequentially to prevent catastrophic forgetting.
  name: gradual unfreezing
  source_chunk_index: 0
  type: method
- description: A type of neural network architecture used in FinBERT.
  name: Transformers
  source_chunk_index: 0
  type: method
- description: Long Short-Term Memory, a type of recurrent neural network used in
    baseline methods for sentiment analysis.
  name: LSTM
  source_chunk_index: 0
  type: method
- description: Global Vectors for Word Representation, a type of word embedding used
    in baseline methods.
  name: GLoVe embeddings
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating sentiment analysis models
    in the financial domain.
  name: Financial PhraseBank
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating sentiment analysis models in the financial
    domain.
  name: FiQA Task 1
  source_chunk_index: 0
  type: dataset
- description: A financial corpus used for further pre-training FinBERT.
  name: TRC-2
  source_chunk_index: 0
  type: dataset
- description: A deep contextualized word representation model that is used as a baseline
    for comparison with FinBERT. It uses a bidirectional language model with multiple
    LSTM layers.
  name: ELMo
  source_chunk_index: 0
  type: method
- description: A transfer learning model for downstream NLP tasks, used as a baseline
    for comparison with FinBERT. It makes use of language model pre-training and fine-tunes
    the whole language model together with task-specific layers.
  name: ULMFit
  source_chunk_index: 0
  type: method
- description: A type of LSTM model used in ULMFit, employing dropout tuning strategies
    for regularization.
  name: AWD-LSTM
  source_chunk_index: 0
  type: method
- description: A dataset used to pre-train BERT, containing a large collection of
    books.
  name: BookCorpus
  source_chunk_index: 0
  type: dataset
- description: A dataset used to pre-train BERT, comprising the content of the English
    Wikipedia.
  name: English Wikipedia
  source_chunk_index: 0
  type: dataset
