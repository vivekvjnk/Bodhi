  source_chunk_index: 0
  type: dataset
- description: A technique used in ULMFit and potentially FinBERT to fine-tune different
    layers of the model with different learning rates, allowing for more efficient
    and effective transfer learning.
  name: Discriminative fine-tuning
  source_chunk_index: 0
  type: method
- description: A learning rate schedule used in ULMFit and potentially FinBERT, where
    the learning rate increases linearly at the beginning of training and then decreases
    linearly, which can improve model convergence.
  name: Slanted triangular learning rates
  source_chunk_index: 0
  type: method
- description: A technique used in ULMFit and potentially FinBERT where layers of
    the pre-trained model are unfrozen gradually during fine-tuning, starting with
    the top layers and proceeding to the lower layers, to prevent catastrophic forgetting.
  name: Gradual unfreezing
  source_chunk_index: 0
  type: method
