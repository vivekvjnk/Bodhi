entities:
- description: The process of computationally identifying and categorizing opinions
    expressed in a piece of text, especially to determine a writer's attitude with
    respect to some topic or document.
  name: sentiment analysis
  source_chunk_index: 0
  type: task
- description: Bidirectional Encoder Representations from Transformers, a transformer-based
    machine learning model for natural language processing.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A BERT model fine-tuned on financial text data.
  name: FinBERT
  source_chunk_index: 0
  type: method
- description: A machine learning technique where a model trained on one task is re-purposed
    on a second related task.
  name: transfer learning
  source_chunk_index: 0
  type: method
- description: The process of taking a pre-trained model and further training it on
    a specific dataset.
  name: fine-tuning
  source_chunk_index: 0
  type: method
- description: Long Short-Term Memory classifiers, a type of recurrent neural network
    used for sequence data.
  name: LSTM classifiers
  source_chunk_index: 0
  type: method
- description: Universal Language Model Fine-tuning for Text Classification, a transfer
    learning method for NLP.
  name: ULMFit
  source_chunk_index: 0
  type: method
- description: Embeddings from Language Models, a deep contextualized word representation.
  name: ELMo
  source_chunk_index: 0
  type: method
- description: Fine-tuning different layers of a neural network with different learning
    rates.
  name: discriminative fine-tuning
  source_chunk_index: 0
  type: method
- description: A technique used in fine-tuning where layers of a pre-trained model
    are unfrozen gradually.
  name: gradual unfreezing
  source_chunk_index: 0
  type: method
- description: A dataset of financial news headlines labeled with sentiment.
  name: Financial PhraseBank
  source_chunk_index: 0
  type: dataset
- description: A dataset for financial question answering.
  name: FiQA Task 1
  source_chunk_index: 0
  type: dataset
- description: A financial corpus used for pre-training the AWD-LSTM language model
    in ULMFit.
  name: TRC 2 - financial corpus
  source_chunk_index: 0
  type: dataset
- description: A parameter used in the BERT implementation, set to p = 0.1, to prevent
    overfitting by randomly setting a fraction of input units to 0 during training.
  name: Dropout probability
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 0.2, that controls
    the initial learning rate increase during training.
  name: Warm-up proportion
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 64 tokens, that
    defines the maximum length of the input sequences.
  name: Maximum sequence length
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 2e-5, that controls
    the step size during the optimization process.
  name: Learning rate
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 64, that defines
    the number of samples processed in each iteration of the training loop.
  name: Mini-batch size
  source_chunk_index: 0
  type: method
- description: Word embeddings used in the LSTM classifier baseline, representing
    words as dense vectors.
  name: GLoVe embeddings
  source_chunk_index: 0
  type: method
- description: A method used for financial sentiment analysis, which includes a text
    simplification step and pre-training of word embeddings on a large financial corpus
    with sentiment labels.
  name: FinSSLX
  source_chunk_index: 0
  type: method
