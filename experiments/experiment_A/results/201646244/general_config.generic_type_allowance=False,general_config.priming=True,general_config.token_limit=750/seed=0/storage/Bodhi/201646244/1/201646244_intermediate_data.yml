entities:
- description: The process of computationally identifying and categorizing opinions
    expressed in a piece of text, especially to determine whether the writer's attitude
    towards a particular topic, product, etc., is positive, negative, or neutral.
  name: sentiment analysis
  source_chunk_index: 0
  type: task
