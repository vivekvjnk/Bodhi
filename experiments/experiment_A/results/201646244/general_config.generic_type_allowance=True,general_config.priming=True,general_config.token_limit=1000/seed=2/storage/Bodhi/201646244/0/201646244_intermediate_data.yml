    FinBERT, that starts with a low learning rate, increases it linearly, and then
    decreases it linearly, which can improve training efficiency.
  name: Slanted Triangular Learning Rates
  source_chunk_index: 0
  type: method
- description: A technique used in ULMFit, and potentially adapted for FinBERT, where
    layers of the pre-trained model are unfrozen and fine-tuned sequentially, starting
    with the final layers, to prevent catastrophic forgetting and improve performance.
  name: Gradual Unfreezing
  source_chunk_index: 0
