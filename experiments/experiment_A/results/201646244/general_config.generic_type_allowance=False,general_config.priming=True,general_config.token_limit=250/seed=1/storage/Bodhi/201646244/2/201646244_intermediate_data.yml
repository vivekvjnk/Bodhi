entities:
- description: The process of computationally identifying and categorizing opinions
    expressed in a piece of text, especially to determine a writer's attitude with
    respect to a particular topic, product, etc.
  name: sentiment analysis
  source_chunk_index: 0
  type: task
- description: A transformer-based machine learning technique for natural language
    processing (NLP).
  name: BERT (Bidirectional Encoder Representations from Transformers)
  source_chunk_index: 0
  type: method
- description: A BERT model pre-trained on financial text data.
  name: FinBERT
  source_chunk_index: 0
  type: method
- description: The reuse of a pre-trained model on a new task.
  name: transfer learning
  source_chunk_index: 0
  type: method
- description: A transfer learning method for NLP that uses a language model pre-trained
    on a large corpus and then fine-tuned on a smaller dataset for a specific task.
  name: ULMFit (Universal Language Model Fine-tuning)
  source_chunk_index: 0
  type: method
- description: A deep contextualized word representation that models both (1) complex
    characteristics of word use (e.g., syntax and semantics) and (2) how these uses
    vary across linguistic contexts.
  name: ELMo (Embeddings from Language Models)
  source_chunk_index: 0
  type: method
- description: Fine-tuning different layers of a neural network with different learning
    rates.
  name: discriminative fine-tuning
  source_chunk_index: 0
  type: method
- description: A learning rate schedule that starts with a small learning rate, increases
    it linearly to a maximum value, and then decreases it linearly.
  name: slanted triangular learning rates
  source_chunk_index: 0
  type: method
- description: Fine-tuning the layers of a neural network one by one, starting from
    the last layer and working backwards.
  name: gradual unfreezing
  source_chunk_index: 0
  type: method
- description: A dataset of financial news headlines labeled with sentiment.
  name: Financial PhraseBank
  source_chunk_index: 0
  type: dataset
- description: A dataset for financial question answering.
  name: FiQA Task 1
  source_chunk_index: 0
  type: dataset
- description: A type of recurrent neural network used for processing sequential data,
    such as text, and is used in the text to classify sentences from financial news
    according to their sentiment.
  name: LSTM network
  source_chunk_index: 0
  type: method
- description: A method for generating word embeddings, which are vector representations
    of words, used to capture semantic relationships between words.
  name: word2vec
  source_chunk_index: 0
  type: method
- description: An unsupervised learning algorithm for obtaining vector representations
    for words, similar to word2vec, used for capturing semantic relationships between
    words.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: A dataset used for text classification tasks, mentioned in the context
    of evaluating the performance of models using word embeddings.
  name: SST-5
  source_chunk_index: 0
  type: dataset
- description: A technique used in conjunction with an LSTM network to classify sentences
    from financial news based on their sentiment.
  name: Text simplification
  source_chunk_index: 0
  type: method
- description: A method for generating contextualized word embeddings, which are used
    to improve performance on various NLP tasks. The text mentions its use in conjunction
    with contextualized word embeddings.
  name: ELMo
  source_chunk_index: 0
  type: method
