    text.
  name: FinBERT
  source_chunk_index: 0
  type: method
- description: The dataset used for classification tasks, specifically for evaluating
    the performance of FinBERT and comparing it with baseline methods like LSTM and
    ULMFit. It suffers from label imbalance, with almost 60% of sentences being neutral.
  name: Financial PhraseBank
  source_chunk_index: 0
