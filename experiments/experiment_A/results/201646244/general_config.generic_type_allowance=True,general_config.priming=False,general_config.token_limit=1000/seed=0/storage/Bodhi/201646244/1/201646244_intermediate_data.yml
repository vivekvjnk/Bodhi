  source_chunk_index: 0
  type: dataset
- description: A technique used in the FinBERT implementation to adjust the learning
    rate during training, starting with a small rate, increasing it linearly, and
    then decreasing it. This helps to stabilize training and improve performance.
  name: Slanted Triangular Learning Rates
  source_chunk_index: 0
  type: method
- description: A technique used in FinBERT where different layers of the model are
    fine-tuned with different learning rates. This allows for more nuanced adjustments
    to the model's parameters, improving performance.
  name: Discriminative Fine-tuning
  source_chunk_index: 0
  type: method
- description: A technique used in FinBERT where layers of the pre-trained model are
    unfrozen sequentially during fine-tuning. This prevents catastrophic forgetting
    and allows the model to adapt to the new task more effectively.
  name: Gradual Unfreezing
  source_chunk_index: 0
  type: method
