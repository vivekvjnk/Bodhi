  name: Learning Rate
  source_chunk_index: 0
  type: generic
- description: The mini-batch size used in the FinBERT implementation, set to 64.
    This hyperparameter determines the number of samples processed in each iteration
    during training.
  name: Mini-batch Size
  source_chunk_index: 0
  type: generic
