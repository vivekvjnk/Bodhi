    to 0.1. This is a hyperparameter used to prevent overfitting.
  name: Dropout Probability
  source_chunk_index: 0
  type: generic
- description: The warm-up proportion used in the FinBERT implementation, set to 0.2.
    This hyperparameter controls the proportion of training steps for which the learning
    rate is increased linearly from 0 to its maximum value.
  name: Warm-up Proportion
  source_chunk_index: 0
  type: generic
- description: The maximum sequence length used in the FinBERT implementation, set
    to 64 tokens. This hyperparameter determines the maximum number of tokens considered
