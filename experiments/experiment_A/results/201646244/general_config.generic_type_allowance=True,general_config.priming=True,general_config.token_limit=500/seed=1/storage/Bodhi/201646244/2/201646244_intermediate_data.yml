    a text corpus.
  name: Language Model
  source_chunk_index: 0
  type: GENERIC
- description: A transfer learning model for NLP tasks, utilizing language model pre-training.
    It fine-tunes the entire language model, including task-specific layers, and uses
    AWD-LSTM as its underlying language model.
  name: ULMFit
  source_chunk_index: 0
  type: method
- description: A language model that is contrasted with ULMFit.
  name: ELMo
  source_chunk_index: 0
  type: method
