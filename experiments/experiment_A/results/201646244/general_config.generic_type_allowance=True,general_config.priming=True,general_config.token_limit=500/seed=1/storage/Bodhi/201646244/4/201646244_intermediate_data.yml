entities:
- description: A dataset used for sentiment classification tasks in the financial
    domain.
  name: Financial PhraseBank
  source_chunk_index: 0
  type: DATASET
- description: The task of classifying text based on its sentiment (positive, negative,
    neutral), a core focus of the research.
  name: Sentiment Classification
  source_chunk_index: 0
  type: TASK
- description: BERT-based language model tailored for financial NLP tasks, evaluated
    on sentiment classification.
  name: FinBERT
  source_chunk_index: 0
  type: method
- description: Bidirectional Encoder Representations from Transformers, a pre-trained
    language model.
  name: BERT
  source_chunk_index: 0
  type: method
- description: Long Short-Term Memory, a type of recurrent neural network used for
    sequence modeling, used as a baseline model.
  name: LSTM
  source_chunk_index: 0
  type: method
- description: Universal Language Model Fine-tuning, a transfer learning technique
    used for NLP, used as a baseline model.
  name: ULMFit
  source_chunk_index: 0
  type: method
- description: Embeddings from Language Models, a deep contextualized word representation
    model, used for comparison.
  name: ELMo
  source_chunk_index: 0
  type: method
- description: A metric used to evaluate the performance of the models.
  name: Accuracy
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the performance of the models.
  name: F1-score
  source_chunk_index: 0
  type: generic
- description: FinBERT model further pre-trained on the classification training set.
  name: FinBERT - task
  source_chunk_index: 0
  type: method
- description: FinBERT model further pre-trained on a financial domain corpus (TRC
    2-financial).
  name: FinBERT - domain
  source_chunk_index: 0
  type: method
- description: BERT model without further pre-training.
  name: Vanilla BERT
  source_chunk_index: 0
  type: method
- description: A method used for sentiment classification, serving as a baseline for
    comparison with FinBERT.
  name: LPS
  source_chunk_index: 0
  type: method
- description: Another method used for sentiment classification, also used as a baseline
    for comparison with FinBERT.
  name: HSC
  source_chunk_index: 0
  type: method
- description: A method that includes text simplification and pre-training of word
    embeddings on a large financial corpus with sentiment labels, used for comparison.
  name: FinSSLX
  source_chunk_index: 0
  type: method
- description: A domain corpus used for further pre-training FinBERT, specifically
    on financial text.
  name: TRC 2-financial
  source_chunk_index: 0
  type: dataset
- description: A parameter used in the BERT implementation, set to p = 0.1, to prevent
    overfitting by randomly setting a fraction of input units to 0 during training.
  name: Dropout Probability
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 0.2, which defines
    the proportion of training steps for which the learning rate increases linearly
    from 0 to its maximum value.
  name: Warm-up Proportion
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 64 tokens, which
    specifies the maximum length of the input sequences.
  name: Maximum Sequence Length
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 2e-5, which controls
    the step size during the optimization process.
  name: Learning Rate
  source_chunk_index: 0
  type: method
- description: A parameter used in the BERT implementation, set to 64, which defines
    the number of samples processed before the model's internal parameters are updated.
  name: Mini-batch Size
  source_chunk_index: 0
  type: method
- description: A dataset used for the classification task, where the performance of
    FinBERT, baseline methods, and state-of-the-art models are compared.
  name: Financial PhraseBank dataset
  source_chunk_index: 0
  type: dataset
- description: Long Short-Term Memory, a type of recurrent neural network used as
