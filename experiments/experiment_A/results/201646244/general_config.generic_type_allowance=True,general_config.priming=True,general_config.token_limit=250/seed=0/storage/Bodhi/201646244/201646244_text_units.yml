    text_unit: 'ULMFit .ULMFit is a transfer learning model for down - stream NLP
      tasks , that make use of language model pre - training [ 5 ] .Unlike ELMo ,
      with ULMFit , the whole language model is fine - tuned together with the task
      - specific layers .The underlying language model used in ULMFit is AWD - LSTM
      , which uses sophisticated dropout tuning strategies to better regularize its
      LSTM model [ 2 1 ] .Forclassification using ULMFit two linear layers are added
      to the pre - trained AWD - LSTM , first of which takes the pooled last hidden
      states as input .We implement these strategies with FinBERT as explained in
      section 3. 2 . 1 The pre - trained weights for GLoVE can be found here : https://nlp.stanford.edu/projects/glove/
      2 The pre - trained ELMo models can be found here : https://allennlp.org/elmo
      3. 1 . 4 Transformer .The Transformer is an attention - based architecture for
      modeling sequential information , that is an alternative to recurrent neural
      networks [ 2 9 ] .As it was argued by Vaswani 2 0 1 7 [ 2 9 ] , Transformer
      architecture has several advantages over the RNN - based approaches .Because
      of RNNs '' sequential nature , they are much harder to parallelize on GPUs and
      too many steps between far away elements in a sequence make it hard for information
      to persist .'
