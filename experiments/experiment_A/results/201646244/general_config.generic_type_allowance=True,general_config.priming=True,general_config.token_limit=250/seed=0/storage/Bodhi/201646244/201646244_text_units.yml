    text_unit: "We introduce FinBERT , a language model based on BERT , to tackle\
      \ NLP tasks in the financial domain .Hence , automated sentiment or polarity\
      \ analysis of texts produced by financial actors using natural language processing\
      \ ( NLP ) methods has gained popularity during the last decade [ 4 ] .It requires\
      \ to address two challenges : 1 ) The most sophisticated classification methods\
      \ that make use of neural nets require vast amounts of labeled data and labeling\
      \ financial text snippets requires costly expertise . 2 ) The sentiment analysis\
      \ models trained on general corpora are not suited to the task , because financial\
      \ texts have a specialized language with unique vocabulary and have a tendency\
      \ to use vague expressions instead of easilyidentified negative/positive words\
      \ .NLP transfer learning methods look like a promising solution to both of the\
      \ challenges mentioned above , and are the focus of this thesis .For that ,\
      \ sentiment of a sentence from a financial news article towards the financial\
      \ actor depicted in the sentence will be tried to be predicted , using the Financial\
      \ PhraseBank created by Malo et al. ( 2 0 1 4 ) [ 1 7 ] and FiQA Task 1 sentiment\
      \ scoring dataset [ 1 5 ] .The main contributions of this thesis are the following\
      \ : \u2022 We introduce FinBERT , which is a language model based on BERT for\
      \ financial NLP tasks .We evaluate FinBERT on two financial sentiment analysis\
      \ datasets . \u2022"
