    text_unit: '.For all classification tasks , including the next sentence prediction
      , [ CLS ] token is used .BERT has two versions : BERT - base , with 1 2 encoder
      layers , hidden size of 7 6 8 , 1 2 multi - head attention heads and 1 1 0 M
      parameters in total and BERT - large , with 2 4 encoder layers , hidden size
      of 1 0 2 4 , 1 6 multi - head attention heads and 3 4 0 M parameters .Both of
      these models have been trained on BookCorpus [ 3 3 ] and English Wikipedia ,
      which have in total more than 3, 5 0 0 M words 3 .In this subsection we will
      describe our implementation of BERT : 1 ) how further pre - training on domain
      corpus is done , 2 - 3 ) how we implemented BERT for classification and regression
      tasks , 4 ) training strategies we used during fine - tuning to prevent catastrophic
      forgetting .FinBERT for text classification .This is the recommended practice
      for using BERT for any classification task [ 3 ] .In order to deal with this
      phenomenon , we apply three techniques as it was proposed by Howard and Ruder
      ( 2 0 1 8) : slanted triangular learning rates , discriminative fine - tuning
      and gradual unfreezing .We aim to answer the following research questions :
      ( RQ 1 )'
