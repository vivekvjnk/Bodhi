    summary: null
    text_unit: "We achieve the state - of - the - art on FiQA sentiment scoring and\
      \ Financial PhraseBank .\u2022 We implement two other pre - trained language\
      \ models , ULMFit and ELMo for financial sentiment analysis and compare these\
      \ with FinBERT . \u2022 We conduct experiments to investigate several aspects\
      \ of the model , including : effects of further pre - training on financial\
      \ corpus , training strategies to prevent catastrophic forgetting and fine -\
      \ tuning only a small subset of model layers for decreasing training time without\
      \ a significant drop in performance .This section describes previous research\
      \ conducted on sentiment analysis in finance ( 2. 1 ) and text classification\
      \ using pre - trained language models ( 2. 2 ) .Financial sentiment analysis\
      \ differs from general sentiment analysis not only in domain , but also the\
      \ purpose .Sohangir et al. ( 2 0 1 8) [ 2 6 ] apply several generic neural network\
      \ architectures to a StockTwits dataset , finding CNN as the best performing\
      \ neural network architecture .Lutz et al. 2 0 1 8 [ 1 3 ] take the approach\
      \ of using doc 2 vec to generate sentence embeddings in a particular company\
      \ ad - hoc announcement and utilize multi - instance learning to predict stock\
      \ market outcomes ."
