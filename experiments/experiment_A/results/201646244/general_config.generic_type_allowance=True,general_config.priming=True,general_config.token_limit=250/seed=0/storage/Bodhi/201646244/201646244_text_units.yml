    text_unit: '.FinBERT outperforms ULMFit , and consequently all of the other methods
      in all metrics .In order to measure the performance of the models on different
      sizes of labeled training datasets , we ran LSTM classifiers , ULMFit and FinBERT
      on 5 different configurations .However , once the training size becomes 2 5
      0 , ULMFit and FinBERT starts to successfully differentiate between labels ,
      with an accuracy as high as 8 0 % for FinBERT .Allof the methods consistently
      get better with more data , but ULMFit and FinBERT does better with 2 5 0 examples
      than LSTM classifiers do with the whole dataset .We compare three models : 1
      ) No further pre - training ( denoted by Vanilla BERT ) , 2 ) Further pre -
      training on classification training set ( denoted by FinBERT - task ) , 3 )
      Further pre - training on domain corpus , TRC 2 - financial ( denoted by FinBERT
      - domain )'
