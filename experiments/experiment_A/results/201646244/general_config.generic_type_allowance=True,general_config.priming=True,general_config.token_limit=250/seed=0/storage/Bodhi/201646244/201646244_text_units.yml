    text_unit: '[ 1 4 ] use a combination of text simplification and LSTM network
      to classify a set of sentences from financial news according to their sentiment
      and achieve stateof - the - art results for the Financial PhraseBank , which
      is used in thesis as well .One of the most important recent developments in
      natural language processing is the realization that a model trained for language
      modeling can be successfully fine - tuned for most down - stream NLP tasks with
      small modifications .Usingthe pre - trained weights of ELMo , contextualized
      word embeddings can be calculated for any piece of text .Initializing embeddings
      for down - stream tasks with those were shown to improve performance on most
      tasks compared to static word embeddings such as word 2 vec or GloVe .For text
      classification tasks like SST - 5 , it achieved state - of - the - art performance
      when used together with a bi - attentive classification network [ 2 0 ] .ULMFit
      ( Universal Language Model Fine - tuning ) [ 5 ] was the first paper to achieve
      true transfer learning for NLP , as using novel techniques such as discriminative
      fine - tuning , slanted triangular learning rates and gradual unfreezing .ULMFit
      ''s main idea of efficiently fine - tuning a pre - trained a language model
      for down - stream tasks was brought to another level with Bidirectional Encoder
      Representations from Transformers ( BERT )'
