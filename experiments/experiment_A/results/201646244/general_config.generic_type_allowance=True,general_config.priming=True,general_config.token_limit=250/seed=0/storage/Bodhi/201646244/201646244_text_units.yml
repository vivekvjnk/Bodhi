    text_unit: '[ 3 ] , which is also the main focus of this paper .Thesetwo factors
      enabled in to achieve state - of - the - art results in multiple NLP tasks such
      as , natural language inference or question answering .The specifics of fine
      - tuning BERT for text classification has not been researched thoroughly .They
      conduct a series of experiments regarding different configurations of BERT for
      text classification .In this section , we will present our BERT implementation
      for financial domain named as FinBERT , after giving a brief background on relevant
      neural architectures . 3. 1 . 1 LSTM .Long short - term memory ( LSTM ) is a
      type of recurrent neural network that allows long - term dependencies in a sequence
      to persist in the network by using " forget " and " update " gates .Since a
      text is a sequence of tokens , the first choice for any LSTM natural language
      processing model is determining how to initially represent a single token .One
      such pre - training algorithm is GLoVe ( Global Vectors for Word Representation
      ) [ 2 2 ] .In the center of ELMo , there is a bidirectional language model with
      multiple LSTM layers .Once the contextualized representations are extracted
      , these can be used to initialize any down - stream NLP task 2 . 3. 1 . 3'
