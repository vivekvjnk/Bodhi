- description: A BERT-based language model tailored for financial NLP tasks, specifically
    sentiment analysis, developed by further pre-training BERT on a financial corpus
    and fine-tuning it for sentiment analysis.
  name: FinBERT
  source_chunk_index: 0
  type: method
