    question answering.
  name: FiQA Task 1
  source_chunk_index: 0
  type: dataset
- description: A type of recurrent neural network (RNN) that allows long-term dependencies
    in a sequence to persist by using "forget" and "update" gates. Used for processing
    sequential data like text.
  name: LSTM
  source_chunk_index: 0
  type: method
- description: An unsupervised learning algorithm for obtaining vector representations
    for words.
  name: GLoVe
  source_chunk_index: 0
  type: method
- description: A technique used in ULMFit where different layers of a pre-trained
    language model are fine-tuned with different learning rates.
  name: Discriminative fine-tuning
  source_chunk_index: 0
  type: method
- description: A learning rate schedule used in ULMFit that starts with a high learning
    rate and linearly decreases it during training.
  name: Slanted triangular learning rates
  source_chunk_index: 0
  type: method
- description: A technique used in ULMFit where layers of a pre-trained language model
    are unfrozen sequentially during fine-tuning.
  name: Gradual unfreezing
  source_chunk_index: 0
  type: method
- description: A method for generating contextualized word embeddings. It uses a bidirectional
    language model with multiple LSTM layers to create these embeddings, which can
    then be used to initialize downstream NLP tasks.
  name: ELMo
  source_chunk_index: 0
  type: method
- description: A neural network architecture used for text classification tasks. The
    text mentions it achieved state-of-the-art performance when used with ELMo.
  name: Bi-attentive classification network
  source_chunk_index: 0
  type: method
- description: A technique used in conjunction with LSTM networks to classify sentences
    from financial news based on their sentiment.
  name: Text simplification
