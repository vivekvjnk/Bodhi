entities:
- description: The task of determining the emotional tone or attitude expressed in
    a piece of text, central to the FinBERT model's application in financial NLP.
  name: sentiment analysis
  source_chunk_index: 0
  type: task
- description: A BERT-based language model specifically designed for financial NLP
    tasks, particularly sentiment analysis, leveraging transfer learning.
  name: FinBERT
  source_chunk_index: 0
  type: method
- description: A transformer-based machine learning model used as the foundation for
    FinBERT, enabling contextual understanding of words in text.
  name: BERT (Bidirectional Encoder Representations from Transformers)
  source_chunk_index: 0
  type: method
- description: A machine learning technique used to apply knowledge gained from one
    task to another, employed in FinBERT to adapt pre-trained models for financial
    text analysis.
  name: transfer learning
  source_chunk_index: 0
  type: method
- description: A transfer learning method used for fine-tuning language models, compared
    with FinBERT in the study.
  name: ULMFit (Universal Language Model Fine-tuning)
  source_chunk_index: 0
  type: method
- description: A deep contextualized word representation model, used for comparison
    with FinBERT in the context of financial text analysis.
  name: ELMo (Embeddings from Language Models)
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating FinBERT, containing financial
    text with sentiment labels.
  name: Financial PhraseBank
  source_chunk_index: 0
  type: dataset
- description: A dataset used for training and evaluating FinBERT, related to financial
    question answering.
  name: FiQA Task 1
  source_chunk_index: 0
  type: dataset
- description: A type of recurrent neural network (RNN) architecture used for processing
    sequential data, such as text, and is used as a baseline model in the study.
  name: LSTM
  source_chunk_index: 0
  type: method
- description: Global Vectors for Word Representation, an unsupervised learning algorithm
    for obtaining vector representations for words, used as embeddings in the LSTM
    classifier.
  name: GLoVe
  source_chunk_index: 0
  type: method
- description: A type of LSTM language model used in ULMFit, pre-trained on a large
    corpus and then fine-tuned for specific tasks.
  name: AWD-LSTM
  source_chunk_index: 0
  type: method
- description: A technique used during the fine-tuning process to optimize training
    and prevent catastrophic forgetting in FinBERT.
  name: Slanted Triangular Learning Rates
  source_chunk_index: 0
  type: method
- description: A technique used during the fine-tuning process to optimize training
    and prevent catastrophic forgetting in FinBERT.
  name: Discriminative Fine-tuning
  source_chunk_index: 0
  type: method
- description: A technique used during the fine-tuning process to optimize training
    and prevent catastrophic forgetting in FinBERT.
  name: Gradual Unfreezing
  source_chunk_index: 0
  type: method
- description: A version of the BERT model with 12 encoder layers, a hidden size of
    768, 12 multi-head attention heads, and 110M parameters.
  name: BERT-base
  source_chunk_index: 0
  type: method
- description: A version of the BERT model with 24 encoder layers, a hidden size of
    1024, 16 multi-head attention heads, and 340M parameters.
  name: BERT-large
  source_chunk_index: 0
  type: method
- description: A dataset used to train BERT, containing a large collection of books.
