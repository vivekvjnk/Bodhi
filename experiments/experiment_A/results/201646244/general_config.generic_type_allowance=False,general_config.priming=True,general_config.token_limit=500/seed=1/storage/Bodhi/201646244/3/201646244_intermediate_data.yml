entities:
- description: The task of determining the emotional tone or attitude expressed in
    a piece of text, central to the FinBERT model's application in financial NLP.
  name: sentiment analysis
  source_chunk_index: 0
  type: task
- description: A BERT-based language model specifically designed for financial NLP
    tasks, particularly sentiment analysis, addressing challenges in financial text
    analysis.
  name: FinBERT
  source_chunk_index: 0
  type: method
- description: A transformer-based machine learning model used as the foundation for
    FinBERT, enabling the model to understand the context of words in a text.
  name: BERT (Bidirectional Encoder Representations from Transformers)
  source_chunk_index: 0
  type: method
- description: A machine learning technique used to leverage knowledge gained from
    one task to improve performance on a related task, applied in the development
    of FinBERT.
  name: transfer learning
  source_chunk_index: 0
  type: method
- description: A transfer learning method used for fine-tuning language models, compared
    with FinBERT in the study.
  name: ULMFit (Universal Language Model Fine-tuning)
  source_chunk_index: 0
  type: method
- description: A deep contextualized word representation model, used for comparison
    with FinBERT.
  name: ELMo (Embeddings from Language Models)
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating FinBERT, containing financial
    text with sentiment labels.
  name: Financial PhraseBank
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating FinBERT, likely containing financial
    questions and answers or related text.
  name: FiQA Task 1
  source_chunk_index: 0
  type: dataset
- description: A technique used to optimize the training of FinBERT, allowing different
    layers of the model to learn at different rates.
  name: discriminative fine-tuning
  source_chunk_index: 0
  type: method
- description: A learning rate schedule used to optimize the training of FinBERT,
    helping to improve performance.
  name: slanted triangular learning rates
  source_chunk_index: 0
  type: method
- description: A technique used to optimize the training of FinBERT, preventing catastrophic
    forgetting by unfreezing layers of the model gradually.
  name: gradual unfreezing
  source_chunk_index: 0
  type: method
- description: A version of BERT with 12 encoder layers, a hidden size of 768, 12
    multi-head attention heads, and 110M parameters.
  name: BERT-base
  source_chunk_index: 0
  type: method
- description: A version of BERT with 24 encoder layers, a hidden size of 1024, 16
    multi-head attention heads, and 340M parameters.
  name: BERT-large
  source_chunk_index: 0
  type: method
- description: A dataset used to train BERT, containing a large collection of books.
  name: BookCorpus
  source_chunk_index: 0
  type: dataset
- description: A dataset used to train BERT, comprising the content of the English
    Wikipedia.
  name: English Wikipedia
  source_chunk_index: 0
  type: dataset
- description: A baseline method for sentiment classification, using Long Short-Term
    Memory (LSTM) with Global Vectors for Word Representation (GloVe) embeddings.
  name: LSTM classifier with GLoVe embeddings
  source_chunk_index: 0
  type: method
- description: A baseline method for sentiment classification, using Long Short-Term
    Memory (LSTM) with Embeddings from Language Models (ELMo) embeddings.
  name: LSTM classifier with ELMo embeddings
  source_chunk_index: 0
  type: method
- description: A baseline method for sentiment classification, using Universal Language
    Model Fine-tuning (ULMFit).
  name: ULMFit classifier
  source_chunk_index: 0
  type: method
- description: A financial corpus used for pre-training the AWD-LSTM language model
    in the ULMFit classifier.
  name: TRC 2-financial corpus
  source_chunk_index: 0
  type: dataset
- description: A type of Long Short-Term Memory (LSTM) language model used in the
    ULMFit classifier. It is pre-trained on a general corpus and then fine-tuned on
    a specific domain corpus.
  name: AWD-LSTM
  source_chunk_index: 0
  type: method
