    and compared with FinBERT.
  name: ULMFit
  source_chunk_index: 0
  type: method
- description: A pre-trained language model used for generating contextualized word
    embeddings, applied in financial sentiment analysis.
  name: ELMo
  source_chunk_index: 0
  type: method
- description: The task of categorizing text into predefined classes, relevant to
    sentiment analysis in the financial domain.
  name: Text Classification
  source_chunk_index: 0
  type: task
- description: The process of applying knowledge gained from one task to another,
    particularly in NLP, to improve performance with limited data.
  name: Transfer Learning
  source_chunk_index: 0
  type: method
- description: A neural network architecture used for text classification, found to
    perform well on a StockTwits dataset.
  name: CNN (Convolutional Neural Network)
  source_chunk_index: 0
  type: method
