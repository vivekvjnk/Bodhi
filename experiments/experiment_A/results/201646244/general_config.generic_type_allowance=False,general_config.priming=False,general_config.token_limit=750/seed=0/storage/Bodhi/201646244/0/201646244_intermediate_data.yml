- description: A method used to generate sentence embeddings.
  name: Doc2vec
  source_chunk_index: 0
  type: method
- description: A dataset used for text classification tasks, mentioned in the context
    of evaluating the performance of pre-trained language models.
  name: SST-5
  source_chunk_index: 0
  type: dataset
- description: A neural network architecture used for text classification, particularly
    known for its performance on tasks like SST-5 when combined with ELMo embeddings.
  name: Bi-attentive classification network
  source_chunk_index: 0
  type: method
- description: A method for generating word embeddings, representing words as vectors
    in a high-dimensional space based on their context in a corpus.
  name: Word2vec
  source_chunk_index: 0
  type: method
- description: A method for generating word embeddings, similar to Word2Vec, but based
    on global word co-occurrence statistics.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: A technique used in transfer learning, specifically in ULMFit, where
    different layers of a pre-trained language model are fine-tuned at different learning
    rates. This allows for more efficient adaptation to the downstream task.
  name: Discriminative Fine-tuning
  source_chunk_index: 0
  type: method
- description: A learning rate schedule used in ULMFit that starts with a small learning
    rate, increases it linearly to a maximum value, and then decreases it linearly.
    This helps the model to quickly learn and then converge to a good solution.
  name: Slanted Triangular Learning Rates
  source_chunk_index: 0
  type: method
- description: The tendency of a neural network to rapidly forget previously learned
    information when learning new information. This is a challenge in transfer learning
    and fine-tuning, and strategies are needed to prevent it.
  name: Catastrophic Forgetting
  source_chunk_index: 0
  type: task
