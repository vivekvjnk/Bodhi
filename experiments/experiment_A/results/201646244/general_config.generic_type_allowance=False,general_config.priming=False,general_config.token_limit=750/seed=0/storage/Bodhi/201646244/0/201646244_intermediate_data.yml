  type: method
- description: A pre-trained language model that serves as the foundation for FinBERT.
  name: BERT
  source_chunk_index: 0
  type: method
- description: The field of study focused on enabling computers to understand and
    process human language, applied here to financial text analysis.
  name: NLP (Natural Language Processing)
  source_chunk_index: 0
  type: task
- description: The process of computationally identifying and categorizing opinions
    expressed in a piece of text, particularly in the context of financial texts.
  name: Sentiment Analysis
  source_chunk_index: 0
  type: task
