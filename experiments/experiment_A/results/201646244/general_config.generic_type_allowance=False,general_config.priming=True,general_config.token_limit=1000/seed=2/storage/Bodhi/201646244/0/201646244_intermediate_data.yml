  name: GLoVe
  source_chunk_index: 0
  type: method
- description: A technique used in ULMFit and potentially FinBERT to fine-tune different
    layers of the model with varying learning rates, allowing for more efficient training
    and preventing catastrophic forgetting.
  name: Discriminative fine-tuning
  source_chunk_index: 0
  type: method
- description: A learning rate schedule used in ULMFit and potentially FinBERT, where
    the learning rate increases linearly at the beginning of training and then decreases
    linearly, which can improve model convergence.
  name: Slanted triangular learning rates
  source_chunk_index: 0
  type: method
- description: A technique used in ULMFit and potentially FinBERT where layers of
    the pre-trained model are unfrozen sequentially during fine-tuning, starting with
    the final layers and gradually including earlier layers, to prevent catastrophic
    forgetting and improve performance.
  name: Gradual unfreezing
  source_chunk_index: 0
  type: method
- description: A neural network architecture, the foundation of BERT, that uses self-attention
    mechanisms to weigh the importance of different parts of the input data when processing
    sequences.
  name: Transformer
  source_chunk_index: 0
  type: method
- description: A language model that considers both the preceding and following context
    of a word or token in a sequence to generate contextualized word representations,
    as used in ELMo.
  name: Bidirectional Language Model
