    text_unit: "- task learning [ 9 , 6 0 , 2 0 , 3 2 ] has been used successfully\
      \ in applications of natural language processing [ 1 3 , 4 2 ] , speech recognition\
      \ [ 1 5 ] , computer vision [ 2 2 , 6 1 , 5 2 ] .Especiallyin many computer\
      \ vision tasks , the effectiveness of multi - task learning has been proved\
      \ .Fast R - CNN [ 2 2 ] and Faster R - CNN [ 4 0 ] jointly predict the class\
      \ and the coordinates of objects in an image .Mask R - CNN [ 2 4 ] can efficiently\
      \ detect objects in an image while simultaneously generating a high - quality\
      \ segmentation mask for each instance .Large scale variation is one of major\
      \ factors to influence the performance of many computer vision tasks like face\
      \ detection , object detection and pose estimation .To address the problem that\
      \ large strides of deep CNNs make small object detection very difficult , object\
      \ detector [ 1 0 , 1 4 ] use dilated/atrous convolutions to increase the resolution\
      \ of the feature map .SDP [ 5 4 ] , SSH [ 3 5 ] and MS - CNN [ 7 ] make predictions\
      \ of small objects on the lower layer and big objects on the higher layers respectively\
      \ .Furthermore , methods like FPN [ 3 3 ] and Mask - RCNN [ 2 4 ] propose a\
      \ pyramidal representation and fuse adjacent scale feature maps to combine features\
      \ which have semantic and detail informations .Besides , some methods , like\
      \ SNIP [ 4 4 ] and SNIPER [ 4 5 ] , propose advanced and efficient data argumentation\
      \ methods to illustrate the scale variation problem .Given an original image\
      \ as input , the multi - task network ( MTN ) can predict the bounding boxes\
      \ , keypoint coordinates and Re - ID features in the scene .A scale - normalized\
      \ image pyramid and feature pyramid ( SIFP ) paradigm is exploited to alleviate\
      \ the scale variation problem of MTN .The MTN adopts the similar unified procedure\
      \ as Mask R - CNN .A fully convolutional network , called a Region Proposal\
      \ Network ( RPN ) , is built upon these feature maps to propose candidate human\
      \ bounding boxes .Based on the candidate boxes and their corresponding features\
      \ extracted from the sharing feature maps , Mask R - CNN has two branches ,\
      \ one branch performs classification and bounding - box regression .Network\
      \ Architecture : Similar with Mask R - CNN , our proposed network can be instantiated\
      \ with multiple architectures : ( i ) the backbone network used for feature\
      \ extraction over an entire image , and ( ii ) the head networks for human detection\
      \ ( bounding - box classification and regression ) , pose estimation and person\
      \ Re - ID that are applied separately to each RoI. For the backbone network\
      \ , deeper architecture gains the effectiveness of extracted features , but\
      \ brings longer training and inference time .To provide a trade - off between\
      \ accuracy and speed when MTN is adopted in practical applications , we evaluate\
      \ MobileNet - v 2 [ 4 3 ] and ResNet [ 2 5 ] with FPN [ 3 3 ] of depth 1 8 ,\
      \ 5 0 and 1 0 1 layers .For the pose estimation head network , Mask R - CNN\
      \ adopts a straightforward structure , which limits the precision of keypoints\
      \ localization .In Mask R - CNN , 1 4 \xD7 1 4 feature maps of 5 1 2 channels\
      \ are extracted by RoIAlign for each proposal .In MTN , we utilize a padding\
      \ operation to maintaining the ratio of the person in the 2 2 \xD7 1 6 feature\
      \ maps extracted by RoIAlign .As this head network is based upon the backbone\
      \ and RPN , so it need the training data composed by images within multi - person\
      \ and corresponding ID annotation , like some person search datasets [ 5 1 ,\
      \ 6 2 ] .The MTN can provide necessary informations to the occlusion - aware\
      \ strategy introduced in Sec. 3. 3 to perform pose tracking .As described above\
      \ , MTN performs human detection , pose estimation and person Re - ID simultaneously\
      \ .However , MTN , a unified network , builds all the head networks upon the\
      \ RoIs generated by RPN .So inspired by [ 4 4 ] , we develop a scalenormalized\
      \ paradigm exploiting both image pyramid and feature pyramid ( SIFP ) to achieve\
      \ enhanced scale invariance capability of MTN .To maxmize the inference speed\
      \ without reducing performance , SIFP exploits FPN to tackle this dilemma .Due"
