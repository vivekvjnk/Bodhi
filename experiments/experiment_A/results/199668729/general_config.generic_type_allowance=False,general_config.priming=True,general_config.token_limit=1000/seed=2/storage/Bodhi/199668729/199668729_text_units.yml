    text_unit: 'An end - to - end multi - task network ( MTN ) is designed to perform
      human detection , pose estimation , and person re - identification ( Re - ID
      ) tasks simultaneously .To alleviate the performance bottleneck caused by scale
      variation problem , a paradigm which exploits scale - normalized image and feature
      pyramids ( SIFP ) is proposed to boost both performance and speed .Given the
      results of MTN , we adopt an occlusion - aware Re - ID feature strategy in the
      pose tracking module , where pose information is utilized to infer the occlusion
      state to make better use of Re - ID feature .In experiments , we demonstrate
      that the pose estimation and tracking performance improves steadily utilizing
      SIFP through different backbones .Using ResNet - 1 8 and ResNet - 5 0 as backbones
      , the overall pose tracking framework achieves competitive performance with
      2 9 . 4 FPS and 1 2 . 2 FPS , respectively .Methods involved are PoseTrack [
      2 8 ] , JointFlow [ 1 6 ] , PoseFlow [ 5 3 ] , Detect - and - Track [ 2 1 ]
      , FlowTrack [ 5 0 ] , and our FastPose framework with various backbones .Previous
      pose estimation systems address single prelocated person , which exploit pictorial
      structures model [ 4 , 1 8 ] and following deep convolutional neural networks
      ( DC - NNs ) approaches [ 4 7 , 4 6 , 4 8 , 3 6 , 5 6 ] .Motivated by practical
      applications in video surveillance , human - computer interaction and action
      recognition , researchers now focus on the multi - person pose estimation in
      unconstrained environment .Generally , two - stages methods achieve the state
      - of - theart results both on pose estimation and pose tracking tasks , beyond
      the performance of unified approach .Based on the detection result of the first
      stage , the second stage only focuses on the task of keypoint detection on a
      fixed scale .Despite the leading performance , these methods ca n''t perform
      real - time inference as their complex procedures , including human detection
      , cropping and scaling images , and pose estimation .Although many methods [
      3 3 , 2 3 ] have been proposed to alleviate scale variation problem in face
      detection or object detection area , there are few researches focusing on dealing
      with the scale variation in unified multi - person pose estimation .Different
      from multiple object tracking that focuses on instance identification assignment
      , pose tracking aims to address a more complex problem of articulated multi
      - person pose tracking in videos .Based on the top - down pose estimation methods
      , [ 5 0 ] exploits flow - based pose similarity as metric and solves the matching
      problem in a greedy fashion . [ 2 1 ] proposes a 3D extension of Mask R - CNN
      , which predicts the location of person tubes and corresponding poses simultaneously
      .Based on the above analyses , this paper develops FastPose , a pose tracking
      framework which can perform pose estimation and tracking towards real - time
      speed .Specifically , we first build a multi - task network ( MTN ) which jointly
      optimizes three tasks simultaneously , including human detection , pose estimation
      , and person Re - ID .The main contributions of this paper can be described
      as follows : ( 1 ) Taking the person Re - ID features into account , we design
      an end - to - end multi - task network which performs human detection , pose
      estimation , and person Re - ID simultaneously .The network ''s outputs provide
      the necessary informations for the following pose tracking strategy . ( 2 )
      We propose a paradigm named scale - normalized image and feature pyramid ( SIFP
      ) for alleviating scale variation problem which is the performance bottleneck
      of unified top - down pose estimation methods .Combining feature pyramid networks
      ( FPN ) with the scale distribution can help the network to avoid multi - scale
      testing . ( 3 ) Utilizing the outputs of our multi - task network , an occlusion
      - aware strategy is exploited to perform articulated multi - person pose tracking
      in videos .Specifically , the pose information is utilized to infer occlusion
      state and achieve the occlusion - aware Re - ID strategy which dramatically
      reduce the identification ( ID ) switches during tracking . Pose estimation
      has underwent a long way as a basic research topic of computer vision .CPN [
      1 2 ] is the leading method on COCO 2 0 1 7 keypoint challenge .It involves
      skip layer feature concatenation and an online hard keypoint mining step . [
      5 0 ] adopts FPN - DCN as the human detector and adds a few deconvolutional
      layers on single - person pose estimation network to improve the performance
      .Based on the multi - person pose estimation approaches described above , it
      is natural to extend them to multiperson pose tracking in video .In [ 2 8 ,
      2 6 ] , authors firstly estimate human pose with a bottom - up method , and
      then transform the problem into solving an energy minimizing function over a
      spatiotemporal graph constructed on the detected joints . [ 1 6 ] proposes a
      model to predict Temporal Flow Fields ( TTF ) to formulate a similarity measure
      of detected joints .Based on the top - down pose estimation methods , [ 2 1
      ] proposes an extended Mask R - CNN and solves the bipartite graph matching
      problem based on IoU. [ 5 0 ] exploits flow - based pose similarity as metric
      and solves the matching problem in a greedy fashion .Based on the obtained pose
      of single person , [ 5 3 ] proposes to construct pose flow and perform pose
      flow non maximum suppression ( NMS ) to eliminate issues like ID switches .Multi'
