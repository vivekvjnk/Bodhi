    text_unit: 'to FPN , MTN enhances scale invariance capability to alleviate the
      domain - shift brought by single scale testing .In conclusion , SIFP is a modified
      version of SNIP .Combining with FPN helps SNIP to avoid slower inference speed
      brought by multi - scale testing .Based on the detection box , keypoints and
      Re - ID feature provided by MTN , pose tracking is performed by an occlusion
      - aware strategy .As described in Sec. 3. 1 , using a deeper backbone network
      ( ResNet - 5 0 or ResNet - 1 0 1 ) , the numbers of convolutional layers in
      pose estimation head and Re - ID head are 8 and 4 respectively .When using a
      smaller backbone ( ResNet - 1 8 or MobileNet - v 2 ) , they are changed to 4
      and 2 .MPII [ 3 ] and PoseTrack [ 2 ] datasets are utilized for training pose
      estimation task .Person search datasets including SSM [ 5 1 ] and PRW [ 6 2
      ] datasets are for training person Re - ID task .Utilizing non - maximum suppression
      , the highest scoring 1 0 0 detection boxes are fed into pose estimation and
      person Re - ID branches to obtain the heat maps of K keypoints and 1 2 8 - d
      Re - ID feature for each human boxes .In this section , we perform thorough
      ablation experiments for both pose estimation and pose tracking tasks , and
      compare our FastPose framework with the state - of - theart methods on PoseTrack
      [ 2 ] dataset .Pose estimation task is evaluated on 5k validation images ( minival
      ) of COCO [ 3 4 ] dataset and PoseTrack [ 2 ] dataset .BackboneArchitecture
      and SIFP for FastPose : As shown in Table 1 ( b ) , our proposed FastPose also
      shows steady improvement by using deeper backbone models . mAP and MOTA are
      two main metrics on PoseTrack dataset .Using MobileNet - v 2 or ResNet 1 8 as
      the backbone , FastPose can achieve real - time pose tracking .Although FastPose
      - MobileNet - v 2 has lower metric ( 6 2 . 1 on mAP and 5 5 . 6 on MOTA ) than
      FastPose - 1 8 ( 6 3 . 1 and 5 6 . 8) , its properties make it particularly
      suitable for mobile applications .It proves SIFP can stably improve the performance
      of pose estimation and tracking on PoseTrack dataset .Pose estimation performance
      of FastPose on COCO dataset is reported in the supplementary material due to
      the page limit .Besides , we evaluate MTN on the person Re - ID dataset SSM
      and the mAP on SSM test is 8 9 . 3 8 , which suggests that it is feasible to
      extract Re - ID features in MTN .More complex designs have the potential to
      improve performance but are not the focus of this work . we compare our FastPose
      framework with the state - ofthe - art methods on PoseTrack Dataset [ 2 ] ,
      including PoseTrack [ 2 ] , JointFlow [ 1 6 ] , PoseFlow [ 5 3 ] , Detect -
      and - Track [ 2 1 ] and FlowTrack [ 5 0 ] . top - down or bottom - up approach
      , are all have lower mAP and slower speed than FastPose - 5 0 or FastPose -
      1 0 1 .On PoseTrack val , Only FlowTrack - 1 5 2 with Flow has 6 5 . 4 MOTA
      higher than 6 3 . 2 of our FastPose - 1 0 1 .But its slower detector FPN - DCN
      and the optical flow estimation take much inference time , which causes the
      speed of FlowTrack - 1 5 2 is only 0. 2 FPS .Although using Flow and adopting
      FPN - DCN as human detector , FlowTrack - 5 0 achieves MOTA of 6 2 . 9 which
      is still caught up by our FastPose - 5 0 with MOTA of 6 2 . 8 .On PoseTrack
      test , FastPose - 5 0 and FastPose - 1 0 1 achieve MOTA of 5 6 . 6 and 5 7 .
      4 , which are close to the state - of - the - art performance .The inference
      time of FastPose comes from two aspects : MTN and tracking strategy .In this
      paper , we present FastPose , a fast and unified pose estimation and tracking
      framework , which utilizes a multi - task network ( MTN ) to integrates three
      tasks together .An occlusion - aware strategy following MTN performs pose tracking
      .Besides , a paradigm named Scale - normalized Image and Feature Pyramid ( SIFP
      ) is designed to deal with severe scale variation widely existed in unified
      pose approaches .In ablation studies , we prove the stable improvements brought
      by MTN , SIFP and occlusion - aware strategy .Moreover , with different configurations
      , FastPose can achieve real - time inference or competitive performance , which
      is helpful to adopt pose tracking in actual scenarios .'
