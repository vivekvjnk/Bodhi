entities:
- description: A core component of FastPose, designed to simultaneously perform human
    detection, pose estimation, and person re-identification.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: The task of identifying the locations of keypoints (e.g., joints) on
    human figures within an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: A real-time pose estimation and tracking framework.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating human figures within an image
    or video.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of identifying and tracking individuals across different camera
    views or over time.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: task
- description: A paradigm designed to address the scale variation problem in pose
    estimation, enhancing scale invariance.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: Leveraged by SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluating the performance of FastPose.
  name: COCO
  source_chunk_index: 0
