  type: dataset
- description: A dataset used for evaluating the performance of FastPose.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A method used to refine the location of detected objects by predicting
    offsets to the initial bounding box proposals.
  name: Bounding Box Regression
  source_chunk_index: 0
  type: method
- description: A fully convolutional network that proposes candidate object bounding
    boxes, used in object detection frameworks like Faster R-CNN and FastPose.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A method used to extract features from the feature maps for each Region
    of Interest (RoI), ensuring spatial alignment and preventing misalignment caused
    by quantization.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: The convolutional neural network architectures (e.g., ResNet, MobileNet-v2)
    used for feature extraction from the input image, forming the base of the FastPose
    framework.
  name: Backbone Networks
  source_chunk_index: 0
  type: method
- description: A backbone network architecture used for feature extraction, evaluated
    with FPN in the context of the MTN.
