entities:
- description: The task of estimating the pose of a person in an image or video.
  name: pose estimation
  source_chunk_index: 0
  type: task
- description: The task of detecting humans in an image or video.
  name: human detection
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: person Re-ID (re-identification)
  source_chunk_index: 0
  type: task
- description: A neural network architecture designed to perform multiple tasks simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A method for creating image and feature pyramids that are scale-normalized.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction method that creates feature pyramids for object
    detection.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy that accounts for occlusions when performing tasks like
    pose estimation.
  name: occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: The task of detecting specific keypoints on an object, such as joints
    on a human body.
  name: keypoint detection
  source_chunk_index: 0
  type: method
- description: A method for refining the location and size of bounding boxes around
    objects.
  name: bounding box regression
  source_chunk_index: 0
  type: method
- description: A neural network that proposes regions of interest for object detection.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A large-scale dataset for object detection, segmentation, and keypoint
    detection.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset for human pose estimation and tracking in videos.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset, likely related to human pose or action recognition, but
    the specific meaning is unknown without further context.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A backbone network used for feature extraction, evaluated for its trade-off
    between accuracy and speed in the MTN framework.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A backbone network used for feature extraction, evaluated for its trade-off
    between accuracy and speed in the MTN framework.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Datasets composed of images within multi-person scenes and corresponding
    ID annotations, used for training the head network for person Re-ID.
  name: person search datasets
  source_chunk_index: 0
  type: dataset
- description: The performance bottleneck in unified pose estimation, particularly
    in computer vision tasks like face detection, object detection, and pose estimation,
    caused by the varying sizes of objects in images.
  name: Scale Variation Problem
  source_chunk_index: 0
  type: task
- description: Feature Pyramid Networks, a method used to enhance scale invariance
    by creating a pyramidal representation and fusing adjacent scale feature maps
    to combine features with semantic and detail information.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A method that efficiently detects objects in an image while simultaneously
    generating a high-quality segmentation mask for each instance.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A convolutional technique used to increase the resolution of the feature
    map, particularly useful for detecting small objects.
  name: Dilated/Atrous Convolutions
  source_chunk_index: 0
  type: method
