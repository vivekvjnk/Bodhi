entities:
- description: A learning approach used in natural language processing, speech recognition,
    and computer vision, where a model learns to perform multiple tasks simultaneously.
  name: Multi-task learning
  source_chunk_index: 0
  type: task
- description: A field focused on enabling computers to 'see' and interpret images,
    with applications in object detection, pose estimation, and more.
  name: Computer vision
  source_chunk_index: 0
  type: task
- description: A computer vision task that involves identifying and locating objects
    within an image.
  name: Object detection
  source_chunk_index: 0
  type: task
- description: A computer vision task that involves determining the position and orientation
    of objects or people in an image.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: A method for object detection and instance segmentation, capable of
    detecting objects and generating high-quality segmentation masks.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A method for object detection that jointly predicts the class and coordinates
    of objects in an image.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A method that proposes a pyramidal representation and fuses adjacent
    scale feature maps to combine features with semantic and detail information.
  name: FPN (Feature Pyramid Network)
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used for feature extraction,
    evaluated for its trade-off between accuracy and speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used for feature extraction, evaluated
    for its effectiveness in feature extraction.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A fully convolutional network built upon feature maps to propose candidate
    human bounding boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A unified network that performs human detection, pose estimation, and
    person Re-ID simultaneously.
  name: MTN (Multi-Task Network)
  source_chunk_index: 0
  type: method
- description: A paradigm exploited to alleviate the scale variation problem of MTN,
    using both image and feature pyramids.
  name: SIFP (Scale-normalized image pyramid and feature pyramid)
  source_chunk_index: 0
  type: method
- description: Datasets composed of images within multi-person and corresponding ID
    annotations, used for training head networks.
  name: Person search datasets
  source_chunk_index: 0
  type: dataset
- description: A method used for object detection, specifically for small objects,
    mentioned in the context of addressing scale variation in computer vision tasks.
  name: SDP
  source_chunk_index: 0
  type: method
- description: A method used for object detection, specifically for small objects,
    mentioned in the context of addressing scale variation in computer vision tasks.
  name: SSH
  source_chunk_index: 0
  type: method
- description: A method used for object detection, specifically for small objects,
