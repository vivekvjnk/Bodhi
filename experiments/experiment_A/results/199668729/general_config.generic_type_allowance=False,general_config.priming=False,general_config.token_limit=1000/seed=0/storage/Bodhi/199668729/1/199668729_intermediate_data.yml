  name: person search datasets
  source_chunk_index: 0
  type: dataset
- description: A type of convolution used to increase the resolution of the feature
    map, particularly useful for detecting small objects.
  name: Dilated/Atrous Convolutions
  source_chunk_index: 0
  type: method
- description: A method used to extract features from regions of interest (RoIs) with
