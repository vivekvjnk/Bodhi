entities:
- description: An end-to-end network designed for human detection, pose estimation,
    and person re-identification tasks simultaneously.
  name: MTN (Multi-task Network)
  source_chunk_index: 0
  type: method
- description: The process of identifying and locating humans within an image or video.
  name: Human Detection
  source_chunk_index: 0
  type: task
- description: The task of determining the position of key body joints in an image
    or video.
  name: Pose Estimation
  source_chunk_index: 0
  type: task
- description: The task of identifying and tracking individuals across different camera
    views or time instances.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: task
- description: A paradigm proposed to address the scale variation problem in pose
    estimation, improving both performance and speed.
  name: SIFP (Scale-normalized Image and Feature Pyramids)
  source_chunk_index: 0
  type: method
- description: A convolutional neural network used as a backbone in the pose tracking
    framework.
  name: ResNet-18
  source_chunk_index: 0
  type: method
- description: A convolutional neural network used as a backbone in the pose tracking
    framework.
  name: ResNet-50
  source_chunk_index: 0
  type: method
- description: A pose tracking framework developed for real-time speed, performing
    pose estimation and tracking.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: A strategy that utilizes pose information to infer occlusion states,
    improving person re-identification performance.
  name: Occlusion-aware Re-ID strategy
  source_chunk_index: 0
  type: method
- description: A benchmark for evaluating keypoint detection methods.
  name: COCO 2017 keypoint challenge
  source_chunk_index: 0
  type: task
- description: A network architecture used to extract features at multiple scales.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: The task of estimating the poses of multiple people in an image or
    video.
  name: Multi-person pose estimation
  source_chunk_index: 0
  type: task
- description: The task of tracking the poses of people over time in a video.
  name: Pose tracking
  source_chunk_index: 0
  type: task
- description: A method involved in pose estimation and tracking.
  name: PoseTrack
  source_chunk_index: 0
  type: method
- description: A method involved in pose estimation and tracking.
  name: JointFlow
  source_chunk_index: 0
  type: method
