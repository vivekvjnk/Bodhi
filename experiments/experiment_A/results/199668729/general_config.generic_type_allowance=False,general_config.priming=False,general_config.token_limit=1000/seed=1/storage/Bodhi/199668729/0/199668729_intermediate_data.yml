  source_chunk_index: 0
  type: method
- description: A method involved in pose estimation and tracking.
  name: FlowTrack
  source_chunk_index: 0
  type: method
- description: A leading method on COCO 2017 keypoint challenge.
  name: CPN
  source_chunk_index: 0
  type: method
- description: The task of tracking the poses of multiple people in a video, considering
    the articulation of their bodies.
  name: Articulated Multi-person Pose Tracking
  source_chunk_index: 0
  type: task
- description: A method that extends the R-CNN framework for object detection and
    segmentation, used in this context for pose estimation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A pose estimation approach that starts by detecting body parts and
    then assembles them into full poses, as opposed to top-down methods.
  name: Bottom-up Method
  source_chunk_index: 0
  type: method
- description: A problem-solving approach used in pose tracking, specifically mentioned
    in the context of [21], where the matching of detected poses is formulated as
    a bipartite graph matching problem.
  name: Bipartite Graph Matching Problem
  source_chunk_index: 0
  type: task
- description: A method described in [21] that extends the Mask R-CNN architecture
    to 3D for predicting the location of person tubes and corresponding poses simultaneously.
  name: 3D Extension of Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A method used in [50] for pose tracking, where the similarity between
    poses is determined using flow-based metrics to solve the matching problem.
  name: Flow-based Pose Similarity as Metric
  source_chunk_index: 0
  type: method
