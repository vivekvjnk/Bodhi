entities:
- description: The process of identifying and locating human figures within an image
    or video.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The task of identifying and locating keypoints (e.g., joints) on a
    human body within an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The process of tracking the poses of multiple individuals over a sequence
    of video frames.
  name: Multi-person pose tracking
  source_chunk_index: 0
  type: GENERIC
- description: An approach to pose estimation that first detects individual keypoints
    and then assembles them into human poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: GENERIC
- description: Pose estimation methods that first detect humans and then estimate
    their poses.
  name: Top-down pose estimation methods
  source_chunk_index: 0
  type: GENERIC
- description: An extension of the Faster R-CNN object detection framework, used for
    instance segmentation, including human pose estimation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: GENERIC
- description: Intersection over Union, a metric used to measure the overlap between
    two bounding boxes or regions.
  name: IoU
  source_chunk_index: 0
  type: GENERIC
- description: A method to represent the movement of human poses across video frames.
  name: Pose flow
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to eliminate redundant detections by suppressing those
    with lower scores that overlap significantly with higher-scoring detections.
  name: Non-maximum suppression (NMS)
  source_chunk_index: 0
  type: GENERIC
- description: The problem of a tracker assigning different identities to the same
    person over time.
  name: ID switches
  source_chunk_index: 0
  type: GENERIC
- description: A human detector that combines Feature Pyramid Networks (FPN) with
    Deformable Convolutional Networks (DCN) to improve human detection performance.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: A model used to predict temporal flow fields to formulate a similarity
    measure of detected joints for pose tracking.
  name: Temporal Flow Fields (TTF)
  source_chunk_index: 0
  type: method
- description: An extended version of Mask R-CNN used for pose estimation, which solves
    the bipartite graph matching problem based on IoU.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
