entities:
- description: The task of estimating the pose of a human in an image, involving keypoint
    detection.
  name: Pose estimation
  source_chunk_index: 0
  type: Task
- description: The task of identifying and re-identifying individuals across different
    camera views or frames.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: Task
- description: The process of identifying and locating key points on a human body.
  name: Keypoint detection
  source_chunk_index: 0
  type: Task
- description: A dataset used for training and evaluating pose estimation and tracking
    tasks.
  name: PoseTrack
  source_chunk_index: 0
  type: Dataset
- description: A dataset used for evaluating pose estimation tasks.
  name: COCO
  source_chunk_index: 0
  type: Dataset
- description: The underlying network architecture used for feature extraction.
  name: Backbone network
  source_chunk_index: 0
  type: GENERIC
- description: The core network in FastPose, responsible for human detection, pose
    estimation, and person Re-identification (Re-ID).
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A method designed to address the scale variation problem in pose estimation,
    combining Feature Pyramid Networks (FPN) with scale distribution.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: Used in conjunction with SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: An approach used for articulated multi-person pose tracking, leveraging
    outputs from the MTN.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: A deeper backbone network used in FastPose.
  name: ResNet-50
  source_chunk_index: 0
  type: method
- description: A deeper backbone network used in FastPose.
  name: ResNet-101
  source_chunk_index: 0
  type: method
- description: A smaller backbone network used in FastPose.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A metric used for evaluating the performance of object detection and
    pose estimation models.
  name: mAP
  source_chunk_index: 0
  type: generic
- description: A dataset utilized for training the pose estimation task.
  name: MPII
  source_chunk_index: 0
  type: dataset
- description: A person search dataset used for training the person Re-ID task.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A person search dataset used for training the person Re-ID task.
  name: PRW
  source_chunk_index: 0
  type: dataset
- description: Visual representations of the confidence scores for keypoint locations,
    used in pose estimation to identify the most likely positions of body joints.
  name: Heat maps
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to select the best bounding boxes by suppressing those
    with lower scores that overlap significantly with higher-scoring boxes, used in
    object detection to filter out redundant detections.
  name: Non-maximum suppression
  source_chunk_index: 0
  type: METHOD
- description: A 128-dimensional feature vector used for person re-identification.
  name: Re-ID feature
  source_chunk_index: 0
  type: GENERIC
- description: A technique used to select the highest scoring detection boxes.
  name: Non-maximum suppression
  source_chunk_index: 0
  type: METHOD
