entities:
- description: The process of identifying and locating human figures within an image
    or video.
  name: human detection
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and locating keypoints on a human figure
    to estimate its pose.
  name: pose estimation
  source_chunk_index: 0
  type: TASK
- description: The task of identifying and matching the same person across different
    camera views or time instances.
  name: person Re-identification (Re-ID)
  source_chunk_index: 0
  type: TASK
- description: A dataset used for evaluating the performance of pose estimation and
    tracking methods.
  name: PoseTrack dataset
  source_chunk_index: 0
  type: DATASET
- description: A dataset used for evaluating the performance of pose estimation methods.
  name: COCO dataset
  source_chunk_index: 0
  type: DATASET
- description: A person Re-ID dataset used to evaluate the MTN.
  name: SSM
  source_chunk_index: 0
  type: DATASET
- description: A real-time pose estimation and tracking framework.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: The core network in FastPose, performing human detection, pose estimation,
    and person Re-identification (Re-ID) simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A paradigm designed to address the scale variation problem in pose
    estimation, combining Feature Pyramid Networks (FPN) with scale distribution.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction method used in SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy used by FastPose for articulated multi-person pose tracking.
  name: occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: The base convolutional neural networks used for feature extraction,
    such as ResNet and MobileNet-v2.
  name: backbone networks
  source_chunk_index: 0
  type: generic
- description: A type of backbone network used in FastPose.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A type of backbone network used in FastPose, suitable for mobile applications.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: Mean Average Precision, a metric used to evaluate the performance of
    object detection and pose estimation models.
  name: mAP
  source_chunk_index: 0
  type: generic
- description: Multiple Object Tracking Accuracy, a metric used to evaluate the performance
    of multi-object tracking algorithms.
  name: MOTA
  source_chunk_index: 0
  type: generic
- description: Features extracted from the MTN to improve tracking accuracy.
  name: Re-ID features
  source_chunk_index: 0
  type: method
- description: The mean Average Precision, a metric used to evaluate the performance
    of object detection and pose estimation models, specifically on the PoseTrack
    and COCO datasets in this context.
  name: mAP
  source_chunk_index: 0
  type: generic
- description: Multiple Object Tracking Accuracy, a metric used to evaluate the performance
