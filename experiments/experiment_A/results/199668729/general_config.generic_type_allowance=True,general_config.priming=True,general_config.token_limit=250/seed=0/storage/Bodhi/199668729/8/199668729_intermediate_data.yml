chunk_indices:
- 0
entities:
- description: A unified network that performs human detection, pose estimation, and
    person Re-identification (Re-ID) simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: METHOD
- description: The process of identifying and locating human figures within an image
    or video.
  name: Human detection
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and locating keypoints (e.g., joints) on
    a human figure within an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: TASK
- description: The task of identifying and matching individuals across different camera
    views or time instances.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: TASK
- description: A strategy used for articulated multi-person pose tracking, utilizing
    information from the MTN.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: METHOD
- description: A method used to extract features from regions of interest (RoIs) in
    the feature maps.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A method that combines image and feature pyramids to enhance scale
    invariance in the MTN.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction method used in SIFP to address the scale variation
    problem.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: The base network upon which the MTN is built.
  name: Backbone network
  source_chunk_index: 0
  type: generic
- description: Used to generate RoIs for the head networks in the MTN.
  name: RPN
  source_chunk_index: 0
  type: method
- description: A performance bottleneck in unified pose estimation addressed by the
    SIFP paradigm.
  name: Scale variation problem
  source_chunk_index: 0
  type: generic
- description: Datasets composed of images containing multiple people with corresponding
    ID annotations, used for training the Multi-Task Network (MTN) and related tasks
    like person Re-identification (Re-ID). Examples are cited in the text.
  name: Person Search Datasets
  source_chunk_index: 0
  type: dataset
- description: A method used to maintain the ratio of the person in the feature maps
    extracted by RoIAlign.
  name: Padding operation
  source_chunk_index: 0
  type: method
- description: The Region Proposal Network, which generates RoIs (Regions of Interest)
    that are used by the head networks in the MTN.
  name: RPN
  source_chunk_index: 0
  type: method
- description: Datasets composed of images containing multiple people with corresponding
    ID annotations, used for training the Multi-Task Network (MTN).
  name: Person Search Datasets
  source_chunk_index: 0
  type: dataset
