entities:
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-identification (Re-ID).
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: METHOD
- description: The process of estimating the pose of a human in an image or video.
  name: pose estimation
  source_chunk_index: 0
  type: TASK
- description: A paradigm designed to address the scale variation problem by combining
    Feature Pyramid Networks (FPN) with scale distribution.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: METHOD
- description: A strategy that utilizes the outputs of the multi-task network to perform
    articulated multi-person pose tracking in videos, inferring occlusion states.
  name: occlusion-aware strategy
  source_chunk_index: 0
  type: METHOD
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: person Re-identification (Re-ID)
  source_chunk_index: 0
  type: TASK
- description: The process of detecting specific keypoints on a human body.
  name: keypoint detection
  source_chunk_index: 0
  type: TASK
- description: The process of tracking the poses of multiple people in a video, considering
    the articulation of their bodies.
  name: articulated multi-person pose tracking
  source_chunk_index: 0
  type: TASK
- description: A dataset used for keypoint challenges.
  name: COCO
  source_chunk_index: 0
  type: DATASET
- description: A performance bottleneck in unified pose estimation methods.
  name: scale variation problem
  source_chunk_index: 0
  type: generic
- description: A method used in the SIFP paradigm to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A leading method for keypoint detection on the COCO 2017 keypoint challenge,
    involving skip layer feature concatenation and an online hard keypoint mining
    step.
  name: CPN
  source_chunk_index: 0
  type: method
- description: A strategy that utilizes pose information to infer occlusion states
    and reduce identification (ID) switches during tracking, improving tracking accuracy.
  name: Re-ID strategy
  source_chunk_index: 0
  type: method
