chunk_indices:
- 0
entities:
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-identification (Re-ID).
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: METHOD
- description: The process of identifying and locating humans within an image or video.
  name: human detection
  source_chunk_index: 0
  type: TASK
- description: The process of estimating the keypoint coordinates of a human in an
    image or video.
  name: pose estimation
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and tracking individuals across different
    camera views or time instances.
  name: person Re-identification (Re-ID)
  source_chunk_index: 0
  type: TASK
- description: A paradigm designed to address the scale variation problem in pose
    estimation, combining Feature Pyramid Networks (FPN) with scale distribution.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: METHOD
- description: A network architecture that creates a feature pyramid from a single
    input image, used to detect objects at different scales.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: METHOD
- description: The coordinates of specific points on a human body, used for pose estimation.
  name: keypoint coordinates
  source_chunk_index: 0
  type: GENERIC
- description: Rectangular regions that enclose detected objects in an image.
  name: bounding boxes
  source_chunk_index: 0
  type: GENERIC
- description: A network architecture that performs object detection, instance segmentation,
    and bounding box regression.
  name: Mask R-CNN
  source_chunk_index: 0
  type: METHOD
- description: A performance bottleneck in unified pose estimation, caused by the
    varying sizes of objects in an image.
  name: scale variation problem
  source_chunk_index: 0
  type: generic
- description: A fully convolutional network used to propose candidate human bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A method used for object detection, specifically for small objects.
  name: SSH
  source_chunk_index: 0
  type: method
- description: A method used for object detection, specifically for big objects.
  name: MS-CNN
  source_chunk_index: 0
  type: method
- description: A method that proposes advanced and efficient data argumentation methods
    to illustrate the scale variation problem.
  name: SNIP
  source_chunk_index: 0
  type: method
- description: A method that proposes advanced and efficient data argumentation methods
    to illustrate the scale variation problem.
  name: SNIPER
  source_chunk_index: 0
  type: method
- description: A task performed by a branch in Mask R-CNN, used to categorize objects.
  name: Classification
  source_chunk_index: 0
  type: task
- description: A task performed by a branch in Mask R-CNN, used to refine the location
    of bounding boxes.
  name: Bounding-box regression
  source_chunk_index: 0
  type: task
- description: Features used for person Re-identification, a key output of the Multi-Task
    Network (MTN) and used to improve tracking accuracy.
  name: Re-ID features
  source_chunk_index: 0
  type: method
