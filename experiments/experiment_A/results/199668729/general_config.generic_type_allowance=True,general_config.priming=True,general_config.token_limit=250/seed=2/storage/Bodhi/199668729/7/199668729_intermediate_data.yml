entities:
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-identification (Re-ID).
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating humans within an image.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the pose of a person, typically by identifying
    keypoints.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of identifying and tracking individuals across different camera
    views or time instances.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: GENERIC
- description: The network used for feature extraction over an entire image.
