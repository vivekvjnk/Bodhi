  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: Used for extracting feature maps for each proposal.
  name: RoIAlign
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying specific points (keypoints) on a human body.
  name: Keypoint detection
  source_chunk_index: 0
