- description: A method mentioned in the text, used as a reference point for the proposed
    network's architecture and limitations in pose estimation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: The task of identifying and re-identifying individuals across different
    camera views or at different times, a component of the Multi-Task Network (MTN)
    in FastPose.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: task
- description: A method used in the backbone network to extract features at multiple
    scales, which is relevant to addressing the scale variation problem.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A method used in the pose estimation head network to extract features
    for each region of interest (RoI), which is used for keypoint localization.
  name: RoIAlign
  source_chunk_index: 0
  type: method
