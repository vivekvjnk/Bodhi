  name: ResNet-18
  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network used as a backbone network.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A technique used to select the highest scoring detection boxes.
  name: Non-maximum suppression
  source_chunk_index: 0
  type: method
- description: A dataset utilized for training the pose estimation task.
  name: MPII
  source_chunk_index: 0
  type: dataset
- description: A dataset utilized for training and evaluating the pose estimation
