- description: A person search dataset used for training the person Re-ID task.
  name: PRW
  source_chunk_index: 0
  type: dataset
- description: A method that SIFP is a modified version of. Combining with FPN helps
    SNIP to avoid slower inference speed brought by multi-scale testing.
  name: SNIP
  source_chunk_index: 0
  type: method
- description: A component within the Multi-Task Network (MTN) responsible for processing
    features to predict keypoint locations for pose estimation. It uses convolutional
    layers to generate heatmaps of keypoints.
  name: Pose Estimation Head
  source_chunk_index: 0
  type: GENERIC
- description: A component within the Multi-Task Network (MTN) responsible for generating
    person Re-identification (Re-ID) features. It uses convolutional layers to generate
    a feature vector for each detected person.
  name: Re-ID Head
  source_chunk_index: 0
  type: GENERIC
