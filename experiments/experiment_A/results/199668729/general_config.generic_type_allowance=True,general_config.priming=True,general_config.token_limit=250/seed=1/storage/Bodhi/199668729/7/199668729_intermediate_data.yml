entities:
- description: The process of identifying and locating humans within an image.
  name: Human detection
  source_chunk_index: 0
  type: TASK
- description: The process of estimating the pose of a human, typically by identifying
    keypoints.
  name: Pose estimation
  source_chunk_index: 0
  type: TASK
- description: The process of re-identifying a person across different camera views
    or time instances.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and locating specific points (keypoints)
    on a human body.
  name: Keypoint detection
  source_chunk_index: 0
  type: TASK
- description: A network architecture designed to perform multiple tasks simultaneously,
    including human detection, pose estimation, and person Re-identification (Re-ID).
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: generic
- description: The core network responsible for feature extraction from an entire
    image.
  name: Backbone network
  source_chunk_index: 0
  type: generic
- description: A lightweight network architecture used as a backbone for feature extraction.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deeper network architecture used as a backbone for feature extraction.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A component used to enhance feature extraction, often used in conjunction
    with backbone networks.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A method used to extract features from regions of interest (RoIs).
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating humans within an image, often
    involving bounding box classification and regression.
  name: Human Detection
  source_chunk_index: 0
  type: Task
- description: The task of determining the positions of keypoints (e.g., joints) on
    a human body within an image.
  name: Pose Estimation
  source_chunk_index: 0
  type: Task
- description: The task of identifying and matching individuals across different camera
    views or within the same view over time.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: Task
- description: The networks responsible for performing human detection, pose estimation,
    and person Re-ID, applied separately to each Region of Interest (RoI).
  name: Head Networks
  source_chunk_index: 0
  type: Method
- description: A method mentioned in the text, serving as a point of architectural
    comparison for the proposed network. It is used for human detection (bounding-box
    classification and regression), pose estimation, and person Re-ID.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A backbone network used for feature extraction, with different depth
    layers (18, 50, and 101 layers) evaluated in the context of the Multi-Task Network
    (MTN).
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A method used in the pose estimation head network to extract feature
    maps for each proposal, specifically mentioned in the context of Mask R-CNN.
  name: RoIAlign
  source_chunk_index: 0
  type: method
