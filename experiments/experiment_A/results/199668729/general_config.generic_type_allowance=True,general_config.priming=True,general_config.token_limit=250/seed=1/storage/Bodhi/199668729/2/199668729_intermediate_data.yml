chunk_indices:
- 0
entities:
- description: The task of identifying and locating humans within an image or video.
  name: Human detection
  source_chunk_index: 0
  type: TASK
- description: The task of estimating the pose (keypoint locations) of a person in
    an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: TASK
- description: The task of identifying and re-identifying individuals across different
    camera views or time instances.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: TASK
- description: The process of tracking human poses over time in a video sequence.
  name: Pose tracking
  source_chunk_index: 0
  type: TASK
- description: Tracking the poses of multiple people in a video, considering the articulation
    of their bodies.
  name: Articulated multi-person pose tracking
  source_chunk_index: 0
  type: TASK
- description: A pose tracking framework designed for real-time speed, performing
    pose estimation and tracking.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: A network that jointly optimizes human detection, pose estimation,
    and person Re-ID tasks.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A performance bottleneck in unified pose estimation, addressed by the
    FastPose framework.
  name: Scale variation problem
  source_chunk_index: 0
  type: task
- description: A network that performs human detection, pose estimation, and person
    Re-ID simultaneously.
  name: End-to-end multi-task network
  source_chunk_index: 0
  type: method
- description: Features used to identify and distinguish different individuals, incorporated
    into the multi-task network to improve pose tracking accuracy.
  name: Person Re-ID features
  source_chunk_index: 0
  type: method
- description: A paradigm designed to address the scale variation problem in pose
    estimation by combining Feature Pyramid Networks (FPN) with scale distribution
    to enhance scale invariance.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: Features extracted from the person Re-identification task, used to
    improve pose tracking accuracy within the FastPose framework.
  name: Re-ID features
  source_chunk_index: 0
  type: method
