entities:
- description: The process of identifying and locating human figures within an image
    or video.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The task of determining the configuration of a human body, typically
    by identifying keypoints.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The process of tracking the poses of multiple individuals over time
    in a video sequence.
  name: Multi-person pose tracking
  source_chunk_index: 0
  type: GENERIC
- description: An approach to pose estimation that starts by detecting individual
    keypoints and then assembles them into human poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: GENERIC
- description: Pose estimation methods that first detect humans and then estimate
    their poses.
  name: Top-down pose estimation methods
  source_chunk_index: 0
  type: GENERIC
- description: An extension of the Faster R-CNN object detection framework, used for
    instance segmentation, including human pose estimation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: GENERIC
- description: Intersection over Union, a metric used to measure the overlap between
    two bounding boxes.
  name: IoU
  source_chunk_index: 0
  type: GENERIC
- description: An optimization approach that makes the best local choice at each step,
    without considering the global impact.
  name: Greedy fashion
  source_chunk_index: 0
  type: GENERIC
- description: A method to represent the movement of keypoints over time, used for
    tracking.
  name: Pose flow
  source_chunk_index: 0
  type: GENERIC
- description: The problem of a tracker assigning different identities to the same
    person over time.
  name: ID switches
  source_chunk_index: 0
  type: GENERIC
- description: A human detector that combines Feature Pyramid Networks (FPN) with
    Deformable Convolutional Networks (DCN) to improve human detection performance.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: A pose estimation approach that first estimates human poses and then
    transforms the problem into solving an energy minimizing function over a spatiotemporal
    graph constructed on the detected joints.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: A model used to predict temporal flow fields to formulate a similarity
    measure of detected joints.
  name: Temporal Flow Fields (TTF)
  source_chunk_index: 0
  type: method
- description: An extended version of Mask R-CNN used for top-down pose estimation,
    solving the bipartite graph matching problem based on IoU.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A method that constructs pose flow and performs non-maximum suppression
    to eliminate issues like ID switches.
  name: Pose flow non maximum suppression (NMS)
  source_chunk_index: 0
  type: method
