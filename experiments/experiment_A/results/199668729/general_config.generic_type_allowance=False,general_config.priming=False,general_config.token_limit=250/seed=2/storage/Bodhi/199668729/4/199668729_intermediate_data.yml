  name: Multi-person pose tracking
  source_chunk_index: 0
  type: task
- description: A human detector that incorporates Feature Pyramid Network (FPN) and
    Deformable Convolutional Networks (DCN).
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: An approach to pose estimation that starts by detecting keypoints and
    then grouping them into human poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: A graph structure used to represent the relationships between detected
    joints across space and time.
  name: Spatiotemporal graph
  source_chunk_index: 0
  type: method
- description: A model used to predict flow fields for measuring the similarity of
    detected joints.
  name: Temporal Flow Fields (TTF)
  source_chunk_index: 0
  type: method
- description: An approach to pose estimation that first detects human bounding boxes
    and then estimates the pose within each box.
  name: Top-down pose estimation
  source_chunk_index: 0
  type: method
- description: An extension of the R-CNN model used for instance segmentation, adapted
    for pose estimation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: Intersection over Union, a metric used to evaluate the overlap between
    predicted and ground truth bounding boxes, used for bipartite graph matching.
  name: IoU
  source_chunk_index: 0
  type: method
- description: A method to construct pose flow and perform pose flow non maximum suppression
