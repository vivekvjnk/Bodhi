  name: Deconvolutional Layers
  source_chunk_index: 0
  type: method
- description: A method used in [28, 26] for human pose estimation, where the pose
    is estimated from the joints up.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: An extension of Mask R-CNN proposed in [21] for human pose estimation.
  name: Extended Mask R-CNN
  source_chunk_index: 0
