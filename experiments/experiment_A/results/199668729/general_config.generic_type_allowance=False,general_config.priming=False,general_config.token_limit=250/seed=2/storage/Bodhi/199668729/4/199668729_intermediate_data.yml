  name: Pose flow
  source_chunk_index: 0
  type: method
- description: A method to solve the matching problem based on IoU.
  name: Bipartite graph matching
  source_chunk_index: 0
  type: method
- description: A technique used to eliminate redundant pose detections and resolve
    ID switches.
  name: Pose flow non maximum suppression (NMS)
  source_chunk_index: 0
  type: method
- description: A method used to solve the matching problem, as described in the text.
  name: Greedy Fashion
  source_chunk_index: 0
  type: method
- description: Specific layers added to the single-person pose estimation network
