  type: method
- description: A metric used to measure the similarity between poses based on flow
    information.
  name: Flow-based pose similarity
  source_chunk_index: 0
  type: method
- description: A technique used to eliminate redundant pose detections and reduce
    ID switches.
  name: Pose flow non-maximum suppression (NMS)
