entities:
- description: A unified network performing human detection, pose estimation, and
    person Re-ID simultaneously.
  name: MTN
  source_chunk_index: 0
  type: method
- description: A method used for extracting feature maps.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A component of the MTN network, used in conjunction with the backbone.
  name: RPN
  source_chunk_index: 0
  type: method
- description: A scale-normalized paradigm exploiting both image pyramid and feature
    pyramid to achieve enhanced scale invariance capability of MTN.
  name: SIFP
  source_chunk_index: 0
  type: method
- description: A feature pyramid network used by SIFP to maximize inference speed
    without reducing performance.
  name: FPN
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating humans within an image.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of estimating the pose of a person in an image.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
