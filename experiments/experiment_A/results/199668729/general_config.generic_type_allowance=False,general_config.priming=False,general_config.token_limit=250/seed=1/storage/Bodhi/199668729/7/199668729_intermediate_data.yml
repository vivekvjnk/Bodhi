entities:
- description: A network architecture used for object detection and instance segmentation,
    serving as a basis for the proposed network.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating humans within an image, involving
    bounding-box classification and regression.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of determining the keypoints of a human pose within an image.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
- description: The network used for feature extraction over an entire image.
  name: Backbone network
  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network architecture used as a backbone
    for feature extraction.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone for feature
    extraction.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Network, used to enhance feature extraction across
    different scales.
  name: FPN
  source_chunk_index: 0
  type: method
- description: The task of precisely locating keypoints in pose estimation.
  name: Keypoints localization
  source_chunk_index: 0
  type: task
- description: A method used in Mask R-CNN to extract features from regions of interest.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A specific configuration of the ResNet architecture with 18 layers,
    used for feature extraction in the context of MTN.
  name: ResNet (18 layers)
  source_chunk_index: 0
  type: method
- description: A specific configuration of the ResNet architecture with 50 layers,
    used for feature extraction in the context of MTN.
  name: ResNet (50 layers)
  source_chunk_index: 0
  type: method
- description: A specific configuration of the ResNet architecture with 101 layers,
    used for feature extraction in the context of MTN.
  name: ResNet (101 layers)
  source_chunk_index: 0
  type: method
- description: The method that utilizes MobileNet-v2 and ResNet architectures for
    feature extraction, human detection, pose estimation, and person Re-ID.
  name: MTN
  source_chunk_index: 0
  type: method
- description: The depth of the Feature Pyramid Network (FPN) layers used in the backbone
    network, specifically 18, 50, and 101 layers are evaluated.
  name: FPN Depth
  source_chunk_index: 0
  type: method
