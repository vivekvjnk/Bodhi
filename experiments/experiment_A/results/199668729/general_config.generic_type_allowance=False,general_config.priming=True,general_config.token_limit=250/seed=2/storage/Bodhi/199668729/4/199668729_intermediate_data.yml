- description: The task of identifying and locating human figures within an image
    or video frame. This is a core component of the FastPose framework, as it precedes
    pose estimation and person re-identification.
  name: Human Detection
  source_chunk_index: 0
  type: task
- description: The task of determining the spatial configuration of human body keypoints
    (e.g., joints) within an image or video. FastPose performs this task as part of
    its multi-task network.
  name: Pose Estimation
  source_chunk_index: 0
  type: task
- description: The task of associating different detections of the same person across
    multiple frames or views. FastPose integrates Re-ID to track individuals over
    time.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: task
- description: The task of identifying and locating human figures within an image
    or video frame.
  name: Human Detection
  source_chunk_index: 0
  type: task
- description: The task of determining the configuration of a human body, typically
    by identifying the locations of keypoints (e.g., joints) in an image or video.
  name: Pose Estimation
  source_chunk_index: 0
  type: task
- description: The task of tracking the poses of multiple individuals over a sequence
    of video frames.
  name: Multi-person pose tracking
  source_chunk_index: 0
  type: task
- description: An approach to human pose estimation that first detects individual
    body parts or keypoints and then assembles them to form full-body poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: An approach to human pose estimation that first detects human bounding
    boxes and then estimates the pose within each box.
  name: Top-down pose estimation methods
  source_chunk_index: 0
  type: method
- description: The task of tracking the poses of multiple people in a video sequence
    over time.
  name: Multi-person pose tracking
  source_chunk_index: 0
  type: task
- description: A human detector that combines Feature Pyramid Networks (FPN) with
    Deformable Convolutional Networks (DCN) to improve performance.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: Temporal Flow Fields, a model used to predict flow fields for measuring
    the similarity of detected joints in multi-person pose tracking.
  name: TTF
  source_chunk_index: 0
  type: method
