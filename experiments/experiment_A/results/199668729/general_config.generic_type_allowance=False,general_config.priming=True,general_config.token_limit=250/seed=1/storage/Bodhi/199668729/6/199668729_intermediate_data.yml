    extracted features.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A technique used to eliminate redundant bounding boxes by selecting
    the box with the highest confidence score and suppressing those with significant
    overlap.
  name: Non-Maximum Suppression
  source_chunk_index: 0
  type: method
