    output).
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A method used in the pose estimation head network to extract feature
    maps for each proposal, which is a step in localizing keypoints.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A backbone network used for feature extraction in the FastPose framework,
    evaluated for its trade-off between accuracy and speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A backbone network used for feature extraction in the FastPose framework,
    with different depths (18, 50, and 101 layers) evaluated for their impact on accuracy
    and speed.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: The part of the FastPose network responsible for specific tasks like
    human detection, pose estimation, and person Re-ID, applied to each Region of
    Interest (RoI).
  name: Head Networks
  source_chunk_index: 0
  type: method
- description: A method used in the pose estimation head network to extract feature
    maps for each proposal, which are then used for keypoint localization.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating humans within an image, often
    involving bounding box classification and regression.
  name: Human Detection
  source_chunk_index: 0
  type: task
- description: A sub-task within human detection that involves categorizing detected
    objects (e.g., humans) and assigning them to a specific class.
  name: Bounding Box Classification
  source_chunk_index: 0
  type: task
- description: A sub-task within human detection that involves refining the location
    and size of the bounding boxes around detected objects to accurately fit the objects.
  name: Bounding Box Regression
  source_chunk_index: 0
  type: task
