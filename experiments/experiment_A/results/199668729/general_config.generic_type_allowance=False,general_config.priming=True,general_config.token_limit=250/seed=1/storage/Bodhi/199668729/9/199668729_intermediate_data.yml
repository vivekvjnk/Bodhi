  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network architecture used as a backbone
    network in FastPose.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A dataset utilized for training the pose estimation task.
  name: MPII
  source_chunk_index: 0
