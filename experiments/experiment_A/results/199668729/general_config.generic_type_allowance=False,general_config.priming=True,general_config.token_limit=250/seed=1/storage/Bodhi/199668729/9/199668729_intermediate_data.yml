    pose estimation or object detection.
  name: occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: The process of identifying and locating specific keypoints (e.g., joints)
    on a person or object.
  name: keypoint detection
  source_chunk_index: 0
  type: method
- description: A large-scale object detection, segmentation, and keypoint detection
    dataset.
  name: COCO
  source_chunk_index: 0
  type: dataset
