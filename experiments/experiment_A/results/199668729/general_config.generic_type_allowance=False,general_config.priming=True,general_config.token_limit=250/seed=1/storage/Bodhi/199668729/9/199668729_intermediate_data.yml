  name: pose estimation
  source_chunk_index: 0
  type: task
- description: The process of identifying and locating humans in an image or video.
  name: human detection
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a specific person across different camera
    views or time instances.
  name: person Re-identification (Re-ID)
  source_chunk_index: 0
  type: task
- description: A neural network architecture designed to perform multiple related
    tasks simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A technique for handling scale variations in images and features.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction technique that creates feature pyramids for object
    detection.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
