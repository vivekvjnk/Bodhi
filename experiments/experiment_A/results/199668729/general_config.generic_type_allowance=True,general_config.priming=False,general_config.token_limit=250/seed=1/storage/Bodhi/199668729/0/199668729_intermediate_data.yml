entities:
- description: An end-to-end network designed to perform human detection, pose estimation,
    and person re-identification tasks simultaneously.
  name: Multi-task network (MTN)
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating humans within an image or video.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of estimating the pose of a person, typically by identifying
    keypoints such as joints.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The task of identifying a specific person across different camera views
    or time instances.
  name: Person re-identification (Re-ID)
  source_chunk_index: 0
  type: task
- description: A challenge in computer vision where the size of objects in an image
    varies, affecting performance.
  name: Scale variation problem
  source_chunk_index: 0
  type: generic
- description: A paradigm that exploits scale-normalized image and feature pyramids
