  name: Pose tracking framework
  source_chunk_index: 0
  type: generic
- description: The observed enhancement in pose estimation and tracking performance
    when utilizing Scale-normalized Image and Feature Pyramids (SIFP) through different
    backbones.
  name: Pose tracking performance improvement
  source_chunk_index: 0
  type: generic
- description: The overall pose tracking framework achieves competitive performance
    with 29, indicating a strong result in the experiments.
  name: Competitive performance
  source_chunk_index: 0
  type: generic
