- description: The task of re-identifying individuals across different frames or views.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
- description: A network that jointly optimizes human detection, pose estimation,
    and person Re-ID tasks.
  name: Multi-task network (MTN)
  source_chunk_index: 0
  type: method
- description: A paradigm proposed to address scale variation problems in pose estimation.
  name: Scale-normalized image and feature pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A method used in conjunction with SIFP to mitigate scale variation
    issues.
  name: Feature pyramid networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy utilized to perform articulated multi-person pose tracking
    in videos, leveraging pose information to infer occlusion states.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: The task of tracking the poses of multiple people in videos, considering
    the articulation of their bodies.
  name: Articulated multi-person pose tracking
  source_chunk_index: 0
  type: task
- description: A computer vision challenge focused on keypoint detection, where CPN
    was a leading method.
  name: COCO 2017 keypoint challenge
  source_chunk_index: 0
  type: task
- description: A leading method for pose estimation, as mentioned in the text. It
    involves skip layer feature concatenation and an online hard keypoint mining step.
  name: CPN
  source_chunk_index: 0
  type: method
- description: A method that uses Feature Pyramid Networks (FPN) with Deformable Convolutional
    Networks (DCN) as the human detector.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: A method for human pose estimation where the pose is estimated first
    and then transformed into solving an energy minimizing function over a spatiotemporal
    graph.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: The objective of identifying and following the movement of human poses
    over time in videos.
  name: Pose Tracking
  source_chunk_index: 0
  type: task
- description: The objective of identifying and tracking the poses of multiple individuals
    simultaneously within a video sequence.
  name: Multi-person Pose Tracking
  source_chunk_index: 0
  type: task
