entities:
- description: A pose tracking framework designed for real-time speed, developed in
    this paper.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating human poses within images or videos.
  name: Pose estimation
  source_chunk_index: 0
