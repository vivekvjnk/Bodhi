entities:
- description: A paradigm designed to address the scale variation problem in pose
    estimation, utilizing Feature Pyramid Networks (FPN).
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: METHOD
- description: The process of tracking human poses over time, utilizing an occlusion-aware
    strategy.
  name: Pose Tracking
  source_chunk_index: 0
  type: TASK
- description: Used in pose tracking to infer occlusion states and improve Re-ID.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: METHOD
- description: The process of identifying and locating humans within an image or video.
  name: Human Detection
  source_chunk_index: 0
  type: TASK
- description: The process of estimating the keypoints of human poses.
  name: Pose Estimation
  source_chunk_index: 0
  type: TASK
- description: The process of re-identifying individuals across different camera views
    or time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and locating specific points (keypoints)
    on a human body.
  name: Keypoint detection
  source_chunk_index: 0
  type: TASK
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: Used within SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
