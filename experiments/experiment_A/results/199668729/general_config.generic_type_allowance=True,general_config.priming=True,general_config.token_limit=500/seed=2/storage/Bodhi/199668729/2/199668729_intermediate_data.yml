entities:
- description: The process of estimating the pose of a person, a key task within the
    FastPose framework.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The process of re-identifying a person across different frames or views,
    a task integrated into the MTN.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A performance bottleneck in unified pose estimation, addressed by the
    SIFP paradigm.
  name: Scale variation problem
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem, enhancing
    scale invariance.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: Used within the SIFP to enhance scale invariance by fusing features
    from different scales.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of detecting keypoints on a human body, a core component
    of pose estimation.
  name: Keypoint detection
  source_chunk_index: 0
  type: GENERIC
- description: A learning approach where a model is trained to perform multiple tasks
    simultaneously, used in the MTN.
  name: Multi-task learning
  source_chunk_index: 0
  type: GENERIC
- description: An architecture that is similar to the MTN architecture, used for object
    detection and instance segmentation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating objects within an image, a
    task related to human detection.
  name: Object detection
  source_chunk_index: 0
  type: GENERIC
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: An object detection method that builds upon Fast R-CNN, jointly predicting
    the class and coordinates of objects in an image.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A type of convolution used to increase the resolution of the feature
    map, particularly useful for detecting small objects in computer vision tasks.
  name: Dilated/Atrous Convolutions
  source_chunk_index: 0
  type: method
- description: The process of following the movement of human poses over time, a key
    objective within the FastPose framework.
  name: Pose tracking
  source_chunk_index: 0
  type: task
- description: A neural network that proposes potential object bounding boxes, used
    in the MTN architecture, similar to Mask R-CNN.
  name: Region Proposal Networks (RPN)
  source_chunk_index: 0
  type: method
- description: A method that makes predictions of small objects on the lower layer.
  name: SDP
