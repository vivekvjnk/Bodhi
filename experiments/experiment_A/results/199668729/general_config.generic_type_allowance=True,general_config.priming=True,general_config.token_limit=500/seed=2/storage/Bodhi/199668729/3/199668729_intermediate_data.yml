chunk_indices:
- 0
entities:
- description: The process of identifying and locating human figures within an image,
    a key component of the MTN framework.
  name: Human detection
  source_chunk_index: 0
  type: Task
- description: The process of determining the keypoints (e.g., joints) of a human
    figure in an image, a core function of the MTN.
  name: Pose estimation
  source_chunk_index: 0
  type: Task
- description: The process of identifying and tracking individuals across different
    camera views or within a video sequence, integrated into the MTN.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: Task
- description: The process of identifying and locating specific points (keypoints)
    on a human body, a core component of pose estimation.
  name: Keypoint detection
  source_chunk_index: 0
  type: Task
- description: A unified network that performs human detection, pose estimation, and
    person Re-ID simultaneously, built upon Region Proposal Networks (RPN) and RoIs.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A fully convolutional network used to propose candidate human bounding
    boxes, a foundational element of the MTN architecture.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: Regions of Interest, used by the head networks for human detection,
    pose estimation, and person Re-ID, generated by the RPN.
  name: RoIs
  source_chunk_index: 0
  type: generic
- description: The network used for feature extraction over an entire image, with
    deeper architectures potentially improving feature extraction but increasing training
    and inference time.
  name: Backbone network
  source_chunk_index: 0
  type: generic
- description: A lightweight backbone network used for feature extraction, evaluated
    within the FastPose framework.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deeper backbone network used for feature extraction, evaluated within
    the FastPose framework.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A technique used to enhance scale invariance by exploiting feature
    maps at different scales.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A paradigm designed to address the scale variation problem in pose
    estimation, utilizing both image and feature pyramids.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A strategy that utilizes pose information to infer occlusion states
    and improve Re-ID, employed within the MTN framework.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network architecture used as a backbone
    network for feature extraction in FastPose, evaluated for its trade-off between
    accuracy and speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone network for
    feature extraction in FastPose, evaluated for its effectiveness in extracting
    features.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Networks, used in conjunction with MobileNet-v2 and
    ResNet to enhance scale invariance in FastPose.
  name: FPN
  source_chunk_index: 0
  type: method
- description: Datasets containing images of multiple people with corresponding ID
    annotations, used for training the MTN's head network, which is based on the backbone
    and RPN.
  name: Person search datasets
  source_chunk_index: 0
  type: dataset
- description: A dataset used for pose estimation and tracking, likely containing
    videos with annotated human poses.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for object detection, segmentation, and keypoint detection,
    often used for training and evaluating pose estimation models.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset used for pose estimation, likely containing images with annotated
    human poses.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A dataset used for person re-identification, likely containing images
    or videos of people with annotated bounding boxes and IDs.
  name: PRW
  source_chunk_index: 0
  type: dataset
