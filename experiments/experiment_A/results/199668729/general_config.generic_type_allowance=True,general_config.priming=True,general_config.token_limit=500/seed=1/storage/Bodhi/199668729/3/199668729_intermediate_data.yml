entities:
- description: The process of identifying and locating human figures within an image
    or video.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating keypoints (e.g., joints) on
    a human figure within an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of identifying and matching individuals across different camera
    views or time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in pose
    estimation, exploiting both image pyramid and feature pyramid to achieve enhanced
    scale invariance capability of MTN.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A feature extraction method used in SIFP to tackle the scale variation
    problem.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: Regions of interest generated by RPN, used by the head networks in
    MTN.
  name: RoI (Region of Interest)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy that uses pose information to infer occlusion states and
    improve Re-ID.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: The process of locating specific points (keypoints) on a human body,
    crucial for pose estimation.
  name: Keypoint detection
  source_chunk_index: 0
  type: GENERIC
- description: A machine learning approach where a single model is trained to perform
    multiple tasks simultaneously, as in MTN.
  name: Multi-task learning
  source_chunk_index: 0
  type: GENERIC
- description: A fully convolutional network that proposes candidate human bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: GENERIC
- description: A unified network that performs human detection, pose estimation, and
    person Re-ID simultaneously. It builds head networks upon RoIs generated by RPN.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: The base network used for feature extraction over an entire image.
    The paper evaluates MobileNet-v2 and ResNet with FPN.
  name: Backbone network
  source_chunk_index: 0
  type: generic
- description: A backbone network used for feature extraction, evaluated in the context
    of MTN.
  name: MobileNet-v2
  source_chunk_index: 0
  type: generic
- description: A backbone network used for feature extraction, evaluated in the context
    of MTN.
  name: ResNet
  source_chunk_index: 0
  type: generic
- description: The task of identifying and locating human figures within an image.
  name: Human Detection
  source_chunk_index: 0
  type: Task
- description: The task of determining the positions of key body joints (keypoints)
    of a person in an image.
  name: Pose Estimation
  source_chunk_index: 0
  type: Task
- description: The task of re-identifying a specific person across different camera
    views or within a video sequence.
  name: Person Re-ID
  source_chunk_index: 0
  type: Task
