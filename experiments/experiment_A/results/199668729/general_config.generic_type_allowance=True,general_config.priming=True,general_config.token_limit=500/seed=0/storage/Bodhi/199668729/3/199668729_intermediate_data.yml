chunk_indices:
- 0
entities:
- description: The process of identifying and locating human figures within an image.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the pose (keypoint locations) of a person
    in an image.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in pose
    estimation, exploiting both image pyramid and feature pyramid (FPN) to achieve
    enhanced scale invariance capability of MTN.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A performance bottleneck in unified pose estimation, addressed by SIFP.
  name: Scale variation problem
  source_chunk_index: 0
  type: GENERIC
- description: Utilized by SIFP to tackle the scale variation problem and maximize
    inference speed without reducing performance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: Uses pose information from MTN to infer occlusion states and improve
    Re-ID, employed for pose tracking.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating specific points (keypoints)
    on a human body.
  name: Keypoint detection
  source_chunk_index: 0
  type: GENERIC
- description: Regions proposed by RPN, used by the head networks for human detection,
    pose estimation, and person Re-ID.
  name: RoI (Region of Interest)
  source_chunk_index: 0
  type: GENERIC
- description: The approach of training a single model to perform multiple tasks simultaneously,
    as exemplified by MTN.
  name: Multi-task learning
  source_chunk_index: 0
  type: GENERIC
- description: A unified network that performs human detection, pose estimation, and
    person Re-ID simultaneously. It builds head networks upon RoIs generated by RPN.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: Used for feature extraction over an entire image. The choice of backbone
    network impacts the trade-off between accuracy and speed.
  name: Backbone network
  source_chunk_index: 0
  type: method
- description: A type of backbone network used for feature extraction, evaluated with
    FPN.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A type of backbone network used for feature extraction, evaluated with
    FPN.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A fully convolutional network used to propose candidate human bounding
    boxes, built upon feature maps.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A method that the MTN architecture is compared to, and which the MTN's
    unified procedure is similar to.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
