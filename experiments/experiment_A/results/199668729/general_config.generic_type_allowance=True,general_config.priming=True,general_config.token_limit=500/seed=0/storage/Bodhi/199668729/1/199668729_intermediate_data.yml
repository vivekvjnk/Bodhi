entities:
- description: A pose tracking framework designed for real-time speed, performing
    pose estimation and tracking.
  name: FastPose
  source_chunk_index: 0
  type: GENERIC
- description: An end-to-end network that simultaneously performs human detection,
    pose estimation, and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating humans within an image or video
    frame.
  name: human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the positions of keypoints (e.g., joints)
    on a human body within an image or video.
  name: pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of identifying and re-identifying individuals across different
    frames or views in a video sequence.
  name: person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in unified
    pose estimation methods.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A performance bottleneck in unified top-down pose estimation methods.
  name: scale variation problem
  source_chunk_index: 0
  type: GENERIC
- description: A network architecture used in SIFP to help avoid multi-scale testing.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy that utilizes pose information to infer occlusion states
    and improve Re-ID in pose tracking.
  name: occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating specific points (keypoints)
    on a human body.
  name: keypoint detection
  source_chunk_index: 0
  type: GENERIC
- description: A machine learning approach where a single model is trained to perform
    multiple tasks simultaneously.
  name: multi-task learning
  source_chunk_index: 0
  type: GENERIC
- description: A leading method for keypoint detection on the COCO 2017 keypoint challenge,
    involving skip layer feature concatenation and an online hard keypoint mining
    step.
  name: CPN
  source_chunk_index: 0
  type: method
- description: A method that adopts Feature Pyramid Networks (FPN) with Deformable
    Convolutional Networks (DCN) as the human detector and adds deconvolutional layers
    to improve single-person pose estimation performance.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: A type of backbone network used in FastPose.
  name: ResNet
