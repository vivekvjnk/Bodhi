entities:
- description: A pose tracking framework designed for real-time speed, performing
    pose estimation and tracking.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: The process of identifying and locating keypoints (e.g., joints) in
    an image or video to determine the posture of a person or object.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The process of identifying and locating humans within an image or video.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a person across different camera views or
    frames in a video.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
- description: A network that jointly optimizes multiple tasks, including human detection,
    pose estimation, and person Re-ID.
  name: Multi-task network (MTN)
  source_chunk_index: 0
  type: method
- description: A paradigm proposed to address scale variation problems in unified
    top-down pose estimation methods.
  name: Scale-normalized image and feature pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction method that combines features from different layers
    to improve object detection and pose estimation.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy utilized to perform articulated multi-person pose tracking
    in videos, inferring occlusion states to reduce ID switches.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: A benchmark for evaluating keypoint detection methods.
  name: COCO 2017 keypoint challenge
  source_chunk_index: 0
  type: task
- description: A leading method on COCO 2017 keypoint challenge, involving skip layer
    feature concatenation and an online hard keypoint mining step.
  name: CPN
  source_chunk_index: 0
  type: method
- description: The task of tracking the poses of multiple people in a video sequence.
  name: Multi-person pose tracking
  source_chunk_index: 0
  type: task
- description: A human detector that utilizes Feature Pyramid Networks (FPN) and Deformable
    Convolutional Networks (DCN) to improve performance in human detection.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: A pose estimation method that first estimates human poses and then
    transforms the problem into solving an energy minimizing function over a spatiotemporal
    graph constructed on the detected joints.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: The objective of identifying and tracking the poses of individuals
    over time in video sequences.
  name: Pose Tracking
  source_chunk_index: 0
  type: task
- description: The objective of recognizing and re-identifying the same person across
    different camera views or within a video sequence.
  name: Human Re-identification
  source_chunk_index: 0
  type: task
