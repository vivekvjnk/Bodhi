chunk_indices:
- 0
entities:
- description: A pose tracking framework designed for real-time speed, performing
    pose estimation and tracking.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating keypoints (e.g., joints) in an
    image or video, a fundamental problem in computer vision.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The task of identifying and locating humans in an image or video.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of re-identifying individuals across different frames or views
    in a video.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
- description: A network that jointly optimizes human detection, pose estimation,
    and person Re-ID tasks.
  name: Multi-task network (MTN)
  source_chunk_index: 0
  type: method
- description: A paradigm proposed to address scale variation problems in unified
    top-down pose estimation methods.
  name: Scale-normalized image and feature pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A method used in conjunction with SIFP to alleviate scale variation
    problems.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy utilized to perform articulated multi-person pose tracking
    in videos, leveraging pose information to infer occlusion states.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: A benchmark dataset used for evaluating keypoint detection methods.
  name: COCO 2017 keypoint challenge
  source_chunk_index: 0
  type: dataset
- description: A leading method on COCO 2017 keypoint challenge, involving skip layer
    feature concatenation and an online hard keypoint mining step.
  name: CPN
  source_chunk_index: 0
  type: method
- description: The task of tracking multiple people's poses over time in a video.
  name: Multi-person pose tracking
  source_chunk_index: 0
  type: task
- description: A network architecture that jointly optimizes multiple tasks (human
    detection, pose estimation, and person Re-ID) simultaneously in an end-to-end
    manner.
  name: End-to-end Multi-task Network
  source_chunk_index: 0
  type: method
- description: A pose estimation approach where human poses are estimated first, and
    then the problem is transformed into solving an energy minimizing function over
    a spatiotemporal graph.
  name: Bottom-up Method
  source_chunk_index: 0
  type: method
- description: A method used in [28, 26] for human pose estimation, where the pose
    is estimated by first detecting joints and then grouping them to form human poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: A method used in [28, 26] to solve the pose tracking problem over a
    spatiotemporal graph constructed on the detected joints.
  name: Energy minimizing function
  source_chunk_index: 0
  type: method
- description: The method adopted by [50] as the human detector, which combines Feature
    Pyramid Networks (FPN) with Deformable Convolutional Networks (DCN).
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: Additional layers added on single-person pose estimation network in
    [50] to improve performance.
  name: Deconvolutional layers
  source_chunk_index: 0
  type: method
