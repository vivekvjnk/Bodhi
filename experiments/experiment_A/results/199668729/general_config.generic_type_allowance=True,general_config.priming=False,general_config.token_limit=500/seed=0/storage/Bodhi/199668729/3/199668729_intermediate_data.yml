chunk_indices:
- 0
entities:
- description: A deep learning model for object detection, instance segmentation,
    and pose estimation, serving as a basis for MTN.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A fully convolutional network used to propose candidate human bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A unified network for human detection, pose estimation, and person
    Re-ID.
  name: MTN
  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network architecture used as a backbone
    in MTN for feature extraction.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone in MTN for
    feature extraction.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A feature pyramid network used for feature extraction, particularly
    in the context of scale invariance and inference speed optimization within MTN.
  name: FPN (Feature Pyramid Network)
  source_chunk_index: 0
  type: method
- description: A method used in Mask R-CNN and MTN to extract features from regions
    of interest.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating humans within an image.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of estimating the pose of a person, typically by locating
    keypoints.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
- description: A method developed to enhance the scale invariance capability of MTN.
  name: SIFP (scale-normalized paradigm exploiting both image pyramid and feature
    pyramid)
  source_chunk_index: 0
  type: method
- description: The part of the network responsible for feature extraction over an
    entire image.
  name: Backbone network
  source_chunk_index: 0
  type: method
- description: The part of the network responsible for human detection, pose estimation
    and person Re-ID.
  name: Head networks
  source_chunk_index: 0
  type: method
- description: The process of refining the location of the bounding boxes.
  name: Bounding box regression
  source_chunk_index: 0
  type: method
- description: The process of classifying the objects within the bounding boxes.
  name: Bounding box classification
  source_chunk_index: 0
  type: method
- description: Datasets used for training the MTN model, specifically those containing
    images of multiple people and corresponding ID annotations. Examples include datasets
    cited in the text [51, 62].
  name: Person Search Datasets
  source_chunk_index: 0
  type: dataset
- description: The specific structure used for the pose estimation head network in
    Mask R-CNN, as mentioned in the text.
  name: Straightforward Structure
  source_chunk_index: 0
  type: method
- description: A method used in MTN to maintain the ratio of the person in the 22
    x 16 feature maps extracted by RoIAlign.
  name: Padding Operation
  source_chunk_index: 0
  type: method
- description: A strategy introduced in Sec. 3.3 to perform pose tracking, which is
    designed to handle situations where parts of the human body are hidden from view.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: Datasets composed by images within multi-person and corresponding ID
    annotation, used for training the head network for person Re-ID.
  name: Person search datasets
  source_chunk_index: 0
  type: dataset
