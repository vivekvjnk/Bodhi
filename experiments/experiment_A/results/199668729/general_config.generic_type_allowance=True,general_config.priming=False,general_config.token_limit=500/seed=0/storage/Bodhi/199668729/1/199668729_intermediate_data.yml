    Networks (DCN) as a human detector.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: A method for pose estimation that starts by detecting joints and then
    assembles them into human poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: The objective of tracking the poses of multiple people in a video,
    considering the articulation of their body parts.
  name: Articulated Multi-person Pose Tracking in Videos
  source_chunk_index: 0
  type: task
- description: The task of identifying and locating humans within an image or video
