chunk_indices:
- 0
entities:
- description: A unified network that simultaneously performs human detection, pose
    estimation, and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating humans within an image, including
    bounding box regression and classification.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating keypoints (e.g., joints) on
    a human figure within an image.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and tracking individuals across different
    camera views or within a video sequence.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A performance bottleneck in unified pose estimation, caused by the
    varying sizes of objects in an image.
  name: Scale variation problem
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem, leveraging
    Feature Pyramid Networks (FPN) to enhance scale invariance.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A network architecture used to enhance scale invariance by creating
    a pyramidal representation of features and fusing adjacent scale feature maps.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: The base network used for feature extraction over an entire image,
    with deeper architectures potentially improving feature extraction effectiveness.
  name: Backbone network
  source_chunk_index: 0
  type: GENERIC
- description: A fully convolutional network built upon feature maps to propose candidate
    human bounding boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: GENERIC
- description: A method used to extract features from regions of interest (RoIs) for
    further processing, such as classification and bounding box regression.
  name: RoIAlign
  source_chunk_index: 0
  type: GENERIC
- description: The process of refining the coordinates of bounding boxes to accurately
    locate objects in an image.
  name: Bounding box regression
  source_chunk_index: 0
  type: GENERIC
- description: A lightweight backbone network used for feature extraction.
  name: MobileNet-v2
  source_chunk_index: 0
  type: GENERIC
- description: A deep residual network used as a backbone for feature extraction.
  name: ResNet
  source_chunk_index: 0
  type: GENERIC
- description: A network that can efficiently detect objects in an image while simultaneously
    generating a high-quality segmentation mask for each instance.
  name: Mask R-CNN
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating specific points (keypoints)
    on an object, such as joints on a human body.
  name: Keypoint detection
  source_chunk_index: 0
  type: GENERIC
- description: The real-time pose estimation and tracking framework introduced in
    the paper.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluating the FastPose framework.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating the FastPose framework.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating the FastPose framework.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: Feature Pyramid Networks, a method used to create a pyramidal representation
    and fuse adjacent scale feature maps to combine features which have semantic and
    detail informations, addressing the scale variation problem.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A method that can efficiently detect objects in an image while simultaneously
    generating a high-quality segmentation mask for each instance. The MTN adopts
    a similar unified procedure as Mask R-CNN.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A backbone network architecture used for feature extraction, evaluated
    to provide a trade-off between accuracy and speed when MTN is adopted in practical
    applications.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A backbone network architecture used for feature extraction, evaluated
    to provide a trade-off between accuracy and speed when MTN is adopted in practical
    applications.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: The primary objective of the FastPose framework, involving the localization
    of human keypoints and tracking their movements across video frames.
  name: Pose Estimation and Tracking
  source_chunk_index: 0
  type: task
- description: A strategy employed by the framework to handle occlusions in multi-person
    pose tracking, enabling the system to maintain accurate pose estimation even when
    body parts are obscured.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: A method that proposes advanced and efficient data argumentation methods
    to illustrate the scale variation problem.
  name: SNIP
  source_chunk_index: 0
  type: method
- description: A method that proposes advanced and efficient data argumentation methods
    to illustrate the scale variation problem.
  name: SNIPER
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluation of the FastPose framework.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluation of the FastPose framework.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluation of the FastPose framework.
  name: SSM
  source_chunk_index: 0
  type: dataset
