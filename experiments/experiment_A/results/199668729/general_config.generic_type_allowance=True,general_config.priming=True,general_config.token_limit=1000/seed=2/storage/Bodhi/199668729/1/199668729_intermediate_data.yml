chunk_indices:
- 0
entities:
- description: A unified network that simultaneously performs human detection, pose
    estimation, and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating humans within an image, including
    bounding box classification and regression.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the keypoint coordinates of human poses within
    an image.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and re-identifying individuals across different
    camera views or time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in pose
    estimation, leveraging both image and feature pyramids.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A performance bottleneck in unified pose estimation, where the varying
    sizes of objects in an image impact detection accuracy.
  name: Scale variation problem
  source_chunk_index: 0
  type: GENERIC
- description: A network architecture used to enhance scale invariance by creating
    a pyramidal representation and fusing adjacent scale feature maps.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy used for articulated multi-person pose tracking, utilizing
    information from the MTN.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: The base network used for feature extraction over an entire image,
    with deeper architectures potentially improving feature extraction.
  name: Backbone network
  source_chunk_index: 0
  type: GENERIC
- description: A type of backbone network used for feature extraction, evaluated with
    different layer depths (e.g., 18, 50, 101).
  name: ResNet
  source_chunk_index: 0
  type: GENERIC
- description: A type of backbone network used for feature extraction, evaluated for
    its trade-off between accuracy and speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: GENERIC
- description: A fully convolutional network built upon feature maps to propose candidate
    human bounding boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: GENERIC
- description: A method used to extract features from the feature maps for each region
    of interest (RoI).
  name: RoIAlign
  source_chunk_index: 0
  type: GENERIC
- description: The process of refining the coordinates of the bounding boxes to better
    fit the objects in the image.
  name: Bounding box regression
  source_chunk_index: 0
  type: GENERIC
- description: A method that efficiently detects objects in an image while simultaneously
    generating a high-quality segmentation mask for each instance.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A method that jointly predicts the class and the coordinates of objects
    in an image.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A method that proposes advanced and efficient data argumentation methods
    to illustrate the scale variation problem.
  name: SNIP
  source_chunk_index: 0
  type: method
- description: A method that proposes advanced and efficient data argumentation methods
    to illustrate the scale variation problem.
  name: SNIPER
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluating the performance of the FastPose framework,
    specifically for human pose estimation.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating the performance of the FastPose framework,
    specifically for human pose tracking.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating the performance of the FastPose framework.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A lightweight convolutional neural network architecture used as a backbone
    network in FastPose for feature extraction, offering a trade-off between accuracy
    and speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone network in
    FastPose for feature extraction.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Networks, a method used to enhance scale invariance
    by creating a pyramidal representation and fusing adjacent scale feature maps.
  name: FPN
  source_chunk_index: 0
  type: method
- description: The process of identifying and locating specific points (keypoints)
    on a human body, such as joints (e.g., elbows, knees) or facial features. This
    is a core component of pose estimation.
  name: Keypoint Detection
  source_chunk_index: 0
  type: task
