entities:
- description: A fast and unified pose estimation and tracking framework.
  name: FastPose
  source_chunk_index: 0
  type: GENERIC
- description: The core component of FastPose, performing human detection, pose estimation,
    and person re-identification simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating human figures within an image
    or video.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the pose (keypoint locations) of a person
    in an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in unified
    pose estimation, leveraging Feature Pyramid Networks (FPN).
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A network architecture used in SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy used by FastPose for articulated multi-person pose tracking,
    utilizing the outputs of the MTN.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: Different convolutional neural network architectures (e.g., ResNet,
    MobileNet-v2) used as the base for the FastPose framework.
  name: Backbone networks
  source_chunk_index: 0
  type: GENERIC
