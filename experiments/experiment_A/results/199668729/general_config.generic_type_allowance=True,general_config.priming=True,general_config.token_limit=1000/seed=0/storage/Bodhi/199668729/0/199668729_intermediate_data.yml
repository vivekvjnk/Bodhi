entities:
- description: A pose estimation and tracking framework designed for real-time performance.
  name: FastPose
  source_chunk_index: 0
  type: GENERIC
- description: The core component of FastPose, designed to simultaneously perform
    human detection, pose estimation, and person re-identification.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating humans within an image or video.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the pose (keypoint locations) of a person
    in an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of identifying and re-identifying individuals across different
    camera views or over time.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A performance bottleneck in unified pose estimation, caused by variations
    in the size of objects in an image.
  name: Scale variation problem
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm proposed to address the scale variation problem, enhancing
    both performance and speed in pose estimation.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A network architecture used within SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy used in the pose tracking module to handle occlusions, improving
    the accuracy of tracking.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: The base convolutional neural networks used in FastPose, such as ResNet
