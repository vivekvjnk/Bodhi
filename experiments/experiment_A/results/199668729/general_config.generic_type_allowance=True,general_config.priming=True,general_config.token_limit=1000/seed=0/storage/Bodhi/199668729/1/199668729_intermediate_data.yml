entities:
- description: The process of identifying and locating humans within an image, a task
    performed by the MTN.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the pose (keypoint locations) of humans in
    an image, a task performed by the MTN.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and tracking individuals across different
    frames or views, a task performed by the MTN.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: The process of locating specific points (keypoints) on a human body,
    a core component of pose estimation.
  name: Keypoint detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of refining the location and size of bounding boxes around
    objects, used in object detection.
  name: Bounding box regression
  source_chunk_index: 0
  type: GENERIC
- description: A core component of FastPose that simultaneously performs human detection,
    pose estimation, and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A method designed to address the scale variation problem in pose estimation,
    leveraging Feature Pyramid Networks (FPN).
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A performance bottleneck in unified pose estimation, addressed by the
    SIFP method.
  name: Scale variation problem
  source_chunk_index: 0
  type: task
- description: Used within the SIFP method to enhance scale invariance by combining
    features from different scales.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: An approach used for articulated multi-person pose tracking, utilizing
    the outputs of the MTN.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: The base network used for feature extraction, with examples including
    ResNet and MobileNet-v2.
  name: Backbone network
  source_chunk_index: 0
  type: method
- description: A type of backbone network used for feature extraction in the FastPose
    framework.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A type of backbone network used for feature extraction in the FastPose
    framework.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A fully convolutional network used to propose candidate human bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A module used to extract features from regions of interest (RoIs).
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A dataset used for object detection, pose estimation, and instance
    segmentation, often used for evaluating the performance of computer vision models.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset for human pose estimation and tracking in videos.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating human pose estimation methods.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A metric used to evaluate the accuracy of object detection and pose
    estimation models, representing the mean Average Precision across different object
    classes or keypoints.
  name: mAP
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the performance of multi-object tracking
    algorithms, measuring the accuracy of object detection and tracking.
  name: MOTA
  source_chunk_index: 0
  type: generic
- description: The task of identifying and locating objects within an image, often
    involving bounding box regression and classification.
  name: Object Detection
  source_chunk_index: 0
  type: task
- description: A method used to predict the coordinates of bounding boxes around objects
    in an image.
  name: Bounding Box Regression
  source_chunk_index: 0
  type: method
- description: The process of assigning a category or label to an object or region
    within an image.
  name: Classification
  source_chunk_index: 0
  type: task
- description: A method that efficiently detects objects in an image while simultaneously
    generating a high-quality segmentation mask for each instance. It is used as a
    point of reference for the MTN and SIFP methods.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A technique used in object detection to increase the resolution of
    the feature map, addressing the difficulty of detecting small objects caused by
    large strides of deep CNNs.
  name: Dilated/Atrous Convolutions
  source_chunk_index: 0
  type: method
- description: A backbone network used for feature extraction, with specified depths
    of 18, 50, and 101 layers.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Network, used with a depth of 18, 50 and 101 layers,
    to enhance scale invariance.
  name: FPN
  source_chunk_index: 0
  type: method
- description: "A technique used to maintain the ratio of the person in the 22 \xD7\
    \ 16 feature maps extracted by RoIAlign."
  name: Padding operation
  source_chunk_index: 0
  type: method
- description: "A method used to extract 14 \xD7 14 feature maps of 512 channels for\
    \ each proposal in Mask R-CNN and 22 \xD7 16 feature maps in MTN."
  name: RoIAlign
  source_chunk_index: 0
  type: method
