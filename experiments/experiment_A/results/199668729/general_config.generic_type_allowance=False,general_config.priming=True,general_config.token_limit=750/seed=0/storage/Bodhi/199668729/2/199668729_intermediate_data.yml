    for feature extraction. It is evaluated in the FastPose framework to provide a
    trade-off between accuracy and speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: Mean Average Precision, a metric used to evaluate the performance of
    the FastPose framework, particularly for pose estimation and human detection tasks.
  name: mAP
  source_chunk_index: 0
  type: task
- description: Multiple Object Tracking Accuracy, a metric used to evaluate the performance
    of the FastPose framework, specifically for pose tracking tasks.
  name: MOTA
  source_chunk_index: 0
  type: task
