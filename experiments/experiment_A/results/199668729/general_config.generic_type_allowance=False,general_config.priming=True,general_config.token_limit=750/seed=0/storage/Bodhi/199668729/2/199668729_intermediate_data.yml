entities:
- description: The process of identifying the pose of a person in an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The process of identifying the presence and location of humans in an
    image or video.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of identifying a specific person across different camera views
    or time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: task
- description: A neural network architecture designed to perform multiple tasks simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A technique for handling scale variations in images and features.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction technique that builds a feature pyramid from a
    single input image.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy that accounts for occlusions in the scene.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: A neural network that proposes potential object regions in an image.
  name: Region Proposal Networks (RPN)
  source_chunk_index: 0
  type: method
- description: A method for aligning regions of interest (RoIs) for feature extraction.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: The process of tracking the pose of a person over time.
  name: Pose tracking
  source_chunk_index: 0
  type: method
