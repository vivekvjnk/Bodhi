  name: FPN
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone network for
    feature extraction in the FastPose framework.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network architecture used as a backbone
    network for feature extraction in the FastPose framework.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A type of convolution that increases the receptive field of the network
    without increasing the number of parameters, used to address the problem of small
    object detection.
  name: Dilated/Atrous Convolutions
  source_chunk_index: 0
  type: method
