    for single-person pose estimation.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: An extension of Faster R-CNN that efficiently detects objects in an
    image while simultaneously generating a high-quality segmentation mask for each
    instance. The FastPose framework adopts a similar unified procedure as Mask R-CNN.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: Features used for person re-identification, which are predicted by
    the multi-task network.
  name: Re-ID features
  source_chunk_index: 0
  type: method
- description: A machine learning approach where a single model is trained to perform
    multiple tasks simultaneously, such as human detection, pose estimation, and person
    re-identification.
  name: Multi-task learning
  source_chunk_index: 0
  type: method
- description: A dataset used for keypoint detection, where CPN is a leading method.
