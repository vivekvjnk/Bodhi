entities:
- description: The task of estimating the pose of a person in an image or video.
  name: pose estimation
  source_chunk_index: 0
  type: task
- description: The task of detecting humans in an image or video.
  name: human detection
  source_chunk_index: 0
  type: task
- description: The task of identifying a person across different camera views or time
    instances.
  name: person Re-identification (Re-ID)
  source_chunk_index: 0
  type: task
- description: A neural network architecture designed to perform multiple tasks simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A method for creating image and feature pyramids that are scale-normalized.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction method that builds feature pyramids from a single
    input image.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy that considers and handles occlusions in the scene.
  name: occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: A neural network that proposes regions of interest in an image.
  name: Region Proposal Networks (RPN)
  source_chunk_index: 0
  type: method
- description: A method for aligning regions of interest for feature extraction.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A fast pose estimation algorithm.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: A dataset for human pose estimation and tracking.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset for object detection, segmentation, and keypoint detection.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset for human pose estimation.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A dataset for person re-identification.
  name: PRW
  source_chunk_index: 0
  type: dataset
- description: A deep residual network used as a backbone for feature extraction in
    the FastPose framework. The paper mentions ResNet with depths of 18, 50, and 101
    layers.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network used as a backbone for feature
    extraction in the FastPose framework. It is evaluated for its trade-off between
    accuracy and speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A method mentioned as the basis for the architecture of the proposed
    network, used for human detection, pose estimation, and person Re-ID.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Networks, used in the Scale-normalized Image and Feature
    Pyramid (SIFP) paradigm to enhance scale invariance and improve inference speed.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A dataset utilized for training the pose estimation task.
  name: MPII
  source_chunk_index: 0
  type: dataset
- description: Mean Average Precision, a metric used to evaluate the accuracy of object
    detection and pose estimation tasks, specifically on the PoseTrack and COCO datasets
    in this context.
  name: mAP
  source_chunk_index: 0
  type: task
- description: Multiple Object Tracking Accuracy, a metric used to evaluate the performance
    of multi-object tracking algorithms, specifically on the PoseTrack dataset in
    this context.
  name: MOTA
  source_chunk_index: 0
  type: task
- description: A dataset used for training and evaluating pose estimation and tracking
    methods, used to assess the performance of FastPose.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
