entities:
- description: The process of identifying the pose of a person in an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The process of identifying and locating humans in an image or video.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a specific person across different camera
    views or time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: task
- description: A neural network architecture designed to perform multiple tasks simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A technique for handling scale variations in images and features.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A feature extraction technique that builds a feature pyramid from a
    single input image.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy that accounts for occlusions when performing tasks like
    pose estimation or human detection.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: The process of identifying and locating specific keypoints on a person's
    body.
  name: Keypoint detection
  source_chunk_index: 0
  type: method
- description: A dataset for human pose estimation and tracking.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset for object detection, segmentation, and keypoint detection.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A backbone network used for feature extraction, evaluated for its trade-off
    between accuracy and speed in the MTN architecture.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A backbone network used for feature extraction, evaluated for its trade-off
    between accuracy and speed in the MTN architecture.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A Feature Pyramid Network used in conjunction with MobileNet-v2 and
    ResNet to enhance scale invariance within the MTN, and to provide a trade-off
    between accuracy and speed.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A method used in the head network of the Multi-Task Network (MTN) to
    extract features from regions of interest (RoIs). It is used to maintain the ratio
    of the person in the feature maps.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating humans within an image, often
    involving bounding-box classification and regression.
  name: Human Detection
  source_chunk_index: 0
  type: task
