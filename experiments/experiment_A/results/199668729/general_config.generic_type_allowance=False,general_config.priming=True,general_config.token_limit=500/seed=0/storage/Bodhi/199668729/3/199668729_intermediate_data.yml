- description: A lightweight convolutional neural network architecture used as a backbone
    network for feature extraction in FastPose.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone network for
    feature extraction in FastPose.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A method that performs object detection, instance segmentation, and
    is used as a basis for the MTN architecture. It has a similar unified procedure
    to MTN, using a Region Proposal Network (RPN) and RoIs.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: The fundamental convolutional neural network architecture used for
    feature extraction in the Multi-Task Network (MTN). The paper evaluates different
    backbone networks, including ResNet and MobileNet-v2, to assess their impact on
    performance and speed.
  name: Backbone Network
  source_chunk_index: 0
  type: method
