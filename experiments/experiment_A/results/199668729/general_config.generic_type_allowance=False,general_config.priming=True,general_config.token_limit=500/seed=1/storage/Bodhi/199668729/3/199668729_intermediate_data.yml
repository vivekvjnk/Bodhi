chunk_indices:
- 0
entities:
- description: A real-time pose estimation and tracking framework.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: The task of identifying the locations of keypoints (e.g., joints) on
    human figures within images or videos.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The task of identifying and locating human figures within images or
    videos.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: The task of identifying and tracking individuals across different camera
    views or over time.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: task
- description: A neural network architecture designed to simultaneously perform human
    detection, pose estimation, and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: method
- description: A paradigm designed to address the scale variation problem in pose
    estimation, utilizing Feature Pyramid Networks (FPN).
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: method
- description: A method used within SIFP to handle scale variations in images.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A strategy used for pose tracking, leveraging pose information to infer
    occlusion states and improve Re-ID.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: method
- description: The base convolutional neural network architectures used in FastPose,
    such as ResNet and MobileNet-v2.
  name: Backbone networks
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating pose estimation models.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset used for training and evaluating pose estimation and tracking
    models.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for training and evaluating pose estimation models.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A backbone network used for feature extraction, evaluated for its trade-off
    between accuracy and speed when used in the Multi-Task Network (MTN).
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A backbone network used for feature extraction, evaluated for its trade-off
    between accuracy and speed when used in the Multi-Task Network (MTN).
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A method used within the Scale-normalized Image and Feature Pyramid
    (SIFP) to enhance scale invariance and maximize inference speed without reducing
    performance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: method
- description: A fully convolutional network used to propose candidate human bounding
    boxes, built upon feature maps.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: Regions of interest generated by the RPN, used as input for the head
    networks in the MTN for tasks like classification, bounding-box regression, pose
    estimation, and person Re-ID.
  name: RoI (Region of Interest)
  source_chunk_index: 0
  type: method
- description: A deep learning model for object detection, instance segmentation,
    and pose estimation, serving as a point of reference for the proposed MTN.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A layer used in Mask R-CNN to extract features from Regions of Interest
    (RoIs) by aligning the extracted features with the input image, improving the
    accuracy of object detection and segmentation.
  name: RoIAlign
  source_chunk_index: 0
  type: method
