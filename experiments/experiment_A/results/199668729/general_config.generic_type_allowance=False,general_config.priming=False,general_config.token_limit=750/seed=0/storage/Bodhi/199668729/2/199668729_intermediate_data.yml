entities:
- description: A unified network for human detection, pose estimation, and person
    Re-ID.
  name: MTN
  source_chunk_index: 0
  type: method
- description: The task of estimating human pose, i.e., the location of keypoints
    on a human body.
  name: Pose estimation
  source_chunk_index: 0
  type: task
