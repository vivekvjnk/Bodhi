entities:
- description: The computer vision task of determining the position and orientation
    of a person's body parts in an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: A leading method for keypoint detection, involving skip layer feature
    concatenation and online hard keypoint mining.
  name: CPN
  source_chunk_index: 0
  type: method
- description: A benchmark for evaluating keypoint detection methods.
  name: COCO 2017 keypoint challenge
  source_chunk_index: 0
  type: task
- description: A method that uses FPN-DCN as the human detector and adds deconvolutional
    layers for single-person pose estimation.
  name: FPN-DCN
  source_chunk_index: 0
  type: method
- description: The task of tracking the poses of multiple people in a video sequence.
  name: Multi-person pose tracking
  source_chunk_index: 0
  type: task
- description: A model used to predict temporal flow fields to formulate a similarity
    measure of detected joints.
  name: Temporal Flow Fields (TTF)
  source_chunk_index: 0
  type: method
- description: An extension of R-CNN used for object detection and instance segmentation,
    also applied to pose estimation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A learning approach where a single model is trained to perform multiple
    related tasks simultaneously.
  name: Multi-task learning
  source_chunk_index: 0
  type: method
- description: A method that jointly predicts the class and coordinates of objects
    in an image.
  name: Fast R-CNN
  source_chunk_index: 0
  type: method
- description: An improved version of Fast R-CNN.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating objects within an image.
  name: Object detection
  source_chunk_index: 0
  type: task
- description: The task of identifying and locating faces within an image.
  name: Face detection
  source_chunk_index: 0
  type: task
- description: A technique used in object detectors to increase the resolution of
    feature maps, addressing the challenge of small object detection.
  name: Dilated/atrous convolutions
  source_chunk_index: 0
  type: method
- description: A method that proposes a pyramidal representation and fuses adjacent
    scale feature maps to combine features with semantic and detail information.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A network that predicts bounding boxes, keypoint coordinates, and Re-ID
    features in a scene.
  name: MTN (Multi-task network)
  source_chunk_index: 0
  type: method
- description: A paradigm exploited to alleviate the scale variation problem of MTN.
  name: SIFP (Scale-normalized image pyramid and feature pyramid)
  source_chunk_index: 0
  type: method
- description: A fully convolutional network used to propose candidate human bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating specific key points (e.g., joints)
    on a human body within an image or video.
  name: Keypoint Detection
  source_chunk_index: 0
  type: task
- description: The task of tracking the pose of a person over a sequence of video
    frames.
  name: Pose Tracking
  source_chunk_index: 0
  type: task
- description: A method for pose estimation that starts by detecting individual body
    parts or joints and then assembles them to form full human poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: A method for solving the matching problem in pose estimation where
    the best match is selected at each step without considering the global impact
    of the decision.
  name: Greedy fashion
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating objects within an image or video.
  name: Object Detection
  source_chunk_index: 0
  type: task
- description: A method used to measure the similarity between poses based on the
    flow of pose information.
  name: Flow-based Pose Similarity
  source_chunk_index: 0
  type: method
- description: A method used to eliminate redundant pose detections by suppressing
    those with overlapping pose flows.
  name: Pose Flow Non Maximum Suppression (NMS)
  source_chunk_index: 0
  type: method
