chunk_indices:
- 0
entities:
- description: A unified network for human detection, pose estimation, and person
    Re-ID.
  name: MTN
  source_chunk_index: 0
  type: method
- description: The task of estimating human pose, i.e., the location of keypoints
    on a human body.
  name: Pose estimation
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
- description: The task of identifying and locating humans in images or videos.
  name: Human detection
  source_chunk_index: 0
  type: task
- description: A lightweight convolutional neural network architecture used as a backbone
    in FastPose.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone for feature
    extraction.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Network, used for enhancing scale invariance.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A scale-normalized paradigm exploiting both image pyramid and feature
    pyramid to achieve enhanced scale invariance capability of MTN.
  name: SIFP
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating pose estimation and pose
    tracking tasks.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset utilized for training pose estimation tasks.
  name: MPII
  source_chunk_index: 0
  type: dataset
- description: A person search dataset used for training person Re-ID tasks.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A person search dataset used for training person Re-ID tasks.
  name: PRW
  source_chunk_index: 0
  type: dataset
- description: A convolutional neural network architecture used as a reference for
    the proposed network.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluating pose estimation tasks.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: The framework proposed in the paper, which is evaluated for pose estimation
    and pose tracking tasks. It utilizes a backbone network, SIFP, and an occlusion-aware
    strategy.
  name: FastPose
  source_chunk_index: 0
  type: method
- description: A specific instantiation of the ResNet architecture with 18 layers,
    used as a backbone network for feature extraction.
  name: ResNet-18
  source_chunk_index: 0
  type: method
- description: A specific instantiation of the ResNet architecture with 50 layers,
    used as a backbone network for feature extraction.
  name: ResNet-50
  source_chunk_index: 0
  type: method
- description: A specific instantiation of the ResNet architecture with 101 layers,
    used as a backbone network for feature extraction.
  name: ResNet-101
  source_chunk_index: 0
  type: method
- description: A specific instantiation of the MobileNet architecture, used as a backbone
    network for feature extraction.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: The specific layer depths used for the backbone networks, including
    18, 50, and 101 layers for ResNet and the architecture of MobileNet-v2.
  name: Backbone Network Layer Depths
  source_chunk_index: 0
  type: method
- description: The number of convolutional layers in the pose estimation and Re-ID
    head networks, which varies depending on the backbone network used (e.g., 8 and
    4 layers for ResNet-50/101, and 4 and 2 layers for ResNet-18/MobileNet-v2).
  name: Head Network Layer Depths
  source_chunk_index: 0
  type: method
- description: A strategy employed within the FastPose framework to handle occlusions
    in pose tracking, enabling the system to maintain accurate pose estimation even
    when parts of the human body are obscured.
  name: Occlusion-aware Strategy
  source_chunk_index: 0
  type: method
