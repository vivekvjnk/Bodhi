chunk_indices:
- 0
entities:
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-identification (Re-ID).
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: METHOD
- description: The process of identifying and locating human figures within an image
    or video frame.
  name: Human detection
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and locating keypoints (e.g., joints) on
    a human figure within an image or video frame.
  name: Pose estimation
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and tracking individuals across different
    camera views or within a video sequence.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: TASK
- description: A paradigm designed to address the scale variation problem in pose
    estimation, utilizing Feature Pyramid Networks (FPN) to enhance scale invariance.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: METHOD
- description: A network architecture used in SIFP to enhance scale invariance by
    creating a feature pyramid.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: METHOD
- description: A strategy for pose tracking that utilizes pose information to infer
    occlusion states and improve Re-ID performance.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: METHOD
- description: A framework that can efficiently detect objects in an image while simultaneously
    generating a high-quality segmentation mask for each instance.
  name: Mask R-CNN
  source_chunk_index: 0
  type: METHOD
- description: A performance bottleneck in unified pose estimation, caused by the
    varying sizes of objects in an image.
  name: Scale variation problem
  source_chunk_index: 0
  type: task
- description: A fully convolutional network used to propose candidate human bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: The base convolutional neural networks used in the FastPose framework,
    such as ResNet and MobileNet-v2.
  name: Backbone networks
  source_chunk_index: 0
  type: method
- description: A machine learning approach where a single model is trained to perform
    multiple tasks simultaneously.
  name: Multi-task learning
  source_chunk_index: 0
  type: method
- description: A dataset used for object detection, segmentation, and keypoint detection,
    relevant for evaluating pose estimation performance.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A method for object detection and instance segmentation, used as a
    reference and architectural inspiration for the MTN in FastPose.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Networks, a method used to enhance scale invariance
    by creating a feature pyramid from different layers of a convolutional neural
    network.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A dataset used for keypoint challenges, relevant to pose estimation.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A method that efficiently detects objects and generates segmentation
    masks, mentioned for its architectural similarity to the MTN.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Networks, used to enhance scale invariance.
  name: FPN
  source_chunk_index: 0
  type: method
