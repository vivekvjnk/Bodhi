entities:
- description: The real-time pose estimation and tracking framework introduced in
    the paper.
  name: FastPose
  source_chunk_index: 0
  type: GENERIC
- description: The core network architecture of FastPose, performing human detection,
    pose estimation, and person Re-ID simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: A task performed by the MTN to identify and locate humans in images.
  name: Human Detection
  source_chunk_index: 0
  type: GENERIC
- description: A task performed by the MTN to estimate the pose (keypoint locations)
    of detected humans.
  name: Pose Estimation
  source_chunk_index: 0
  type: GENERIC
- description: A task performed by the MTN to identify and track individuals across
    different frames or views.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in pose
    estimation, utilizing Feature Pyramid Networks (FPN).
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: Used within SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy used for pose tracking, leveraging pose information to infer
    occlusion states and improve Re-ID performance.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: Used in the MTN architecture, similar to Mask R-CNN.
  name: Region Proposal Networks (RPN)
  source_chunk_index: 0
  type: GENERIC
- description: Used in the MTN architecture, similar to Mask R-CNN.
  name: RoIAlign
  source_chunk_index: 0
  type: GENERIC
- description: The base convolutional neural network architectures used for feature
    extraction, including ResNet and MobileNet-v2.
  name: Backbone networks
  source_chunk_index: 0
  type: GENERIC
- description: A type of backbone network used in FastPose, with different layer depths
    (e.g., 18, 50, 101).
  name: ResNet
  source_chunk_index: 0
  type: GENERIC
- description: A type of backbone network used in FastPose.
  name: MobileNet-v2
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for training and evaluating FastPose.
  name: PoseTrack
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for evaluating FastPose.
  name: COCO
  source_chunk_index: 0
  type: GENERIC
- description: A person search dataset used for training person Re-ID task.
  name: SSM
  source_chunk_index: 0
  type: GENERIC
- description: A person search dataset used for training person Re-ID task.
  name: PRW
  source_chunk_index: 0
  type: GENERIC
- description: Mean Average Precision, a metric used to evaluate the accuracy of object
    detection and pose estimation models.
  name: mAP
  source_chunk_index: 0
  type: generic
- description: Multiple Object Tracking Accuracy, a metric used to evaluate the performance
    of multi-object tracking algorithms.
  name: MOTA
  source_chunk_index: 0
  type: generic
- description: A dataset used for pose estimation and tracking, used to evaluate the
    performance of FastPose.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A lightweight convolutional neural network architecture used as a backbone
    in FastPose for feature extraction, providing a trade-off between accuracy and
    speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone in FastPose
    for feature extraction, with different layer depths (18, 50, and 101) to evaluate
    the impact of depth on performance.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Feature Pyramid Networks, used in conjunction with the backbone networks
    (ResNet, MobileNet-v2) to enhance scale invariance in FastPose by creating a feature
    pyramid.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating pose estimation and tracking
    tasks in FastPose.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating pose estimation tasks in FastPose, specifically
    the 5k validation images (minival).
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A person search dataset used for training the person Re-ID task within
