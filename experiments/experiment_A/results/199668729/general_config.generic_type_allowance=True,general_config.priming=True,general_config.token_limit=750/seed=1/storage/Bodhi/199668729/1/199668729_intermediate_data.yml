entities:
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: METHOD
- description: The process of estimating the pose of a human in an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: TASK
- description: The process of identifying and locating humans within an image or video.
  name: Human detection
  source_chunk_index: 0
  type: TASK
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: TASK
- description: A paradigm designed to address the scale variation problem.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: METHOD
- description: Used within SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: METHOD
- description: The process of identifying and locating specific points (keypoints)
    on a human body.
  name: Keypoint detection
  source_chunk_index: 0
  type: TASK
- description: The process of tracking the pose of a human over a sequence of video
    frames.
  name: Pose tracking
  source_chunk_index: 0
  type: TASK
- description: A framework that the MTN architecture is built upon, used for object
    detection and instance segmentation.
  name: Mask R-CNN
  source_chunk_index: 0
  type: METHOD
- description: A performance bottleneck in unified pose estimation, caused by variations
    in the size of objects in an image.
  name: Scale variation problem
  source_chunk_index: 0
  type: generic
- description: A fully convolutional network used to propose candidate human bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: The base convolutional neural networks used in the FastPose framework
    (e.g., ResNet, MobileNet-v2).
  name: Backbone networks
  source_chunk_index: 0
  type: method
- description: A dataset used for keypoint challenges and evaluating pose estimation
    methods.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A dataset used for multi-person pose tracking in videos.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating pose estimation methods.
  name: SSM
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating person re-identification (Re-ID) methods,
    which is relevant to pose tracking.
  name: PRW
  source_chunk_index: 0
  type: dataset
- description: A dataset used for keypoint challenges, mentioned in the context of
    pose estimation.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A method that can efficiently detect objects in an image while simultaneously
    generating a high-quality segmentation mask for each instance. The MTN architecture
    is built upon Region Proposal Networks (RPN) and RoIAlign, similar to Mask R-CNN.
  name: Mask R-CNN
  source_chunk_index: 0
  type: method
- description: A method that proposes a pyramidal representation and fuses adjacent
    scale feature maps to combine features which have semantic and detail informations.
  name: FPN
  source_chunk_index: 0
  type: method
- description: A pose estimation approach that starts from the joints and then assembles
    them to form human poses.
  name: Bottom-up method
  source_chunk_index: 0
  type: method
- description: Pose estimation methods that first detect humans and then estimate
    their poses.
  name: Top-down pose estimation methods
  source_chunk_index: 0
  type: method
- description: A problem formulation used in pose tracking to find the best matches
    between detected poses across frames.
  name: Bipartite graph matching problem
  source_chunk_index: 0
  type: task
- description: A method for solving the matching problem, where the best match is
    selected at each step without considering future steps.
  name: Greedy fashion
  source_chunk_index: 0
  type: method
- description: A technique used to eliminate redundant pose detections by suppressing
    those with high overlap.
  name: Pose flow non maximum suppression (NMS)
  source_chunk_index: 0
  type: method
- description: A machine learning approach where a single model is trained to perform
    multiple tasks simultaneously.
  name: Multi-task learning
  source_chunk_index: 0
  type: method
