  name: COCO
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating specific points (keypoints)
    on a human body.
  name: Keypoint detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of tracking the pose of a person over time in a video sequence.
  name: Pose tracking
  source_chunk_index: 0
  type: GENERIC
- description: A person search dataset used for training person Re-ID task.
  name: SSM
  source_chunk_index: 0
  type: dataset
