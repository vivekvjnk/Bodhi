    tracking.
  name: mAP
  source_chunk_index: 0
  type: generic
- description: A metric used for evaluating the performance of pose tracking.
  name: MOTA
  source_chunk_index: 0
  type: generic
- description: The process of identifying and locating specific points (keypoints)
    on a human body, such as joints, used for pose estimation.
  name: Keypoint Detection
  source_chunk_index: 0
  type: method
- description: The process of extracting features from a person's appearance to enable
    person re-identification, which helps in tracking individuals across different
    frames or camera views.
  name: Re-ID Feature Extraction
  source_chunk_index: 0
  type: method
- description: The process of identifying and locating human figures within an image
    or video frame, a core component of the MTN architecture.
  name: Human Detection
  source_chunk_index: 0
  type: task
- description: The task of re-identifying a specific person across different camera
    views or within the same view over time, a key component of the MTN architecture.
  name: Person Re-ID
  source_chunk_index: 0
  type: task
- description: A lightweight convolutional neural network architecture used as a backbone
    in FastPose for feature extraction, offering a trade-off between accuracy and
    speed.
  name: MobileNet-v2
  source_chunk_index: 0
  type: method
- description: A deep residual network architecture used as a backbone in FastPose
    for feature extraction, with varying depths (18, 50, 101 layers) to balance accuracy
    and computational cost.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A method used in the pose estimation head network to extract feature
    maps for each region of interest (RoI), enabling keypoint localization.
  name: RoIAlign
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating the pose estimation and
    tracking tasks in FastPose.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
