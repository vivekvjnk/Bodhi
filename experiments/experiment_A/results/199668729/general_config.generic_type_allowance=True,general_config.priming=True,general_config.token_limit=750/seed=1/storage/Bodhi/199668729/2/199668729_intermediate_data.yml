entities:
- description: Real-time pose estimation and tracking framework.
  name: FastPose
  source_chunk_index: 0
  type: GENERIC
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-ID.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating humans within an image or video.
  name: Human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the pose (keypoint locations) of a person
    in an image or video.
  name: Pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of re-identifying a person across different camera views or
    time instances.
  name: Person Re-ID (re-identification)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in unified
    pose estimation, utilizing Feature Pyramid Networks (FPN).
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: Used within SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy for pose tracking that utilizes pose information to infer
    occlusion states and improve Re-ID.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: Used in the MTN architecture, similar to Mask R-CNN.
  name: Region Proposal Networks (RPN)
  source_chunk_index: 0
  type: GENERIC
- description: Used in the MTN architecture, similar to Mask R-CNN.
  name: RoIAlign
  source_chunk_index: 0
  type: GENERIC
