entities:
- description: A pose estimation and tracking framework designed for real-time speed.
  name: FastPose
  source_chunk_index: 0
  type: GENERIC
- description: A network that simultaneously performs human detection, pose estimation,
    and person Re-identification (Re-ID).
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: The process of identifying and locating humans within an image or video.
  name: human detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of estimating the positions of keypoints (e.g., joints)
    on a human body within an image or video.
  name: pose estimation
  source_chunk_index: 0
  type: GENERIC
- description: The task of identifying and re-identifying individuals across different
    camera views or time instances.
  name: person Re-identification (Re-ID)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in pose
    estimation, enhancing both performance and speed.
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: A performance bottleneck in unified pose estimation, caused by variations
    in the size of objects in an image.
  name: scale variation problem
  source_chunk_index: 0
  type: GENERIC
- description: A network architecture used within SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy used in pose tracking that utilizes pose information to
    infer occlusion states and improve Re-ID performance.
  name: occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: The process of tracking the movement of human poses over time in a
    video sequence.
  name: pose tracking
  source_chunk_index: 0
  type: GENERIC
