- description: Mean Average Precision, a metric used to evaluate the accuracy of object
    detection and pose estimation tasks.
  name: mAP
  source_chunk_index: 0
  type: generic
- description: Multiple Object Tracking Accuracy, a metric used to evaluate the performance
    of multi-object tracking algorithms.
  name: MOTA
  source_chunk_index: 0
  type: generic
- description: A dataset used for pose estimation and tracking, used for evaluation
    in the paper.
  name: PoseTrack
  source_chunk_index: 0
  type: dataset
- description: A deep residual network architecture used as a backbone for feature
    extraction in FastPose, with variants of different depths (18, 50, and 101 layers)
    evaluated.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: A lightweight convolutional neural network architecture used as a backbone
    for feature extraction in FastPose, offering a trade-off between accuracy and
