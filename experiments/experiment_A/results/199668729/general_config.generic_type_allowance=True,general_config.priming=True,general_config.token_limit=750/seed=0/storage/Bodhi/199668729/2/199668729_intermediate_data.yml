entities:
- description: The real-time pose estimation and tracking framework introduced in
    the paper.
  name: FastPose
  source_chunk_index: 0
  type: GENERIC
- description: The core network architecture of FastPose, performing human detection,
    pose estimation, and person Re-ID simultaneously.
  name: Multi-Task Network (MTN)
  source_chunk_index: 0
  type: GENERIC
- description: A task performed by the MTN to identify and locate humans in images.
  name: Human Detection
  source_chunk_index: 0
  type: GENERIC
- description: A task performed by the MTN to estimate the pose (keypoint locations)
    of detected humans.
  name: Pose Estimation
  source_chunk_index: 0
  type: GENERIC
- description: A task performed by the MTN to identify and track individuals across
    different frames or views.
  name: Person Re-identification (Re-ID)
  source_chunk_index: 0
  type: GENERIC
- description: A paradigm designed to address the scale variation problem in pose
    estimation, utilizing Feature Pyramid Networks (FPN).
  name: Scale-normalized Image and Feature Pyramid (SIFP)
  source_chunk_index: 0
  type: GENERIC
- description: Used within SIFP to enhance scale invariance.
  name: Feature Pyramid Networks (FPN)
  source_chunk_index: 0
  type: GENERIC
- description: A strategy used for pose tracking, leveraging pose information to infer
    occlusion states and improve Re-ID performance.
  name: Occlusion-aware strategy
  source_chunk_index: 0
  type: GENERIC
- description: Used in the MTN architecture, similar to Mask R-CNN.
  name: Region Proposal Networks (RPN)
  source_chunk_index: 0
  type: GENERIC
- description: Used in the MTN architecture, similar to Mask R-CNN.
  name: RoIAlign
  source_chunk_index: 0
  type: GENERIC
- description: The base convolutional neural network architectures used for feature
    extraction, including ResNet and MobileNet-v2.
  name: Backbone networks
  source_chunk_index: 0
  type: GENERIC
- description: A type of backbone network used in FastPose, with different layer depths
    (e.g., 18, 50, 101).
  name: ResNet
  source_chunk_index: 0
  type: GENERIC
- description: A type of backbone network used in FastPose.
  name: MobileNet-v2
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for training and evaluating FastPose.
  name: PoseTrack
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for evaluating FastPose.
  name: COCO
