  name: Image Captioning
  source_chunk_index: 0
  type: task
- description: A neural network model used for learning word embeddings from co-occurrences
    in local context windows.
  name: Continuous Bag-of-Words (CBOW)
  source_chunk_index: 0
  type: method
- description: A neural network model used for learning word embeddings from co-occurrences
    in local context windows.
  name: Skip-Gram models
  source_chunk_index: 0
  type: method
- description: A lexical database of English that groups words into sets of synonyms
    called synsets, providing a good starting point for visual concept annotations.
  name: WordNet
  source_chunk_index: 0
  type: dataset
- description: An approach to visually enhance existing word embeddings by training
    an autoencoder on pre-trained word embeddings and matching intermediate representations
    to visual features extracted from a convolutional network trained on ImageNet.
  name: ViEW
  source_chunk_index: 0
  type: method
- description: A specific type of co-occurrence calculated using ImageNet annotations
    augmented with WordNet hypernyms. It involves identifying the co-occurrences between
    objects and their hypernyms (more general terms).
  name: Object-Hypernym co-occurrences
  source_chunk_index: 0
  type: method
- description: A specific type of co-occurrence computed from VisualGenome's object
    and attribute annotations. It involves identifying the co-occurrences between
    objects and their attributes.
  name: Object-Attribute co-occurrences
  source_chunk_index: 0
  type: method
- description: Word embeddings from Visual Cooccurrences, learned by concatenating
    GloVe-like embeddings trained separately for each co-occurrence type via a logbilinear
    model.
  name: ViCo
  source_chunk_index: 0
  type: method
