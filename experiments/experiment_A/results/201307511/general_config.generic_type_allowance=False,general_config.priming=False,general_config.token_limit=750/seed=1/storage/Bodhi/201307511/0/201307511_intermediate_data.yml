entities:
- description: Word embeddings from Visual Cooccurrences, a method to learn word embeddings
    from multiple types of co-occurrences.
  name: ViCo
  source_chunk_index: 0
  type: method
- description: A text-only word embedding model, used as a baseline and compared against
    ViCo.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: A large-scale visual database used for training and evaluation, providing
    annotations and visual data.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: A large-scale, textually-annotated visual database used for training
    and evaluation, providing object and attribute annotations.
  name: VisualGenome
  source_chunk_index: 0
  type: dataset
- description: A word embedding model, similar to GloVe, typically learned from large-scale
    text corpora.
  name: word2vec
  source_chunk_index: 0
  type: method
- description: An evaluation setting used to assess the performance of ViCo and other
    word embedding models.
  name: unsupervised clustering
  source_chunk_index: 0
