    word embedding models.
  name: zero-shot-like visual generalization
  source_chunk_index: 0
  type: task
- description: A method that incorporates image representations into word embeddings,
    using abstract scenes to learn visual relatedness.
  name: vis-w2v
  source_chunk_index: 0
  type: method
- description: A vision-language task used to evaluate the performance of word embeddings.
  name: Caption-Image Retrieval
  source_chunk_index: 0
  type: task
