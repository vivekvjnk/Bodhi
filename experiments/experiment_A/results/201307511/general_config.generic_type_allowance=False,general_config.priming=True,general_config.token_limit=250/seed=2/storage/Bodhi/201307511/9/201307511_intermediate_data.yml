entities:
- description: A method for learning word embeddings from visual co-occurrences in
    textually-annotated visual databases.
  name: ViCo
  source_chunk_index: 0
  type: method
- description: A textually-annotated visual database used for training and evaluating
    ViCo.
  name: VisualGenome
  source_chunk_index: 0
  type: dataset
- description: A large-scale image database used in conjunction with ViCo.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: A task used to evaluate ViCo's performance.
  name: unsupervised clustering
  source_chunk_index: 0
  type: task
- description: A task used to evaluate ViCo's performance.
  name: supervised partitioning
  source_chunk_index: 0
  type: task
- description: A task used to evaluate ViCo's performance, representing a zero-shot-like
    visual generalization task.
  name: zero-shot classification
  source_chunk_index: 0
  type: task
- description: Text-based representations of words, enhanced by ViCo using visual
    information.
  name: word embeddings
  source_chunk_index: 0
  type: method
- description: A text-based word embedding method, which ViCo aims to enhance.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: A vision-language task used to evaluate ViCo's performance.
  name: image retrieval
  source_chunk_index: 0
  type: task
- description: A vision-language task used to evaluate ViCo's performance.
  name: VQA
  source_chunk_index: 0
  type: task
- description: A configuration of the ViCo method, combined with GloVe, using a linear
    transformation and 100 dimensions for the embeddings.
  name: GloVe+ViCo(linear, 100)
  source_chunk_index: 0
  type: method
- description: A model that combines GloVe embeddings with ViCo embeddings.
  name: GloVe+ViCo
  source_chunk_index: 0
  type: method
- description: A model that combines GloVe embeddings with random vectors.
  name: GloVe+random
  source_chunk_index: 0
  type: method
- description: A vision-language task where the model generates a textual description
