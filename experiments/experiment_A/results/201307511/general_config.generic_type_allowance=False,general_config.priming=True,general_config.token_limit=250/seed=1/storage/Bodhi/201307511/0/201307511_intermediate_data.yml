entities:
- description: A method for learning word embeddings from visual co-occurrences in
    textually-annotated visual databases.
  name: ViCo
  source_chunk_index: 0
  type: method
- description: A textually-annotated visual database used for training and evaluating
    ViCo.
  name: VisualGenome
  source_chunk_index: 0
  type: dataset
- description: A large-scale image database used in conjunction with ViCo.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: Text-based representations of words, enhanced by visual information
    in ViCo.
  name: word embeddings
  source_chunk_index: 0
  type: method
- description: A text-based word embedding method, used as a baseline and potentially
    combined with ViCo.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: A task used to evaluate the performance of ViCo.
  name: unsupervised clustering
  source_chunk_index: 0
  type: task
- description: A task used to evaluate the performance of ViCo.
  name: supervised partitioning
  source_chunk_index: 0
  type: task
- description: A task used to evaluate the performance of ViCo, assessing its ability
    to generalize to unseen visual data.
  name: zero-shot classification
  source_chunk_index: 0
  type: task
- description: A vision-language task used to evaluate ViCo.
  name: image retrieval
  source_chunk_index: 0
  type: task
- description: A vision-language task used to evaluate ViCo.
  name: VQA
  source_chunk_index: 0
  type: task
- description: A type of visual co-occurrence calculated using ImageNet annotations
    augmented with WordNet hypernyms. It represents the co-occurrence between objects
    and their hypernyms (more general terms) in the visual data.
  name: Object-Hypernym co-occurrences
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence, computed from VisualGenome's object
    annotations, representing the co-occurrence between different objects within the
    same image or visual context.
  name: Object-Object co-occurrences
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence, computed from VisualGenome's attribute
    annotations, representing the co-occurrence between different attributes within
    the same image or visual context.
  name: Attribute-Attribute co-occurrences
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence, representing the co-occurrence between
    different concepts within the same image or visual context. This is a general
    category, and the specific implementation details are not provided in this text
    unit.
  name: Concept-Concept co-occurrences
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence used in ViCo, representing the co-occurrence
    of objects within visual data.
  name: Object-Object
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence used in ViCo, representing the co-occurrence
    of attributes within visual data.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence used in ViCo, representing the co-occurrence
    of concepts within visual data.
  name: Concept-Concept
  source_chunk_index: 0
  type: method
- description: A method for learning word embeddings, typically from large-scale text
    corpora by modeling textual co-occurrences.
  name: word2vec
  source_chunk_index: 0
  type: method
