  source_chunk_index: 0
  type: method
- description: A neural network model that learns word embeddings by predicting the
    context words given a target word. It learns from co-occurrences in local context
    windows.
  name: Skip-Gram
  source_chunk_index: 0
  type: method
- description: A contextualized word representation method that uses a deep bidirectional
    language model to generate word embeddings.
  name: ELMo
  source_chunk_index: 0
  type: method
- description: A generative pre-trained transformer model used for various natural
    language processing tasks, including generating contextualized word representations.
  name: OpenAI GPT
  source_chunk_index: 0
  type: method
- description: A transformer-based model designed to pre-train deep bidirectional
    representations from unlabeled text by jointly conditioning on both left and right
    context in all layers.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A category of relationships between words, such as Object-Hypernym,
    used in ViCo to structure and interpret visual co-occurrences.
  name: Co-occurrence Type
  source_chunk_index: 0
  type: method
- description: "A function, denoted as \u03C6t, that maps ViCo embeddings to a type-specialized\
    \ embedding space, specific to each co-occurrence type."
  name: Transformation Function
  source_chunk_index: 0
  type: method
- description: The loss function used in ViCo, which is minimized to learn ViCo embeddings.
    It incorporates co-occurrence type-specific transformation functions and bias
    terms.
  name: ViCo loss function
  source_chunk_index: 0
  type: method
- description: A learnable parameter (b_i or b_t_i) used in the GloVe and ViCo models
    to adjust the embeddings and account for word-specific characteristics.
  name: Bias term
  source_chunk_index: 0
  type: method
