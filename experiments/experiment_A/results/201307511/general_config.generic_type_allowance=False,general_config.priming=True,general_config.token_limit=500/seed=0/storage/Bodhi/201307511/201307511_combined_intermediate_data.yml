  source_chunk_index: 2
  type: method
- description: A co-occurrence type used in ViCo, computed using ImageNet synsets
    and their ancestors in WordNet. It involves incrementing a co-occurrence matrix
    based on synset pairs.
  name: Object-Hypernym (oh)
  source_chunk_index: 2
  type: method
- description: "A co-occurrence type, where for each region in VisualGenome, the co-occurrence\
    \ matrix X oa ij is incremented by 1 for each word pair (i, j) \u2208 S o \xD7\
    S a, and for all synset pairs (S o, S a) \u2208 O \xD7 A."
  name: Object-Attribute
  source_chunk_index: 2
  type: method
- description: "A co-occurrence type, where for each region in VisualGenome, the co-occurrence\
    \ matrix X aa ij is incremented by 1 for each word pair (i, j) \u2208 S a 1 \xD7\
    \ S a 2, and for all synset pairs (S a 1, S a 2) \u2208 A \xD7 A."
  name: Attribute-Attribute
