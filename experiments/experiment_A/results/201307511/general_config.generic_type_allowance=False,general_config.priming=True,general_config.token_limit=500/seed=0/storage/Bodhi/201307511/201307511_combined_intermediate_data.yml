- description: A co-occurrence type used in ViCo, computed using ImageNet synsets
    and their ancestors in WordNet. It involves incrementing a co-occurrence count
    (X oh ij) for each word pair and synset pair within the annotated images.
  name: Object-Hypernym
  source_chunk_index: 2
