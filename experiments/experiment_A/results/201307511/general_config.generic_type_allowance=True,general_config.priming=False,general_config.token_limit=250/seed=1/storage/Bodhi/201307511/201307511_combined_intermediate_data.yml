- description: "The mathematical formulation of the GloVe objective function, which\
    \ is the core of the GloVe method. It is represented as:  \u2211i,j f(Xij) (wiT\
    \ wj + bi + bj - log(Xij))^2, where f is a weighting function, Xij is the co-occurrence\
    \ count, wi and wj are word embeddings, and bi and bj are bias terms."
  name: GLOVE OBJECTIVE FUNCTION
  source_chunk_index: 4
  type: method
- description: "The mathematical formulation of the ViCo objective function. It is\
    \ represented as:  \u2211i,j f(Xij) (wiT wj - log(Xij))^2 + \u03BB \u2211i,t ||\u03C6\
    t(wi) - bti||^2, where f is a weighting function, Xij is the co-occurrence count,\
    \ wi and wj are word embeddings, \u03C6t is a co-occurrence type-specific transformation\
    \ function, and bti is a learned bias term."
  name: VICO OBJECTIVE FUNCTION
  source_chunk_index: 4
  type: method
- description: The weighting function f(X) used in the GloVe and ViCo objective functions.
    It assigns lower weight to less frequent, noisy co-occurrences. In the context
    of the provided text, it is set to the constant 1 for all X in the ViCo method.
  name: WEIGHTING FUNCTION f(X)
  source_chunk_index: 4
  type: method
- description: The word embeddings, represented as vectors (wi and wj), that the GloVe
    and ViCo methods learn to represent words in a lower-dimensional space. These
    embeddings capture semantic relationships between words based on their co-occurrence
    patterns.
  name: WORD EMBEDDINGS (wi, wj)
  source_chunk_index: 4
  type: method
- description: The bias terms (bi, bj, and bti) are learnable parameters in the GloVe
    and ViCo methods. They are used to adjust the dot product of word embeddings and
    the type-specific transformation to better approximate the log co-occurrence counts.
  name: BIAS TERMS (bi, bj, bti)
  source_chunk_index: 4
  type: method
- description: A function that maps ViCo embeddings to a type-specialized embedding
    space. This function is used in the ViCo method to capture different types of
    co-occurrences.
  name: "CO-OCCURRENCE TYPE-SPECIFIC TRANSFORMATION FUNCTION \u03C6t"
  source_chunk_index: 4
  type: method
- description: "The parameter, often denoted as \u03BB, that likely controls the trade-off\
    \ or weighting within the ViCo objective function (Eq. 2), though its specific\
    \ role isn't explicitly defined in the provided text."
  name: LAMBDA
