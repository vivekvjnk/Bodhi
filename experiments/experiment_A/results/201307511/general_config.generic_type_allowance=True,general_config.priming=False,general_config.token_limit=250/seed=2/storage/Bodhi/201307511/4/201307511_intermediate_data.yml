  type: method
- description: A method for learning word embeddings.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: A type of word embedding learned by minimizing a loss function.
  name: ViCo embeddings
  source_chunk_index: 0
  type: method
- description: A function used to quantify the error between predicted and actual
    values, guiding the learning process.
  name: Loss function
  source_chunk_index: 0
  type: generic
- description: The frequency with which words appear together in a text.
  name: Co-occurrence
  source_chunk_index: 0
  type: generic
- description: Two words considered together for analysis.
  name: Word pair
  source_chunk_index: 0
  type: generic
- description: A mathematical operation used in the context of word embeddings.
  name: Dot product
  source_chunk_index: 0
  type: generic
- description: A function that maps ViCo embeddings to a type-specialized embedding
    space.
  name: "Transformation function (\u03C6t)"
  source_chunk_index: 0
  type: generic
- description: A learnable parameter used in the model.
  name: Bias term
  source_chunk_index: 0
  type: generic
- description: The process of optimizing the parameters of a model using a dataset.
  name: Training
  source_chunk_index: 0
  type: generic
- description: The goal of the program, which is to learn word embeddings.
  name: Objective
  source_chunk_index: 0
  type: task
- description: The number of times a word pair appears together.
  name: Co-occurrence count
  source_chunk_index: 0
  type: generic
- description: A function that maps ViCo embeddings to a type-specialized embedding
    space. This is a core component of the ViCo embeddings method.
  name: "CO-OCCURRENCE TYPE-SPECIFIC TRANSFORMATION FUNCTION (\u03C6t)"
  source_chunk_index: 0
  type: method
- description: A learned bias term for word i and type t, used in conjunction with
    the co-occurrence type-specific transformation function within the ViCo embeddings
    method.
  name: LEARNED BIAS TERM (bti)
  source_chunk_index: 0
  type: method
- description: "The function 'f : R \u2192 R' used in the GloVe objective, which assigns\
    \ lower weight to less frequent, noisy co-occurrences. This function is crucial\
    \ for the GloVe method's performance."
  name: WEIGHTING FUNCTION
  source_chunk_index: 0
  type: method
- description: The mathematical formulation or equation (Eq.(1)) that defines the
    GloVe method's objective. It involves optimizing word embeddings based on co-occurrence
    counts, the weighting function, and learnable bias terms. The specific equation
    is essential for understanding how GloVe works.
  name: GLOVE OBJECTIVE
  source_chunk_index: 0
  type: method
- description: The mathematical formulation or equation (Eq.(2)) that defines the
    ViCo method's objective. It involves optimizing ViCo embeddings, co-occurrence
    type-specific transformation function, and learnable bias terms. The specific
    equation is essential for understanding how ViCo works.
  name: VICOS OBJECTIVE
  source_chunk_index: 0
  type: method
- description: "The mathematical formulation of the GloVe objective function. This\
    \ is represented by the program in Eq.(1) in the source text:  \u2211i,j f(Xij)\
    \ (wiT wj + bi + bj - log(Xij))^2, where f : R \u2192 R is a weighting function,\
    \ wi and wj are word embeddings, bi and bj are bias terms, and Xij is the co-occurrence\
    \ count between words i and j."
  name: GloVe Objective Equation
  source_chunk_index: 0
  type: method
- description: "The mathematical formulation of the ViCo objective function. This\
    \ is represented by Eq.(2) in the source text:  \u2211i,j f(Xij) (wiT \u03C6t(wj)\
    \ + bi + bti - log(Xij))^2 + \u03BB ||\u03C6t||^2, where \u03C6t : R d \u2192\
    \ R dt is a co-occurrence type-specific transformation function, wi and wj are\
    \ word embeddings, bi and bti are bias terms, Xij is the co-occurrence count between\
    \ words i and j, and \u03BB is a regularization parameter."
  name: ViCo Objective Equation
  source_chunk_index: 0
  type: method
