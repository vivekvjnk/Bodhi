entities:
- description: A method for learning word embeddings from visual co-occurrences extracted
    from textually-annotated visual databases.
  name: ViCo
  source_chunk_index: 0
  type: METHOD
- description: A large-scale, textually-annotated visual database used for training
    and evaluating ViCo.
  name: VisualGenome
  source_chunk_index: 0
  type: DATASET
- description: A large-scale image dataset used in conjunction with WordNet for computing
    object-hypernym co-occurrences and training visual models.
  name: ImageNet
  source_chunk_index: 0
  type: DATASET
- description: A text-only word embedding method, used as a baseline and for comparison
    with ViCo.
  name: GloVe
  source_chunk_index: 0
  type: METHOD
- description: An evaluation method used to assess the performance of ViCo in capturing
    similarities between visual concepts.
  name: unsupervised clustering
  source_chunk_index: 0
  type: TASK
- description: An evaluation method used to assess the performance of ViCo.
  name: supervised partitioning
  source_chunk_index: 0
  type: TASK
- description: An evaluation method used to assess the ability of ViCo to generalize
    to unseen visual concepts.
  name: zero-shot-like generalization analysis
  source_chunk_index: 0
  type: TASK
- description: A model used in ViCo to learn word embeddings from multiple types of
    co-occurrences.
  name: log-bilinear model
  source_chunk_index: 0
  type: METHOD
- description: Tasks that involve both visual and textual information, such as image
    retrieval, VQA, and captioning, used to evaluate ViCo.
  name: vision-language tasks
  source_chunk_index: 0
  type: TASK
- description: A method for incorporating image representations into word embeddings,
    used for comparison with ViCo.
  name: vis-w2v
  source_chunk_index: 0
  type: METHOD
- description: A lexical database used in conjunction with ImageNet to compute object-hypernym
    co-occurrences.
  name: WordNet
  source_chunk_index: 0
  type: DATASET
- description: An approach used in ViCo to learn word embeddings from multiple types
    of co-occurrences.
  name: multi-task method
  source_chunk_index: 0
  type: METHOD
- description: Vector representations of words, capturing semantic meaning and relationships,
    used in natural language processing and vision-language tasks.
  name: word embeddings
  source_chunk_index: 0
  type: generic
- description: Co-occurrences between objects and their hypernyms (e.g., "dog" and
    "animal"), used in ViCo to capture semantic relationships.
  name: object-hypernym co-occurrences
  source_chunk_index: 0
  type: generic
- description: A type of visual co-occurrence computed using ImageNet annotations
    augmented with WordNet hypernyms.
  name: Object-Hypernym
  source_chunk_index: 0
  type: method
- description: A vision-language task where the goal is to retrieve images based on
    textual captions.
  name: Caption-Image Retrieval
  source_chunk_index: 0
  type: task
- description: A vision-language task where the goal is to answer questions about
    images.
  name: VQA
  source_chunk_index: 0
  type: task
- description: A vision-language task where the goal is to identify image regions
    based on textual descriptions.
  name: Referring Expression Comprehension
  source_chunk_index: 0
  type: task
- description: A vision-language task where the goal is to generate textual descriptions
    for images.
  name: Image Captioning
  source_chunk_index: 0
  type: task
- description: A neural network architecture that learns word embeddings by predicting
    a word given its context words.
  name: Continuous Bag-of-Words (CBOW)
  source_chunk_index: 0
  type: method
- description: A neural network architecture that learns word embeddings by predicting
    the context words given a target word.
  name: Skip-Gram
  source_chunk_index: 0
  type: method
- description: An approach to visually enhance existing word embeddings by training
    an autoencoder on pre-trained word embeddings and matching intermediate representations
    to visual features extracted from a convolutional network trained on ImageNet.
  name: ViEW
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence computed using ImageNet annotations
    augmented with WordNet hypernyms.
  name: Object-Hypernym co-occurrences
  source_chunk_index: 0
  type: generic
- description: A type of visual co-occurrence computed from VisualGenome's object
