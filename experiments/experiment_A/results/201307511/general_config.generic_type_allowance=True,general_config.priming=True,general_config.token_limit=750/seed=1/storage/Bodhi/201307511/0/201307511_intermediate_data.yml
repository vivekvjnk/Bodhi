chunk_indices:
- 0
entities:
- description: A method for learning word embeddings from visual co-occurrences, aiming
    to improve upon text-only embeddings.
  name: ViCo
  source_chunk_index: 0
  type: METHOD
- description: A text-only word embedding method that ViCo aims to improve upon.
  name: GloVe
  source_chunk_index: 0
  type: METHOD
- description: A large-scale, textually-annotated visual database used for extracting
    visual co-occurrences.
  name: VisualGenome
  source_chunk_index: 0
  type: DATASET
- description: A large-scale image dataset used for extracting visual co-occurrences
    and training models.
  name: ImageNet
  source_chunk_index: 0
  type: DATASET
- description: An evaluation task used to assess the performance of ViCo embeddings.
  name: Unsupervised clustering
  source_chunk_index: 0
  type: TASK
- description: An evaluation task used to assess the performance of ViCo embeddings.
  name: Supervised partitioning
  source_chunk_index: 0
  type: TASK
- description: An evaluation task used to assess the ability of ViCo to generalize
    to unseen visual concepts.
  name: Zero-shot-like visual generalization
  source_chunk_index: 0
  type: TASK
- description: Tasks that involve both vision and language, used to evaluate ViCo's
    performance (e.g., image retrieval, question answering).
  name: Vision-language tasks
  source_chunk_index: 0
  type: TASK
- description: A method for incorporating image representations into word embeddings.
  name: vis-w2v
  source_chunk_index: 0
  type: METHOD
- description: A lexical database used to augment ImageNet annotations with hypernyms.
  name: WordNet
  source_chunk_index: 0
  type: DATASET
- description: Vector representations of words, capturing semantic meaning and relationships
    between words.
  name: Word embeddings
  source_chunk_index: 0
  type: generic
- description: Co-occurrences of visual concepts (objects, attributes) extracted from
    visual data.
  name: Visual co-occurrences
  source_chunk_index: 0
  type: generic
- description: Co-occurrences between objects and their hypernyms, used in ViCo.
  name: Object-Hypernym co-occurrences
  source_chunk_index: 0
  type: generic
- description: A model used in ViCo to combine embeddings trained for different co-occurrence
    types.
  name: Log-bilinear model
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence extracted, representing the relationship
    between an object and its hypernym (a more general term).
  name: Object-Hypernym
  source_chunk_index: 0
  type: GENERIC
- description: A type of visual co-occurrence extracted, representing the relationship
    between an object and its attributes.
  name: Object-Attribute
  source_chunk_index: 0
  type: GENERIC
- description: A type of visual co-occurrence extracted, representing the relationship
    between different attributes.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: GENERIC
- description: A type of visual co-occurrence extracted, representing the relationship
    between different concepts.
  name: Concept-Concept
  source_chunk_index: 0
  type: GENERIC
- description: A vision-language task where the system retrieves images based on textual
    captions.
  name: Caption-Image Retrieval
  source_chunk_index: 0
  type: TASK
- description: A vision-language task where the system answers questions about images.
  name: VQA
  source_chunk_index: 0
  type: TASK
- description: A vision-language task where the system identifies the region in an
    image referred to by a given expression.
  name: Referring Expression Comprehension
  source_chunk_index: 0
  type: TASK
- description: A vision-language task where the system generates a textual description
    (caption) for a given image.
  name: Image Captioning
  source_chunk_index: 0
  type: TASK
- description: A neural network architecture used for learning word embeddings by
    predicting a word given its context words.
  name: Continuous Bag-of-Words (CBOW)
  source_chunk_index: 0
  type: method
- description: A neural network architecture used for learning word embeddings by
    predicting context words given a target word.
  name: Skip-Gram models
  source_chunk_index: 0
  type: method
- description: A method for visually enhancing existing word embeddings by training
    an autoencoder on pre-trained word embeddings and matching intermediate representations
    to visual features extracted from a convolutional network trained on ImageNet.
  name: ViEW
  source_chunk_index: 0
  type: method
- description: A dataset used for zero-shot-like object classification in the evaluation
    of ViCo.
  name: CIFAR-100
  source_chunk_index: 0
  type: dataset
