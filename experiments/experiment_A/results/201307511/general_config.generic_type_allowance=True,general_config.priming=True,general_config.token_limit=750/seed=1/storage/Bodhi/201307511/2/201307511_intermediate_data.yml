entities:
- description: A method for learning word embeddings from visual co-occurrences, designed
    to improve upon text-only embeddings like GloVe.
  name: ViCo
  source_chunk_index: 0
  type: METHOD
- description: A text-based word embedding method, used as a baseline for comparison
    with ViCo.
  name: GloVe
  source_chunk_index: 0
  type: METHOD
- description: A lexical database used in the training of ViCo, specifically for generating
    synset annotations and Object-Hypernym co-occurrences.
  name: WordNet
  source_chunk_index: 0
  type: DATASET
- description: A large-scale visual database used to extract visual co-occurrences
    for training ViCo.
  name: VisualGenome
  source_chunk_index: 0
  type: DATASET
- description: A large-scale visual database used to extract visual co-occurrences
    for training ViCo.
  name: ImageNet
  source_chunk_index: 0
  type: DATASET
- description: An evaluation task used to assess the generalization ability of word
    embeddings, specifically using the CIFAR-100 dataset.
  name: Zero-shot-like object classification
  source_chunk_index: 0
  type: TASK
- description: A dataset used for zero-shot-like object classification to evaluate
    the performance of word embeddings.
  name: CIFAR-100
  source_chunk_index: 0
  type: DATASET
- description: A vision-language task used to evaluate the performance of word embeddings.
  name: Image retrieval
  source_chunk_index: 0
  type: TASK
- description: A vision-language task used to evaluate the performance of word embeddings.
  name: Question answering
  source_chunk_index: 0
  type: TASK
- description: Visual word embeddings, used for comparison with ViCo, initialized
    using word2vec and trained on visual data.
  name: vis-w2v
  source_chunk_index: 0
  type: METHOD
- description: A vision-language task used to evaluate the performance of word embeddings.
  name: Image Captioning
  source_chunk_index: 0
  type: TASK
- description: Vector representations of words, capturing semantic relationships,
    and used in various NLP and vision-language tasks.
  name: Word embeddings
  source_chunk_index: 0
  type: generic
- description: The core concept used by ViCo, extracted from visual data, including
    Object-Hypernym, Object-Attribute, Attribute-Attribute, and Concept-Concept.
  name: Co-occurrences
  source_chunk_index: 0
  type: generic
- description: A Convolutional Neural Network (CNN) used to extract image features
    for the zero-shot-like object classification task.
  name: ResNet
  source_chunk_index: 0
  type: method
- description: Used as a baseline for comparison with ViCo and GloVe, representing
    a simple approach to word representation.
  name: Random vectors
  source_chunk_index: 0
  type: generic
- description: A dataset used for training word2vec in the context of vis-w2v, specifically
    in the 'vis-w2v-coco' version.
  name: MS-COCO
  source_chunk_index: 0
  type: dataset
- description: A visual word embedding method, with different versions depending on
    the dataset used for training word2vec (Wikipedia or MS-COCO).
  name: vis-w2v
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence used by ViCo, representing the relationship
    between an object and its hypernym (a more general term).
  name: Object-Hypernym
  source_chunk_index: 0
  type: GENERIC
- description: A type of visual co-occurrence used by ViCo, representing the relationship
    between an object and its attributes.
  name: Object-Attribute
  source_chunk_index: 0
  type: GENERIC
- description: A type of visual co-occurrence used by ViCo, representing the co-occurrence
    of different attributes.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: GENERIC
- description: A type of visual co-occurrence used by ViCo, representing the co-occurrence
    of different concepts.
  name: Concept-Concept
  source_chunk_index: 0
  type: GENERIC
- description: A Gated Recurrent Unit, a type of recurrent neural network used for
    processing sequential data, such as in the fusion of image features and question
    representations.
  name: GRU
  source_chunk_index: 0
  type: method
- description: Support Vector Machine, a supervised machine learning model used for
    classification, such as in the GloVe+ViCo model.
  name: SVM
  source_chunk_index: 0
  type: method
- description: A version of vis-w2v, a visual word embedding method, trained on the
    Wikipedia dataset.
  name: vis-w2v-wiki
  source_chunk_index: 0
  type: method
- description: A version of vis-w2v, a visual word embedding method, trained on the
    MS-COCO dataset.
  name: vis-w2v-coco
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluating localization accuracy with different
    embeddings, using the UNC split.
  name: RefCOCO+ dataset
  source_chunk_index: 0
  type: dataset
