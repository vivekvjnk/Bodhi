chunk_indices:
- 0
entities:
- description: A method for learning word embeddings from visual co-occurrences, aiming
    to improve upon text-only embeddings like GloVe.
  name: ViCo
  source_chunk_index: 0
  type: METHOD
- description: A method for learning word embeddings from global word-word co-occurrence
    statistics.
  name: GloVe
  source_chunk_index: 0
  type: METHOD
- description: A large-scale visual database used for extracting visual co-occurrence
    counts.
  name: VisualGenome
  source_chunk_index: 0
  type: DATASET
- description: A large image database used for extracting visual co-occurrence counts,
    particularly for object-hypernym relationships.
  name: ImageNet
  source_chunk_index: 0
  type: DATASET
- description: A lexical database of English that is used to compute Object-Hypernym
    counts.
  name: WordNet
  source_chunk_index: 0
  type: DATASET
- description: An unsupervised machine learning task used to evaluate the performance
    of ViCo embeddings.
  name: Clustering analysis
  source_chunk_index: 0
  type: TASK
- description: Vector representations of words, capturing semantic meaning and relationships
    between words.
  name: Word embeddings
  source_chunk_index: 0
  type: generic
- description: Co-occurrences extracted from visual data, used to train ViCo embeddings.
    Includes Object-Hypernym, Object-Attribute, Attribute-Attribute, and Concept-Concept.
  name: Visual co-occurrences
  source_chunk_index: 0
  type: generic
- description: A type of visual co-occurrence representing the relationship between
    an object and its hypernym (parent concept) in a hierarchy.
  name: Object-Hypernym
  source_chunk_index: 0
  type: generic
- description: A type of visual co-occurrence representing the relationship between
    an object and its attributes.
  name: Object-Attribute
  source_chunk_index: 0
  type: generic
- description: A type of visual co-occurrence representing the relationship between
    different attributes.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: generic
- description: A type of visual co-occurrence representing the relationship between
    different concepts.
  name: Concept-Concept
  source_chunk_index: 0
  type: generic
- description: A type of model used in ViCo for learning word embeddings.
  name: Log-bilinear models
  source_chunk_index: 0
  type: method
- description: A co-occurrence type-specific function that maps ViCo embeddings to
    a type-specialized embedding space.
  name: "Transformation function (\u03C6t)"
  source_chunk_index: 0
  type: generic
- description: An evaluation task used to assess ViCo's performance, where the model
    groups data points without prior labels.
  name: Unsupervised Clustering
  source_chunk_index: 0
  type: TASK
- description: An evaluation task used to assess ViCo's performance, where the model
    divides data into predefined groups based on labeled data.
  name: Supervised Partitioning
  source_chunk_index: 0
  type: TASK
- description: An evaluation task used to assess ViCo's ability to generalize to new
    visual concepts without explicit training on those concepts.
  name: Zero-shot-like Visual Generalization
  source_chunk_index: 0
  type: TASK
- description: A vision-language task used to evaluate ViCo, where the system retrieves
    images based on textual queries.
  name: Image Retrieval
  source_chunk_index: 0
  type: TASK
- description: A vision-language task used to evaluate ViCo, where the system answers
    questions about images.
  name: Question Answering
  source_chunk_index: 0
  type: TASK
- description: A text-only word embedding method that ViCo is compared against.
  name: GloVe
  source_chunk_index: 0
  type: METHOD
- description: A baseline method using randomly generated vectors for word representation,
    used for comparison.
  name: Random Vectors
  source_chunk_index: 0
  type: METHOD
- description: A metric used for evaluating the clustering performance.
  name: V-Measure
  source_chunk_index: 0
  type: GENERIC
- description: A method used for learning word embeddings from visual data, serving
    as a comparison point for ViCo.
  name: Vis-w2v
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence extracted from visual databases, representing
    the relationship between objects and their attributes.
  name: Object-Attribute
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence extracted from visual databases, representing
    the relationships between different attributes of objects.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence extracted from visual databases, representing
    the relationships between different visual concepts.
  name: Concept-Concept
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence extracted from visual databases, representing
    the relationship between an object and its hypernym (parent concept) in a hierarchy,
    often derived from WordNet and ImageNet.
  name: Object-Hypernym
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence, representing the relationship between
    an object and its attributes, extracted from visual databases.
  name: Object-Attribute
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence, representing the relationship between
    different attributes of objects, extracted from visual databases.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence, representing the relationship between
    different concepts, extracted from visual databases.
  name: Concept-Concept
  source_chunk_index: 0
  type: method
