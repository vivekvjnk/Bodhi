entities:
- description: A method for learning word embeddings from visual co-occurrences, utilizing
    multiple types of visual co-occurrences to improve upon text-only embeddings like
    GloVe.
  name: ViCo
  source_chunk_index: 0
  type: METHOD
- description: A large-scale, textually-annotated visual database used for extracting
    visual co-occurrences in ViCo.
  name: VisualGenome
  source_chunk_index: 0
  type: DATASET
- description: A large-scale image dataset used for extracting visual co-occurrences
    and training visual models, also used in conjunction with WordNet.
  name: ImageNet
  source_chunk_index: 0
  type: DATASET
- description: A text-based word embedding method that ViCo aims to improve upon by
    incorporating visual information.
  name: GloVe
  source_chunk_index: 0
  type: METHOD
- description: An evaluation task used to assess the performance of ViCo embeddings
    in capturing similarities between visual concepts.
