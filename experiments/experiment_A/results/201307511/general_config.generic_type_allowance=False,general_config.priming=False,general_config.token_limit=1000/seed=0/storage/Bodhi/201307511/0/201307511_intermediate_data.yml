    providing a good starting point for visual concept analysis.
  name: WordNet
  source_chunk_index: 0
  type: dataset
- description: An approach to visually enhance existing word embeddings. It trains
    an autoencoder on pre-trained word embeddings while matching intermediate representations
    to visual features extracted from a convolutional network trained on ImageNet.
  name: ViEW
  source_chunk_index: 0
  type: method
- description: A method that uses abstract (synthetic) scenes to learn visual relatedness
    and incorporate image representations into word embeddings.
  name: vis-w2v
  source_chunk_index: 0
  type: method
- description: A neural network architecture used for learning word embeddings by
    predicting a word given its context.
  name: Continuous Bag-of-Words (CBOW)
  source_chunk_index: 0
  type: method
- description: A neural network architecture used for learning word embeddings by
    predicting the context words given a target word.
  name: Skip-Gram
  source_chunk_index: 0
  type: method
- description: A method that involves acquiring word similarity annotations followed
    by applying Multidimensional Scaling (MDS) to obtain low dimensional embeddings.
  name: MDS approach
  source_chunk_index: 0
  type: method
- description: An early attempt to obtain vector representations of words.
  name: Semantic Differential (SD)
  source_chunk_index: 0
  type: method
