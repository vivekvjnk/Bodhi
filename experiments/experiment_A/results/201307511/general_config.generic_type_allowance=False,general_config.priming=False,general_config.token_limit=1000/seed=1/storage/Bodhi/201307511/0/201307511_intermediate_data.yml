  source_chunk_index: 0
  type: dataset
- description: An approach to visually enhance existing word embeddings. It trains
    an autoencoder on pre-trained word embeddings while matching intermediate representations
    to visual features extracted from a convolutional network trained on ImageNet.
  name: ViEW
  source_chunk_index: 0
  type: method
- description: A method that uses abstract (synthetic) scenes to learn visual relatedness
    and incorporate image representations into word embeddings.
  name: vis-w2v
  source_chunk_index: 0
  type: method
- description: Continuous Bag-of-Words model. A method for learning word embeddings
    from co-occurrences in local context windows.
  name: CBOW
  source_chunk_index: 0
  type: method
- description: A method for learning word embeddings from co-occurrences in local
    context windows, similar to CBOW but with a different architecture.
  name: Skip-Gram
  source_chunk_index: 0
  type: method
- description: Multidimensional Scaling. A technique used to obtain low-dimensional
    embeddings of words based on word similarity annotations.
  name: MDS
  source_chunk_index: 0
  type: method
- description: Matrices representing the frequency of word co-occurrences within a
    given context, used for training word embeddings.
  name: Co-occurrence Matrices
  source_chunk_index: 0
  type: dataset
- description: The loss function used to train ViCo embeddings, which is a multi-task
    extension to learn from multiple co-occurrence matrices.
  name: ViCo Loss Function
  source_chunk_index: 0
  type: method
- description: A model used to train GloVe-like embeddings separately for each co-occurrence
    type.
  name: Logbilinear Model
  source_chunk_index: 0
  type: method
