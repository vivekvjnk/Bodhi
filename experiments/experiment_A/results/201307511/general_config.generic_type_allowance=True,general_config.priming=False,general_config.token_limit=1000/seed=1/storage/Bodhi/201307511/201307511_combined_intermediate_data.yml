- description: "The loss function used by GloVe to learn word embeddings. It is defined\
    \ as:  \u2211_(i,j)  f(X_(i,j)) * (w_i^T w_j + b_i + b_j - log(X_(i,j)))^2, where\
    \ X_(i,j) is the co-occurrence count of words i and j, f is a weighting function,\
    \ w_i and w_j are the word embeddings, and b_i and b_j are bias terms."
  name: GloVe Loss Function
  source_chunk_index: 0
  type: method
- description: "The loss function used by ViCo to learn word embeddings from multiple\
    \ types of co-occurrences. It is defined as:  \u2211_(i,j,t)  f(X_(i,j,t)) * (w_i^T\
    \ \u03C6_t(w_j) + b_t_i + b_t_j - log(X_(i,j,t)))^2, where X_(i,j,t) is the co-occurrence\
    \ count of words i and j for co-occurrence type t, f is a weighting function,\
    \ w_i and w_j are the word embeddings, \u03C6_t is a type-specific transformation\
    \ function, and b_t_i and b_t_j are bias terms for word i and j for type t."
  name: ViCo Loss Function
  source_chunk_index: 0
  type: method
