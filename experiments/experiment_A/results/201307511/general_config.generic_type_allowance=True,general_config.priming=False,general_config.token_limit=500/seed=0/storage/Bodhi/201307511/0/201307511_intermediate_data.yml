- description: WordNet hypernyms are used to augment ImageNet annotations for computing
    Object-Hypernym co-occurrences. They represent a hierarchical relationship, where
    a hypernym is a more general term.
  name: Hypernyms
  source_chunk_index: 0
  type: generic
- description: An early method for obtaining vector representations of words.
  name: Semantic Differential (SD)
  source_chunk_index: 0
  type: method
- description: A specific type of co-occurrence used by ViCo, computed using ImageNet
    annotations augmented with WordNet hypernyms. It involves the co-occurrence of
    objects and their hypernyms (more general terms).
  name: Object-Hypernym co-occurrences
  source_chunk_index: 0
  type: generic
- description: Another specific type of co-occurrence used by ViCo, computed from
    VisualGenome's object and attribute annotations. It captures the co-occurrence
    of objects and their descriptive attributes.
  name: Object-Attribute co-occurrences
  source_chunk_index: 0
  type: generic
