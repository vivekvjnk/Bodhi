- description: "Incrementing the value of X oa ij by 1 for each region in VisualGenome,\
    \ for each word pair (i, j) in S o \xD7 S a, and for all synset pairs (S o, S\
    \ a) in O \xD7 A."
  name: Increment X oa ij
  source_chunk_index: 0
  type: task
- description: "Incrementing the value of X oa ji by 1, unless i = j, for each region\
    \ in VisualGenome, for each word pair (i, j) in S o \xD7 S a, and for all synset\
    \ pairs (S o, S a) in O \xD7 A."
  name: Increment X oa ji
  source_chunk_index: 0
  type: task
- description: "Incrementing the value of X aa ij by 1 for each region in VisualGenome,\
    \ for each word pair (i, j) in S a 1 \xD7 S a 2, and for all synset pairs (S a\
    \ 1, S a 2) in A \xD7 A."
  name: Increment X aa ij
  source_chunk_index: 0
  type: task
- description: "Incrementing the value of X c ij by 1 for each image in VisualGenome,\
    \ for each word pair (i, j) in S c 1 \xD7 S c 2, and for all synset pairs (S c\
    \ 1, S c 2) in C \xD7 C."
  name: Increment X c ij
  source_chunk_index: 0
  type: task
- description: "Incrementing the value of X oh ij by 1 for each image in ImageNet,\
    \ for each word pair (i, j) in S h 1 \xD7 S h 2, and for all synset pairs (S h\
    \ 1, S h 2) in H \xD7 H."
  name: Increment X oh ij
