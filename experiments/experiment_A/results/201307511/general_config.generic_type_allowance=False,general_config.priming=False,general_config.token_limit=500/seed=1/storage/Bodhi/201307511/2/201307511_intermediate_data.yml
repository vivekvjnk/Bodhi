- description: "The specific transformations, denoted as \u03C6t, that are discussed\
    \ in the text. These transformations are a core component of the method being\
    \ described, and understanding their nature is crucial for comprehending the overall\
    \ approach."
  name: "Transformations \u03C6t"
  source_chunk_index: 0
  type: method
- description: The counts of how often specific word pairs or synset pairs appear
    together in the datasets. These counts are central to the ViCo method.
  name: Co-occurrence Counts
  source_chunk_index: 0
  type: method
