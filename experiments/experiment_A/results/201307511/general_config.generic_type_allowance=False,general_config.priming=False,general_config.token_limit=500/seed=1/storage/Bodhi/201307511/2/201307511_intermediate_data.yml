    with word pairs to calculate co-occurrence counts.
  name: Synset Pairs
  source_chunk_index: 0
  type: method
- description: The process of identifying and quantifying the simultaneous occurrence
    of different visual elements or words within the dataset. The text highlights
    the "benefits of capturing different types of co-occurrences" as a key aspect
    of the method.
  name: Co-occurrence Capturing
  source_chunk_index: 0
  type: method
- description: A specific type of co-occurrence count calculated between objects and
    their hypernyms (more general terms) in the WordNet hierarchy. This is used to
    capture relationships between objects and their broader categories.
  name: Object-Hypernym (oh) Counts
  source_chunk_index: 0
  type: method
- description: Represents a specific type of co-occurrence count, likely related to
    object-ancestor co-occurrences. The indices i and j likely refer to words or synsets.
  name: X oa ij
  source_chunk_index: 0
  type: method
- description: Represents a specific type of co-occurrence count, likely related to
    ancestor-ancestor co-occurrences. The indices i and j likely refer to words or
    synsets.
  name: X aa ij
  source_chunk_index: 0
  type: method
- description: Represents a specific type of co-occurrence count, likely related to
    co-occurrences within an image. The indices i and j likely refer to words or synsets.
  name: X c ij
  source_chunk_index: 0
  type: method
- description: Represents a specific type of co-occurrence count, likely related to
    object-hypernym co-occurrences. The indices i and j likely refer to words or synsets.
  name: X oh ij
  source_chunk_index: 0
  type: method
