    co-occurrences.
  name: WordNet (lexical database)
  source_chunk_index: 0
  type: dataset
- description: A vision-language task where the goal is to retrieve the most relevant
    image given a text caption.
  name: Caption-Image Retrieval
  source_chunk_index: 0
  type: task
- description: A vision-language task where the system answers questions about an
    image.
  name: VQA
  source_chunk_index: 0
  type: task
- description: A vision-language task where the system identifies the region in an
    image referred to by a given expression.
  name: Referring Expression Comprehension
  source_chunk_index: 0
  type: task
- description: A vision-language task where the system generates a textual description
    (caption) for a given image.
  name: Image Captioning
  source_chunk_index: 0
  type: task
- description: A type of visual co-occurrence between objects and their hypernyms
    (e.g., a specific type of dog and the general concept of dog).
  name: Object-Hypernym
  source_chunk_index: 0
  type: generic
- description: A type of visual co-occurrence between objects and their attributes
    (e.g., a red car and the attributes of color).
  name: Object-Attribute
  source_chunk_index: 0
  type: generic
- description: A model used to train ViCo embeddings, specifically mentioned as a
    method to concatenate GloVe-like embeddings trained separately for each co-occurrence
    type.
  name: Logbilinear model
  source_chunk_index: 0
  type: method
