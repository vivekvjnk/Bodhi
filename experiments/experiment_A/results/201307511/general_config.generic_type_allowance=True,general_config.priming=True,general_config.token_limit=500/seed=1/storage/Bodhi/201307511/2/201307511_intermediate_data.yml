- description: Text-only word embeddings used for comparison with ViCo.
  name: GloVe
  source_chunk_index: 0
  type: GENERIC
- description: A type of co-occurrence used in ViCo, based on object and hypernym
    relationships.
  name: Object-Hypernym
  source_chunk_index: 0
  type: GENERIC
- description: Analysis performed on ViCo embeddings to assess their ability to represent
    similarities and differences between visual categories.
  name: clustering analysis
  source_chunk_index: 0
  type: GENERIC
- description: A large-scale, textually-annotated visual database used for estimating
    visual co-occurrence counts.
  name: Visual Genome
  source_chunk_index: 0
  type: dataset
- description: A large-scale, textually-annotated visual database used for estimating
    visual co-occurrence counts. ImageNet synsets and their ancestors in WordNet are
    used to compute Object-Hypernym (oh) counts.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: A type of co-occurrence count calculated using ImageNet synsets and
    their ancestors in WordNet.
  name: Object-Hypernym
  source_chunk_index: 0
  type: generic
- description: An optimization algorithm reported to work best for GloVe, used in
    the context of training word embeddings.
  name: Adagrad
  source_chunk_index: 0
  type: method
- description: A co-occurrence type calculated using ImageNet synsets and their ancestors
    in WordNet. It represents the relationship between objects and their hypernyms
    (broader categories).
  name: Object-Hypernym (oh)
  source_chunk_index: 0
  type: generic
- description: "A co-occurrence type calculated for each region in VisualGenome, incrementing\
    \ X oa ij by 1, for each word pair (i, j) \u2208 S o \xD7S a, and for all synset\
    \ pairs (S o , S a ) \u2208 O \xD7 A. X oa ji is also incremented unless i = j."
  name: Object-Attribute (oa)
  source_chunk_index: 0
  type: generic
- description: "A co-occurrence type calculated for each region in VisualGenome, incrementing\
    \ X aa ij by 1, for each word pair (i, j) \u2208 S a 1 \xD7 S a 2, and for all\
    \ synset pairs (S a 1 , S a 2 ) \u2208 A \xD7 A."
  name: Attribute-Attribute (aa)
  source_chunk_index: 0
  type: generic
- description: "A co-occurrence type calculated for each image in VisualGenome, incrementing\
    \ X c ij by 1, for each word pair (i, j) \u2208 S c 1 \xD7 S c 2, and for all\
    \ synset pairs (S c 1 , S c 2 ) \u2208 C \xD7 C, where C is the union of all object\
    \ synsets annotated in an image."
  name: Contextual (c)
  source_chunk_index: 0
  type: generic
- description: A type of co-occurrence count calculated using ImageNet synsets and
    their ancestors in WordNet. It represents the relationship between objects and
    their hypernyms (more general terms).
  name: Object-Hypernym (oh)
  source_chunk_index: 0
  type: generic
- description: A type of co-occurrence, where the co-occurrence counts are incremented
    for each word pair (i, j) belonging to the sets of objects (So) and attributes
    (Sa) respectively, within a region in VisualGenome.
  name: Object-Attribute
  source_chunk_index: 0
  type: generic
- description: A type of co-occurrence, where the co-occurrence counts are incremented
    for each word pair (i, j) belonging to the sets of objects (Sc1 and Sc2) within
    an image in VisualGenome.
  name: Object-Object
  source_chunk_index: 0
  type: generic
- description: A type of co-occurrence, where the co-occurrence counts are incremented
    for each word pair (i, j) belonging to the sets of attributes (Sa1 and Sa2) within
    a region in VisualGenome.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: generic
