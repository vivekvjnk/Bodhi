entities:
- description: A word embedding model that learns word embeddings by minimizing a
    loss function based on co-occurrence counts.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: Vector representations of words, capturing semantic relationships.
  name: word embeddings
  source_chunk_index: 0
  type: method
- description: Embeddings learned by minimizing a loss function that incorporates
    co-occurrence information and type-specific transformations.
  name: ViCo embeddings
  source_chunk_index: 0
  type: method
- description: The task of capturing and utilizing the frequency with which words
    appear together in a text.
  name: co-occurrence
  source_chunk_index: 0
  type: task
- description: A function used to quantify the error between predicted and actual
    values, guiding the learning process of the model.
  name: loss function
  source_chunk_index: 0
  type: method
- description: The number of times two words appear together within a defined context.
  name: co-occurrence count
  source_chunk_index: 0
  type: dataset
- description: The mathematical expression or formula (Eq.(1)) that defines the goal
    of the GloVe model, which involves optimizing a weighting function to approximate
    the log co-occurrence count of word pairs.
  name: Objective Function in Eq.(1)
  source_chunk_index: 0
  type: method
- description: The mathematical expression or formula (Eq.(2)) that defines the loss
    function used to learn ViCo embeddings, incorporating a co-occurrence type-specific
    transformation function.
  name: Objective Function in Eq.(2)
  source_chunk_index: 0
  type: method
- description: A co-occurrence type-specific transformation function that maps ViCo
    embeddings to a type-specialized embedding space.
  name: "Transformation Function \u03C6t"
  source_chunk_index: 0
  type: method
- description: The specific kind of co-occurrence being analyzed, which is not explicitly
    stated but is crucial for understanding the context of the embeddings. This could
    refer to different types of relationships between words, such as syntactic, semantic,
    or distributional co-occurrences.
  name: Co-occurrence Type
  source_chunk_index: 0
  type: method
- description: The weighting function, denoted as f(X), used in the GloVe objective
    to assign lower weights to less frequent, noisy co-occurrences.
  name: Weighting Function f(X)
  source_chunk_index: 0
  type: method
