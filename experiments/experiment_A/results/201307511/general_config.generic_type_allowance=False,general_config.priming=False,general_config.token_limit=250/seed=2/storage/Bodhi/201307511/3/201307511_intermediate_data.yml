entities:
- description: A neural approach for learning word embeddings by considering co-occurrences
    in local context windows.
  name: Continuous Bag-of-Words (CBOW)
  source_chunk_index: 0
  type: method
- description: A neural approach for learning word embeddings, similar to CBOW, using
    local context windows.
  name: Skip-Gram models
  source_chunk_index: 0
  type: method
- description: A log-bilinear model for learning word embeddings.
