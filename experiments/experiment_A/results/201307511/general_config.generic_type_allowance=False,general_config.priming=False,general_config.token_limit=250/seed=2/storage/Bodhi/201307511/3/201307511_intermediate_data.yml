  name: Multi-task extension
  source_chunk_index: 0
  type: method
- description: A method that incorporates image representations into word embeddings
    using abstract scenes.
  name: vis-w2v
  source_chunk_index: 0
  type: method
- description: An approach to visually enhance existing word embeddings.
  name: ViEW
