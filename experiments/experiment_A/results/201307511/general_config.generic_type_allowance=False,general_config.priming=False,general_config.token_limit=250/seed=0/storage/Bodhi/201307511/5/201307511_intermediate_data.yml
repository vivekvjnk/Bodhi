    (i, j) in the set of adjective words, and for all synset pairs (S a1, S a2) in
    the set of adjective synsets, within a region in VisualGenome.
  name: Incrementing X aa ij
  source_chunk_index: 0
  type: task
- description: The task of increasing the value of X c ij by 1 for each word pair
    (i, j) in the set of words, and for all synset pairs (S c1, S c2) in the set of
    object synsets annotated for an image in VisualGenome.
  name: Incrementing X c ij
  source_chunk_index: 0
  type: task
- description: The task of incrementing a variable X ij for each image in ImageNet,
