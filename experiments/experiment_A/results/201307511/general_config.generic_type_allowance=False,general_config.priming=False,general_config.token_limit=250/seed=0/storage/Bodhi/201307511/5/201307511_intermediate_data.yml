- description: The task of increasing the value of X oa ij by 1 for each word pair
    (i, j) in the set of object words and adjective words, and for all synset pairs
    (S o, S a) in the sets of object synsets and adjective synsets, respectively,
    within a region in VisualGenome.
  name: Incrementing X oa ij
  source_chunk_index: 0
  type: task
