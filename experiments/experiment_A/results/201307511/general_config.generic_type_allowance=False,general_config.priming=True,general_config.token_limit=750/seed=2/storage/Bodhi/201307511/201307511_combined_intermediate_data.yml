    likely used in ViCo training.
  name: Adagrad
  source_chunk_index: 1
  type: method
- description: Object-Attribute co-occurrence counts, incremented for each word pair
    (i, j) in a region of VisualGenome, where (i, j) belongs to the synset pairs (So,
    Sa) in O x A.
  name: Xoa
  source_chunk_index: 1
  type: method
- description: Attribute-Attribute co-occurrence counts, incremented for each word
    pair (i, j) in a region of VisualGenome, where (i, j) belongs to the synset pairs
    (Sa1, Sa2) in A x A.
  name: Xaa
  source_chunk_index: 1
  type: method
- description: Concept-Concept co-occurrence counts, incremented for each word pair
    (i, j) in an image from VisualGenome, where (i, j) belongs to the synset pairs
    (Sc1, Sc2) in C x C, where C is the union of all object synsets annotated in an
    image.
  name: Xci
  source_chunk_index: 1
  type: method
- description: Object-Hypernym co-occurrence counts, incremented for each word pair
    (i, j) in an image from ImageNet, where (i, j) belongs to the synset pairs (Sh1,
    Sh2) in H x H, where H is a set of object synsets annotated for an image in ImageNet
    and its ancestors in WordNet.
  name: Xoh
  source_chunk_index: 1
  type: method
