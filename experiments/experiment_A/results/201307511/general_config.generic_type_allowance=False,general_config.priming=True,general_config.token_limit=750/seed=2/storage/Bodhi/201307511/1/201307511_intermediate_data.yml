entities:
- description: A method for learning word embeddings from visual co-occurrences, designed
    to improve upon text-only embeddings.
  name: ViCo
  source_chunk_index: 0
  type: method
- description: A text-only word embedding method that ViCo aims to improve upon.
  name: GloVe
  source_chunk_index: 0
  type: method
- description: A large-scale, textually-annotated visual dataset used for training
    and evaluating ViCo.
  name: VisualGenome
  source_chunk_index: 0
  type: dataset
- description: A large-scale, textually-annotated visual dataset used for training
    and evaluating ViCo.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
