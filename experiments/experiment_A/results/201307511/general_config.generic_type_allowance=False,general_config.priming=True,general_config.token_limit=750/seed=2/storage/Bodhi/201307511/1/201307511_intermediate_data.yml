  name: Zero-shot-like visual generalization
  source_chunk_index: 0
  type: task
- description: A dataset used for evaluating ViCo.
  name: CIFAR-100
  source_chunk_index: 0
  type: dataset
- description: A vision-language task used to evaluate ViCo.
  name: Caption-Image Retrieval
  source_chunk_index: 0
  type: task
- description: A vision-language task used to evaluate ViCo.
  name: VQA
  source_chunk_index: 0
  type: task
- description: A type of visual co-occurrence used in ViCo, computed using ImageNet
    synsets and their ancestors in WordNet.
  name: Object-Hypernym
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence used in ViCo, calculated from word pairs
    within regions of VisualGenome.
  name: Object-Object
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence used in ViCo, calculated from word pairs
    within regions of VisualGenome.
  name: Attribute-Attribute
  source_chunk_index: 0
  type: method
- description: A type of visual co-occurrence used in ViCo, calculated from synset
    pairs annotated in images from VisualGenome and ImageNet.
  name: Concept-Concept
  source_chunk_index: 0
  type: method
- description: A dataset used for estimating visual co-occurrence counts, specifically
    for Object-Object and Attribute-Attribute co-occurrences.
  name: VisualGenome
  source_chunk_index: 0
  type: dataset
- description: A dataset used for estimating visual co-occurrence counts, specifically
    for Object-Hypernym and Concept-Concept co-occurrences.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: A lexical database used to compute Object-Hypernym co-occurrences,
    providing synsets and hypernym relationships.
  name: WordNet
  source_chunk_index: 0
  type: dataset
- description: The loss function used to train ViCo embeddings, which minimizes a
    loss based on co-occurrence counts and type-specific transformation functions.
  name: Loss Function
  source_chunk_index: 0
  type: method
- description: A co-occurrence type-specific transformation function that maps ViCo
    embeddings to a type-specialized embedding space.
  name: "\u03C6t"
  source_chunk_index: 0
  type: method
- description: The optimization algorithm reported to work best for GloVe, and is
    likely used in ViCo training.
  name: Adagrad
  source_chunk_index: 0
  type: method
- description: Object-Attribute co-occurrence counts, incremented for each word pair
    (i, j) in a region of VisualGenome, where (i, j) belongs to the synset pairs (So,
    Sa) in O x A.
  name: Xoa
  source_chunk_index: 0
  type: method
- description: Attribute-Attribute co-occurrence counts, incremented for each word
    pair (i, j) in a region of VisualGenome, where (i, j) belongs to the synset pairs
    (Sa1, Sa2) in A x A.
  name: Xaa
  source_chunk_index: 0
  type: method
- description: Concept-Concept co-occurrence counts, incremented for each word pair
    (i, j) in an image from VisualGenome, where (i, j) belongs to the synset pairs
    (Sc1, Sc2) in C x C, where C is the union of all object synsets annotated in an
    image.
  name: Xci
  source_chunk_index: 0
  type: method
- description: Object-Hypernym co-occurrence counts, incremented for each word pair
    (i, j) in an image from ImageNet, where (i, j) belongs to the synset pairs (Sh1,
    Sh2) in H x H, where H is a set of object synsets annotated for an image in ImageNet
    and its ancestors in WordNet.
  name: Xoh
  source_chunk_index: 0
  type: method
- description: A dataset used for estimating visual co-occurrence counts, specifically
    for computing Object-Attribute and Concept-Concept co-occurrences.
  name: VisualGenome
  source_chunk_index: 0
  type: dataset
- description: A dataset used for estimating visual co-occurrence counts, specifically
    for computing Object-Hypernym co-occurrences.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
