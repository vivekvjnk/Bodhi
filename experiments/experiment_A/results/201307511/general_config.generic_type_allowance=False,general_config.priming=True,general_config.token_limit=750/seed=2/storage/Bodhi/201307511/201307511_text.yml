"Specifically , we extract four types of visual co - occurrences between object and\
  \ attribute words from large - scale , textually - annotated visual databases like\
  \ VisualGenome and ImageNet .Through unsupervised clustering , supervised partitioning\
  \ , and a zero - shot - like generalization analysis we show that our word embeddings\
  \ complement text - only embeddings like GloVe by better representing similarities\
  \ and differences between visual concepts that are difficult to obtain from text\
  \ corpora alone .These word embeddings , e.g. , GloVe and word 2 vec , are typically\
  \ learned from large - scale text corpora by modeling textual co - occurrences .While\
  \ no visual dataset exists with such exhaus - tive annotations ( many non - annotated\
  \ words may still be applicable to an image region ) , large scale datasets like\
  \ Vi - sualGenome [ 1 7 ] and ImageNet [ 8 ] along with their Word - Net [ 3 2 ]\
  \ synset annotations provide a good starting point .We use ImageNet annotations\
  \ augmented with WordNet hypernyms to compute Object - Hypernym co - occurrences\
  \ while the remaining types of co - occurrence are computed from VisualGenome 's\
  \ object and attribute annotations .To learn ViCo , i.e. , word embeddings from\
  \ Visual Cooccurrences , we could concatenate GloVe - like embeddings trained separately\
  \ for each co - occurrence type via a logbilinear model .To test ViCo 's ability\
  \ to capture similarities and differences between visual concepts , we analyze performance\
  \ in an unsupervised clustering , supervised partitioning ( see supplementary material\
  \ ) , and a zero - shot - like visual generalization setting .In both cases , ViCo\
  \ augmented GloVe outperforms GloVe , random vectors , vis - w 2 v , or their combinations\
  \ .Through a qualitative analogy question answering evaluation , we also find ViCo\
  \ embedding space to better capture relations between visual concepts than GloVe\
  \ .The latter includes Caption - Image Retrieval , VQA , Referring Expression Comprehension\
  \ , and Image Captioning .Systems using ViCo outperform those using GloVe for almost\
  \ all tasks and metrics .To summarize our contributions : ( 1 ) We develop a multitask\
  \ method to learn a word embedding from multiple types of co - occurrences ; ( 2\
  \ ) We show that the embeddings learned from multiple visual co - occurrences ,\
  \ when com - bined with GloVe , outperform GloVe alone in unsupervised clustering\
  \ , supervised partitioning , and zero - shot - like analysis , as well as on multiple\
  \ vision - language tasks ; ( 3 ) We find that performance of supervised vision\
  \ - language models is relatively insensitive to word embeddings , with even random\
  \ embeddings leading to nearly the same performance as learned embeddings .Semantic\
  \ Differential ( SD ) [ 3 4 ] is among the earliest attempts to obtain vector representations\
  \ of words .Another approach involved acquiring word similarity annotations followed\
  \ by applying Multidimensional Scaling ( MDS ) [ 2 1 ] to obtain low dimensional\
  \ ( typically 2 - 4 ) embeddings and then identifying meaningful clusters or interpretable\
  \ dimensions [ 4 5 ] .Like SD , the MDS approach lacked representation power , and\
  \ embeddings and their interpretations varied based on words ( e.g. , food names\
  \ [ 4 5 ] , animals [ 4 4 ] , etc . ) to which MDS was applied .Recent neural approaches\
  \ like the Continuous Bag - of - Words ( CBOW ) and the Skip - Gram models [ 2 9\
  \ , 3 1 , 3 0 ] learn from co - occurrences in local context windows as opposed\
  \ to global co - occurrence statistics .We show loss computation of different approaches\
