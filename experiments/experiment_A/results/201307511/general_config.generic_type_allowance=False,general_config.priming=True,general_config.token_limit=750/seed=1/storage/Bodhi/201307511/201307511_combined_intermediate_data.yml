- description: The function used to train ViCo embeddings, which minimizes the difference
    between the dot product of word embeddings and the log co-occurrence count, incorporating
    a type-specific transformation function and bias terms.
  name: Loss Function
  source_chunk_index: 1
  type: method
- description: One of the four types of visual co-occurrences extracted, representing
    the relationship between an object and its hypernym (a more general term). Counts
    are computed using ImageNet synsets and their ancestors in WordNet.
  name: Object-Hypernym
  source_chunk_index: 1
  type: method
- description: One of the four types of visual co-occurrences extracted, representing
    the relationship between an object and its attributes. This is not explicitly
    described in the text, but is implied as one of the four types.
  name: Object-Attribute
  source_chunk_index: 1
  type: method
- description: One of the four types of visual co-occurrences extracted, representing
    the relationship between different attributes. This is not explicitly described
    in the text, but is implied as one of the four types.
  name: Attribute-Attribute
  source_chunk_index: 1
  type: method
- description: One of the four types of visual co-occurrences extracted, representing
    the relationship between different concepts. This is not explicitly described
    in the text, but is implied as one of the four types.
  name: Concept-Concept
  source_chunk_index: 1
  type: method
- description: A lexical database of English that is used to compute Object-Hypernym
    counts. ImageNet synsets and their ancestors in WordNet are used.
  name: WordNet
  source_chunk_index: 1
  type: dataset
- description: Represents the Object-Attribute co-occurrence counts. For each region
    in VisualGenome, it is incremented by 1 for each word pair (i, j) where (i, j)
    belongs to the Cartesian product of object synsets (So) and attribute synsets
    (Sa).
  name: Xoa
  source_chunk_index: 1
  type: method
- description: Represents the Attribute-Attribute co-occurrence counts. For each region
    in VisualGenome, it is incremented by 1 for each word pair (i, j) where (i, j)
    belongs to the Cartesian product of two attribute synsets (Sa1, Sa2).
  name: Xaa
  source_chunk_index: 1
  type: method
- description: Represents the Concept-Concept co-occurrence counts. For each image
    in VisualGenome, it is incremented by 1 for each word pair (i, j) where (i, j)
    belongs to the Cartesian product of two concept synsets (Sc1, Sc2), where C is
    the union of all object synsets annotated in an image.
  name: Xc
  source_chunk_index: 1
  type: method
- description: Represents the Object-Hypernym co-occurrence counts. For each image
    in ImageNet, it is incremented by 1 for each word pair (i, j) where (i, j) belongs
    to the Cartesian product of two synsets (Sh1, Sh2), where H is a set of object
    synsets annotated for an image in ImageNet and its ancestors in WordNet.
  name: Xoh
  source_chunk_index: 1
  type: method
