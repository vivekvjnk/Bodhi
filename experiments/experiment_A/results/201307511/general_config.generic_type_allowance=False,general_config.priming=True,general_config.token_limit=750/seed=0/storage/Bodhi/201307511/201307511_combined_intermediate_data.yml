  name: WordNet
  source_chunk_index: 1
  type: dataset
- description: "Co-occurrence counts (X oa) computed for each region in VisualGenome,\
    \ incremented by 1 for each word pair (i, j) from object synsets (S o) and attribute\
    \ synsets (S a), and for all synset pairs (S o, S a) in O \xD7 A."
  name: Object-Attribute Co-occurrence
  source_chunk_index: 1
  type: dataset
- description: "Co-occurrence counts (X aa) computed for each region in VisualGenome,\
    \ incremented by 1 for each word pair (i, j) from attribute synsets (S a1 and\
    \ S a2), and for all synset pairs (S a1, S a2) in A \xD7 A."
  name: Attribute-Attribute Co-occurrence
  source_chunk_index: 1
  type: dataset
- description: Co-occurrence counts (X c) computed for each image in VisualGenome,
    incremented by 1 for each word pair (i, j) from concept synsets (S c1 and S c2)
    where C is the union of all object synsets annotated in an image.
  name: Concept-Concept Co-occurrence
  source_chunk_index: 1
  type: dataset
- description: Co-occurrence counts (X oh) computed for each image in ImageNet, incremented
    by 1 for each word pair (i, j) from synsets (S h1 and S h2) where H is a set of
    object synsets annotated for an image in ImageNet and its ancestors in WordNet.
  name: Object-Hypernym Co-occurrence
  source_chunk_index: 1
  type: dataset
