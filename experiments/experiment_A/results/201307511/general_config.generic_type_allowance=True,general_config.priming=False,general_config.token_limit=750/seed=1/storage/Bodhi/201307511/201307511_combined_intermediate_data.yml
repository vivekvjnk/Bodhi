- description: "The function 'f : R \u2192 R' used in GloVe to assign weights to co-occurrences.\
    \ It assigns lower weights to less frequent, noisy co-occurrences. In the provided\
    \ text, it is set to the constant 1 for all X in the ViCo objective."
  name: Weighting Function
  source_chunk_index: 1
  type: method
- description: "The function '\u03C6t : R d \u2192 R dt' used in ViCo embeddings.\
    \ It maps ViCo embeddings to a type-specialized embedding space."
  name: Co-occurrence Type-Specific Transformation Function
  source_chunk_index: 1
  type: method
- description: The different types of co-occurrences used in the ViCo method. These
    include object-hypernym (oh), object-object (oo), and context-context (cc) co-occurrences,
    which are calculated based on visual information from Visual Genome and ImageNet.
  name: Co-occurrence Types
  source_chunk_index: 1
  type: method
- description: "The method for calculating object-hypernym counts. For each region\
    \ in VisualGenome, increment X oa ij by 1, for each word pair (i, j) \u2208 S\
    \ o \xD7S a, and for all synset pairs (S o, S a) \u2208 O \xD7 A. X oa ji is also\
    \ incremented unless i = j."
  name: Object-Hypernym (oh) Counts
  source_chunk_index: 1
  type: method
- description: "The method for calculating object-object counts. For each region in\
    \ VisualGenome, increment X aa ij by 1, for each word pair (i, j) \u2208 S a 1\
    \ \xD7 S a 2, and for all synset pairs (S a 1, S a 2) \u2208 A \xD7 A."
  name: Object-Object (oo) Counts
  source_chunk_index: 1
  type: method
- description: "The method for calculating context-context counts. For each image\
    \ in VisualGenome, X c ij is incremented by 1, for each word pair (i, j) \u2208\
    \ S c 1 \xD7 S c 2, and for all synset pairs (S c 1, S c 2) \u2208 C \xD7 C, where\
    \ C is the union of all object synsets annotated in an image."
  name: Context-Context (cc) Counts
  source_chunk_index: 1
  type: method
- description: "The method for calculating ImageNet counts. For each image in ImageNet,\
    \ X oh ij is incremented by 1, for each word pair (i, j) \u2208 S h 1 \xD7 S h\
    \ 2, and for all synset pairs (S h 1, S h 2) \u2208 H \xD7 H, where H is a set\
    \ of object synsets annotated for an image in ImageNet and its ancestors in WordNet."
  name: ImageNet Counts
  source_chunk_index: 1
  type: method
- description: "The function \u03C6 t : R d \u2192 R dt that maps ViCo embeddings\
    \ to a type-specialized embedding space."
  name: Co-occurrence Type-Specific Transformation Function
  source_chunk_index: 1
  type: method
- description: "The loss function used in ViCo method: Here \u03C6 t : R d \u2192\
    \ R dt is a co - occurrence type - specific transformation function that maps\
    \ ViCo embeddings to a type - specialized embedding space . b t i is a learned\
    \ bias term for word i and type t."
  name: Loss Function
  source_chunk_index: 1
  type: method
