  name: Co-occurrence
  source_chunk_index: 0
  type: generic
- description: The loss function used to learn ViCo embeddings, as presented in Eq.
    (2) in the provided text.
  name: ViCo Loss Function
  source_chunk_index: 0
  type: method
- description: Represents the object-hypernym co-occurrence counts, incremented for
    each word pair (i, j) in the specified synset pairs within VisualGenome regions.
  name: Xoa
  source_chunk_index: 0
  type: generic
- description: Represents the co-occurrence counts between synsets within the same
    category (A), incremented for each word pair (i, j) in the specified synset pairs
    within VisualGenome regions.
  name: Xaa
  source_chunk_index: 0
  type: generic
- description: Represents the co-occurrence counts between words within the same image,
    incremented for each word pair (i, j) in the specified synset pairs within VisualGenome
    images.
  name: Xci
  source_chunk_index: 0
  type: generic
- description: Represents the co-occurrence counts between words within the same image,
    incremented for each word pair (i, j) in the specified synset pairs within ImageNet
    images.
  name: Xoh
  source_chunk_index: 0
  type: generic
- description: A function that maps ViCo embeddings to a type-specialized embedding
    space. This is a core component of the ViCo method, enabling it to capture different
    types of co-occurrences.
  name: "Co-occurrence Type-Specific Transformation Function (\u03C6t)"
  source_chunk_index: 0
  type: method
- description: A type of co-occurrence analyzed by ViCo, calculated using ImageNet
    synsets and their ancestors in WordNet. It involves counting co-occurrences between
    objects and their hypernyms (more general categories).
  name: Object-Hypernym Co-occurrence
  source_chunk_index: 0
  type: dataset
- description: A type of co-occurrence analyzed by ViCo, calculated using VisualGenome
    data. It involves counting co-occurrences between objects within the same region
    of an image.
  name: Object-Object Co-occurrence
  source_chunk_index: 0
  type: dataset
- description: A type of co-occurrence analyzed by ViCo, calculated using VisualGenome
    data. It involves counting co-occurrences between objects within the same image.
  name: Image-Image Co-occurrence
  source_chunk_index: 0
  type: dataset
- description: The different types of co-occurrences analyzed by the ViCo method.
    These include object-hypernym (oh), and co-occurrences within visual regions (oa,
    aa, c, oh).
  name: Co-occurrence Types
  source_chunk_index: 0
  type: method
- description: "The type-specific transformation functions that map ViCo embeddings\
    \ to a type-specialized embedding space. These functions are denoted as \u03C6\
    t : R d \u2192 R dt."
  name: "Transformation Functions (\u03C6t)"
  source_chunk_index: 0
  type: method
