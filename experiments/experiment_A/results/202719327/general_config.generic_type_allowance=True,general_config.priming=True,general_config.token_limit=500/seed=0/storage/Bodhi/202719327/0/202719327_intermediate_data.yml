- description: The process of adapting a pre-trained language model to a specific
    downstream task.
  name: Fine-tuning
  source_chunk_index: 0
  type: GENERIC
- description: A large Transformer-based language model used as the teacher model
    in knowledge distillation.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A smaller student model designed to learn from the teacher BERT model
    through knowledge distillation, aiming for faster inference and reduced size.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A method for transferring knowledge from a larger, more complex model
    (teacher) to a smaller, simpler model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: The pre-training stage of the two-stage learning framework, where TinyBERT
    learns general domain knowledge from BERT.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: The fine-tuning stage of the two-stage learning framework, where TinyBERT
    learns task-specific knowledge.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: Used in the task-specific distillation stage to improve performance
    on downstream tasks.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
