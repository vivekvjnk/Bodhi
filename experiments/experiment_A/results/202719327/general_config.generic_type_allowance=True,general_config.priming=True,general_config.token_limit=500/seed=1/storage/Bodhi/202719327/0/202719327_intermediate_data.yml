  source_chunk_index: 0
  type: GENERIC
- description: A large Transformer-based language model used as the teacher model
    in knowledge distillation.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A smaller student model designed to learn from the teacher BERT model
    through knowledge distillation, aiming for faster inference and reduced size.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A method for transferring knowledge from a larger, more complex model
    (teacher) to a smaller, simpler model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: The pre-training stage of the two-stage learning framework, used to
    initialize TinyBERT with general domain knowledge.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: The fine-tuning stage of the two-stage learning framework, using augmented
    data for downstream tasks.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: The layers within the Transformer architecture from which knowledge
    is distilled in TinyBERT. These include Multi-Head Attention and Feed-Forward
    Network layers.
  name: Transformer layers
  source_chunk_index: 0
  type: method
- description: A technique used to increase the diversity of a dataset by creating
    modified versions of existing data, which is used in the task-specific distillation
    stage.
  name: Data Augmentation
