- description: The first stage of the two-stage learning framework, using a large
    corpus (English Wikipedia) to initialize TinyBERT.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: The pre-trained teacher model used to supervise the training of TinyBERT.
    Specifically, BERT BASE is used in general distillation and a fine-tuned BERT
    teacher in task-specific distillation.
  name: BERT
  source_chunk_index: 0
  type: method
- description: The smaller student model that learns from the teacher BERT model through
    knowledge distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning framework, using augmented
    data for downstream tasks and supervised by a fine-tuned BERT teacher.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: The process of creating augmented datasets for task-specific distillation
    to improve the performance of TinyBERT on downstream tasks.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A distillation method applied to the intermediate layers of the Transformer
    models, used in both general and task-specific distillation.
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation method applied to the prediction layer of the Transformer
    models, used in task-specific distillation.
  name: Prediction Layer Distillation
