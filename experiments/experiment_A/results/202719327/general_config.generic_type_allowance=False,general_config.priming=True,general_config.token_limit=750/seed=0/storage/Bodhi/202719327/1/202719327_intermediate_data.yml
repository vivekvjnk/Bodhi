    is evaluated on this task.
  name: Question Answering
  source_chunk_index: 0
  type: task
- description: A distillation method that uses the attention matrices of the teacher
    BERT model as a fitting target to transfer linguistic knowledge to the student
    TinyBERT model.
  name: Attention Based Distillation
  source_chunk_index: 0
  type: method
- description: A distillation method that transfers knowledge from the embedding layers
    of the teacher BERT model to the student TinyBERT model.
  name: Embedding-layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation method that transfers knowledge from the prediction
    layers of the teacher BERT model to the student TinyBERT model.
  name: Prediction-layer Distillation
  source_chunk_index: 0
  type: method
- description: A sub-layer within a Transformer layer that captures relationships
    between input tokens through self-attention mechanisms. It calculates a weighted
    sum of values, where the weights are determined by applying a softmax operation
    on the attention matrix.
  name: Multi-Head Attention (MHA)
  source_chunk_index: 0
  type: method
- description: A sub-layer within a Transformer layer, consisting of two linear transformations
    and a ReLU activation function. It processes the output of the Multi-Head Attention
    layer.
  name: Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: method
