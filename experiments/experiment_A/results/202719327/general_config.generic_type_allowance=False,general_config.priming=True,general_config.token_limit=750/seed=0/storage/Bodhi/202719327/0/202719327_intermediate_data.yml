  name: Attention Matrices
  source_chunk_index: 0
  type: method
- description: The logits output by the prediction layer of the teacher BERT model,
    used as a target for the student TinyBERT to mimic during distillation.
  name: Logits Output
  source_chunk_index: 0
  type: method
