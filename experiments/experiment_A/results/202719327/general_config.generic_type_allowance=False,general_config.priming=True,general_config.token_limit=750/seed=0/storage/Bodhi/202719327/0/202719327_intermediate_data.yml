entities:
- description: A method for transferring knowledge from a larger teacher model to
    a smaller student model.
  name: knowledge distillation (KD)
  source_chunk_index: 0
  type: method
- description: A novel distillation method used in TinyBERT.
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: The learning framework used in TinyBERT, consisting of general distillation
    (pre-training) and task-specific distillation (fine-tuning).
  name: two-stage learning framework
  source_chunk_index: 0
  type: method
- description: Techniques used for task-specific distillation in TinyBERT.
  name: data augmentation
  source_chunk_index: 0
  type: method
