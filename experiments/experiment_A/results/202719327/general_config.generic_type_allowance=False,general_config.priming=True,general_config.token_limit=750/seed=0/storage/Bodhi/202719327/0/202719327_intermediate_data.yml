  type: task
- description: One of the objectives of TinyBERT, achieved by using a smaller student
    model.
  name: reduce model size
  source_chunk_index: 0
  type: task
- description: An objective of TinyBERT, ensuring the smaller model performs comparably
    to the larger teacher model.
  name: maintain performance
  source_chunk_index: 0
  type: task
- description: The first stage of the two-stage learning framework in TinyBERT.
  name: general distillation (pre-training)
  source_chunk_index: 0
