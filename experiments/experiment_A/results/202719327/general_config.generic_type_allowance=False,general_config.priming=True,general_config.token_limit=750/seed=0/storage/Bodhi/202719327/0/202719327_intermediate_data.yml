    as a target for the student TinyBERT to mimic during distillation.
  name: Embedding Layer Output
  source_chunk_index: 0
  type: method
- description: The hidden states derived from the Transformer layers of the teacher
    BERT model, used as a target for the student TinyBERT to mimic during distillation.
  name: Hidden States
  source_chunk_index: 0
  type: method
- description: The attention matrices derived from the Transformer layers of the teacher
    BERT model, used as a target for the student TinyBERT to mimic during distillation.
