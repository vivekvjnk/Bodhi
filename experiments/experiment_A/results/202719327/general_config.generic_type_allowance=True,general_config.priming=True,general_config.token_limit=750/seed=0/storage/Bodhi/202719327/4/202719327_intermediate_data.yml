entities:
- description: The process of transferring knowledge from a larger, more complex model
    (BERT) to a smaller model (TinyBERT).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: METHOD
- description: A method used in TinyBERT to transfer knowledge from BERT layers, including
    embedding, hidden states, attention matrices, and prediction layer outputs.
  name: Transformer distillation
  source_chunk_index: 0
  type: METHOD
- description: A pre-training stage where TinyBERT learns knowledge from intermediate
    layers of the teacher BERT model.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: METHOD
- description: A fine-tuning stage where TinyBERT continues learning task-specific
    knowledge from the fine-tuned teacher BERT model.
  name: Task-specific distillation
  source_chunk_index: 0
  type: METHOD
