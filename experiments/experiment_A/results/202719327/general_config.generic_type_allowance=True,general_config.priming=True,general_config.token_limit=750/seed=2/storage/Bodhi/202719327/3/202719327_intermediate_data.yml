chunk_indices:
- 0
entities:
- description: The process of transferring knowledge from a larger, more complex model
    (teacher) to a smaller, simpler model (student), such as TinyBERT.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: METHOD
- description: The text corpus used for general distillation in the TinyBERT learning
    framework.
  name: English Wikipedia
  source_chunk_index: 0
  type: DATASET
- description: A student model designed for knowledge distillation from a larger teacher
    BERT model, aiming to reduce model size and inference time while maintaining performance.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: The teacher model used in the knowledge distillation process, providing
    knowledge to the TinyBERT student model.
  name: BERT
  source_chunk_index: 0
  type: method
- description: The learning approach used by TinyBERT, consisting of general distillation
    (pre-training) and task-specific distillation (fine-tuning).
  name: Two-stage learning framework
  source_chunk_index: 0
  type: generic
- description: A set of natural language understanding tasks used to evaluate the
    performance of TinyBERT.
  name: GLUE benchmark
  source_chunk_index: 0
  type: dataset
- description: A baseline model used for comparison with TinyBERT, employing a different
    knowledge distillation approach.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: Another baseline model used for comparison with TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A smaller version of BERT, used as a baseline and potentially as an
    initialization for TinyBERT.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: A key component of TinyBERT learning, involving the distillation of
    knowledge from the Transformer layers of the teacher model.
  name: Transformer-layer distillation
  source_chunk_index: 0
  type: method
- description: The pre-training stage of the two-stage learning framework, using a
    large corpus like Wikipedia to initialize TinyBERT.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: The fine-tuning stage of the two-stage learning framework, leveraging
    data augmentation and a fine-tuned BERT teacher.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A method used in the task-specific distillation stage to increase the
    size and diversity of the training data.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: Distillation of knowledge from the embedding layer of the teacher model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: Distillation of knowledge from the prediction layer of the teacher
    model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: A task involving linguistic acceptability judgments, used to evaluate
    TinyBERT's performance.
  name: CoLA
  source_chunk_index: 0
  type: task
- description: A natural language inference task used to evaluate TinyBERT's performance.
  name: MNLI
  source_chunk_index: 0
  type: task
- description: A paraphrase identification task used to evaluate TinyBERT's performance.
  name: MRPC
  source_chunk_index: 0
  type: task
- description: A question-pair similarity task used to evaluate TinyBERT's performance.
  name: QQP
  source_chunk_index: 0
  type: task
- description: A question-answering task used to evaluate TinyBERT's performance.
  name: QNLI
  source_chunk_index: 0
  type: task
- description: The layers within the Transformer architecture, including Multi-Head
    Attention (MHA) and Feed Forward Networks (FFN).
  name: Transformer Layers
  source_chunk_index: 0
  type: GENERIC
- description: Functions used to quantify the difference between the predicted output
    of the student model (TinyBERT) and the teacher model (BERT), guiding the knowledge
    distillation process.
  name: Loss Functions
  source_chunk_index: 0
  type: GENERIC
- description: The mathematical functions used to quantify the difference between
    the predicted outputs of the student model (TinyBERT) and the teacher model (BERT),
    guiding the knowledge distillation process. These functions are crucial for training
    the student model to mimic the teacher's behavior.
  name: Loss Functions
  source_chunk_index: 0
  type: GENERIC
