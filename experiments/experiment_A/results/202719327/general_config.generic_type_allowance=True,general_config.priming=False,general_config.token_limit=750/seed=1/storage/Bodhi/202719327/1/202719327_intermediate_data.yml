chunk_indices:
- 0
entities:
- description: A student model designed to capture linguistic knowledge from teacher
    BERT, achieving comparable results with fewer parameters and less inference time.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A pre-trained language model used as a teacher model to transfer linguistic
    knowledge to TinyBERT.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method specifically designed for Transformer-based
    models, used to transfer knowledge from teacher BERT to student TinyBERT.
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: A method used to transfer knowledge from a larger, more complex model
    (teacher) to a smaller, less complex model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A neural network architecture that captures long-term dependencies
    between input tokens using self-attention mechanisms.
  name: Transformer
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer architecture that allows the model
    to attend to different parts of the input sequence.
  name: Multi-head attention (MHA)
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer architecture that contains two linear
    transformations and one ReLU activation.
  name: Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: method
- description: A benchmark used to evaluate the performance of natural language understanding
    models.
  name: GLUE tasks
  source_chunk_index: 0
  type: task
- description: The initial training phase of a language model, where the model learns
    general linguistic knowledge from a large corpus of text.
  name: Pre-training
  source_chunk_index: 0
  type: generic
- description: The process of adapting a pre-trained model to a specific downstream
    task.
  name: Fine-tuning
  source_chunk_index: 0
  type: generic
- description: A matrix that captures the attention weights between different tokens
    in the input sequence, used in the Transformer architecture.
  name: Attention matrix (A)
  source_chunk_index: 0
  type: generic
- description: A learning framework that performs Transformer distillation at both
    the pre-training and fine-tuning stages.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: method
- description: A distillation technique that focuses on transferring knowledge from
    the embedding layer of the teacher model to the student model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique that focuses on transferring knowledge from
    the prediction layer of the teacher model to the student model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: The specific mathematical formulations or equations used to quantify
    the difference between the student and teacher models during Transformer distillation.
    These are crucial for defining the learning objective and guiding the training
    process.
  name: Loss Functions
  source_chunk_index: 0
  type: generic
- description: References to the specific equations that define the loss functions
    used in the Transformer distillation process. These equations are essential for
    understanding the technical details of the method.
  name: Equations 7, 8, 9, and 10
  source_chunk_index: 0
  type: generic
- description: The specific natural language processing tasks (e.g., GLUE tasks) for
    which TinyBERT is fine-tuned after the general domain pre-training. These tasks
    define the practical application and evaluation of the method.
  name: Downstream Tasks
  source_chunk_index: 0
  type: task
- description: The specific mathematical functions used to quantify the difference
    between the student model's output and the teacher model's output during distillation.
    These functions guide the learning process by penalizing discrepancies and driving
    the student model to mimic the teacher's behavior. Examples include the attention-based
    distillation loss, embedding-layer distillation loss, and prediction-layer distillation
    loss.
  name: Loss Functions
  source_chunk_index: 0
  type: generic
- description: The broad, non-task-specific textual data used to pre-train the TinyBERT
    model. This data provides the model with general linguistic knowledge before fine-tuning
    on specific downstream tasks. The text from general domain is used for the Transformer
    distillation.
  name: General Domain
  source_chunk_index: 0
  type: dataset
- description: The specific loss functions used in the Transformer distillation process.
    This includes the equations (7, 8, 9, and 10) mentioned in the text, which are
    used to unify the loss of model layers.
  name: Loss Functions
  source_chunk_index: 0
  type: generic
- description: The datasets used for pre-training the general TinyBERT model. These
    datasets are from the general domain.
  name: General Domain Datasets
  source_chunk_index: 0
  type: dataset
- description: The datasets used for fine-tuning the TinyBERT model for downstream
    tasks.
  name: Task-Specific Datasets
  source_chunk_index: 0
  type: dataset
