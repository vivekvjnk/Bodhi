      \ feed - forward network , which is formulated as follows : We can see that\
      \ the FFN contains two linear transformations and one ReLU activation .In the\
      \ context of Transformer distillation , the output of MHA layer or FFN layer\
      \ , or some intermediate representations ( e.g. the attention matrix A ) can\
      \ be used as behavior function .Different from previous KD methods , we also\
      \ need to consider how to perform KD at the pre - training stage of BERT , which\
