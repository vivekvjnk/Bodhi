    text_unit: 'Language model pre - training , such as BERT , has significantly improved
      the performances of many natural language processing tasks .To accelerate inference
      and reduce model size while maintaining accuracy , we first propose a novel
      Transformer distillation method that is specially designed for knowledge distillation
      ( KD ) of the Transformer - based models .By leveraging this new KD method ,
      the plenty of knowledge encoded in a large teacher BERT can be effectively transferred
      to a small student Tiny - BERT .Then , we introduce a new two - stage learning
      framework for TinyBERT , which performs Transformer distillation at both the
      pretraining and task - specific learning stages .This framework ensures that
      TinyBERT can capture he general - domain as well as the task - specific knowledge
      in BERT .TinyBERT with 4 layers is empirically effective and achieves more than
      9 6 . 8 % the performance of its teacher BERTBASE on GLUE benchmark , while
      being 7. 5 x smaller and 9. 4 x faster on inference .TinyBERT with 4 layers
      is also significantly better than 4 - layer state - of - the - art baselines
      on BERT distillation , with only about 2 8 % parameters and about 3 1 % inference
      time of them .Moreover , TinyBERT with 6 layers performs on - par with its teacher
      BERTBASE .Pre - training language models then fine - tuning on downstream tasks
      has become a new paradigm for natural language processing ( NLP ) .Pre - trained
      language models ( PLMs ) , such as BERT ( Devlin et al. , 2 0 1 8) , XLNet (
      Yang et al. , 2 0 1 9 ) , RoBERTa and SpanBERT , have achieved great success
      in many NLP tasks ( e.g. , the GLUE benchmark ( Wang et al. , 2 0 1 8) and the
      challenging multi - hop reasoning task ( Ding et al. , 2 0 1 9 ) ) .The most
      commonly used techniques include quantization ( Gong et al. , 2 0 1 4 ) , weights
      pruning ( Han et al. , 2 0 1 5 b ) , and knowledge distillation ( KD ) ( Romero
      et al. , 2 0 1 4 ) .Based on the framework , we propose a novel distillation
      method specifically for Transformer - based models ( Vaswani et al. , 2 0 1
      7 ) , and use BERT as an example to investigate the KD methods for large scale
      PLMs .Under review KD has been extensively studied in NLP ( Kim & Rush , 2 0
      1 6 ; Hu et al. , 2 0 1 8) , while designing KD methods for BERT has been less
      explored .The pre - training - then - fine - tuning paradigm firstly pre - trains
      BERT on a large scale unsupervised text corpus , then fine - tunes it on task
      - specific dataset , which greatly increases the difficulty of BERT distillation
      .To build a competitive TinyBERT , we firstly propose a new Transformer distillation
      method to distill the knowledge embedded in teacher BERT .Specifically , we
      design several loss functions to fit different representations from BERT layers
      : 1 ) the output of the embedding layer ; 2 ) the hidden states and attention
      matrices derived from the Transformer layer ; 3 ) the logits output by the prediction
      layer .The attention based fitting is inspired by the recent findings ( Clark
      et al. , 2 0 1 9 ) that the attention weights learned by BERT can capture substantial
      linguistic knowledge , which encourages that the linguistic knowledge can be
      well transferred from teacher BERT to student TinyBERT .However , it is ignored
      in existing KD methods of BERT , such as Distilled BiLSTM SOFT , BERT - PKD
      ( Sun et al. , 2 0 1 9 ) and DistilBERT 2 .The student TinyBERT learns to mimic
      the teacher ''s behavior by executing the proposed Transformer distillation
      on the large scale corpus from general domain .At the task - specific distillation
      stage , we perform the data augmentation to provide more task - related materials
      for teacherstudent learning , and then re - execute the Transformer distillation
      on the augmented data .TinyBERT ( our method ) The main contributions of this
      work are as follows : 1 )'
