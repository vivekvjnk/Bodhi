    text_unit: "Another interesting observation is that the smallest 4 - layer TinyBERT\
      \ can even outperform the 6 - layers baselines , which further confirms the\
      \ effectiveness of the proposed KD method .The proposed two - stage TinyBERT\
      \ learning framework ( see Figure 2 ) consists of three key procedures : TD\
      \ ( Task - specific Distillation ) , GD ( General Distillation ) and DA ( Data\
      \ Augmentation ) .TheTD and DA has comparable effects in all the four tasks\
      \ .We can also find the task - specific procedures ( TD and DA ) are more helpful\
      \ than the pre - training procedure ( GD ) in all the four tasks .Another interesting\
      \ observation is that GD has more effect on CoLA than on MNLI and MRPC .We conjecture\
      \ that the ability of linguistic generalization ( Warstadt et al. , 2 0 1 8)\
      \ learned by GD plays a more important role in the downstream CoLA task ( linguistic\
      \ acceptability judgments ) .Several baselines are proposed including the TinyBERT\
      \ learning without the Transformer - layer distillation ( No Trm ) , embedding\
      \ - layer distillation ( No Emb ) and predictionlayer distillation ( No Pred\
      \ ) 6 respectively .The performance drops significantly from 7 5 . 3 to 5 6\
      \ . 3 under the setting ( No Trm ) , which indicates Transformer - layer distillation\
      \ is the key for TinyBERT learning .Meanwhile , these two kinds of knowledge\
      \ distillation are complementary to each other , which makes TinyBERT obtain\
      \ the competitive results .We find that the top - strategy performs better than\
      \ the bottom - strategy in MNLI , while being worse in MRPC and CoLA tasks ,\
      \ which confirms the observations that different tasks depend on the different\
      \ kinds of knowledge from BERT layers .We also evaluate TinyBERT on the question\
      \ answering tasks , and study whether we can use BERT SMALL as the initialization\
      \ of the general TinyBERT .The experiments are detailed in Appendix C and D.\
      \ In this paper , we firstly introduce a new KD method for Transformer - based\
      \ distillation , then we further propose a two - stage framework for TinyBERT\
      \ learning .Extensive experiments show that the TinyBERT achieves competitive\
      \ performances meanwhile significantly reducing the model size and shortening\
      \ the inference time of original BERT BASE , which provides an effective way\
      \ to deploy BERT - based NLP applications on the edge devices .In future work\
      \ , we would study how to effectively transfer the knowledge from wider and\
      \ deeper teachers ( e.g. , BERT LARGE and XLNet LARGE ) to student TinyBERT\
      \ .The joint learning of distillation and quantization/pruning would be another\
      \ promising direction to further compress the pre - trained language models\
      \ . In this section , we explain the proposed data augmentation method .TinyBERT\
      \ learning includes the general distillation and the task - specific distillation\
      \ .For the general distillation , we use English Wikipedia ( 2, 5 0 0 M words\
      \ ) as the text corpus and perform the intermediate layer distillation for 3\
      \ epochs with the supervision from a pre - trained BERT BASE teacher and keep\
      \ other hyper - parameters same as BERT pre - training ( Devlin et al. , 2 0\
      \ 1 8) .For task - specific distillation , we firstly perform intermediate layer\
      \ distillation on the augmented dataset for 1 0 epochs with batch size 3 2 and\
      \ learning rate 5e - 5 under the supervision of a fine - tuned BERT teacher\
      \ , and then perform prediction layer distillation for 3 epochs with batch size\
      \ 3 2 and learning rate 3e - 5 .For tasks like MNLI , QQP and QNLI which have\
      \ \u2265 1 0 0 K training examples , we distill intermediate layer knowledge\
      \ for 5 epochs with batch size 2 5 6 on the augmented dataset .Besides , for\
      \ CoLA task , we perform 5 0 epochs of intermediate layer distillation .We use\
      \ BERT - PKD and DistilBERT as our baselines .For a fair comparison , we firstly\
      \ re - implemented the results of BERT - PKD and DistilBERT reported in their\
      \ papers to ensure our implementation procedure is correct .Then following the\
      \ verified implementation procedure , we trained a 4 - layer BERT - PKD and\
      \ a 4 - layer DistilBERT as the baselines .The BERT SMALL learning strictly\
      \ follows the same learning strategy as described in the original BERT work\
      \ ( Devlin et al. , 2 0 1 8) .The"
