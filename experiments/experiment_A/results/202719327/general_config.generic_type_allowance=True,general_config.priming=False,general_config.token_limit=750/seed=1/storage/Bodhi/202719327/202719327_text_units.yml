    text_unit: 'GLUE datasets are described as follows : MNLI .TheStanford Sentiment
      Treebank is a binary single - sentence classification task , where the goal
      is to predict the sentiment of movie reviews ( Socher et al. , 2 0 1 3 ) .C
      SQUAD 1. 1 AND 2. 0 We also demonstrate the effectiveness of TinyBERT on the
      question answering ( QA ) tasks : SQuAD v 1 . 1 ( Rajpurkar et al. , 2 0 1 6
      ) and v 2 . 0 ( Rajpurkar et al. , 2 0 1 8) .We follow the settings of task
      - specific distillation in GLUE tasks , except with 3 running epochs and a learning
      rate of 5e - 5 for the prediction - layer distillation on the original training
      dataset .Compared with sequence - level GLUE tasks , the question answering
      tasks depends on more subtle knowledge to infer the correct answer , which increases
      the difficulty of knowledge distillation .Initializing general TinyBERT with
      BERT SMALL is a straightforward idea .However , BERT SMALL would derive mismatched
      distributions in intermediate representations ( e.g. , attention matrices and
      hidden states ) with the teacher BERT BASE model , if without imitating the
      teacher ''s behaviors at the pre - training stage .Further task - specific distillation
      under the supervision of BERT BASE will disturb the learned distribution/knowledge
      of BERT SMALL , finally leading to poor performances in some less - data tasks
      .The results in Table 9 , show that the BERT SMALL ( MLM&NSP+TD ) performs worse
      than the BERT SMALL in MRPC and CoLA tasks , which validates our hypothesis
      .For the intensive - data task ( e.g. MNLI ) , TD learning has enough learning
      materials to make BERT SMALL acquire the task - specific knowledge very well
      , although the pre - trained distributions have already been disturbed .To make
      TinyBERT effectively work for all tasks , we propose General Distillation (
      GD ) for initialization , where the TinyBERT learns the knowledge from intermediate
      layers of teacher BERT at the pre - training stage .From the results of Table
      9 , we find that GD can effectively transfer the knowledge from the teacher
      BERT to the student TinyBERT and achieve comparable results with BERT SMALL
      ( 6 1 . 1 vs 6 3 . 9 ) , even without performing the MLM and NSP tasks .Furthermore
      , the task - specific distillation boosts the performances of TinyBERT by continuing
      on learning the taskspecific knowledge of fine - tuned teacher BERT BASE .'
