    text_unit: "We propose a new Transformer distillation method to encourage that\
      \ the linguistic knowledge encoded in teacher BERT can be well transferred to\
      \ TinyBERT .2 ) We propose a novel two - stage learning framework with performing\
      \ the proposed Transformer distillation at both the pre - training and fine\
      \ - tuning stages , which ensures that Tiny - BERT can capture both the general\
      \ - domain and task - specific knowledge of the teacher BERT . 3 ) We show experimentally\
      \ that our TinyBERT can achieve comparable results with teacher BERT on GLUE\
      \ tasks , while having much fewer parameters ( \u223C 1 3 . 3 % ) and less inference\
      \ time ( \u223C 1 0 . 6 % ) , and significantly outperforms other state - of\
      \ - the - art baselines on BERT distillation .We firstly describe the formulation\
      \ of Transformer ( Vaswani et al. , 2 0 1 7 ) and Knowledge Distillation ( Hinton\
      \ et al. , 2 0 1 5 ) .Our proposed Transformer distillation is a specially designed\
      \ KD method for Transformer - based models .Most of recent pre - trained language\
      \ models ( e.g. , BERT , XLNet and RoBERTa ) are built with Transformer layers\
      \ , which can capture long - term dependencies between input tokens by self\
      \ - attention mechanism .Specifically , a standard Transformer layer includes\
      \ two main sub - layers : multi - head attention ( MHA ) and fully connected\
      \ feed - forward network ( FFN ) .Multi - Head Attention ( MHA ) .The final\
      \ function output is calculated as a weighted sum of values V , and the weight\
      \ is computed by applying softmax ( ) operation on the matrix A. The attention\
      \ matrices A of BERT can capture substantial linguistic knowledge and plays\
      \ an essential role in our proposed distillation method .Position - wise Feed\
