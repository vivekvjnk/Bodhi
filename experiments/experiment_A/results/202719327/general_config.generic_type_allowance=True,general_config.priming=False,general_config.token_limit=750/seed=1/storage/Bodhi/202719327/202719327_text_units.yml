    text_unit: "the task - specific distillation , we re - perform the proposed Transformer\
      \ distillation on augmented task - specific dataset ( as shown in Figure 2 )\
      \ .Specifically , the fine - tuned big BERT is used as the teacher and a new\
      \ data augmentation method is proposed to extend the task - specific training\
      \ set.In this work , we combine a pre - trained language model BERT and GloVe\
      \ ( Pennington et al. , 2 0 1 4 ) word embeddings to do word - level replacement\
      \ for data augmentation .More details of data augmentation procedure are discussed\
      \ in Appendix A. The above two learning stages are complementary to each other\
      \ : the general distillation provides a good initialization for the task - specific\
      \ distillation , while the task - specific distillation further improves TinyBERT\
      \ by focusing on learning the task - specific knowledge .Although there is a\
      \ big gap between BERT and TinyBERT in model size , by performing the proposed\
      \ two - stage distillation , the TinyBERT can achieve comparable performances\
      \ as large BERT in various NLP tasks .We use g(m ) = 3 \xD7 m as the layer mapping\
      \ function , so TinyBERT learns from every 3 layers of BERT BASE .We evaluate\
      \ TinyBERT on the General Language Understanding Evaluation ( GLUE ) ( Wang\
      \ et al. , 2 0 1 8) benchmark , which is a collection of diverse natural language\
      \ understanding tasks .The experiment results demonstrate that : 1 ) There is\
      \ a large performance gap between BERT SMALL and BERT BASE due to the big reduction\
      \ in model size . 2 ) TinyBERT is consistently better than BERT SMALL in all\
      \ the GLUE tasks and achieves a large improvement of 6. 3 % on average .This\
      \ indicates that the proposed KD learning framework can effectively improve\
      \ the performances of small models regardless of downstream tasks . 3 ) TinyBERT\
      \ significantly outperforms the state - ofthe - art KD baselines ( i.e. , BERT\
      \ - PKD and DistillBERT ) by a margin of at least 3. 9 % , even with only \u223C\
      \ 2 8 % parameters and \u223C 3 1 % inference time of baselines ( see Table\
      \ 3 ) . 4 ) Compared with the teacher BERT BASE , TinyBERT is 7. 5 x smaller\
      \ and 9. 4 x faster in the model efficiency , while maintaining comparable performances\
      \ . 5 ) TinyBERT has a comparable model efficiency ( slightly larger in size\
      \ but faster in inference ) with Distilled BiLSTM SOFT and obtains substantially\
      \ better performances in all tasks reported by the BiLSTM baseline . 6 ) For\
      \ the challenging CoLA dataset ( the task of predicting linguistic acceptability\
      \ judgments ) , all the distilled small models have a relatively bigger performance\
      \ gap with teacher model .Moreover , BERT - PKD and DistillBERT initialize their\
      \ student models with some layers of well pre - trained teacher BERT ( see Table\
      \ 1 ) , which makes the student models have to keep the same size settings of\
      \ Transformer layer ( or embedding layer ) as their teacher BERT .We evaluate\
      \ how much improvement can be achieved when increasing the model size of TinyBERT\
      \ on several typical GLUE tasks , where MNLI and MRPC are used in the ablation\
      \ studies of Devlin et al. ( 2 0 1 8) , and CoLA is the most difficult task\
      \ in GLUE .We can observe that : 1 ) All the three TinyBERT variants can consistently\
      \ outperform the original smallest TinyBERT , which indicates that the proposed\
      \ KD method works for the student models of various model sizes . 2 ) For the\
      \ CoLA task , the improvement is slight when only increasing the number of layers\
      \ ( from 4 9 . 7 to 5 0 . 6 ) or hidden size ( from 4 9 . 7 to 5 0 . 5 ) .To\
      \ achieve more dramatic improve - ments , the student model should become deeper\
      \ and wider ( from 4 9 . 7 to 5 4 . 0 ) . 3 )"
