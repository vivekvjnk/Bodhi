  type: method
- description: A baseline model used for comparison with TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: The learning rate used during the task-specific distillation phase.
    For intermediate layer distillation, it is 5e-5, and for prediction layer distillation,
    it is 3e-5.
  name: Learning Rate for Task-Specific Distillation
  source_chunk_index: 0
  type: generic
- description: The batch size used during the task-specific distillation phase. It
    is 32 for both intermediate and prediction layer distillation, except for tasks
    like MNLI, QQP, and QNLI, where it is 256.
  name: Batch Size for Task-Specific Distillation
  source_chunk_index: 0
  type: generic
- description: The number of epochs used for intermediate layer distillation on tasks
    like MNLI, QQP, and QNLI, which have >= 100K training examples. The value is 5.
  name: Epochs for Intermediate Layer Distillation (MNLI, QQP, QNLI)
  source_chunk_index: 0
  type: generic
- description: The number of epochs used for intermediate layer distillation on the
    CoLA task. The value is 50.
  name: Epochs for Intermediate Layer Distillation (CoLA)
  source_chunk_index: 0
  type: generic
- description: A distillation strategy focused on the specific tasks for which TinyBERT
    is being trained.
  name: Task-specific Distillation
  source_chunk_index: 0
  type: method
- description: A distillation strategy that uses a general corpus (English Wikipedia
    in this case) to transfer knowledge from the teacher model.
  name: General Distillation
  source_chunk_index: 0
  type: method
- description: The teacher model used for general distillation.
  name: BERT BASE
  source_chunk_index: 0
  type: method
- description: The teacher model used for task-specific distillation.
  name: Fine-tuned BERT teacher
  source_chunk_index: 0
  type: method
- description: The number of epochs used for general distillation, which is specified
    as 3 epochs.
  name: Number of Epochs for General Distillation
  source_chunk_index: 0
  type: generic
- description: The learning rate used for prediction layer distillation, which is
    specified as 3e-5.
  name: Learning Rate for Prediction Layer Distillation
  source_chunk_index: 0
  type: generic
