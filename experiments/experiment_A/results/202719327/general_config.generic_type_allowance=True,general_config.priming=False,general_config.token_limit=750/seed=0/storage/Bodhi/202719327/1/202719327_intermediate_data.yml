  name: Transformer
  source_chunk_index: 0
  type: method
- description: A technique used to transfer knowledge from a larger, more complex
    model (teacher) to a smaller, more efficient model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer architecture that allows the model
    to attend to different parts of the input sequence.
  name: Multi-head attention (MHA)
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer architecture that performs non-linear
    transformations on the output of the multi-head attention layer.
