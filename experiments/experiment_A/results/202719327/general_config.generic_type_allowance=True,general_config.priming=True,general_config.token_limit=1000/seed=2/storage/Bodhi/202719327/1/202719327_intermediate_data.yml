chunk_indices:
- 0
entities:
- description: The process of transferring knowledge from a larger, more complex model
    (teacher) to a smaller, simpler model (student), such as TinyBERT, to improve
    performance and efficiency.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: METHOD
- description: A specifically designed knowledge distillation method for Transformer
    networks, used in the two-stage learning framework of TinyBERT.
  name: Transformer distillation
  source_chunk_index: 0
  type: METHOD
- description: The learning approach used by TinyBERT, consisting of general distillation
    (pre-training) and task-specific distillation (fine-tuning).
  name: Two-stage learning framework
  source_chunk_index: 0
  type: METHOD
- description: A smaller student model designed to learn from a larger teacher BERT
    model through knowledge distillation, aiming for faster inference and reduced
    model size while maintaining performance.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A collection of diverse natural language understanding tasks used to
    evaluate the performance of TinyBERT.
  name: GLUE benchmark
  source_chunk_index: 0
  type: dataset
- description: A method used to expand the task-specific training dataset, involving
    word-level replacement using a pre-trained language model and word embeddings.
  name: Data augmentation
  source_chunk_index: 0
  type: method
- description: The first stage of the two-stage learning framework, using a large
    corpus to initialize TinyBERT and improve its generalization capability.
  name: General distillation
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning framework, which re-performs
    Transformer distillation on an augmented task-specific dataset to further improve
    TinyBERT.
  name: Task-specific distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique that focuses on transferring knowledge from
    the embedding layer of the teacher model to the student model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique that focuses on transferring knowledge from
    the prediction layer of the teacher model to the student model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: A component of the BERT model used in the Transformer distillation
    process, specifically as a fitting target to transfer linguistic knowledge from
    the teacher to the student model.
  name: Attention matrix A
  source_chunk_index: 0
  type: generic
- description: A component of the Transformer layer that calculates the final function
    output as a weighted sum of values.
  name: Head Attention (MHA)
  source_chunk_index: 0
  type: generic
- description: The teacher model used in the knowledge distillation process, providing
    the knowledge that TinyBERT learns from.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A fully connected network within the Transformer layer, consisting
    of two linear transformations and a ReLU activation function. Its output, along
    with the output of the MHA layer, can be used as a behavior function in Transformer
    distillation.
  name: Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: method
- description: A baseline method for knowledge distillation, specifically for BERT,
    used for comparison with TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A baseline method for knowledge distillation, used for comparison with
    TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: Word embeddings used in conjunction with a pre-trained language model
    BERT for word-level replacement during data augmentation in the task-specific
    distillation stage.
  name: GloVe word embeddings
  source_chunk_index: 0
  type: method
- description: The specific mathematical formulations used to quantify the difference
    between the student and teacher models' outputs during the Transformer distillation
    process. These equations define the objectives for knowledge transfer from BERT
    to TinyBERT, encompassing various distillation targets like hidden states, attention
    matrices, and prediction layers.
  name: Loss Functions (Equations 7, 8, 9, and 10)
  source_chunk_index: 0
  type: method
- description: A function that determines the correspondence between layers in the
    teacher BERT model and the student TinyBERT model. In this case, it specifies
    that TinyBERT learns from every 3 layers of the BERT BASE model, enabling knowledge
    transfer across different architectural depths.
  name: "Layer Mapping Function (g(m) = 3 \xD7 m)"
  source_chunk_index: 0
  type: method
