    distills knowledge.
  name: BERT
  source_chunk_index: 0
  type: generic
- description: The process of transferring knowledge from a larger teacher model (BERT)
    to a smaller student model (TinyBERT).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A benchmark used to evaluate the performance of TinyBERT, including
