chunk_indices:
- 0
entities:
- description: A technique used to transfer knowledge from a larger, more complex
    model (teacher) to a smaller, more efficient model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: METHOD
- description: A novel distillation method specifically designed for Transformer-based
    models, used to transfer knowledge from BERT to TinyBERT.
  name: Transformer distillation
  source_chunk_index: 0
  type: METHOD
- description: A smaller student model based on BERT, designed for faster inference
    and reduced size through knowledge distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A large Transformer-based language model used as the teacher model
    in knowledge distillation to train TinyBERT.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A benchmark used to evaluate the performance of language models on
    various natural language processing tasks.
  name: GLUE benchmark
  source_chunk_index: 0
  type: dataset
- description: A learning approach for TinyBERT that includes general distillation
    (pre-training) and task-specific distillation (fine-tuning).
  name: Two-stage learning framework
  source_chunk_index: 0
  type: generic
- description: A layer in the BERT model from which knowledge is distilled to TinyBERT.
  name: Embedding layer
  source_chunk_index: 0
  type: generic
- description: Internal representations of the BERT model's layers, used in the Transformer
    distillation process.
  name: Hidden states
  source_chunk_index: 0
  type: generic
- description: Matrices representing the attention weights in the Transformer layers,
    used in the Transformer distillation process.
  name: Attention matrices
  source_chunk_index: 0
  type: generic
- description: The output of the prediction layer in BERT, used in the Transformer
    distillation process.
  name: Prediction layer logits
  source_chunk_index: 0
  type: generic
- description: A baseline model used for comparison with TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A baseline model used for comparison with TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A technique used to increase the diversity of training data, particularly
    in the task-specific distillation stage, to improve model performance.
  name: Data augmentation
  source_chunk_index: 0
  type: method
- description: The initial stage of the two-stage learning framework, where TinyBERT
    is trained on a large corpus.
  name: Pre-training
  source_chunk_index: 0
  type: generic
- description: The second stage of the two-stage learning framework, where TinyBERT
    is trained on task-specific data.
  name: Fine-tuning
  source_chunk_index: 0
  type: generic
- description: Several loss functions are designed to fit different representations
    from BERT layers, including the output of the embedding layer, the hidden states
    and attention matrices derived from the Transformer layer, and the logits output
    by the prediction layer.
  name: Loss Functions
  source_chunk_index: 0
  type: method
- description: A large-scale unsupervised text corpus used for pre-training TinyBERT
    in the general distillation stage.
  name: Wikipedia
  source_chunk_index: 0
  type: dataset
- description: The initial layer in the BERT model that transforms input tokens into
    vector representations. The output of this layer is used in one of the loss functions
    for the Transformer distillation method.
  name: Embedding layer
  source_chunk_index: 0
  type: method
- description: The internal representations of the input data at each layer of the
    Transformer model. These are derived from the Transformer layer and are used in
    one of the loss functions for the Transformer distillation method.
  name: Hidden states
  source_chunk_index: 0
  type: method
- description: Matrices that represent the attention weights learned by the Transformer
    layers, capturing relationships between different parts of the input sequence.
    These are derived from the Transformer layer and are used in one of the loss functions
    for the Transformer distillation method.
  name: Attention matrices
  source_chunk_index: 0
  type: method
- description: The output of the prediction layer in the BERT model, representing
    the model's predictions. These are used in one of the loss functions for the Transformer
    distillation method.
  name: Logits
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer layer that allows the model to attend
    to different parts of the input sequence simultaneously.
  name: Multi-head attention (MHA)
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer layer that applies a feed-forward
    network to each position independently.
  name: Fully connected feed-forward network (FFN)
  source_chunk_index: 0
  type: method
- description: The specific loss functions designed to fit different representations
    from BERT layers during Transformer distillation. These include loss functions
    for the embedding layer output, hidden states and attention matrices from the
    Transformer layer, and logits from the prediction layer.
  name: Loss functions
  source_chunk_index: 0
  type: method
- description: A large-scale unsupervised text corpus used for the general distillation
    (pre-training) stage of TinyBERT.
  name: Wikipedia
  source_chunk_index: 0
  type: dataset
- description: The technique used to provide more task-related materials for teacher-student
    learning during the task-specific distillation stage.
  name: Data augmentation
  source_chunk_index: 0
  type: method
