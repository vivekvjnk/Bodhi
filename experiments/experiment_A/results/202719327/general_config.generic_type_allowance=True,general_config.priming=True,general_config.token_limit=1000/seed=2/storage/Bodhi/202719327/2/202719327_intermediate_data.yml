    in the task-specific distillation and general distillation.
  name: Batch Size
  source_chunk_index: 0
  type: GENERIC
- description: A hyperparameter that controls the step size at each iteration while
    moving toward a minimum of a loss function. Used in the task-specific distillation
    and general distillation.
  name: Learning Rate
  source_chunk_index: 0
  type: GENERIC
