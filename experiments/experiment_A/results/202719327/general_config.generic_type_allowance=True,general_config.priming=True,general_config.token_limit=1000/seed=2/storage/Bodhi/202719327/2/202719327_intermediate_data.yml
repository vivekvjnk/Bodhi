  type: dataset
- description: A smaller version of the BERT model used as a baseline and for initialization
    in the experiments. It follows the same learning strategy as described in the
    original BERT work.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: A baseline model, the implementation of which was re-implemented to
