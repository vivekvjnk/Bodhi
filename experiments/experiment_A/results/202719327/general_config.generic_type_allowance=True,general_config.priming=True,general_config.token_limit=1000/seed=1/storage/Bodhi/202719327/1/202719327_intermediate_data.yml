chunk_indices:
- 0
entities:
- description: The process of transferring knowledge from a larger teacher model (BERT)
    to a smaller student model (TinyBERT).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: METHOD
- description: A knowledge distillation method specifically designed for Transformer
    architectures.
  name: Transformer Distillation
  source_chunk_index: 0
  type: METHOD
- description: The student model, a smaller and faster version of BERT, designed for
    knowledge distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: The teacher model, a Transformer-based language model, from which knowledge
    is distilled.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A learning method for TinyBERT, involving general and task-specific
    distillation stages.
  name: Two-Stage Learning
  source_chunk_index: 0
  type: method
- description: Used as fitting targets in the distillation process to transfer linguistic
    knowledge from the teacher to the student model.
  name: Attention Matrices
  source_chunk_index: 0
  type: generic
- description: The initial stage of the two-stage learning method, focusing on transferring
    general knowledge from BERT to TinyBERT.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning method, focusing on fine-tuning
    TinyBERT for specific tasks using data augmentation.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: Used in the task-specific distillation stage to expand the task-specific
    dataset, improving TinyBERT's performance.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A benchmark used to evaluate TinyBERT's performance across various
    natural language understanding tasks.
  name: GLUE Benchmark
  source_chunk_index: 0
  type: dataset
- description: A layer within the Transformer architecture, containing components
    like Multi-Head Attention and Feed-Forward Networks.
  name: Transformer layer
  source_chunk_index: 0
  type: generic
- description: A fully connected network within the Transformer layer.
  name: Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: generic
- description: A component within the Transformer layer that captures relationships
    between different parts of the input sequence.
  name: Multi-Head Attention (MHA)
  source_chunk_index: 0
  type: generic
- description: A smaller version of BERT used as a baseline for comparison.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: A knowledge distillation baseline method used for comparison with TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A knowledge distillation baseline method used for comparison with TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A smaller version of BERT used as a baseline to evaluate the performance
    of TinyBERT.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: A component of the Transformer distillation method, focusing on transferring
    knowledge from the embedding layer of the teacher model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A component of the Transformer distillation method, focusing on transferring
    knowledge from the prediction layer of the teacher model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: A distillation method that uses the attention matrix as the fitting
    target to transfer linguistic knowledge from the teacher BERT to the student TinyBERT.
  name: Attention based distillation
  source_chunk_index: 0
  type: method
- description: Designed to fit different representations from BERT layers (embedding,
    hidden states, attention matrices, logits) during the distillation process. Equations
    7, 8, 9 and 10 are used to unify the loss of model layer.
  name: Loss Functions
  source_chunk_index: 0
  type: method
- description: The mathematical functions used to quantify the difference between
    the student model's output and the teacher model's output, guiding the knowledge
    distillation process. These functions are designed to fit different representations
    from BERT layers (embedding, hidden states, attention matrices, logits).
  name: Loss Functions
  source_chunk_index: 0
  type: method
