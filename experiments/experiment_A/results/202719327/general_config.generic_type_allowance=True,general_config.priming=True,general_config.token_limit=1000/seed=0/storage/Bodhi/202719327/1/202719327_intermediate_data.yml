chunk_indices:
- 0
entities:
- description: The process of transferring knowledge from a larger, more complex model
    (teacher) to a smaller, simpler model (student), such as TinyBERT, to improve
    efficiency and performance.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: METHOD
- description: A specifically designed knowledge distillation method for Transformer
    networks, focusing on distilling knowledge from various layers of the BERT teacher
    model.
  name: Transformer distillation
  source_chunk_index: 0
  type: METHOD
- description: A collection of diverse natural language understanding tasks used to
    evaluate the performance of TinyBERT and compare it against other models.
  name: GLUE benchmark
  source_chunk_index: 0
  type: DATASET
- description: A smaller student model designed to learn from a larger teacher BERT
    model through knowledge distillation, aiming for faster inference and reduced
    size while maintaining performance.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A large Transformer-based language model used as the teacher model
    in the knowledge distillation process to transfer knowledge to TinyBERT.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A component of the BERT model used in the Transformer distillation
    process, specifically as a fitting target to transfer linguistic knowledge from
    the teacher to the student model.
  name: Attention matrix A
  source_chunk_index: 0
  type: generic
- description: A component of the Transformer layer that calculates a weighted sum
    of values, with weights computed by applying a softmax operation on the attention
    matrix A.
  name: Head Attention (MHA)
  source_chunk_index: 0
  type: generic
- description: A method used to increase the size and diversity of the training data,
    particularly in the task-specific distillation stage, to improve the performance
    of TinyBERT.
  name: Data augmentation
  source_chunk_index: 0
  type: method
- description: The first stage of the two-stage learning framework, using a large
    corpus to initialize TinyBERT and help it learn rich knowledge from the teacher
    BERT.
  name: General distillation
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning framework, which re-performs
    Transformer distillation on an augmented task-specific dataset to further improve
    TinyBERT's performance.
  name: Task-specific distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique that focuses on transferring knowledge from
    the embedding layer of the teacher BERT model to the student TinyBERT model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique that focuses on transferring knowledge from
    the prediction layer of the teacher BERT model to the student TinyBERT model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method used as a baseline for comparison with
    TinyBERT. It is a variant of BERT that uses knowledge distillation.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method used as a baseline for comparison with
    TinyBERT. It is a distilled version of BERT, designed to be smaller and faster
    while maintaining performance.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A benchmark for evaluating the performance of natural language understanding
    systems, consisting of a collection of diverse natural language understanding
    tasks.
  name: GLUE
  source_chunk_index: 0
  type: dataset
- description: A fully connected feed-forward network within the Transformer layer,
    consisting of two linear transformations and a ReLU activation function. Its output,
    or intermediate representations, can be used in Transformer distillation.
  name: Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: method
- description: Word embeddings from the GloVe model, used in conjunction with a pre-trained
    language model BERT for word-level replacement during data augmentation in the
    task-specific distillation stage.
  name: GloVe word embeddings
  source_chunk_index: 0
  type: method
- description: The specific mathematical formulations used to quantify the difference
    between the teacher and student models' outputs during the distillation process.
    These equations define the objectives that TinyBERT aims to optimize to learn
    from BERT.
  name: Loss Functions (Equations 7, 8, 9, and 10)
  source_chunk_index: 0
  type: method
- description: "The function, g(m) = 3 \xD7 m, that determines which layers of the\
    \ teacher BERT model are used to train the student TinyBERT model. In this case,\
    \ TinyBERT learns from every 3 layers of BERT BASE."
  name: Layer Mapping Function
  source_chunk_index: 0
  type: method
