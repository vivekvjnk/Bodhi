chunk_indices:
- 0
entities:
- description: A technique where a smaller "student" model learns from a larger "teacher"
    model to improve performance and efficiency.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: Method
- description: The architecture used in TinyBERT and BERT, known for its ability to
    process sequential data.
  name: Transformer
  source_chunk_index: 0
  type: method
- description: A method in the two-stage learning framework, used during pre-training.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A method in the two-stage learning framework, used during fine-tuning.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A method used to increase the diversity of the training data, often
    used in conjunction with task-specific distillation.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A fully connected network within each layer of the Transformer architecture,
    consisting of two linear transformations and a ReLU activation function. It processes
    the output of the Multi-Head Attention layer.
  name: Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: method
- description: A mechanism within the Transformer architecture that allows the model
    to attend to different parts of the input sequence when processing each word.
    The output of the MHA layer or FFN layer, or some intermediate representations
    (e.g. the attention matrix A) can be used as behavior function in the distillation
    process.
  name: Multi-Head Attention (MHA)
  source_chunk_index: 0
  type: method
- description: The larger "teacher" model in the Knowledge Distillation process, a
    pre-trained language model from which TinyBERT learns.
  name: BERT
  source_chunk_index: 0
  type: method
- description: The smaller "student" model that learns from BERT through Knowledge
    Distillation, aiming to achieve comparable performance with reduced size and inference
    time.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A component of the Transformer architecture used to capture and transfer
    linguistic knowledge from the teacher model (BERT) to the student model (TinyBERT)
    during the distillation process.
  name: Attention Matrix
  source_chunk_index: 0
  type: method
- description: A learning approach involving General Distillation (GD) during pre-training
    and Task-specific Distillation (TD) during fine-tuning, used in TinyBERT.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: method
- description: A component of the Transformer distillation process where knowledge
    is transferred from the embedding layer of the teacher model (BERT) to the student
    model (TinyBERT).
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A component of the Transformer distillation process where knowledge
    is transferred from the prediction layer of the teacher model (BERT) to the student
    model (TinyBERT).
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
