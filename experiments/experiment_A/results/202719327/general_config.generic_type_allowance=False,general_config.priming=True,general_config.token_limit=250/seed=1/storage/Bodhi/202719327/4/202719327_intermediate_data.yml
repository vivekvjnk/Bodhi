entities:
- description: A method where a smaller "student" model learns from a larger "teacher"
    model.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: Method
- description: A stage in the two-stage learning framework where TinyBERT is fine-tuned
    on downstream tasks.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: Method
- description: A stage in the two-stage learning framework that occurs during pre-training.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: Method
- description: Used in the Task-specific Distillation stage to improve performance.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: Method
- description: A method used to transfer linguistic knowledge from a teacher BERT
    model to a student TinyBERT model. It is performed in both pre-training and fine-tuning
    stages.
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: The stage in the two-stage learning framework where TinyBERT is fine-tuned
    on downstream tasks, using data augmentation to provide more task-related materials
    for teacher-student learning.
  name: Task-specific Distillation
  source_chunk_index: 0
  type: task
- description: The larger BERT model from which TinyBERT learns through knowledge
    distillation. It provides the linguistic knowledge that TinyBERT aims to capture.
  name: Teacher BERT
  source_chunk_index: 0
  type: method
- description: The smaller, faster, and more efficient version of BERT, which learns
    from the teacher BERT model through a novel Transformer distillation method.
  name: TinyBERT
  source_chunk_index: 0
  type: method
