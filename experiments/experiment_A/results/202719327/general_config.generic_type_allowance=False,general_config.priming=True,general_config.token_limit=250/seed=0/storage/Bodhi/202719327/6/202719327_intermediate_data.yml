chunk_indices:
- 0
entities:
- description: A method where a smaller "student" model learns from a larger "teacher"
    model.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: Method
- description: A stage in the two-stage learning framework where TinyBERT is fine-tuned
    on downstream tasks.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: Method
- description: A stage in the two-stage learning framework that occurs during pre-training.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: Method
- description: Used in the Task-specific Distillation stage to improve performance.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: Method
- description: A component within Transformer layers used to capture relationships
    between different parts of the input sequence. It is a key element in the Transformer
    architecture and is used in the distillation process.
  name: Multi-Head Attention
  source_chunk_index: 0
  type: method
- description: A fully connected network within each Transformer layer, used for processing
    the output of the Multi-Head Attention mechanism. It consists of linear transformations
    and activation functions, and is a key element in the Transformer architecture
    and is used in the distillation process.
  name: Feed-Forward Networks
  source_chunk_index: 0
  type: method
- description: A specially designed Knowledge Distillation (KD) method for Transformer
    networks, aiming to transfer knowledge from a larger teacher model (BERT) to a
    smaller student model (TinyBERT).
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: A distillation method focused on transferring linguistic knowledge
    from the teacher BERT to the student TinyBERT, using the attention matrix.
  name: attention based distillation
  source_chunk_index: 0
  type: method
- description: The initial layer in a Transformer model that converts input tokens
    into dense vector representations. In the context of TinyBERT, distillation is
    applied to the output of this layer.
  name: Embedding Layer
  source_chunk_index: 0
  type: method
- description: The final layer in a Transformer model, often a linear layer followed
    by a softmax function, used to generate the final output, such as class probabilities.
    Distillation is applied to this layer in TinyBERT.
  name: Prediction Layer
  source_chunk_index: 0
  type: method
