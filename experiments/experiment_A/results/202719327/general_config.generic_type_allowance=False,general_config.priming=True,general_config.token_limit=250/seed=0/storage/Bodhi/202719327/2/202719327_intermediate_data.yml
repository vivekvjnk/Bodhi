entities:
- description: A method where a smaller "student" model learns from a larger "teacher"
    model.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: Method
- description: A stage in the two-stage learning framework where TinyBERT is fine-tuned
    on downstream tasks.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: Method
- description: A stage in the two-stage learning framework that occurs during pre-training.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: Method
- description: A technique used in the Task-specific Distillation stage to improve
    performance.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A technique used to reduce the size of a model by representing its
    weights with fewer bits, thereby decreasing memory usage and computational cost.
  name: Quantization
  source_chunk_index: 0
  type: method
- description: A technique used to reduce the size of a model by removing less important
    connections (weights) between neurons, leading to a sparser model and potentially
    faster inference.
  name: Weights pruning
  source_chunk_index: 0
  type: method
