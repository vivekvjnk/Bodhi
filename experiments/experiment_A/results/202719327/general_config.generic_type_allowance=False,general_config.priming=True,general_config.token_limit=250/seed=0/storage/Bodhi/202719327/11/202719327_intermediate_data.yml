  source_chunk_index: 0
  type: method
- description: The two-stage framework used by TinyBERT, consisting of General Distillation
    (GD) during pre-training and Task-specific Distillation (TD) during fine-tuning,
    with Data Augmentation (DA) used in the TD stage.
  name: TinyBERT learning framework
  source_chunk_index: 0
  type: method
- description: The Corpus of Linguistic Acceptability, a task focused on linguistic
