chunk_indices:
- 0
entities:
- description: A two-stage learning framework for Transformer-based distillation,
    designed to reduce model size and inference time while maintaining competitive
    performance.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A key procedure within the TinyBERT learning framework, focused on
    distilling knowledge specific to a particular task.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A procedure within the TinyBERT learning framework, involving pre-training
    and knowledge transfer from a teacher model.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A procedure within the TinyBERT learning framework, used to augment
    the dataset.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A pre-trained Transformer model used as a teacher model for knowledge
    distillation in TinyBERT.
  name: BERT BASE
  source_chunk_index: 0
  type: method
- description: A smaller version of BERT, used as a student model and for initialization
    in TinyBERT.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: The text corpus used for general distillation in the TinyBERT learning
    framework.
  name: English Wikipedia
  source_chunk_index: 0
  type: dataset
- description: A natural language inference task used to evaluate the performance
    of TinyBERT.
  name: MNLI
  source_chunk_index: 0
  type: task
- description: A linguistic acceptability judgment task used to evaluate the performance
    of TinyBERT.
  name: CoLA
  source_chunk_index: 0
  type: task
- description: A paraphrase identification task used to evaluate the performance of
    TinyBERT.
  name: MRPC
  source_chunk_index: 0
  type: task
- description: A question-pair similarity task used to evaluate the performance of
    TinyBERT.
  name: QQP
  source_chunk_index: 0
  type: task
- description: A question-answering task used to evaluate the performance of TinyBERT.
  name: QNLI
  source_chunk_index: 0
  type: task
- description: A baseline method used for comparison with TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A baseline method used for comparison with TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A knowledge distillation technique applied to the intermediate layers
    of the student model, transferring knowledge from the teacher model.
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: A knowledge distillation technique applied to the prediction layer
    of the student model, transferring knowledge from the teacher model.
  name: Prediction Layer Distillation
  source_chunk_index: 0
  type: method
- description: A hyperparameter that defines the number of complete passes through
    the entire training dataset during the training process.
  name: Epochs
  source_chunk_index: 0
  type: method
- description: A hyperparameter that defines the number of training examples utilized
    in one iteration.
  name: Batch Size
  source_chunk_index: 0
  type: method
- description: A hyperparameter that controls the step size at each iteration while
    moving toward a minimum of a loss function.
  name: Learning Rate
  source_chunk_index: 0
  type: method
- description: The number of epochs used for intermediate layer distillation on the
    augmented dataset for tasks like MNLI, QQP, and QNLI, which is 5 epochs.
  name: Epochs for Intermediate Layer Distillation (MNLI, QQP, QNLI)
  source_chunk_index: 0
  type: method
- description: The batch size used during the task-specific distillation stage, which
    is 32.
  name: Batch Size for Task-Specific Distillation
  source_chunk_index: 0
  type: method
- description: The learning rate used during the task-specific distillation stage.
    For intermediate layer distillation, it's 5e-5, and for prediction layer distillation,
    it's 3e-5.
  name: Learning Rate for Task-Specific Distillation
  source_chunk_index: 0
  type: method
- description: The number of epochs used for intermediate layer distillation on the
    CoLA task, which is 50 epochs.
  name: Epochs for Intermediate Layer Distillation (CoLA)
  source_chunk_index: 0
  type: method
- description: The batch size used for intermediate layer distillation on the augmented
    dataset for tasks like MNLI, QQP, and QNLI, which is 256.
  name: Batch Size for Intermediate Layer Distillation (MNLI, QQP, QNLI)
  source_chunk_index: 0
  type: method
- description: The learning rate used during the BERT pre-training, which is kept
    the same as BERT pre-training (Devlin et al., 2018).
  name: Learning Rate for BERT Pre-training
  source_chunk_index: 0
  type: method
- description: The number of epochs used for general distillation, which is 3 epochs.
  name: Epochs for General Distillation
  source_chunk_index: 0
  type: method
- description: The text corpus used for general distillation, which is English Wikipedia
    (2,500M words).
  name: Text Corpus for General Distillation
  source_chunk_index: 0
  type: dataset
- description: The number of layers used for the BERT-PKD baseline, which is 4.
  name: BERT-PKD Baseline Layers
  source_chunk_index: 0
  type: method
- description: The number of layers used for the DistilBERT baseline, which is 4.
  name: DistilBERT Baseline Layers
  source_chunk_index: 0
  type: method
- description: The learning rate used for training the BERT-PKD baseline (not explicitly
    mentioned in the text, but implied to follow the original BERT work).
  name: BERT-PKD Learning Rate
  source_chunk_index: 0
  type: method
- description: The learning rate used for training the DistilBERT baseline (not explicitly
    mentioned in the text, but implied to follow the original BERT work).
  name: DistilBERT Learning Rate
  source_chunk_index: 0
  type: method
- description: The batch size used for training the BERT-PKD baseline (not explicitly
    mentioned in the text, but implied to follow the original BERT work).
  name: BERT-PKD Batch Size
  source_chunk_index: 0
  type: method
- description: The batch size used for training the DistilBERT baseline (not explicitly
    mentioned in the text, but implied to follow the original BERT work).
  name: DistilBERT Batch Size
  source_chunk_index: 0
  type: method
