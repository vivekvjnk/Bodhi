chunk_indices:
- 0
entities:
- description: A student model designed to capture linguistic knowledge from the teacher
    BERT model, with fewer parameters and faster inference time.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A pre-trained language model used as a teacher model to transfer linguistic
    knowledge to TinyBERT.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method specifically designed for Transformer-based
    models, used to transfer knowledge from teacher BERT to student TinyBERT.
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: A benchmark used to evaluate the performance of TinyBERT, comparing
    its results with teacher BERT.
  name: GLUE tasks
  source_chunk_index: 0
  type: task
- description: A method used to transfer knowledge from a larger, more complex model
    (teacher) to a smaller, more efficient model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A neural network architecture that captures long-term dependencies
    between input tokens using a self-attention mechanism.
  name: Transformer
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer architecture that allows the model
    to attend to different parts of the input sequence.
  name: Multi-head attention (MHA)
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer architecture that applies a fully
    connected network to each position in the input sequence.
  name: Feed-forward network (FFN)
  source_chunk_index: 0
  type: method
- description: A matrix used in the Transformer model to capture the relationships
    between different words in the input sequence.
  name: Attention matrix (A)
  source_chunk_index: 0
  type: method
- description: The initial training phase of a language model, where the model learns
    general linguistic knowledge from a large corpus of text.
  name: Pre-training
  source_chunk_index: 0
  type: method
- description: The process of adapting a pre-trained language model to a specific
    downstream task.
  name: Fine-tuning
  source_chunk_index: 0
  type: method
- description: A distillation technique applied to the embedding layer of the Transformer
    model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique applied to the prediction layer of the Transformer
    model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: The ability of a model to perform well on unseen data.
  name: Generalization capability
  source_chunk_index: 0
  type: task
- description: A novel framework that performs Transformer distillation at both the
    pre-training and fine-tuning stages to ensure TinyBERT captures both general-domain
    and task-specific knowledge.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: method
- description: The first stage of the two-stage learning framework, performed on text
    from the general domain, to help student TinyBERT learn the rich knowledge embedded
    in teacher BERT.
  name: General distillation
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning framework, used to derive
    competitive fine-tuned TinyBERTs for downstream tasks.
  name: Task-specific distillation
  source_chunk_index: 0
  type: method
- description: A sub-layer within a Transformer layer that allows the model to attend
    to different parts of the input sequence simultaneously. It calculates a weighted
    sum of values, where the weights are computed using the softmax function applied
    to the attention matrices.
  name: Multi-head Attention (MHA)
  source_chunk_index: 0
  type: method
- description: Another sub-layer within a Transformer layer, consisting of two linear
    transformations and a ReLU activation function. It processes the output of the
    multi-head attention layer.
  name: Fully Connected Feed-forward Network (FFN)
  source_chunk_index: 0
  type: method
- description: The matrix used in the multi-head attention mechanism to calculate
    the attention weights. It captures the relationships between different parts of
    the input sequence.
  name: Attention Matrix (A)
  source_chunk_index: 0
  type: method
- description: A distillation technique applied to the embedding layer of the Transformer
    model, aiming to transfer knowledge from the teacher model to the student model
    regarding how to represent the input tokens.
  name: Embedding Layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique applied to the prediction layer of the Transformer
    model, aiming to transfer knowledge from the teacher model to the student model
    regarding the final output or prediction.
  name: Prediction Layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation method that uses the attention matrix as the fitting
    target to transfer linguistic knowledge from the teacher BERT to the student TinyBERT.
  name: Attention-based Distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique applied to the intermediate layers of the
    Transformer model.
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: The specific mathematical formulations used to quantify the difference
    between the teacher and student models' outputs during the distillation process.
    These equations define the objectives for the distillation, such as matching attention
    matrices or intermediate representations.
  name: Loss Functions (Equations 7, 8, 9, and 10)
  source_chunk_index: 0
  type: method
- description: A sub-layer within a Transformer layer that allows the model to attend
    to different parts of the input sequence. It calculates a weighted sum of values,
    where the weights are computed using the softmax function applied to the attention
    matrices.
  name: Multi-Head Attention (MHA)
  source_chunk_index: 0
  type: method
- description: Another sub-layer within a Transformer layer, consisting of two linear
    transformations and a ReLU activation function.
  name: Fully Connected Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: method
- description: The matrix used in the multi-head attention mechanism to calculate
    the attention weights. It captures the relationships between different parts of
    the input sequence.
  name: Attention Matrix (A)
  source_chunk_index: 0
  type: method
- description: The process of transferring knowledge from a teacher Transformer model
    to a student Transformer model at the layer level.
  name: Transformer Layer Distillation
  source_chunk_index: 0
  type: method
- description: The process of transferring knowledge from a teacher Transformer model
    to a student Transformer model at the embedding layer.
  name: Embedding-Layer Distillation
  source_chunk_index: 0
  type: method
- description: The process of transferring knowledge from a teacher Transformer model
    to a student Transformer model at the prediction layer.
  name: Prediction-Layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation method that uses the attention matrix as the fitting
    target to transfer linguistic knowledge from the teacher BERT to the student TinyBERT.
  name: Attention Based Distillation
  source_chunk_index: 0
  type: method
- description: Distillation performed on intermediate layers of the Transformer model.
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: The mathematical formulas used to quantify the difference between the
    student and teacher models' outputs, guiding the learning process during distillation.
    These equations are used to unify the loss of model layer.
  name: Loss Functions (Equations 7, 8, 9, and 10)
  source_chunk_index: 0
  type: method
