    training data, used for task-specific distillation.
  name: Augmented dataset
  source_chunk_index: 0
  type: dataset
- description: The learning rate used during the task-specific distillation phase.
    Specifically, the text mentions a learning rate of 5e-5 for intermediate layer
    distillation and 3e-5 for prediction layer distillation.
  name: Learning Rate for Task-Specific Distillation
  source_chunk_index: 0
  type: method
- description: The batch size used during the task-specific distillation phase. The
    text specifies a batch size of 32 for both intermediate and prediction layer distillation,
    except for tasks like MNLI, QQP, and QNLI, where a batch size of 256 is used for
    intermediate layer distillation.
  name: Batch Size for Task-Specific Distillation
  source_chunk_index: 0
  type: method
- description: The number of epochs used for intermediate layer distillation on tasks
    like MNLI, QQP, and QNLI. The text specifies 5 epochs.
  name: Epochs for Intermediate Layer Distillation (MNLI, QQP, QNLI)
  source_chunk_index: 0
  type: method
