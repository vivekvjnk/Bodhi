  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A specific knowledge distillation strategy focused on transferring
    knowledge from the Transformer layers of a teacher model to a student model.
  name: Transformer-layer distillation
  source_chunk_index: 0
  type: method
- description: A specific knowledge distillation strategy focused on transferring
