chunk_indices:
- 0
entities:
- description: A two-stage framework for Transformer-based distillation, designed
    to reduce model size and inference time while maintaining competitive performance.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A key procedure within the TinyBERT learning framework, focused on
    distilling knowledge specific to a particular task.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A procedure within the TinyBERT learning framework, used for pre-training
    and knowledge transfer.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A procedure within the TinyBERT learning framework, used to augment
    the dataset.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A pre-trained Transformer model used as a teacher model for knowledge
    distillation in TinyBERT.
  name: BERT BASE
  source_chunk_index: 0
  type: method
- description: A smaller version of BERT, used as an initialization for TinyBERT and
    for comparison.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: The text corpus used for general distillation in the TinyBERT framework,
    consisting of 2,500M words.
  name: English Wikipedia
  source_chunk_index: 0
  type: dataset
- description: A natural language inference task used to evaluate the performance
    of TinyBERT.
  name: MNLI
  source_chunk_index: 0
  type: task
- description: A paraphrase identification task used to evaluate the performance of
    TinyBERT.
  name: MRPC
  source_chunk_index: 0
  type: task
- description: A linguistic acceptability judgment task used to evaluate the performance
    of TinyBERT.
  name: CoLA
  source_chunk_index: 0
  type: task
- description: A baseline method used for comparison with TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A baseline method used for comparison with TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A question-pair similarity task used to evaluate the performance of
    TinyBERT.
  name: QQP
  source_chunk_index: 0
  type: task
- description: A question-answering task used to evaluate the performance of TinyBERT.
  name: QNLI
  source_chunk_index: 0
  type: task
- description: A knowledge distillation method where the intermediate layers of the
    student model are trained to mimic the outputs of the corresponding layers in
    the teacher model.
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method where the prediction layer (e.g., the
    output layer for classification) of the student model is trained to mimic the
    predictions of the teacher model.
  name: Prediction Layer Distillation
  source_chunk_index: 0
  type: method
- description: The specific knowledge distillation method used for Transformer-based
    distillation, which is the core contribution of the paper.
  name: KD method for Transformer-based distillation
  source_chunk_index: 0
  type: method
- description: The target application environment for TinyBERT, highlighting its suitability
    for resource-constrained devices.
  name: Edge devices
  source_chunk_index: 0
  type: task
- description: The learning rate used during the task-specific distillation phase,
    specifically 5e-5 for intermediate layer distillation and 3e-5 for prediction
    layer distillation.
  name: Learning Rate
  source_chunk_index: 0
  type: method
- description: The batch size used during the task-specific distillation phase, specifically
    32 for intermediate layer distillation and prediction layer distillation, except
    for MNLI, QQP, and QNLI where it is 256.
  name: Batch Size
  source_chunk_index: 0
  type: method
