  type: dataset
- description: A distillation process performed during the training of TinyBERT, where
    knowledge is transferred between intermediate layers of the teacher and student
    models.
  name: Intermediate layer distillation
  source_chunk_index: 0
  type: method
- description: A distillation process performed during the training of TinyBERT, where
    knowledge is transferred between the prediction layers of the teacher and student
