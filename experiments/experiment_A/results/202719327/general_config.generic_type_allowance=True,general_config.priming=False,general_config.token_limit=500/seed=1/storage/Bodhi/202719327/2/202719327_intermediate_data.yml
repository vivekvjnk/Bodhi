  name: Two-stage learning framework
  source_chunk_index: 0
  type: generic
- description: A specific technique used in the Transformer distillation process,
    focusing on transferring knowledge from the teacher model's embedding layer to
    the student model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A specific technique used in the Transformer distillation process,
    focusing on transferring knowledge from the teacher model's prediction layer to
    the student model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer architecture that allows the model
    to attend to different parts of the input sequence. It calculates a weighted sum
    of values, where the weights are computed using the softmax function applied to
    the attention matrices.
  name: Multi-Head Attention (MHA)
  source_chunk_index: 0
  type: method
- description: Another sub-layer within the Transformer architecture, consisting of
    two linear transformations and a ReLU activation function. It processes the output
    of the MHA layer.
  name: Fully Connected Feed-Forward Network (FFN)
  source_chunk_index: 0
  type: method
- description: A specific distillation technique applied to Transformer-based models,
    where knowledge is transferred from a teacher Transformer model to a student Transformer
    model. This involves choosing layers from the teacher model for distillation.
  name: Transformer Layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique focused on transferring knowledge from the
    embedding layer of the teacher model to the student model.
  name: Embedding-Layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation technique focused on transferring knowledge from the
    prediction layer of the teacher model to the student model.
  name: Prediction-Layer Distillation
  source_chunk_index: 0
  type: method
- description: A distillation method that focuses on transferring linguistic knowledge,
    specifically from the attention matrices of the teacher BERT model to the student
    TinyBERT model.
  name: Attention-Based Distillation
  source_chunk_index: 0
  type: method
- description: A collection of benchmark datasets used for evaluating natural language
    understanding models, including tasks like sentiment analysis, question answering,
    and textual entailment.
  name: GLUE tasks
  source_chunk_index: 0
  type: dataset
