chunk_indices:
- 0
entities:
- description: A technique for transferring knowledge from a larger, more complex
    model (teacher) to a smaller, simpler model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A method used to transfer knowledge from various layers of a Transformer-based
    model, such as BERT, to a smaller student model.
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: A learning approach that involves a general distillation stage (pre-training)
    and a task-specific distillation stage (fine-tuning).
  name: Two-stage learning framework
  source_chunk_index: 0
  type: method
- description: Techniques used to increase the diversity of training data, often employed
    in the task-specific distillation stage.
  name: Data augmentation
  source_chunk_index: 0
  type: method
- description: A Transformer-based language model used as a teacher model in knowledge
    distillation.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A smaller student model designed to learn from a larger BERT teacher
    model, aiming for faster inference and reduced size.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: The objective of reducing the time required for a model to make predictions.
  name: Accelerate inference
  source_chunk_index: 0
  type: task
- description: The objective of decreasing the number of parameters in a model, making
    it more efficient.
  name: Reduce model size
  source_chunk_index: 0
  type: task
- description: The objective of preserving the accuracy and effectiveness of a model
    after it has been distilled or compressed.
  name: Maintain performance
  source_chunk_index: 0
  type: task
- description: The Corpus of Linguistic Acceptability dataset, used to evaluate the
    performance of TinyBERT and other models in predicting linguistic acceptability
    judgments.
  name: CoLA
  source_chunk_index: 0
  type: dataset
- description: The Multi-Genre Natural Language Inference dataset, used in the ablation
    studies and evaluation of TinyBERT.
  name: MNLI
  source_chunk_index: 0
  type: dataset
- description: The Microsoft Research Paraphrase Corpus dataset, used in the ablation
    studies and evaluation of TinyBERT.
  name: MRPC
  source_chunk_index: 0
  type: dataset
- description: The Quora Question Pairs dataset, used for evaluating TinyBERT.
  name: QQP
  source_chunk_index: 0
  type: dataset
- description: The Question Natural Language Inference dataset, used for evaluating
    TinyBERT.
  name: QNLI
  source_chunk_index: 0
  type: dataset
- description: A baseline model using knowledge distillation from BERT, used for comparison
    with TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A distilled version of BERT, used as a baseline for comparison with
    TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A smaller version of BERT, used as a baseline and for initializing
    TinyBERT.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: The first stage of the two-stage TinyBERT learning framework, which
    uses a large corpus (e.g., Wikipedia) to pre-train the student model.
  name: General Distillation
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage TinyBERT learning framework, which
    fine-tunes the student model on a specific task using data augmentation and a
    fine-tuned BERT teacher.
  name: Task-specific Distillation
  source_chunk_index: 0
  type: method
- description: A large text corpus used in the general distillation stage to pre-train
    TinyBERT.
  name: English Wikipedia
  source_chunk_index: 0
  type: dataset
- description: The target application environment for TinyBERT, representing devices
    with limited computational resources where BERT-based NLP applications can be
    deployed.
  name: Edge Devices
  source_chunk_index: 0
  type: task
- description: The teacher model from which TinyBERT distills knowledge.
  name: BERT
  source_chunk_index: 0
  type: method
