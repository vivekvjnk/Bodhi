    distillation process. These equations likely define how the student model (TinyBERT)
    learns from the teacher model (BERT) across different layers (embedding, hidden
    states, attention matrices, and prediction layer logits).
  name: Equations 7, 8, 9, and 10
  source_chunk_index: 1
  type: method
- description: A core component of the Transformer architecture that calculates a
    weighted sum of values, where the weights are determined by the softmax of the
    attention matrix. It captures linguistic knowledge and is used in the distillation
    process.
  name: Head Attention (MHA)
  source_chunk_index: 1
  type: method
- description: A fully connected feed-forward network within each Transformer layer,
    consisting of two linear transformations and a ReLU activation. The output of
    this layer can be used as a behavior function in Transformer distillation.
  name: Position-wise Feed-Forward Network (FFN)
  source_chunk_index: 1
  type: method
