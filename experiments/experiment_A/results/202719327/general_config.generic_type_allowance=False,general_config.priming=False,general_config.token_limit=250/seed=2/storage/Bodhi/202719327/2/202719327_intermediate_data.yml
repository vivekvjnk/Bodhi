entities:
- description: A technique used to reduce the precision of the weights in a neural
    network, often to reduce memory footprint and computational cost.
  name: Quantization
  source_chunk_index: 0
  type: method
- description: A technique used to remove less important connections (weights) in
    a neural network, leading to a sparser network and reduced computational complexity.
  name: Weights pruning
  source_chunk_index: 0
  type: method
- description: A technique where a smaller "student" model learns from a larger "teacher"
    model, transferring knowledge and potentially improving performance.
  name: Knowledge distillation (KD)
  source_chunk_index: 0
  type: method
