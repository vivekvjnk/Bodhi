  name: BERT BASE
  source_chunk_index: 0
  type: method
- description: A distillation technique applied for 3 epochs in general distillation
    and for varying epochs in task-specific distillation.
  name: Intermediate layer distillation
  source_chunk_index: 0
  type: method
- description: A distillation approach applied to augmented datasets for specific
    tasks.
  name: Task-specific distillation
  source_chunk_index: 0
  type: method
