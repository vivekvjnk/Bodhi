  source_chunk_index: 0
  type: method
- description: A baseline method used for comparison.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A distillation technique applied for 3 epochs in task-specific distillation.
  name: Prediction layer distillation
  source_chunk_index: 0
  type: method
- description: A dataset used for task-specific distillation.
  name: Augmented dataset
  source_chunk_index: 0
  type: dataset
- description: The number of samples processed in one iteration during training. Specifically,
    batch size 32 and learning rate 5e-5 were used for 10 epochs on the augmented
    dataset for task-specific distillation. Batch size 32 and learning rate 3e-5 were
    used for prediction layer distillation for 3 epochs. Batch size 256 was used for
    tasks like MNLI, QQP and QNLI for 5 epochs on the augmented dataset.
  name: Batch Size
  source_chunk_index: 0
  type: method
- description: The step size used to update the model's weights during training. Specifically,
    a learning rate of 5e-5 was used for 10 epochs on the augmented dataset for task-specific
    distillation. A learning rate of 3e-5 was used for prediction layer distillation
    for 3 epochs.
  name: Learning Rate
  source_chunk_index: 0
  type: method
- description: The number of complete passes through the entire training dataset.
    Specifically, 10 epochs were used for task-specific distillation on the augmented
    dataset. 3 epochs were used for prediction layer distillation. 5 epochs were used
    for tasks like MNLI, QQP and QNLI on the augmented dataset. 50 epochs were used
    for CoLA task.
  name: Epochs
  source_chunk_index: 0
  type: method
- description: The batch size used during training, specifically 32 and 256 are mentioned.
  name: Batch Size
