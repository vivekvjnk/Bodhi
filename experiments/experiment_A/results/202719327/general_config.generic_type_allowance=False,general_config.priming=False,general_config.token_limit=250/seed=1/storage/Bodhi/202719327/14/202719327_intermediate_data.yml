    are mentioned.
  name: Learning Rate
  source_chunk_index: 0
  type: method
- description: The number of training epochs, specifically 3, 10, and 50 are mentioned.
  name: Epochs
  source_chunk_index: 0
  type: method
- description: The specific hyperparameter settings used during the pre-training phase
    of the BERT model, which are kept the same as in the original BERT pre-training
    (Devlin et al., 2018). This includes details like the number of attention heads,
    hidden layer size, and the optimizer used.
  name: BERT Pre-training Hyperparameters
  source_chunk_index: 0
  type: method
