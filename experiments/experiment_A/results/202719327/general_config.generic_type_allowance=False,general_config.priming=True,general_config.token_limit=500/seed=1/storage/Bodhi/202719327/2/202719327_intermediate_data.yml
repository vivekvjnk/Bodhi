chunk_indices:
- 0
entities:
- description: A technique for transferring knowledge from a larger, more complex
    model (teacher) to a smaller, simpler model (student).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A pre-training stage in the two-stage learning framework, using a large
    corpus to initialize TinyBERT.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A fine-tuning stage in the two-stage learning framework, using augmented
    data for downstream tasks.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: The novel method used to transfer knowledge from BERT layers to TinyBERT.
  name: Transformer distillation method
  source_chunk_index: 0
  type: method
- description: The process of creating new training data from existing data, used
    in the task-specific distillation stage.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: The learning approach used, consisting of general distillation (pre-training)
    and task-specific distillation (fine-tuning).
  name: Two-stage learning framework
  source_chunk_index: 0
  type: method
- description: The objective of the method, aiming to reduce the time required for
    model predictions.
  name: Accelerate inference
  source_chunk_index: 0
  type: task
- description: The objective of the method, aiming to create a smaller model footprint.
  name: Reduce model size
  source_chunk_index: 0
  type: task
- description: The objective of the method, ensuring that the smaller model retains
    the accuracy of the larger model.
  name: Maintain performance
  source_chunk_index: 0
  type: task
- description: A baseline Knowledge Distillation method used for comparison.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A baseline Knowledge Distillation method used for comparison.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A collection of natural language understanding tasks used to evaluate
    the performance of TinyBERT.
  name: GLUE benchmark
  source_chunk_index: 0
  type: dataset
- description: A sub-layer within a Transformer layer that allows the model to attend
    to different parts of the input sequence when encoding or decoding. It is a key
    component of the Transformer architecture, enabling the capture of long-range
    dependencies.
  name: Multi-Head Attention
  source_chunk_index: 0
  type: method
- description: A fully connected feed-forward network, another sub-layer within a
    Transformer layer, typically consisting of two linear transformations with a ReLU
    activation in between. It processes the output of the multi-head attention layer.
  name: Feed-Forward Network
  source_chunk_index: 0
  type: method
- description: The initial layer in a Transformer model that converts input tokens
    into dense vector representations (embeddings). Knowledge distillation is applied
    to this layer to transfer knowledge from the teacher BERT to the student TinyBERT.
  name: Embedding Layer
  source_chunk_index: 0
  type: method
- description: The final layer in a Transformer model, responsible for generating
    the output predictions for the task. Knowledge distillation is applied to this
    layer to transfer knowledge from the teacher BERT to the student TinyBERT.
  name: Prediction Layer
  source_chunk_index: 0
  type: method
- description: The teacher model in the knowledge distillation process, a large Transformer-based
    language model.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer layer that captures dependencies
    between input tokens.
  name: Multi-Head Attention
  source_chunk_index: 0
  type: method
- description: A sub-layer within the Transformer layer, consisting of linear transformations
    and activation functions.
  name: Feed-Forward Network
  source_chunk_index: 0
  type: method
- description: A smaller student model based on BERT, designed to accelerate inference
    and reduce model size while maintaining performance through knowledge distillation
    from a larger teacher BERT model.
  name: TinyBERT
  source_chunk_index: 0
  type: method
