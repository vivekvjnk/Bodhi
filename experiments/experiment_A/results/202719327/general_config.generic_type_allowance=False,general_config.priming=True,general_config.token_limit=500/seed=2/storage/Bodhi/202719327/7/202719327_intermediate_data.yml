- description: A method for transferring knowledge from a larger teacher model to
    a smaller student model.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A method used in TinyBERT to transfer knowledge from BERT layers.
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: The learning framework used by TinyBERT, consisting of general distillation
    and task-specific distillation.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: method
- description: The pre-training stage of the two-stage learning framework, using a
    large corpus to initialize TinyBERT.
  name: General Distillation
  source_chunk_index: 0
  type: method
