  name: Feed-Forward Network
  source_chunk_index: 0
  type: method
- description: A technique used to transfer knowledge from a larger, more complex
    model (teacher) to a smaller, simpler model (student).
  name: Knowledge Distillation
  source_chunk_index: 0
  type: method
- description: A benchmark comprising a collection of natural language understanding
    tasks used to evaluate the performance of TinyBERT.
  name: GLUE tasks
  source_chunk_index: 0
  type: dataset
- description: The initial layer in a Transformer model that converts input tokens
    into dense vector representations. Knowledge distillation is applied to transfer
    knowledge from the teacher BERT's embedding layer to the student TinyBERT's embedding
    layer.
  name: Embedding Layer
  source_chunk_index: 0
  type: method
- description: The final layer in a Transformer model, responsible for generating
    the output predictions (e.g., classification probabilities). Knowledge distillation
    is applied to transfer knowledge from the teacher BERT's prediction layer to the
    student TinyBERT's prediction layer.
  name: Prediction Layer
  source_chunk_index: 0
  type: method
- description: A fundamental building block of Transformer models, consisting of sub-layers
    like Multi-Head Attention and Feed-Forward Networks. The paper focuses on distilling
    knowledge from these layers in BERT to TinyBERT.
  name: Transformer Layer
  source_chunk_index: 0
  type: method
