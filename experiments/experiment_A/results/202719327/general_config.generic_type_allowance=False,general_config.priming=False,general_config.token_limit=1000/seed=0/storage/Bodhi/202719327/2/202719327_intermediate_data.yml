entities:
- description: A two-stage framework for knowledge distillation, designed to compress
    BERT-based NLP models.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A pre-trained language model used as a teacher model for knowledge
    distillation and a baseline for comparison.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A method used to transfer knowledge from a larger teacher model (BERT)
    to a smaller student model (TinyBERT).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: The Corpus of Linguistic Acceptability dataset, used to evaluate the
    performance of TinyBERT on linguistic acceptability judgments.
  name: CoLA dataset
  source_chunk_index: 0
  type: dataset
- description: The Multi-Genre Natural Language Inference dataset, used in the ablation
    studies and for evaluating TinyBERT.
  name: MNLI
  source_chunk_index: 0
  type: dataset
- description: The Microsoft Research Paraphrase Corpus dataset, used in the ablation
    studies and for evaluating TinyBERT.
  name: MRPC
  source_chunk_index: 0
  type: dataset
- description: A knowledge distillation method used as a baseline for comparison with
    TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A distilled version of BERT, used as a baseline for comparison with
    TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: A key procedure in the TinyBERT learning framework, focused on distilling
    knowledge specific to a particular task.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A key procedure in the TinyBERT learning framework, focused on distilling
    general linguistic knowledge.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A key procedure in the TinyBERT learning framework, used to augment
    the training data.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: The text corpus used for general distillation in the TinyBERT learning
    framework.
  name: English Wikipedia
  source_chunk_index: 0
  type: dataset
- description: A specific type of knowledge distillation focused on the Transformer
    layers of the model.
  name: Transformer-layer distillation
  source_chunk_index: 0
  type: method
- description: A specific type of knowledge distillation focused on the embedding
    layers of the model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: The Quora Question Pairs dataset, used in the experiments.
  name: QQP
  source_chunk_index: 0
  type: dataset
- description: The Stanford Question Natural Language Inference dataset, used in the
    experiments.
  name: QNLI
  source_chunk_index: 0
  type: dataset
- description: The learning rate used during the intermediate layer distillation stage.
    For task-specific distillation, it is 5e-5.
  name: Intermediate Layer Distillation Learning Rate
  source_chunk_index: 0
  type: method
- description: The learning rate used during the prediction layer distillation stage.
    It is 3e-5.
  name: Prediction Layer Distillation Learning Rate
  source_chunk_index: 0
  type: method
- description: The batch size used for intermediate layer distillation on the MNLI
    dataset. It is 256.
  name: MNLI Dataset Batch Size
  source_chunk_index: 0
  type: dataset
- description: The batch size used for intermediate layer distillation on the QQP
    dataset. It is 256.
  name: QQP Dataset Batch Size
  source_chunk_index: 0
  type: dataset
- description: The batch size used for intermediate layer distillation on the QNLI
    dataset. It is 256.
  name: QNLI Dataset Batch Size
  source_chunk_index: 0
  type: dataset
- description: The number of epochs used for intermediate layer distillation on the
    CoLA dataset. It is 50.
  name: CoLA Dataset Intermediate Layer Distillation Epochs
  source_chunk_index: 0
  type: method
- description: The batch size used during the task-specific distillation stage. It
    is 32.
  name: Task-specific Distillation Batch Size
  source_chunk_index: 0
  type: method
- description: The number of epochs used for general distillation. It is 3.
  name: General Distillation Epochs
  source_chunk_index: 0
  type: method
- description: The dataset used for general distillation, which is English Wikipedia
    (2,500M words).
  name: General Distillation Dataset
  source_chunk_index: 0
  type: dataset
- description: The number of epochs used for intermediate layer distillation for the
    MNLI, QQP, and QNLI tasks, which is specified as 5 epochs.
  name: Epochs for Intermediate Layer Distillation (MNLI, QQP, QNLI)
  source_chunk_index: 0
  type: method
