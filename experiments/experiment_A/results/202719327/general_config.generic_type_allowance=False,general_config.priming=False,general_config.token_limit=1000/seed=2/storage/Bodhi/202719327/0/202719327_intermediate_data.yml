- description: A small student model designed to capture the knowledge of a larger
    teacher BERT model through Transformer distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method specifically designed for Transformer-based
    models, used to transfer knowledge from a larger teacher model (e.g., BERT) to
    a smaller student model (e.g., TinyBERT).
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: A technique used to transfer knowledge from a larger, more complex
    model (teacher) to a smaller, simpler model (student).
