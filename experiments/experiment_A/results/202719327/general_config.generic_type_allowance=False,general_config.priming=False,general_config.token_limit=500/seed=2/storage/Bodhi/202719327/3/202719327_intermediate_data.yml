  name: BERT
  source_chunk_index: 0
  type: method
- description: A distillation technique used to transfer knowledge from a larger teacher
    model (BERT) to a smaller student model (TinyBERT).
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: A distillation approach that fine-tunes TinyBERT on augmented task-specific
