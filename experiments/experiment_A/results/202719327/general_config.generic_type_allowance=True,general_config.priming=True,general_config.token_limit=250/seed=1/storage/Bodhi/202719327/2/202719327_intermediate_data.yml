entities:
- description: A technique where a smaller "student" model learns from a larger "teacher"
    model.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: A technique used to reduce the size of a model by representing the
    weights and activations with lower precision data types (e.g., using 8-bit integers
    instead of 32-bit floating-point numbers).
  name: Quantization
  source_chunk_index: 0
  type: method
- description: A technique used to reduce the size of a model by removing less important
    connections (weights) in the neural network, effectively sparsifying the model.
  name: Weights Pruning
  source_chunk_index: 0
  type: method
