chunk_indices:
- 0
entities:
- description: The core method used to train TinyBERT, where a smaller student model
    learns from a larger teacher model.
  name: Knowledge Distillation
  source_chunk_index: 0
  type: GENERIC
- description: A stage in the two-stage learning framework where TinyBERT learns from
    BERT during pre-training, improving its generalization capability.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: GENERIC
- description: A stage in the two-stage learning framework where the proposed Transformer
    distillation is re-performed on augmented task-specific datasets to derive competitive
    fine-tuned TinyBERTs.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: GENERIC
- description: The architecture used in BERT and TinyBERT, which includes layers with
    Multi-Head Attention and Feed-Forward Networks.
  name: Transformer
  source_chunk_index: 0
  type: GENERIC
- description: A method used in the task-specific distillation stage to extend the
    task-specific training set.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: GENERIC
- description: A smaller, faster, and more efficient version of BERT, designed to
    learn from a larger teacher model through knowledge distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A pre-trained language model used as the teacher model for TinyBERT,
    from which knowledge is distilled.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A specific distillation technique where knowledge is transferred from
    the teacher model (BERT) to the student model (TinyBERT) at intermediate layers
    of the Transformer architecture.
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: A specific distillation technique where knowledge is transferred from
    the teacher model (BERT) to the student model (TinyBERT) at the prediction layer
    (output layer).
  name: Prediction-layer Distillation
  source_chunk_index: 0
  type: method
- description: A dataset specifically tailored to a downstream task, used in the task-specific
    distillation stage to fine-tune TinyBERT. This dataset is augmented to improve
    performance.
  name: Task-specific dataset
  source_chunk_index: 0
  type: dataset
- description: A component within the Transformer architecture, used to capture relationships
    between different parts of the input sequence by attending to different positions
    in the input.
  name: Multi-Head Attention (MHA)
  source_chunk_index: 0
  type: method
- description: A component within the Transformer architecture, typically consisting
    of two linear transformations with a non-linear activation function in between,
    used for processing the output of the multi-head attention mechanism.
  name: Feed-Forward Networks (FFN)
  source_chunk_index: 0
  type: method
