entities:
- description: A novel framework involving General Distillation during pre-training
    and Task-specific Distillation during fine-tuning.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: GENERIC
- description: The initial stage of training where the model learns general-domain
    knowledge.
  name: Pre-training
  source_chunk_index: 0
  type: GENERIC
- description: The stage where the model is adapted to specific downstream tasks.
  name: Fine-tuning
  source_chunk_index: 0
  type: GENERIC
- description: The second stage of the two-stage learning framework, performed during
    fine-tuning on downstream tasks, utilizing data augmentation.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: Used in the task-specific distillation stage to provide more task-related
    materials for teacher-student learning.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: The smaller, faster, and more efficient "student" model that learns
    from the "teacher" BERT model, using a novel Transformer distillation method.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: The method used to transfer linguistic knowledge from the teacher BERT
    to TinyBERT, performed in both pre-training and fine-tuning stages.
  name: Transformer distillation
  source_chunk_index: 0
  type: method
- description: The "teacher" model from which TinyBERT distills knowledge.
  name: BERT
  source_chunk_index: 0
  type: method
- description: Performed during pre-training to ensure TinyBERT captures general-domain
    knowledge.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
