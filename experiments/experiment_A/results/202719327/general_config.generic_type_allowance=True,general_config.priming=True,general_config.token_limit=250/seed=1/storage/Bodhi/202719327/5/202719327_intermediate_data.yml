- description: A neural network architecture, the foundation for models like BERT,
    used to capture long-term dependencies in input tokens.
  name: Transformer
  source_chunk_index: 0
  type: GENERIC
- description: A method where a smaller "student" model (TinyBERT) learns from a larger
    "teacher" model (BERT).
  name: Knowledge Distillation
  source_chunk_index: 0
  type: GENERIC
