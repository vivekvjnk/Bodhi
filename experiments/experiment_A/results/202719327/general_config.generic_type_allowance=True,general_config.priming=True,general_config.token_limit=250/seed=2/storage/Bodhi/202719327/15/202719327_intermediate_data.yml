  source_chunk_index: 0
  type: generic
- description: A core mechanism in the Transformer architecture that allows the model
    to attend to different parts of the input sequence when forming representations.
    It consists of multiple attention heads, each performing the attention mechanism
    independently and then concatenating the results.
  name: Multi-Head Attention (MHA)
  source_chunk_index: 0
  type: generic
- description: The first stage of the two-stage learning framework in TinyBERT, used
    during pre-training to transfer knowledge from the teacher BERT model to the student
    TinyBERT model.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning framework in TinyBERT, used
    during fine-tuning on specific tasks (e.g., GLUE) to further refine the student
    model's performance.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
