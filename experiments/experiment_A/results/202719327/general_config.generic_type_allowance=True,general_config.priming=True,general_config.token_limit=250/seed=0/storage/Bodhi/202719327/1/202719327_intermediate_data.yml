entities:
- description: The framework used by TinyBERT, involving General Distillation during
    pre-training and Task-specific Distillation during fine-tuning.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: GENERIC
- description: The first stage of TinyBERT's two-stage learning framework, occurring
    during pre-training.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: GENERIC
- description: The second stage of TinyBERT's two-stage learning framework, occurring
    during fine-tuning.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: GENERIC
- description: A pre-trained language model used as the teacher model in TinyBERT's
    knowledge distillation process.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A smaller, faster, and more efficient student model that learns from
    BERT through knowledge distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: The core method used to transfer knowledge from a larger teacher model
    (BERT) to a smaller student model (TinyBERT).
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: The architecture upon which BERT and TinyBERT are based.
  name: Transformer
  source_chunk_index: 0
  type: method
- description: A benchmark used to evaluate the performance of language models, including
