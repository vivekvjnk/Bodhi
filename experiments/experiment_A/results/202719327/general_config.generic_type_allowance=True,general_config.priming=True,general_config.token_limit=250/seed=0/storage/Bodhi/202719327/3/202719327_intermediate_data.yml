chunk_indices:
- 0
entities:
- description: The student model, a smaller and more efficient version of BERT, designed
    to learn from the teacher model through Knowledge Distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A pre-trained language model used as the teacher model in the Knowledge
    Distillation process, providing knowledge to TinyBERT.
  name: BERT
  source_chunk_index: 0
  type: method
- description: A method where a smaller "student" model (TinyBERT) learns from a larger
    "teacher" model (BERT) to transfer knowledge and improve efficiency.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: The underlying architecture of both BERT and TinyBERT, which is the
    basis for the proposed distillation method.
  name: Transformer
  source_chunk_index: 0
  type: generic
- description: A layer in BERT whose output is used as one of the representations
    to be fitted during the distillation process.
  name: Embedding layer
  source_chunk_index: 0
  type: generic
- description: Representations derived from the Transformer layer in BERT, used in
    the distillation process to transfer knowledge to TinyBERT.
  name: Hidden states
  source_chunk_index: 0
  type: generic
- description: Matrices derived from the Transformer layer in BERT, used to capture
    linguistic knowledge and transfer it to TinyBERT during distillation.
  name: Attention matrices
  source_chunk_index: 0
  type: generic
- description: The layer in BERT that outputs logits, which are used in the distillation
    process.
  name: Prediction layer
  source_chunk_index: 0
  type: generic
- description: An existing KD baseline model used for comparison with TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: An existing KD baseline model used for comparison with TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A stage in the two-stage learning framework, used during pre-training.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A stage in the two-stage learning framework, used during fine-tuning.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: The first stage of the two-stage learning framework in TinyBERT, performed
    during pre-training on a large-scale corpus.
  name: General Distillation
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning framework in TinyBERT, performed
    during fine-tuning on a task-specific dataset.
  name: Task-specific Distillation
  source_chunk_index: 0
  type: method
- description: A technique used to increase the diversity of the training data, potentially
    employed during either General Distillation or Task-specific Distillation to improve
    TinyBERT's performance.
  name: Data Augmentation
  source_chunk_index: 0
  type: method
- description: The framework used by TinyBERT, involving General Distillation (GD)
    during pre-training and Task-specific Distillation (TD) during fine-tuning.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: generic
- description: A large-scale text dataset used for pre-training BERT, and subsequently,
    for the General Distillation stage of TinyBERT.
  name: Unsupervised text corpus
  source_chunk_index: 0
  type: dataset
- description: Several functions designed to fit different representations from BERT
    layers, including the embedding layer output, hidden states and attention matrices
    from the Transformer layer, and logits from the prediction layer.
  name: Loss Functions
  source_chunk_index: 0
  type: GENERIC
