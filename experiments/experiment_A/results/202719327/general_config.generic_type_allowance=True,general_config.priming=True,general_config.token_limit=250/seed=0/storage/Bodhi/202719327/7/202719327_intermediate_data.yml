- description: The number of layers in the model.
  name: Layer Number
  source_chunk_index: 0
  type: GENERIC
- description: The student model, a smaller and faster version of BERT, designed to
    learn from the teacher model through knowledge distillation.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: The teacher model, a pre-trained language model used to guide the training
    of TinyBERT through knowledge distillation.
  name: BERT
  source_chunk_index: 0
  type: method
- description: The core technique where a smaller "student" model (TinyBERT) learns
    from a larger "teacher" model (BERT), transferring knowledge from the teacher
    to the student.
  name: Knowledge Distillation (KD)
  source_chunk_index: 0
  type: method
- description: The architecture used in both BERT and TinyBERT models.
  name: Transformer
  source_chunk_index: 0
  type: generic
- description: A stage in the two-stage learning framework where TinyBERT learns from
    BERT on a general domain dataset.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A stage in the two-stage learning framework where TinyBERT is fine-tuned
    on a task-specific dataset, often with data augmentation.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A method used to extend the task-specific training set, often employed
    during task-specific distillation.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A specific distillation technique mentioned in the text, likely referring
    to the process of transferring knowledge from the intermediate layers of the teacher
    model (BERT) to the student model (TinyBERT).
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: A specific distillation technique mentioned in the text, likely referring
    to the process of transferring knowledge from the prediction layer of the teacher
    model (BERT) to the student model (TinyBERT).
  name: Prediction-layer Distillation
  source_chunk_index: 0
  type: method
- description: A dataset created by augmenting a task-specific dataset, used in the
    task-specific distillation stage to fine-tune TinyBERT.
  name: Augmented Task-specific Dataset
  source_chunk_index: 0
  type: dataset
- description: A specific distillation technique where knowledge is transferred from
    intermediate layers of the teacher model (BERT) to the student model (TinyBERT).
  name: Intermediate Layer Distillation
  source_chunk_index: 0
  type: method
- description: A specific distillation technique focused on transferring knowledge
    from the prediction layer of the teacher model (BERT) to the student model (TinyBERT).
  name: Prediction-layer Distillation
  source_chunk_index: 0
  type: method
