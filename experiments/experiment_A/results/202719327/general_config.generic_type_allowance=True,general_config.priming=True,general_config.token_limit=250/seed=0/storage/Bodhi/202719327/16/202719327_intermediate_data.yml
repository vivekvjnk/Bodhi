- description: A smaller variant of the BERT model, used as a student model in the
    experiments. It is compared with TinyBERT to evaluate the effectiveness of the
    proposed distillation methods.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: The objective of transferring knowledge specific to a particular task
    from a teacher model (BERT) to a student model (TinyBERT) during fine-tuning.
    This is contrasted with General Distillation, which focuses on pre-training knowledge
    transfer.
  name: Task-specific knowledge transfer
  source_chunk_index: 0
  type: task
