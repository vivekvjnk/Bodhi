  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A key procedure in the two-stage TinyBERT learning framework, used
    during pre-training to transfer knowledge from the teacher model (BERT) to the
    student model (TinyBERT).
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
