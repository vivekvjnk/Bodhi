  source_chunk_index: 0
  type: method
- description: The core methodology employed by TinyBERT, consisting of General Distillation
    (GD) during pre-training and Task-specific Distillation (TD) during fine-tuning,
    often incorporating Data Augmentation (DA).
  name: Two-stage TinyBERT learning framework
  source_chunk_index: 0
  type: method
