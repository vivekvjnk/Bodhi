- description: The improvement on the CoLA task when increasing the model size of
    TinyBERT, specifically from 49.7 to 50.6 when increasing the number of layers
    and from 49.7 to 50.5 when increasing the hidden size, and from 49.7 to 54.0 when
    the model becomes deeper and wider.
  name: Performance Improvement on CoLA
  source_chunk_index: 0
  type: generic
- description: The performance drop from 75.3 to 56.3 when the Transformer-layer distillation
    is not used (No Trm).
  name: Transformer-layer distillation performance drop
  source_chunk_index: 0
  type: generic
- description: "The number of epochs used for intermediate layer distillation. For\
    \ general distillation, it is 3 epochs. For task-specific distillation, it is\
    \ 10 epochs for the augmented dataset, and 5 epochs for tasks like MNLI, QQP,\
    \ and QNLI which have \u2265 100K training examples, and 50 epochs for the CoLA\
    \ task."
  name: Intermediate layer distillation epochs
  source_chunk_index: 0
  type: generic
- description: The batch size used in the experiments. For task-specific distillation,
    the batch size is 32. For tasks like MNLI, QQP, and QNLI, the batch size is 256.
  name: Batch size
  source_chunk_index: 0
  type: generic
- description: The learning rates used in the experiments. For task-specific distillation,
    the learning rate is 5e-5 for intermediate layer distillation and 3e-5 for prediction
    layer distillation.
  name: Learning rate
  source_chunk_index: 0
  type: generic
