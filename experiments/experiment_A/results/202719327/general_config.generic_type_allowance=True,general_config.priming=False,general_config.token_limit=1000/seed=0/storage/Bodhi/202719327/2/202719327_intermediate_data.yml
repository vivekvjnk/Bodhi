entities:
- description: A two-stage framework for knowledge distillation, designed to reduce
    the model size and inference time of BERT-based NLP applications.
  name: TinyBERT
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method used as a baseline for comparison with
    TinyBERT.
  name: BERT-PKD
  source_chunk_index: 0
  type: method
- description: A knowledge distillation method used as a baseline for comparison with
    TinyBERT.
  name: DistilBERT
  source_chunk_index: 0
  type: method
- description: The Corpus of Linguistic Acceptability dataset, used to evaluate the
    performance of TinyBERT, focusing on linguistic acceptability judgments.
  name: CoLA dataset
  source_chunk_index: 0
  type: dataset
- description: The Multi-Genre Natural Language Inference dataset, used in ablation
    studies and evaluation of TinyBERT.
  name: MNLI
  source_chunk_index: 0
  type: dataset
- description: The Microsoft Research Paraphrase Corpus dataset, used in ablation
    studies and evaluation of TinyBERT.
  name: MRPC
  source_chunk_index: 0
  type: dataset
- description: A set of natural language understanding tasks used to evaluate the
    performance of TinyBERT.
  name: GLUE tasks
  source_chunk_index: 0
  type: task
- description: A key procedure in the TinyBERT learning framework, focused on distilling
    knowledge specific to a given task.
  name: Task-specific Distillation (TD)
  source_chunk_index: 0
  type: method
- description: A key procedure in the TinyBERT learning framework, focused on distilling
    general linguistic knowledge.
  name: General Distillation (GD)
  source_chunk_index: 0
  type: method
- description: A key procedure in the TinyBERT learning framework, used to improve
    model performance.
  name: Data Augmentation (DA)
  source_chunk_index: 0
  type: method
- description: A knowledge distillation technique applied to the Transformer layers
    of the model.
  name: Transformer-layer distillation
  source_chunk_index: 0
  type: method
- description: A knowledge distillation technique applied to the embedding layers
    of the model.
  name: Embedding-layer distillation
  source_chunk_index: 0
  type: method
- description: A knowledge distillation technique applied to the prediction layer
    of the model.
  name: Prediction-layer distillation
  source_chunk_index: 0
  type: method
- description: A pre-trained BERT model used as a teacher model for TinyBERT.
  name: BERT BASE
  source_chunk_index: 0
  type: method
- description: A smaller BERT model, used as a potential initialization for TinyBERT.
  name: BERT SMALL
  source_chunk_index: 0
  type: method
- description: The text corpus used for general distillation in the TinyBERT framework.
  name: English Wikipedia
  source_chunk_index: 0
  type: dataset
- description: The batch size used during the task-specific distillation phase. Specifically,
    it is 32 for the augmented dataset.
  name: Batch Size for Task-Specific Distillation
  source_chunk_index: 0
  type: generic
- description: The learning rate used during the task-specific distillation phase.
    Specifically, it is 5e-5 for intermediate layer distillation and 3e-5 for prediction
    layer distillation.
  name: Learning Rate for Task-Specific Distillation
  source_chunk_index: 0
  type: generic
- description: The number of epochs used for intermediate layer distillation on the
    CoLA task. Specifically, it is 50 epochs.
  name: Epochs for Intermediate Layer Distillation (CoLA)
  source_chunk_index: 0
  type: generic
- description: The number of epochs used for intermediate layer distillation on the
    MNLI, QQP, and QNLI tasks. Specifically, it is 5 epochs.
  name: Epochs for Intermediate Layer Distillation (MNLI, QQP, QNLI)
  source_chunk_index: 0
  type: generic
- description: The batch size used during the intermediate layer distillation for
    MNLI, QQP, and QNLI tasks. Specifically, it is 256.
  name: Batch Size for Intermediate Layer Distillation (MNLI, QQP, QNLI)
  source_chunk_index: 0
  type: generic
- description: The number of epochs used for general distillation. Specifically, it
    is 3 epochs.
  name: Epochs for General Distillation
  source_chunk_index: 0
  type: generic
- description: The batch size used during the task-specific distillation phase. Specifically,
    it is 32 for the augmented dataset.
  name: Batch Size for Task-Specific Distillation
  source_chunk_index: 0
  type: generic
- description: The learning rate used during the prediction layer distillation phase.
    Specifically, it is 3e-5.
  name: Learning Rate for Prediction Layer Distillation
  source_chunk_index: 0
  type: generic
- description: The learning rate used during the general distillation phase.
  name: General Distillation Learning Rate
  source_chunk_index: 0
  type: generic
- description: The batch size used during the general distillation phase.
  name: General Distillation Batch Size
  source_chunk_index: 0
  type: generic
- description: The learning rate used during the general distillation process, which
    is the same as BERT pre-training (Devlin et al., 2018).
  name: Learning Rate for General Distillation
  source_chunk_index: 0
  type: generic
- description: The batch size used during the general distillation process, which
    is the same as BERT pre-training (Devlin et al., 2018).
  name: Batch Size for General Distillation
  source_chunk_index: 0
  type: generic
