    distillation stages.
  name: Two-stage learning framework
  source_chunk_index: 0
  type: method
- description: The first stage of the two-stage learning framework, providing a good
    initialization for task-specific distillation.
  name: General distillation
  source_chunk_index: 0
  type: method
- description: The second stage of the two-stage learning framework, focusing on learning
