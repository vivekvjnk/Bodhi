- description: A metric used to evaluate the accuracy of object detection models.
    It measures the overlap between the predicted bounding box and the ground truth
    bounding box. In the context of the KITTI dataset, proposal boxes with an IoU
    greater than 70% are considered true detections for cars.
  name: Intersection over Union (IoU)
  source_chunk_index: 0
  type: generic
- description: Predefined bounding boxes of different sizes and aspect ratios used
    in Faster R-CNN to propose potential object locations. They are a key component
    of the Region Proposal Network (RPN).
  name: Anchor Boxes
