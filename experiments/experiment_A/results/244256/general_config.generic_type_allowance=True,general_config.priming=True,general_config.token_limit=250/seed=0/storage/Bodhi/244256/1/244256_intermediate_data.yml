chunk_indices:
- 0
entities:
- description: The task of identifying and locating objects within an image, a core
    focus of the paper in the context of car detection.
  name: Object Detection
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for training and evaluating object detection models,
    specifically for car detection in the context of ADAS applications.
  name: KITTI
  source_chunk_index: 0
  type: Dataset
- description: A method that uses shared convolutional feature maps for fast object
    detection, which inspired Faster R-CNN.
  name: SPPNet
  source_chunk_index: 0
  type: GENERIC
- description: The process of determining the location of an object within an image,
    a key aspect of object detection.
  name: Localization
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning-based object detection framework that uses a Region
    Proposal Network (RPN) to generate region proposals and an R-CNN network for classification.
    It is used for car detection in ADAS applications.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that generates region proposals for potential
    objects, such as cars, to be classified by the R-CNN network.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A convolutional neural network used for object classification, particularly
    within the Faster R-CNN framework, which receives region proposals from the RPN.
  name: R-CNN
  source_chunk_index: 0
  type: method
- description: A method for object detection that predicts a single box for localization.
  name: OverFeat
  source_chunk_index: 0
  type: method
- description: A method for object detection that predicts multiple boxes in a class-agnostic
    way.
  name: Multibox
  source_chunk_index: 0
  type: method
- description: An object detection method that improves upon R-CNN by sharing convolutional
    features for faster inference.
  name: Fast R-CNN
  source_chunk_index: 0
  type: method
- description: Convolutional features that are computed once and then reused for multiple
    region proposals, improving efficiency in object detection.
  name: Shared Convolution Features
  source_chunk_index: 0
  type: generic
- description: The primary objective of identifying and locating cars within images,
    specifically in the context of ADAS applications, as described in the priming
    summary.
  name: Car Detection
  source_chunk_index: 0
  type: task
