entities:
- description: The task of identifying and locating objects within an image, a core
    focus of the paper, particularly in the context of car detection for ADAS.
  name: Object Detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of categorizing images based on their content, relevant
    to the performance of CNN architectures used in object detection.
  name: Image Classification
  source_chunk_index: 0
  type: GENERIC
- description: The process of determining the position of an object within an image,
    a key aspect of object detection.
  name: Localization
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for evaluating car detection algorithms, providing a
    challenging environment for testing and improving accuracy.
  name: KITTI
  source_chunk_index: 0
  type: Dataset
- description: A large-scale dataset used for pre-training CNN architectures like
    AlexNet and VGG16.
  name: ImageNet
  source_chunk_index: 0
  type: Dataset
- description: A predefined bounding box used in object detection to propose potential
    object locations.
  name: Anchor box
  source_chunk_index: 0
  type: GENERIC
- description: The surrounding area considered when analyzing a specific region in
    an image, used to improve detection accuracy.
  name: Context windows
  source_chunk_index: 0
  type: GENERIC
- description: A feature layer in CNN architectures, used for feature extraction and
    analysis in object detection tasks.
  name: conv5_3
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning-based object detection method, a faster variant of
    R-CNN, used for car detection and other object detection tasks. It utilizes a
    Region Proposal Network (RPN) to generate region proposals.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A method for object detection that uses selective search for object
    region proposal and a classification network. Faster R-CNN is a faster variant
    of R-CNN.
  name: R-CNN
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used in Faster R-CNN configurations
    for car detection, known for its relatively shallow structure and high accuracy.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used in Faster R-CNN configurations,
    known for its deeper structure compared to AlexNet.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A type of deep learning architecture used for image analysis, including
    object detection and classification. AlexNet and VGG16 are examples.
  name: Convolutional Neural Network (CNN)
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that generates region proposals for the
    R-CNN classification network.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A high-accuracy method for identifying objects in the KITTI dataset,
    combining Scale Dependent Pooling (SDP) with Cascaded Region Classifiers (CRC).
  name: SDP+CRC
  source_chunk_index: 0
  type: method
- description: Deformable parts models, a method that was state-of-the-art for image
    object detection before the emergence of deep convolutional neural networks.
  name: DPM
  source_chunk_index: 0
  type: method
- description: A widely-used dataset for training 2D object detection models, used
    in conjunction with ImageNet.
  name: PASCAL
  source_chunk_index: 0
  type: dataset
- description: A method for object detection that predicts a single box for localization.
  name: OverFeat
  source_chunk_index: 0
  type: method
- description: A method that uses shared convolutional feature maps for fast object
    detection, inspiring the development of Faster R-CNN.
  name: SPPNet
  source_chunk_index: 0
  type: method
- description: An approach that uses 2D images to identify the pose of objects, with
    the goal of detecting objects as 3D bounding boxes.
  name: Mono 3D
  source_chunk_index: 0
  type: method
- description: A classification dataset used for pretraining the VGG16 and AlexNet
    CNN architectures in the context of this study.
  name: ImageNet-1k
  source_chunk_index: 0
  type: dataset
- description: A technique developed by the R-CNN authors that allows input images
    of any size to be used with AlexNet/VGG FC layers.
  name: ROI Pooling
  source_chunk_index: 0
  type: method
- description: A website from which user-generated images and videos are obtained
    for annotation to build supervised 2D datasets.
  name: Flickr
  source_chunk_index: 0
  type: dataset
- description: A website from which user-generated images and videos are obtained
    for annotation to build supervised 2D datasets.
  name: YouTube
  source_chunk_index: 0
  type: dataset
