entities:
- description: The process of identifying and locating objects within an image or
    video, a key task in ADAS.
  name: Object Detection
  source_chunk_index: 0
  type: GENERIC
- description: Advanced Driver-Assistance Systems, the application context for the
    car detection research.
  name: ADAS
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning architecture used for object detection, particularly
    for car detection in the context of ADAS. It utilizes a Region Proposal Network
    (RPN) and ROI Pooling.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluating object detection algorithms, specifically
    for car detection.
  name: KITTI dataset
  source_chunk_index: 0
  type: dataset
- description: A class of deep learning architectures used for image analysis, including
    object detection. AlexNet and VGG16 are examples.
  name: Convolutional Neural Network (CNN)
  source_chunk_index: 0
  type: method
- description: A CNN architecture used for image classification and object detection,
    explored in the context of Faster R-CNN.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A CNN architecture with sixteen convolutional layers, used in Faster
    R-CNN for car detection and compared with AlexNet.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: Layers within a CNN that perform feature extraction from input images.
    The paper examines the impact of different layers (e.g., conv4_3, conv5_3) on
    detection accuracy.
  name: convolutional layers
  source_chunk_index: 0
  type: generic
- description: A component of Faster R-CNN that generates region proposals, suggesting
    potential locations of objects within an image.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A technique used in Faster R-CNN to handle varying input sizes by pooling
    features from different regions of interest into a fixed size.
  name: ROI Pooling
  source_chunk_index: 0
  type: method
- description: Predefined bounding boxes used by the RPN to propose object locations.
    The paper discusses the impact of anchor box selection on detection accuracy.
  name: anchor box
  source_chunk_index: 0
  type: generic
- description: A large dataset used for pre-training CNN models, such as those used
    in Faster R-CNN.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: A method for object detection that combines scale-dependent pooling
    (SDP) with cascaded region classifiers (CRC), used for comparison with Faster
    R-CNN.
  name: SDP+CRC
  source_chunk_index: 0
  type: method
- description: An approach that uses 2D images to identify the pose of objects, with
    the goal of detecting objects as 3D bounding boxes.
  name: Mono3D
  source_chunk_index: 0
  type: method
- description: A dataset used for pre-training and comparison in object detection
    tasks, similar to ImageNet.
  name: PASCAL
  source_chunk_index: 0
