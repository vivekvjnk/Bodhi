    by the convolutional layers.
  name: Fully connected layers
  source_chunk_index: 0
  type: method
- description: A metric used to evaluate the overlap between the predicted bounding
    box and the ground truth bounding box. In the context of the KITTI dataset, proposal
    boxes having an IoU greater than 70% are counted as true detections for cars.
  name: Intersection over Union (IoU)
  source_chunk_index: 0
  type: dataset
