    in the R-CNN framework for object detection.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: An object detection method that builds upon R-CNN by reusing shared
    convolutional features for region proposals, improving inference speed.
  name: Fast R-CNN
  source_chunk_index: 0
  type: method
- description: A method for image object detection that was state-of-the-art before
    the emergence of deep convolutional neural networks.
  name: Deformable Parts Models (DPM)
  source_chunk_index: 0
  type: method
- description: A method that uses shared convolutional feature maps for fast object
    detection, inspiring the development of Faster R-CNN.
  name: SPPNet
  source_chunk_index: 0
  type: method
- description: A method that predicts a single bounding box for localization.
  name: OverFeat
  source_chunk_index: 0
  type: method
- description: A method that predicts multiple bounding boxes in a class-agnostic
    way.
  name: Multibox
  source_chunk_index: 0
  type: method
- description: A high-accuracy method for identifying objects in the KITTI dataset,
    combining scale-dependent pooling (SDP) with cascaded region classifiers (CRC).
  name: SDP+CRC
  source_chunk_index: 0
  type: method
- description: A method that uses 2D images to identify the pose of objects, with
    the goal of detecting objects as 3D bounding boxes, built around a version of
    R-CNN.
  name: Mono 3D
  source_chunk_index: 0
  type: method
