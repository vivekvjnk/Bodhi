    a specific method for assessing performance.
  name: Intersection over Union (IoU)
  source_chunk_index: 1
  type: method
- description: A large-scale image dataset used for pre-training CNNs, specifically
    the ImageNet-1k classification dataset, which is used to pre-train the VGG16 and
    AlexNet networks in this study.
  name: ImageNet
  source_chunk_index: 1
  type: dataset
- description: A dataset used for object detection, mentioned in comparison to the
    KITTI dataset, highlighting the challenges of adapting Faster R-CNN from PASCAL
    to KITTI due to differences in image sizes.
  name: PASCAL
  source_chunk_index: 1
  type: dataset
- description: A specific convolutional layer within the VGG16 CNN architecture. The
    paper uses features from this layer as input to both the region proposal network
    (RPN) and the classification network.
  name: CONV5_3
  source_chunk_index: 1
  type: method
- description: Layers used as the R-CNN branch for VGG16 and AlexNet architectures.
    These layers are fully connected and used for classification after feature extraction
    by the convolutional layers.
  name: Fully connected layers
  source_chunk_index: 1
  type: method
- description: A metric used to evaluate the overlap between the predicted bounding
    box and the ground truth bounding box. In the context of the KITTI dataset, proposal
    boxes having an IoU greater than 70% are counted as true detections for cars.
  name: Intersection over Union (IoU)
  source_chunk_index: 1
  type: dataset
- description: The objective of identifying and locating cars within images, a key
    task in ADAS applications.
  name: Car detection
  source_chunk_index: 2
  type: Task
- description: A deep learning object detection method used for car detection, employing
    a Region Proposal Network (RPN).
  name: Faster R-CNN
  source_chunk_index: 2
  type: Method
- description: A dataset for autonomous driving research, used to evaluate the performance
    of car detection methods.
  name: KITTI Dataset
  source_chunk_index: 2
  type: Dataset
- description: A convolutional neural network (CNN) architecture used as a feature
    extractor within the R-CNN framework for car detection. The paper uses conv5 activations
    as input to the R-CNN region-proposal and classification branches.
  name: AlexNet
  source_chunk_index: 2
  type: method
- description: A convolutional neural network (CNN) architecture used as a feature
    extractor within the R-CNN framework for car detection. The paper explores the
    impact of different convolutional layers (e.g., conv4_3, conv5_3) on detection
    accuracy.
  name: VGG16
  source_chunk_index: 2
  type: method
- description: The size of the input images used in the Faster R-CNN model, which
    significantly impacts detection accuracy. The paper investigates the effect of
    different input resolutions, such as 2000x604 and 5000x1510, on car detection
    performance.
  name: Input Resolution
  source_chunk_index: 2
  type: task
- description: An additional feature extraction branch added to the R-CNN framework
    to improve accuracy. It trains on features extracted from a context window, and
    its features are concatenated with the original R-CNN features before classification.
  name: Context Window
  source_chunk_index: 2
  type: method
- description: The time taken to perform object detection, a key metric for evaluating
    the efficiency of the Faster R-CNN method.
  name: Inference Time
  source_chunk_index: 2
  type: task
