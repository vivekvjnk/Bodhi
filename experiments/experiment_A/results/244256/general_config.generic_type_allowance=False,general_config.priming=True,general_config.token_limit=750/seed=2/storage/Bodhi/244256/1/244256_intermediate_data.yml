entities:
- description: The objective of identifying and locating cars within images, a key
    task in ADAS applications.
  name: Car detection
  source_chunk_index: 0
  type: Task
- description: A deep learning object detection method used for car detection, employing
    a Region Proposal Network (RPN).
  name: Faster R-CNN
  source_chunk_index: 0
  type: Method
- description: A dataset for autonomous driving research, used to evaluate the performance
    of car detection methods.
  name: KITTI Dataset
  source_chunk_index: 0
  type: Dataset
- description: A convolutional neural network (CNN) architecture used as a feature
    extractor within the Faster R-CNN framework for car detection.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A convolutional neural network (CNN) architecture used as a feature
    extractor within the Faster R-CNN framework for car detection.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A large-scale image dataset used for pre-training the AlexNet and VGG16
    CNNs.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: A network within Faster R-CNN that proposes potential object bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A technique used in R-CNN variants to allow for input images of any
    size to be used with the fully connected layers of CNN architectures like AlexNet/VGG.
  name: ROI Pooling
  source_chunk_index: 0
  type: method
- description: A specific convolutional layer within the VGG16 CNN architecture. The
    paper examines the activations from this layer as input to the region proposal
    network (RPN) and the classification network in Faster R-CNN.
  name: Conv5_3
  source_chunk_index: 0
  type: method
- description: Layers in the VGG16 and AlexNet architectures that are used as the
    R-CNN branch in Faster R-CNN. These layers are fully connected and used for classification.
  name: Fully Connected Layers
  source_chunk_index: 0
  type: method
