entities:
- description: The task of identifying and locating objects within an image.
  name: Object Detection
  source_chunk_index: 0
  type: task
- description: A deep learning-based object detection method used for car detection.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A class of deep neural networks, used for image analysis and object
    detection.
  name: Convolutional Neural Network (CNN)
  source_chunk_index: 0
  type: method
- description: A CNN architecture used in the Faster R-CNN framework.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A CNN architecture used in the Faster R-CNN framework.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that generates region proposals for object
    detection.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A dataset used for training and evaluating car detection models, particularly
    within the context of ADAS applications.
  name: KITTI dataset
  source_chunk_index: 0
  type: dataset
- description: A method for object detection in the KITTI dataset that combines scale-dependent
    pooling (SDP) with cascaded region classifiers (CRC).
  name: SDP+CRC
  source_chunk_index: 0
  type: method
- description: A method for monocular 3D object detection, aiming to identify the
    pose of objects and detect them as 3D bounding boxes using 2D images.
  name: Mono3D
  source_chunk_index: 0
  type: method
- description: A family of methods for object detection, including the base R-CNN
    and its variants, which are used as a foundation for other methods like Mono3D.
  name: R-CNN
  source_chunk_index: 0
  type: method
- description: A method for object detection in the KITTI dataset that combines scale-dependent
    pooling (SDP) with cascaded region classifiers (CRC). It leverages high-resolution
    and downsampled CNN layers to achieve high accuracy.
  name: SDP+CRC
  source_chunk_index: 0
  type: method
- description: A method for 3D object detection that uses 2D images to identify the
    pose of objects and detect them as 3D bounding boxes. It is built around a version
    of R-CNN.
  name: Mono3D
  source_chunk_index: 0
  type: method
- description: A convolutional neural network layer, specifically layer 3_3 in the
    VGG16 architecture, used in SDP+CRC for feature extraction based on the resolution
    of region proposals.
  name: conv3_3
  source_chunk_index: 0
  type: method
- description: A convolutional neural network layer, specifically layer 5_3 in the
    VGG16 architecture, used in SDP+CRC for feature extraction based on the resolution
    of region proposals.
  name: conv5_3
  source_chunk_index: 0
  type: method
