entities:
- description: A dataset used for training and evaluating car detection models, specifically
    Faster R-CNN, with images of varying resolutions.
  name: KITTI dataset
  source_chunk_index: 0
  type: Dataset
- description: The task of identifying and locating objects within an image, a core
    focus of the paper.
  name: Object Detection
  source_chunk_index: 0
  type: GENERIC
- description: The process of categorizing images, a related concept to object detection,
    and relevant to the use of CNNs.
  name: Image Classification
  source_chunk_index: 0
  type: GENERIC
- description: A class of deep learning models, such as AlexNet and VGG16, used for
    feature extraction and classification in the context of car detection.
  name: Convolutional Neural Network (CNN)
  source_chunk_index: 0
  type: GENERIC
- description: The size of the input images used in the Faster R-CNN model, which
    impacts the performance of car detection.
  name: Input image resolution
  source_chunk_index: 0
  type: GENERIC
- description: A feature layer in the VGG16 architecture, used as input to the RPN
    and classification network in Faster R-CNN.
  name: conv5_3
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for object detection, referenced for comparison with
    the KITTI dataset.
  name: PASCAL
  source_chunk_index: 0
  type: Dataset
- description: The process of determining the location of objects within an image,
    a key aspect of object detection.
  name: Localization
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning-based object detection algorithm used for car detection,
    employing a Region Proposal Network (RPN) and R-CNN classification network.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A Convolutional Neural Network architecture used as a backbone in Faster
    R-CNN for feature extraction and classification, evaluated for car detection.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A Convolutional Neural Network architecture, used in Faster R-CNN,
    and compared with VGG16 for car detection.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that generates region proposals, which
    are then classified by the R-CNN branch.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: The classification network in Faster R-CNN, responsible for classifying
    the region proposals generated by the RPN.
  name: R-CNN
  source_chunk_index: 0
  type: method
- description: Convolutional layers within a CNN, such as conv4_3 and conv5_3, whose
    activations are used as input to subsequent layers like the Region Proposal Network
    (RPN) and the classification network. The selection of these layers impacts detection
    accuracy.
  name: Feature Layers
  source_chunk_index: 0
  type: GENERIC
- description: The process of optimizing the Faster R-CNN model's parameters using
    the KITTI dataset.
  name: Training
  source_chunk_index: 0
  type: GENERIC
- description: Weights from ImageNet used to initialize the convolution layers during
    Faster R-CNN training.
  name: Pre-trained weights
  source_chunk_index: 0
  type: GENERIC
- description: The number of iterations run during the R-CNN training phase.
  name: 70K iterations
  source_chunk_index: 0
  type: GENERIC
- description: A set of predefined bounding boxes with different scales and aspect
    ratios, used in Faster R-CNN to propose potential object locations. The text does
    not explicitly mention anchor boxes, but the context of Faster R-CNN and the KITTI
    dataset implies their use in the region proposal network.
  name: Anchor Boxes
  source_chunk_index: 0
  type: GENERIC
- description: The process of altering the dimensions of an image, which is performed
    in the Faster R-CNN pipeline when processing images from the KITTI dataset. The
    text mentions resizing KITTI images to 1000 x 302 as a default behavior.
  name: Image Resizing
  source_chunk_index: 0
  type: GENERIC
