  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the Faster R-CNN framework.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the Faster R-CNN framework, known for its high accuracy in image classification
    and localization.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that proposes potential object bounding
    boxes, starting with convolution layers to compute a high-dimensional, low-resolution
    feature map.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A dataset for autonomous driving research, used for evaluating car
    detection performance, with specific image sizes (e.g., 1242 x 375 pixels).
  name: KITTI dataset
  source_chunk_index: 0
  type: dataset
- description: An evaluation metric used to assess the overlap between predicted and
    ground truth bounding boxes, with a threshold (e.g., 70%) used to determine true
    detections.
  name: Intersection over Union (IoU)
  source_chunk_index: 0
  type: generic
- description: The process of identifying and localizing objects (specifically cars)
    in images, the primary focus of the study.
  name: Object Detection
  source_chunk_index: 0
  type: task
- description: A Convolutional Neural Network (CNN) architecture, a variant of VGG16,
    used as a feature extractor within the R-CNN framework.
  name: VGG19
  source_chunk_index: 0
  type: method
- description: A technique developed by the R-CNN authors that allows input images
    of any size to be used with AlexNet/VGG fully connected layers.
  name: ROI Pooling
  source_chunk_index: 0
  type: method
- description: The KITTI dataset's evaluation criteria includes 'easy', 'medium',
