entities:
- description: The process of identifying and localizing objects within an image.
  name: Object Detection
  source_chunk_index: 0
  type: GENERIC
- description: A dataset for autonomous driving research, used for evaluating car
    detection performance.
  name: KITTI Dataset
  source_chunk_index: 0
  type: Dataset
- description: A type of deep learning architecture used for image analysis and feature
    extraction.
  name: Convolutional Neural Network (CNN)
  source_chunk_index: 0
  type: GENERIC
- description: The size of the input images, which significantly impacts detection
    accuracy.
  name: Image Resolution
  source_chunk_index: 0
  type: GENERIC
- description: The task of identifying and locating cars within images, a key component
    of ADAS.
  name: Car Detection
  source_chunk_index: 0
  type: GENERIC
- description: A convolutional layer within the VGG16 architecture, used for feature
    extraction.
  name: conv5_3
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning object detection method that uses a Region Proposal
    Network (RPN) to suggest object locations, improving upon R-CNN and Fast R-CNN.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the R-CNN framework.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the R-CNN framework.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that proposes potential object bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A metric used to evaluate the accuracy of object detection by measuring
    the overlap between predicted and ground truth bounding boxes.
  name: Intersection over Union (IoU)
  source_chunk_index: 0
  type: generic
- description: A metric used to assess the performance of object detection, often
    categorized into 'easy', 'medium', and 'hard' levels.
  name: Detection Accuracy
  source_chunk_index: 0
  type: generic
- description: A method for object detection that uses selective search for object
    region proposal and a classification network.
  name: R-CNN
  source_chunk_index: 0
  type: method
- description: An improvement over R-CNN that reuses shared convolutional features
    for region proposals, increasing inference speed.
  name: Fast R-CNN
  source_chunk_index: 0
  type: method
- description: An older method for image object detection, predating the use of deep
    convolutional neural networks. It was the state of the art before the emergence
    of deep learning methods.
  name: Deformable parts models (DPM)
  source_chunk_index: 0
  type: method
- description: A method that predicts a single bounding box for object localization.
  name: OverFeat
  source_chunk_index: 0
  type: method
- description: A method that predicts multiple bounding boxes in a class-agnostic
    way.
  name: Multibox
  source_chunk_index: 0
  type: method
- description: A method that uses shared convolutional feature maps for fast object
    detection, inspiring the development of Faster R-CNN.
  name: SPPNet
  source_chunk_index: 0
  type: method
- description: A high-accuracy method for identifying objects in the KITTI dataset,
    which combines scale-dependent pooling with cascaded region classifiers. It selects
    CNN layers based on the resolution of region proposals.
  name: Scale Dependent Pooling (SDP) + Cascaded Region Classifiers (CRC)
  source_chunk_index: 0
  type: method
- description: A method that uses 2D images to identify the pose of objects, with
    the goal of detecting objects as 3D bounding boxes. It is built around a version
    of R-CNN.
  name: Monocular 3D (Mono 3D)
  source_chunk_index: 0
  type: method
- description: A specific convolutional layer within the VGG16 CNN architecture, used
    for feature extraction.
  name: Conv4_3
  source_chunk_index: 0
  type: method
- description: A specific convolutional layer within the VGG16 CNN architecture, used
    for feature extraction.
  name: Conv5_3
  source_chunk_index: 0
  type: method
- description: A performance metric used to evaluate the accuracy of car detection,
    categorized into 'easy', 'medium', and 'hard' levels based on factors like object
    size, occlusion, and truncation in the KITTI dataset.
  name: Detection Accuracy (Easy, Medium, Hard Categories)
  source_chunk_index: 0
  type: task
