chunk_indices:
- 0
entities:
- description: The process of identifying and localizing objects within images.
  name: Object detection
  source_chunk_index: 0
  type: GENERIC
- description: Deep learning models used for feature extraction and classification
    in object detection tasks.
  name: Convolutional neural networks (CNNs)
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning object detection method, an evolution of R-CNN and
    Fast R-CNN, utilizing a Region Proposal Network (RPN) to suggest object locations.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: The task of identifying and locating cars within images, a key application
    in ADAS.
  name: Car detection
  source_chunk_index: 0
  type: task
- description: A dataset for autonomous driving research, used to evaluate the performance
    of object detection methods like Faster R-CNN.
  name: KITTI dataset
  source_chunk_index: 0
  type: dataset
- description: A convolutional neural network architecture used as a feature extractor
    within the R-CNN framework, explored for car detection accuracy.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the R-CNN framework, and its impact on detection accuracy is examined.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that proposes potential object bounding
    boxes, improving the efficiency of object detection.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A large-scale image dataset used for pre-training CNNs.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: The size of the input images, which significantly impacts detection
    accuracy.
  name: Input resolution
  source_chunk_index: 0
  type: generic
- description: An evolution of the R-CNN method that reuses shared convolution features
    for region proposals.
  name: Fast R-CNN
  source_chunk_index: 0
  type: method
- description: A method that uses selective search for object region proposal.
  name: R-CNN
  source_chunk_index: 0
  type: method
- description: A method for image object detection that was state-of-the-art before
    the emergence of deep convolutional neural nets.
  name: Deformable parts models (DPM)
  source_chunk_index: 0
  type: method
- description: A method that inspired Faster R-CNN, using shared convolutional feature
    maps for fast object detection.
  name: SPPNet
  source_chunk_index: 0
  type: method
- description: A method that predicts a single box for localization.
  name: OverFeat
  source_chunk_index: 0
  type: method
- description: A method that predicts multiple boxes in a class-agnostic way.
  name: Multibox
  source_chunk_index: 0
  type: method
- description: A dataset used for building supervised 2D datasets, alongside ImageNet,
    where mechanical turk workers annotate user-generated images and videos.
  name: PASCAL
  source_chunk_index: 0
  type: dataset
- description: A high-accuracy method for identifying objects in the KITTI dataset,
    combining scale dependent pooling (SDP) with cascaded region classifiers (CRC).
    It selects either a high-resolution or a heavily downsampled CNN layer based on
    the region proposal's resolution.
  name: SDP+CRC
  source_chunk_index: 0
  type: method
- description: An approach that uses 2D images to identify the pose of objects, with
    the goal of detecting objects as 3D bounding boxes. It is built around a version
    of R-CNN.
  name: Mono 3D
  source_chunk_index: 0
  type: method
- description: A metric used to evaluate the accuracy of object detection by measuring
    the overlap between the predicted bounding box and the ground truth bounding box.
  name: Intersection over Union (IoU)
  source_chunk_index: 0
  type: generic
- description: Evaluation of object detection performance categorized by difficulty
    levels, likely based on factors like object size, occlusion, and distance from
    the camera, as defined by the KITTI dataset.
  name: Detection Accuracy (easy, medium, hard categories)
  source_chunk_index: 0
  type: generic
