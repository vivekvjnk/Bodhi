entities:
- description: The process of identifying and localizing cars in images, a key application
    within ADAS.
  name: Car Detection
  source_chunk_index: 0
  type: Task
- description: A dataset for autonomous driving research, used to evaluate the performance
    of the proposed methods.
  name: KITTI Dataset
  source_chunk_index: 0
  type: Dataset
- description: A deep learning object detection method used for car detection, employing
    a Region Proposal Network (RPN).
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the Faster R-CNN framework; the paper examines the impact of different
    convolutional layers (e.g., conv4_3, conv5_3) on detection accuracy.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the Faster R-CNN framework; used to evaluate the impact of shallower networks
    on accuracy.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that proposes potential object bounding
    boxes.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: generic
- description: The size of the input images, which significantly impacts detection
    accuracy.
  name: Input Resolution
  source_chunk_index: 0
  type: generic
- description: A metric used to evaluate the performance of object detection models,
    often categorized into easy, medium, and hard detections.
  name: Detection Accuracy
  source_chunk_index: 0
  type: generic
- description: A specific convolutional layer within the VGG16 architecture, used
    as a feature extractor.
  name: conv4_3
  source_chunk_index: 0
  type: generic
- description: A specific convolutional layer within the VGG16 architecture, used
    as a feature extractor.
  name: conv5_3
  source_chunk_index: 0
  type: generic
- description: An additional feature extraction branch added to improve accuracy.
  name: Context Window
  source_chunk_index: 0
  type: generic
- description: The time taken to perform object detection.
  name: Inference Time
  source_chunk_index: 0
  type: generic
- description: A configuration of Faster R-CNN that uses VGG16 as the CNN backbone
    for feature extraction. The paper explores the impact of different convolutional
    layers (conv4_3, conv5_3) within this configuration on detection accuracy.
  name: VGG16-based feature representation
  source_chunk_index: 0
  type: method
- description: A CNN architecture used as a feature extractor within the R-CNN framework.
    The paper uses AlexNet to evaluate the impact of shallower convolutional layers
    on detection accuracy, comparing it with VGG16.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A specific convolutional layer (the 10th layer) within the VGG16 CNN
    architecture. The paper investigates its impact on car detection accuracy.
  name: conv4_3
  source_chunk_index: 0
  type: generic
- description: A specific convolutional layer (the 13th layer) within the VGG16 CNN
    architecture. The paper investigates its impact on car detection accuracy.
  name: conv5_3
  source_chunk_index: 0
  type: generic
- description: The components of the R-CNN framework responsible for proposing potential
    object bounding boxes and classifying them. The paper uses these branches with
    AlexNet and VGG16.
  name: R-CNN region-proposal and classification branches
  source_chunk_index: 0
  type: method
- description: An additional feature extraction branch added to the R-CNN framework
    to improve accuracy. It extracts features from a surrounding region (context)
    around the potential objects.
  name: context window
  source_chunk_index: 0
  type: method
- description: Different methods for selecting anchor boxes, which are pre-defined
    bounding boxes used to propose object locations in Faster R-CNN. The paper tests
    the AlexNet-based Faster R-CNN's detection accuracy with different schemes.
  name: anchor box selection schemes
  source_chunk_index: 0
  type: method
- description: The size of the input images, which significantly impacts detection
    accuracy. The paper explores different input resolutions (e.g., 2000x604, 5000x1510)
    for AlexNet and VGG16 configurations.
  name: Input image resolution
  source_chunk_index: 0
  type: generic
- description: The 5th convolutional layer of AlexNet, used as input to the R-CNN
    region-proposal and classification branches.
  name: Conv5
  source_chunk_index: 0
  type: method
- description: A metric used to evaluate the overlap between the predicted bounding
    box and the ground truth bounding box. It is used to assess the accuracy of object
    detection.
  name: Intersection over Union (IoU)
  source_chunk_index: 0
  type: generic
- description: The ability of the model to correctly identify and locate cars in images,
    categorized as easy, medium, and hard detections.
  name: Detection Accuracy
  source_chunk_index: 0
  type: task
- description: The 5th convolutional layer of the AlexNet CNN architecture, used as
    a feature extractor within the R-CNN framework for car detection. Activations
    from this layer are used as input to the R-CNN region-proposal and classification
    branches.
  name: AlexNet conv5
  source_chunk_index: 0
  type: method
- description: The primary evaluation metric used to assess the performance of car
    detection models, specifically categorized into 'easy', 'medium', and 'hard' detection
    difficulties.
  name: Detection Accuracy
  source_chunk_index: 0
  type: task
