entities:
- description: Layers within CNN architectures (AlexNet, VGG16) that extract features
    from images. The paper examines the impact of different convolutional layers on
    detection accuracy.
  name: Convolutional Layers
  source_chunk_index: 0
  type: GENERIC
- description: The size of the input images, which significantly impacts detection
    accuracy in the context of Faster R-CNN.
  name: Input Resolution
  source_chunk_index: 0
  type: GENERIC
- description: The branch of the Faster R-CNN architecture that uses fully connected
    layers for classification.
  name: R-CNN branch
  source_chunk_index: 0
  type: GENERIC
- description: A specific convolutional layer within the VGG16 architecture, used
    as input to the RPN and classification network.
  name: conv5_3
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning object detection method that utilizes a region proposal
    network (RPN) to suggest object locations, used for car detection in ADAS applications.
  name: Faster R-CNN
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the Faster R-CNN framework.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a feature extractor
    within the Faster R-CNN framework, known for its sixteen convolutional layers.
  name: VGG16
  source_chunk_index: 0
  type: method
- description: A network within Faster R-CNN that proposes potential object bounding
    boxes, used to identify potential object locations.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
- description: A dataset for autonomous driving research, used to evaluate the performance
    of object detection methods like Faster R-CNN.
  name: KITTI Dataset
  source_chunk_index: 0
  type: dataset
- description: A large-scale image dataset used for pre-training CNNs, such as AlexNet
    and VGG16.
  name: ImageNet
  source_chunk_index: 0
  type: dataset
- description: The process of identifying and localizing objects (cars) in images,
    a key focus of the paper within the context of ADAS.
  name: Object Detection
  source_chunk_index: 0
  type: task
- description: Intersection over Union, an evaluation metric used to assess the accuracy
    of object detection.
  name: IoU
  source_chunk_index: 0
  type: generic
- description: Categories used in the KITTI dataset's evaluation criteria to assess
    detection accuracy based on the difficulty of the detection task.
  name: Easy, Medium, Hard Categories
  source_chunk_index: 0
  type: GENERIC
- description: A convolutional layer within the VGG16 CNN architecture, used as a
    feature extractor in Faster R-CNN. The activations from this layer serve as input
    to both the region proposal network (RPN) and the classification network.
  name: Conv5_3
  source_chunk_index: 0
  type: METHOD
- description: A convolutional layer within the VGG16 CNN architecture. The paper
    examines the use of features from convolutional layers that are the bottom layers
    of the previous pooling layer, such as conv4_3.
  name: Conv4_3
  source_chunk_index: 0
  type: METHOD
- description: A technique developed by the R-CNN authors that allows input images
    of any size to be used with AlexNet/VGG fully connected layers.
  name: ROI Pooling
  source_chunk_index: 0
  type: method
