    branches.
  name: AlexNet conv5
  source_chunk_index: 2
  type: method
- description: The primary evaluation metric used to assess the performance of car
    detection models, specifically categorized into 'easy', 'medium', and 'hard' detection
    difficulties.
  name: Detection Accuracy
  source_chunk_index: 2
