    for region proposals.
  name: Fast R-CNN
  source_chunk_index: 0
  type: method
- description: A method that uses selective search for object region proposal.
  name: R-CNN
  source_chunk_index: 0
  type: method
- description: A method for image object detection that was state-of-the-art before
    the emergence of deep convolutional neural nets.
  name: Deformable parts models (DPM)
  source_chunk_index: 0
  type: method
- description: A method that inspired Faster R-CNN, using shared convolutional feature
    maps for fast object detection.
  name: SPPNet
  source_chunk_index: 0
  type: method
- description: A method that predicts a single box for localization.
  name: OverFeat
  source_chunk_index: 0
  type: method
- description: A method that predicts multiple boxes in a class-agnostic way.
  name: Multibox
  source_chunk_index: 0
  type: method
- description: A dataset used for building supervised 2D datasets, alongside ImageNet,
    where mechanical turk workers annotate user-generated images and videos.
  name: PASCAL
  source_chunk_index: 0
  type: dataset
- description: A high-accuracy method for identifying objects in the KITTI dataset,
    combining scale dependent pooling (SDP) with cascaded region classifiers (CRC).
    It selects either a high-resolution or a heavily downsampled CNN layer based on
    the region proposal's resolution.
  name: SDP+CRC
  source_chunk_index: 0
  type: method
- description: An approach that uses 2D images to identify the pose of objects, with
    the goal of detecting objects as 3D bounding boxes. It is built around a version
    of R-CNN.
  name: Mono 3D
  source_chunk_index: 0
  type: method
- description: A metric used to evaluate the accuracy of object detection by measuring
    the overlap between the predicted bounding box and the ground truth bounding box.
  name: Intersection over Union (IoU)
  source_chunk_index: 0
  type: generic
- description: Evaluation of object detection performance categorized by difficulty
    levels, likely based on factors like object size, occlusion, and distance from
    the camera, as defined by the KITTI dataset.
  name: Detection Accuracy (easy, medium, hard categories)
  source_chunk_index: 0
  type: generic
