  name: Convolutional Layer
  source_chunk_index: 0
  type: method
- description: A neural network that proposes regions of an image that are likely
    to contain objects. It is used in Faster R-CNN to improve the speed of object
    detection by replacing the selective search method.
  name: Region Proposal Network (RPN)
  source_chunk_index: 0
  type: method
