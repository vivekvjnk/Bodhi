    detection. It inspired the Faster R-CNN method.
  name: SPPNet
  source_chunk_index: 0
  type: method
- description: A dataset used for building supervised 2D datasets, often used in conjunction
    with ImageNet. Mechanical Turk workers annotate user-generated images and videos
    from websites such as Flickr or YouTube to build this dataset.
  name: PASCAL
