      - CNN branch , an extra R - CNN branch is added that trains on the features
      extracted from context window .The original R - CNN features and the context
      R - CNN features are concatenated before classification .When applying the context
      window to an AlexNet - based R - CNN configuration , we find that the accuracy
      of all the categories improve as shown in Table 4 .We tested the AlexNet - based
      Faster R - CNN 's detection accuracy with different anchor box selection schemes
      , and the result is shown in Table 3 .The inference time using AlexNet conv
      5 layer with input image size of 5 0 0 0 x 1 5 1 0 and VGG 1 6 conv 4 3 layer
      with input image size of 2 0 0 0 x 6 0 4 is 0. 3 4 s and 0. 6 s respectively
      .Inferencetimes for other published high accuracy methods on the KITTI dataset
      are 3s for 3DOP [ 3 ] and 0. 4 s for SDP+CRC [ 2 5 ] .We have shown that input
      image resolution has a large impact on the accuracy of car detection using the
      faster R - CNN network .
