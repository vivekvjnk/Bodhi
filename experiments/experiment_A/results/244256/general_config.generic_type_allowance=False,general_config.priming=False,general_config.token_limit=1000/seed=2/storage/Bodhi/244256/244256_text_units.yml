    text_unit: Specifically relevant to ADAS application is the dramatic increase
      in accuracy of image object classification [ 1 6 , 2 2 , 2 1 , 1 2 ] and localization
      [ 2 0 , 2 6 , 1 0 , 9 , 1 9 ] in the last few years .R - CNN and its faster
      variants have become the state of the art in different object detection tasks
      .In this work , we leverage this method to establish a number of observations
      related to car detection on the challenging KITTI [ 8 ] dataset .Surprisingly
      , even shallow models like AlexNet provide high accuracy on the detection task
      .We do additional exploration of R - CNN based configurations in Section 7 We
      summarize our findings in the context of the related work in Section 8 , and
      we conclude in Section 9 . Deformable parts models ( DPM ) were the state of
      the art for image object detection [ 7 ] before the emergence of deep convolutional
      neural nets .The R - CNN method uses selective search for object region proposal
      [ 1 0 ] .The proposed regions in an image are warped to a fixed size and fed
      into a classification network called R - CNN .Fast R - CNN was introduced to
      reuse the shared convolution features for the region proposals [ 9 ] .In Fast
      R - CNN [ 9 ] , the inference speed is still dominated by the region proposal
      in the selective search method .Inspired by the SPPNet [ 1 1 ] method , Faster
      R - CNN uses a region proposal network ( RPN ) to regress proposal boxes to
      ground truth boxes .The regions proposed by the RPN network is fed into the
      R - CNN network for classification .For example , the OverFeat [ 2 0 ] method
      predicts a single box for localization whereas the Multibox [ 5 , 2 3 ] method
      predicts multiple boxes in a class - agnostic way .The SPP method [ 1 1 ] uses
      shared convolutional feature maps for fast object detection .Deep neural networks
      are the backbone of most high - accuracy approaches to identifying objects such
      as cars in KITTI and similar datasets .A high - accuracy method for identifying
      objects in KITTI dataset is scale dependent pooling ( SDP ) combined with cascaded
      region classifiers ( CRC ) [ 2 5 ] .The crux of SDP+CRC lies in selecting a
      high - resolution CNN layer ( e.g. conv 3 3 in VGG 1 6 [ 2 1 ] ) or a heavily
      downsampled CNN layer ( e.g. conv 5 3 ) , depending on the resolution of each
      region proposal .By combining features from multiple convolution layers , they
      were able to achieve very high accuracy on KITTI 's object detection task .Another
      approach is Monocular 3D ( Mono 3 D ) which actually uses 2D images , but it
      aims to identify the pose of objects , with the goal of detecting objects as
      3D bounding boxes .Like SDP+CRC , Mono 3 D is built around a version of R -
      CNN .There are also a number of anonymous and/or sparsely - explained submissions
      to the KITTI website 's leaderboard that are reportedly built on top of R -
      CNN .To build supervised 2D datasets such as ImageNet [ 4 ] and PASCAL [ 6 ]
      , a widely - used approach is to have mechanical turk workers annotate user
      - generated images and videos from websites such as Flickr or YouTube .For example
      , in VGG 1 6 , for a standard input image size 2 2 4 x 2 2 4 , the features
      calculated by the first convolution layer is 2 2 4 x 2 2 4 which reduce to 1
      4 x 1 4 at the output of conv 5 3 .Similarly for AlexNet , the convolution feature
      dimension reduces from 5 5 x 5 5 in conv 1 to 6x 6 in pool 5 .In some CNN architectures
      such as AlexNet [ 1 6 ] and VGG 1 6 [ 2 1 ] , the first fully - connected layer
      expects a specific height and width for its input data ( e.g. 6x 6 for AlexNet
      ) .At the CNN architecture level , an easy way around this is to design a CNN
      architecture that has global average pooling prior to the first FC layer -this
      approach was popularized in the Network - in - Network ( NiN ) architecture
      [ 1 7 ] , and it is now used in other architectures such as SqueezeNet [ 1 5
      ] and ResNet architectures [ 1 2 ] .However , when using AlexNet or VGG 1 9
      , the R - CNN authors developed a technique called ROI Pooling that allows any
      size input image to be used in concert with AlexNet/VGG FC layers .We briefly
      review how the region proposal network ( RPN ) in Faster R - CNN generate proposals
      [ 1 9 ] that will be useful later .RPN starts with convolution layers , which
      computes a high dimensional , low resolution feature map for the input image
      .As we will see later in this paper , reducing this distance , or relatively
      , increasing the " anchor density " will significantly increase the localization
      accuracy , thus improve the detection accuracy . We train faster R - CNN networks
      built on the VGG 1 6 [ 2 1 ] and AlexNet [ 1 6 ] , pretrained on the ImageNet
      - 1 k [ 4 ] classification dataset .VGG 1 6 has sixteen convolution layers [
      2 1 ] and AlexNet has only five convolutional layers [ 1 6 ] .Rather
  1:
