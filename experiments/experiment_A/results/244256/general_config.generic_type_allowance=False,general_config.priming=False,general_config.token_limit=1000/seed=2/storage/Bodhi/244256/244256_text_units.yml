    text_unit: than using the convolution features of the last pooled layer ( as is
      done in the original faster R - CNN paper ) , we use features from convolutional
      layers that are the bottom layers of the previous pooling layer .For VGG 1 6
      and AlexNet , fully connected layers are used as the R - CNN branch .Asthe standard
      procedure introduced in faster R - CNN , we randomly sample 1 2 8 positive and
      1 2 8 negative roi proposals per batch to train the R - CNN layer .A total of
      7 0 K iterations are run during R - CNN training starting from imagenet pre
      - trained weights for the convolution layers .We use the KITTI object detection
      dataset .In KITTI 's evaluation criteria , proposal boxes having overlap with
      the ground truth or IoU greater than 7 0 % are counted as true detection for
      cars .The Faster R - CNN algorithm has been shown to deliver high accuracy on
      the PASCAL [ 6 ] dataset .Adapting that pipeline from PASCAL to KITTI poses
      a few natural challenges .First , the image sizes in the KITTI dataset is 1
      2 4 2 x 3 7 5 pixels whereas the image sizes in PASCAL dataset is 5 0 0 pixels
      in the longest dimension ( many PASCAL images are 5 0 0 x 3 3 3 or 3 3 3 x 5
      0 0 ) .We performed extensive design space search of Faster R - CNN configurations
      on the KITTI dataset .Our starting point is the VGG 1 6 network that has achieved
      high accuracy in both image classification [ 2 1 ] and localization [ 1 9 ]
      .KITTI images have a native resolution of 1 2 9 5 x 3 7 5 , so the default Faster
      R - CNN behavior is to resize KITTI images to 1 0 0 0 x 3 0 2 .For example ,
      the conv 5 3 activations -which serves as input to both the region proposal
      network ( RPN ) and the classification network -double in height and width .In
      the next section , we consider shallower networks with fewer layers of activation
      planes , which enables us to move to even higher input resolutions . So far
      , we have upsampled the input image until we ran out of on - chip GPU memory
      when training R - CNN models with a VGG 1 6 - based feature representation .In
      VGG 1 6 's scheme for naming layers , conv 4 3 is the 1 0 th layer , and conv
      5 3 is the 1 3 th layer in the CNN .We expected that the accuracy of R - CNN
      with conv 4 3 would be slightly lower than R - CNN with conv 5 3 , but as we
      show in Table 2 that the accuracy is higher with conv 4 3 by 5. 5 , 9. 4 , and
      1 2 . 4 percentage - points for easy , medium , and hard detections .We initially
      considered using the earlier layers of VGG 1 6 as input to the Region Proposal
      Network .Besides depth , one of the differences between VGG 1 6 and AlexNet
      is that AlexNet downsamples more aggressively in the early layers -for example
      AlexNet has stride= 4 in the conv 1 layer ( 4x downsampling ) , while the conv
      1 layer of VGG 1 6 has stride= 1 ( no downsampling ) .So , to evaluate this
      question of how using shallower ( < 1 0 conv layers ) network impacts accuracy
      , we use AlexNet instead of VGG 1 6 .We use conv 5 ( 5th layer ) activations
      as input to the R - CNN region - proposal and classification branches , and
      we report the results in Table 2 .With resolution of 2 0 0 0 x 6 0 4 for both
      AlexNet - conv 5 and VGG 1 6 - conv 4 3 , the VGG 1 6 - based configuration
      delivers significantly higher accuracy on easy , medium , and hard detections
      in Table 2 .We have additional memory available when running AlexNet with 2
      0 0 0 x 6 0 4 input images , so we now try upsampling the AlexNet input images
      to 5 0 0 0 x 1 5 1 0 .In this configuration , on the easy detections , AlexNet
      with 5 0 0 0 x 1 5 1 0 input is within 0. 5 of a percentage - point of our best
      VGG 1 6 - based result so far .On medium and hard categories , VGG 1 6 conv
      4 3 with an input resolution of 2 0 0 0 x 6 0 4 delivers higher accuracy than
      AlexNet with 2 0 0 0 x 6 0 4 or 5 0 0 0 x 1 5 1 0 input images .We also conduct
      a sweep of input image sizes applied to an AlexNet - based R - CNN model that
      uses conv 5 features .In
