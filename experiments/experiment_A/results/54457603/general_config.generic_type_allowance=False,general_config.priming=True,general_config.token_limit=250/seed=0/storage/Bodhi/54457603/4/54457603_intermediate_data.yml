- description: A dataset collected from real university-level hockey matches, used
    for concurrent activity recognition.
  name: Hockey Dataset
  source_chunk_index: 0
  type: dataset
- description: A convolutional neural network used as a baseline for framewise activity
    recognition.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A model combining Convolutional Neural Networks (CNNs) and Long Short-Term
    Memory networks (LSTMs), used as a baseline for comparison.
  name: CNN-LSTM
