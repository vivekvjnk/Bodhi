  type: method
- description: A 3D convolutional neural network method used for activity recognition,
    serving as a baseline for comparison.
  name: i3D
  source_chunk_index: 0
  type: method
- description: A neural network architecture that captures long-range dependencies
    in the input data, used for activity recognition and compared against the proposed
    method.
  name: non-local neural network
  source_chunk_index: 0
  type: method
- description: A feature extraction method, likely a variation of VLAD (Vector of
    Locally Aggregated Descriptors), modified for the specific task of concurrent
    activity recognition. The term "tunable" suggests that the parameters of this
    method can be adjusted or optimized.
  name: Tunable VLAD descriptors
  source_chunk_index: 0
  type: method
- description: Support Vector Machines, a type of supervised machine learning algorithm
    used for classification tasks. In this context, SVMs are likely used for activity
    recognition, potentially as a baseline or comparison method.
  name: SVMs
  source_chunk_index: 0
  type: method
