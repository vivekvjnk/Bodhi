    models, significantly larger than the Charades dataset.
  name: Kinetics dataset
  source_chunk_index: 0
  type: dataset
- description: A mechanism used for feature extraction in the proposed concurrent
    activity recognition model. It maintains unaggregated temporal information to
    preserve temporal ordering.
  name: Feature-to-Activity Attention
  source_chunk_index: 0
  type: method
- description: The core component of the proposed model used for multi-label prediction.
    It learns independent temporal associations for different activities and makes
    concurrent activity predictions while considering possible activity combinations.
  name: Tri-axial Self-Attention Encoder-Decoder
  source_chunk_index: 0
  type: method
- description: A baseline model used for framewise activity recognition, against which
