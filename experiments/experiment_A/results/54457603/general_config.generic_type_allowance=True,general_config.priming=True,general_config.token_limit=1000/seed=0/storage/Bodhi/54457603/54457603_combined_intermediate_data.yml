entities:
- description: The task of recognizing multiple activities happening simultaneously
    in a video.
  name: Concurrent activity recognition
  source_chunk_index: 0
  type: GENERIC
- description: The process of extracting relevant features from video data for activity
    recognition.
  name: Feature extraction
  source_chunk_index: 0
  type: GENERIC
- description: Extracting features that capture the temporal dynamics of activities
    in videos.
  name: Temporal feature extraction
  source_chunk_index: 0
  type: GENERIC
- description: Predicting multiple activities present in a video frame or segment.
  name: Multi-label prediction
  source_chunk_index: 0
  type: GENERIC
- description: An attention mechanism that focuses on the most relevant features for
    each activity, preserving temporal ordering.
  name: Feature-to-activity attention
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning architecture component used for multi-label prediction,
    designed to capture temporal dependencies and activity relationships.
  name: Tri-axial self-attention encoder-decoder
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for evaluating concurrent activity recognition models,
    containing videos of hockey matches.
  name: Hockey dataset
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for evaluating concurrent activity recognition models,
    containing videos of volleyball matches.
  name: Volleyball dataset
  source_chunk_index: 0
  type: GENERIC
- description: A dataset used for evaluating concurrent activity recognition models,
    containing videos of various activities.
  name: Charades dataset
  source_chunk_index: 0
  type: GENERIC
- description: A pre-trained convolutional neural network used for initial feature
    extraction.
  name: VGG net
  source_chunk_index: 0
  type: GENERIC
- description: A baseline model used for comparison in concurrent activity recognition.
  name: AlexNet
  source_chunk_index: 0
  type: GENERIC
- description: A model combining Convolutional Neural Networks (CNNs) and Long Short-Term
    Memory (LSTM) networks, used as a baseline.
  name: CNN-LSTM
  source_chunk_index: 0
  type: GENERIC
- description: An attention mechanism that focuses on specific spatial regions within
    a video frame.
  name: Spatial attention
  source_chunk_index: 0
  type: GENERIC
- description: An attention mechanism that focuses on specific time steps within a
    video sequence.
  name: Temporal attention
  source_chunk_index: 0
  type: GENERIC
- description: A feature encoding technique used for representing visual information.
  name: VLAD descriptors
  source_chunk_index: 0
  type: GENERIC
- description: A component of the self-attention decoder that helps capture relationships
    between activities.
  name: Activity association mask
  source_chunk_index: 0
  type: GENERIC
- description: A component of the proposed architecture, based on the action VLAD
    source code, used for feature extraction.
  name: Modified VLAD feature extractor
  source_chunk_index: 0
  type: method
- description: A baseline method used for framewise activity recognition, against
    which the proposed method's performance is compared.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A baseline method, specifically a CNN-LSTM with a sigmoid layer, used
    for concurrent activity recognition and compared against the proposed method.
  name: CNN-LSTM
  source_chunk_index: 0
  type: method
- description: A method for spatio-temporal descriptor-based activity recognition.
  name: iDT
  source_chunk_index: 0
  type: method
- description: A method that uses spatio-temporal descriptors for activity recognition.
  name: TDD
  source_chunk_index: 0
  type: method
