    activity recognition, against which the proposed method's performance is compared.
  source_index:
  - 0
  - 0
  - 0
  id: ALEXNET
- type: GENERIC, METHOD, METHOD
  description: A model combining Convolutional Neural Networks (CNNs) and Long Short-Term
    Memory (LSTM) networks, used as a baseline. ; A baseline method, specifically
    a CNN-LSTM with a sigmoid layer, used for concurrent activity recognition and
    compared against the proposed method. ; A baseline model, specifically a Convolutional
    Neural Network combined with a Long Short-Term Memory network, used for concurrent
    activity recognition and compared against the proposed method.
