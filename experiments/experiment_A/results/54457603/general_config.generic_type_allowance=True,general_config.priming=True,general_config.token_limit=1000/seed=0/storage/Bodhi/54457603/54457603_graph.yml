  description: A component of the proposed architecture, based on the action VLAD
    source code, used for feature extraction.
  source_index:
  - 0
  id: MODIFIED VLAD FEATURE EXTRACTOR
- type: METHOD
  description: A method for spatio-temporal descriptor-based activity recognition.
  source_index:
  - 0
  id: IDT
