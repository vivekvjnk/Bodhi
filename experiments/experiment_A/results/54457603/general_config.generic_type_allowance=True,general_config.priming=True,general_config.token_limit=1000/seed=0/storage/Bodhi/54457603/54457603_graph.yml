  description: A large-scale video dataset used for pre-training activity recognition
    models, significantly larger than the Charades dataset.
  source_index:
  - 0
  id: KINETICS DATASET
- type: GENERIC, METHOD
  description: An attention mechanism that focuses on the most relevant features for
    each activity, preserving temporal ordering. ; A mechanism used for feature extraction
    in the proposed concurrent activity recognition model. It maintains unaggregated
    temporal information to preserve temporal ordering.
  source_index:
  - 0
  id: FEATURE-TO-ACTIVITY ATTENTION
- type: GENERIC, METHOD
  description: A deep learning architecture component used for multi-label prediction,
    designed to capture temporal dependencies and activity relationships. ; The core
    component of the proposed model used for multi-label prediction. It learns independent
    temporal associations for different activities and makes concurrent activity predictions
    while considering possible activity combinations.
  source_index:
  - 0
  id: TRI-AXIAL SELF-ATTENTION ENCODER-DECODER
