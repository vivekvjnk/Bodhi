  name: charades dataset
  source_chunk_index: 0
  type: dataset
- description: Convolutional Neural Networks.
  name: CNNs
  source_chunk_index: 0
  type: method
- description: Long Short-Term Memory networks.
  name: LSTMs
  source_chunk_index: 0
  type: method
- description: 3D Convolutional Neural Networks.
  name: 3D ConvNets
  source_chunk_index: 0
  type: method
- description: Vector of Locally Aggregated Descriptors.
  name: VLAD descriptors
  source_chunk_index: 0
  type: method
- description: A hand-crafted feature used in traditional activity recognition, capturing
    the distribution of local intensity gradients in an image.
  name: Histogram of Oriented Gradients (HOG)
  source_chunk_index: 0
  type: method
- description: A hand-crafted feature used in traditional activity recognition, representing
    the distribution of optical flow vectors, which describe the motion of pixels
    between video frames.
  name: Histogram of Optical Flow (HOF)
  source_chunk_index: 0
  type: method
- description: A novel attention mechanism designed for feature extraction in the
    proposed concurrent activity recognition model. It maintains unaggregated temporal
    information to preserve temporal ordering, allowing for different temporal attentions
    for different activities.
  name: Feature-to-Activity Attention
  source_chunk_index: 0
  type: method
- description: A core component of the proposed model used for multi-label prediction.
    It learns independent temporal associations for different activities and makes
    concurrent activity predictions while considering possible activity combinations.
  name: Tri-axial Self-Attention Encoder-Decoder
  source_chunk_index: 0
  type: method
- description: A component of the proposed model that helps the self-attention-based
    decoder better capture the associations between activities.
  name: Activity Association Mask
  source_chunk_index: 0
  type: method
