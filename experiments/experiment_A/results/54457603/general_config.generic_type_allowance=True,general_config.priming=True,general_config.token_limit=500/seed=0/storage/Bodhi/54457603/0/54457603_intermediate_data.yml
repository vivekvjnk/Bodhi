  type: GENERIC
- description: The task of identifying multiple activities happening simultaneously
    in a video.
  name: Concurrent activity recognition
  source_chunk_index: 0
  type: GENERIC
- description: A mechanism for feature extraction designed to preserve temporal ordering
    in video data.
  name: Feature-to-activity attention
  source_chunk_index: 0
  type: GENERIC
- description: A deep learning architecture used for multi-label prediction in concurrent
    activity recognition, enabling the model to learn independent temporal associations
    and predict activity combinations.
  name: Tri-axial self-attention encoder-decoder
  source_chunk_index: 0
  type: GENERIC
- description: A component used to capture relationships between activities in the
    proposed model.
  name: Activity association mask
  source_chunk_index: 0
  type: GENERIC
