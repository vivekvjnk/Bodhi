entities:
- description: The task of recognizing activities from video data.
  name: video-based activity recognition
  source_chunk_index: 0
  type: task
- description: The task of recognizing multiple activities happening simultaneously.
  name: concurrent activity recognition
  source_chunk_index: 0
  type: task
- description: A method using deep learning for activity recognition.
  name: deep learning architecture
  source_chunk_index: 0
  type: method
- description: An attention mechanism focusing on relevant features for activity recognition.
  name: feature-to-activity attention
  source_chunk_index: 0
  type: method
- description: A method using a tri-axial self-attention encoder-decoder for activity
    recognition.
  name: tri-axial self-attention encoder-decoder
  source_chunk_index: 0
  type: method
- description: A method for predicting multiple labels for activities.
  name: multi-label prediction
  source_chunk_index: 0
  type: method
- description: A mask used to identify associations between activities.
  name: activity association mask
  source_chunk_index: 0
  type: method
- description: A dataset containing hockey-related video data.
  name: hockey dataset
  source_chunk_index: 0
  type: dataset
- description: A dataset containing volleyball-related video data.
  name: volleyball dataset
  source_chunk_index: 0
  type: dataset
- description: A dataset containing charades-related video data.
  name: charades dataset
  source_chunk_index: 0
  type: dataset
- description: A hand-crafted feature used in traditional activity recognition, representing
    the distribution of gradients in an image.
  name: Histogram of Oriented Gradients (HOG)
  source_chunk_index: 0
  type: method
- description: A hand-crafted feature used in traditional activity recognition, representing
    the distribution of optical flow vectors in a video.
  name: Histogram of Optical Flow (HOF)
  source_chunk_index: 0
  type: method
- description: Convolutional Neural Networks, used for feature extraction in image
    recognition and, with modifications, in early video-based activity recognition.
  name: CNN
  source_chunk_index: 0
  type: method
- description: A combination of Convolutional Neural Networks (CNNs) and Long Short-Term
    Memory (LSTM) networks, used for video-based activity recognition to model both
    spatial and temporal information.
  name: CNN-LSTM
  source_chunk_index: 0
  type: method
- description: A probabilistic inference method used for decision-making in activity
    recognition, but which can ignore associations between activities when applied
    in concurrent activity recognition.
  name: Softmax
  source_chunk_index: 0
  type: method
- description: A layer used in single-activity recognition models, mentioned as a
    component that existing research modifies for concurrent activity recognition,
    but which has limitations in achieving satisfactory performance.
  name: Sigmoid Output Layer
  source_chunk_index: 0
  type: method
- description: A novel feature extraction mechanism designed to preserve temporal
    ordering in video-based activity recognition. It maintains unaggregated temporal
    information, allowing different activities to be associated with different temporal
    attentions.
  name: Feature-to-Activity Attention
  source_chunk_index: 0
  type: method
- description: A deep learning architecture used for multi-label prediction in concurrent
    activity recognition. It learns independent temporal associations for different
    activities and predicts activity combinations.
  name: Tri-axial Self-Attention Encoder-Decoder
  source_chunk_index: 0
  type: method
- description: A hand-crafted feature used in traditional activity recognition, capturing
    the distribution of gradients in an image.
  name: Histogram of Oriented Gradients (HOG)
  source_chunk_index: 0
  type: method
- description: A hand-crafted feature used in traditional activity recognition, capturing
    the motion information in a video sequence.
  name: Histogram of Optical Flow (HOF)
  source_chunk_index: 0
  type: method
- description: A method that combines Convolutional Neural Networks (CNNs) and Long
    Short-Term Memory (LSTM) networks for activity recognition, leveraging CNNs for
    spatial feature extraction and LSTMs for temporal association modeling.
  name: CNN-LSTM
  source_chunk_index: 0
  type: method
