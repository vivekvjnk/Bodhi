entities:
- description: The objective of identifying multiple activities happening simultaneously
    within a video.
  name: Concurrent activity recognition
  source_chunk_index: 0
  type: task
- description: A novel attention mechanism for feature extraction in concurrent activity
    recognition, designed to maintain unaggregated temporal information.
  name: Feature-to-activity attention
  source_chunk_index: 0
  type: method
- description: A method used for multi-label prediction in concurrent activity recognition,
    designed to capture temporal associations between activities.
  name: Tri-axial self-attention encoder-decoder
  source_chunk_index: 0
  type: method
- description: A dataset used to evaluate the concurrent activity recognition system,
    containing 12 activities.
  name: Hockey dataset
  source_chunk_index: 0
  type: dataset
- description: A dataset used to evaluate the concurrent activity recognition system,
    containing 9 activities.
  name: Volleyball dataset
  source_chunk_index: 0
  type: dataset
