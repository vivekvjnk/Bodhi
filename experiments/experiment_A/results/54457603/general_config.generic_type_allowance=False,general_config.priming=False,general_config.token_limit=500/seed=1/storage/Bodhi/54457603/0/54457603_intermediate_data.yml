  name: Single-activity recognition
  source_chunk_index: 0
  type: task
- description: A hand-crafted feature used in traditional activity recognition.
  name: Histogram of Oriented Gradients (HOG)
  source_chunk_index: 0
  type: method
- description: A hand-crafted feature used in traditional activity recognition.
  name: Histogram of Optical Flow (HOF)
  source_chunk_index: 0
  type: method
- description: Convolutional Neural Networks used for image classification, but not
    ideally suited for spatio-temporal associations in video-based activity recognition.
  name: 2D CNNs
  source_chunk_index: 0
  type: method
- description: Strategies that combine Convolutional Neural Networks (CNNs) with Long
    Short-Term Memory (LSTM) networks for temporal association modeling in activity
    recognition.
  name: CNN-LSTM strategies
  source_chunk_index: 0
  type: method
- description: Attention mechanisms that help networks focus on activity-associated
    features, often region-based.
  name: Spatial attention
  source_chunk_index: 0
  type: method
- description: Attention mechanisms that help networks focus on activity-associated
    features, focusing on the temporal aspect of the video.
  name: Temporal attention
  source_chunk_index: 0
  type: method
- description: A method proposed to achieve video-based activity recognition.
  name: Temporal Feature Extractor
  source_chunk_index: 0
  type: method
- description: The objective of predicting multiple activity labels simultaneously.
  name: Multi-label Prediction
  source_chunk_index: 0
  type: task
- description: A probabilistic function used for decision making in activity recognition.
  name: Softmax
  source_chunk_index: 0
  type: method
- description: A component of the proposed concurrent activity recognition model that
    helps the self-attention-based decoder better capture the associations between
    activities.
  name: Activity Association Mask
  source_chunk_index: 0
  type: method
- description: Features such as Histogram of Oriented Gradients (HOG) and Histogram
    of Optical Flow (HOF) that were traditionally used in activity recognition before
    the advent of deep learning.
  name: Hand-crafted Features
  source_chunk_index: 0
  type: method
- description: Convolutional Neural Networks, a type of deep learning architecture
    used for image recognition and, with temporal feature fusion, for activity recognition.
  name: CNN
  source_chunk_index: 0
  type: method
- description: Long Short-Term Memory networks, a type of recurrent neural network
    used for modeling temporal associations in video-based activity recognition.
  name: LSTM
  source_chunk_index: 0
  type: method
