    text_unit: "D have good performance on activity recognition .We designed a novel\
      \ deep learning architecture for recognizing concurrent activities that outperformed\
      \ stateof - the - art mechanisms in three published datasets ( charades , volleyball\
      \ , and hockey ).We hope this paper delivers the following contribution to the\
      \ society : \u2022 A modified VLAD feature extractor and novel activity mapping\
      \ layer that extracts independent features for each activity while preserving\
      \ the temporal information . \u2022 A novel triaxial self - attention that learns\
      \ independent temporal associations for different activities and makes concurrent\
      \ activity predictions aware of possible activity combinations . \u2022 A novel\
      \ use of the self - attention decoder that helps extract hidden associations\
      \ between activities and avoid redundant weights . \u2022 An implemented network\
      \ architecture that can serve as a reference for any multi - label classification\
