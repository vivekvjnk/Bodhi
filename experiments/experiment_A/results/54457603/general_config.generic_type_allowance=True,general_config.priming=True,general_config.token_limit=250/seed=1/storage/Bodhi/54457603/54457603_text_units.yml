    text_unit: Beyond single - image activity recognition , a new temporal feature
      extractor was proposed to achieve video - based activity recognition [ 1 6 ]
      .Existing research simply modifies single - activity recognition models with
      a sigmoid output layer or uses multiple single - activity recognizers for concurrent
      activity recognition ; these have failed to achieve satisfactory performance
      [ 1 8 ] .Firstly , single - activity recognition focuses on selecting the most
      representative features associated with a certain activity ; many attentionbased
      methods were proposed to improve this feature extraction .Lastly , both types
      of activity recognition use probabilistic inference ( softmax ) for decision
      making .However , simply applying softmax with a threshold or using a parallel
      softmax layer for concurrent activity recognition would ignore the associations
      between activities .To address these challenges , we introduce a concurrent
      activity recognition model with a feature - to - activity attention for feature
      extraction and a tri - axial self - attention encoder - decoder for multi -
      label prediction .The proposed feature - to - activity attention maintains unaggregated
      temporal information to preserve temporal ordering ; different activities may
      occur at different times and require different temporal attentions , which would
      be Tri - axial Self - Attention for Concurrent Activity Recognition
