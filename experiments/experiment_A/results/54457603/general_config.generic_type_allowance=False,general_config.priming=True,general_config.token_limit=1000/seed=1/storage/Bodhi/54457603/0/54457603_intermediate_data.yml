chunk_indices:
- 0
entities:
- description: The objective of identifying and understanding multiple activities
    happening simultaneously in videos.
  name: concurrent activity recognition
  source_chunk_index: 0
  type: task
- description: A novel system designed for video-based activity recognition, particularly
    for concurrent activities.
  name: deep learning architecture
  source_chunk_index: 0
  type: method
- description: The process of extracting relevant features from video data, using
    a feature-to-activity attention mechanism.
  name: feature extraction
  source_chunk_index: 0
  type: method
- description: The process of predicting multiple activities simultaneously, employing
    a tri-axial self-attention encoder-decoder.
  name: multi-label prediction
  source_chunk_index: 0
  type: method
- description: A dataset used for evaluating the performance of the activity recognition
    system.
  name: hockey dataset
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating the performance of the activity recognition
    system.
  name: volleyball dataset
  source_chunk_index: 0
  type: dataset
- description: A dataset used for evaluating the performance of the activity recognition
    system.
  name: charades datasets
  source_chunk_index: 0
  type: dataset
- description: A modified feature extractor used within the deep learning architecture.
  name: VLAD feature extractor
  source_chunk_index: 0
  type: method
- description: A novel layer within the deep learning architecture.
  name: activity mapping layer
  source_chunk_index: 0
  type: method
- description: A baseline model used for comparison in the evaluation of the activity
    recognition system.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A baseline model used for comparison in the evaluation of the activity
    recognition system.
  name: CNN-LSTM
  source_chunk_index: 0
  type: method
- description: A baseline model used for comparison in the evaluation of the activity
    recognition system.
  name: i3D
  source_chunk_index: 0
  type: method
- description: A baseline model used for comparison in the evaluation of the activity
    recognition system.
  name: non-local neural networks
  source_chunk_index: 0
  type: method
- description: A convolutional neural network architecture used as a baseline for
    framewise activity recognition.
  name: AlexNet
  source_chunk_index: 0
  type: method
- description: A model combining Convolutional Neural Networks (CNNs) and Long Short-Term
    Memory networks (LSTMs), used as a baseline for concurrent activity recognition.
  name: CNN-LSTM
  source_chunk_index: 0
  type: method
- description: A 3D convolutional neural network used as a baseline for activity recognition,
    known for its strong performance on the charades dataset.
  name: i3D
  source_chunk_index: 0
  type: method
- description: A neural network architecture that captures long-range dependencies
    in the input data, used as a baseline for activity recognition, particularly on
    the charades dataset.
  name: Non-local neural network
  source_chunk_index: 0
  type: method
- description: A modified version of the Vector of Locally Aggregated Descriptors
    (VLAD) feature extractor, used within the proposed architecture.
  name: VLAD feature extractor
  source_chunk_index: 0
  type: method
- description: A novel layer within the proposed architecture, designed to map features
    to activities.
  name: Activity mapping layer
  source_chunk_index: 0
  type: method
- description: A novel attention mechanism used for feature extraction, designed to
    preserve temporal ordering by maintaining unaggregated temporal information. Different
    activities may occur at different times and require different temporal attentions.
  name: Feature-to-Activity Attention
  source_chunk_index: 0
  type: method
- description: A novel deep learning architecture used for multi-label prediction,
    designed to capture associations between activities. It learns independent temporal
    associations for different activities and makes concurrent activity predictions
    while being aware of possible activity combinations.
  name: Tri-axial Self-Attention Encoder-Decoder
  source_chunk_index: 0
  type: method
- description: A component of the proposed architecture that helps the self-attention-based
    decoder better capture the associations between activities.
  name: Activity Association Mask
  source_chunk_index: 0
  type: method
- description: A component of the proposed architecture that learns independent temporal
    associations for different activities and makes concurrent activity predictions
    while being aware of possible activity combinations.
  name: Tri-axial Self-Attention
  source_chunk_index: 0
  type: method
