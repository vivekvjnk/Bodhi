entities:
- description: A computer vision task where models learn to segment objects from a
    limited number of examples.
  name: few-shot image segmentation
  source_chunk_index: 0
  type: task
- description: A large-scale dataset for few-shot segmentation, comprising 1000 object
    classes with pixelwise segmentation annotations.
  name: FSS-1000
  source_chunk_index: 0
  type: dataset
- description: Neural network architectures (e.g., VGG-16, ResNet-101, Inception)
    used as a foundation for image segmentation models.
  name: backbone networks
  source_chunk_index: 0
  type: method
- description: A large-scale dataset for few-shot segmentation, comprising 1000 object
    classes with pixelwise segmentation annotations.
  name: FSS-1000
  source_chunk_index: 0
  type: dataset
- description: A dataset used for object detection and segmentation, often used for
    comparison with FSS-1000.
  name: PASCAL VOC
  source_chunk_index: 0
  type: dataset
- description: A dataset used for object detection, segmentation, and captioning,
    often used for comparison with FSS-1000.
  name: MS COCO
  source_chunk_index: 0
  type: dataset
- description: ImageNet Large Scale Visual Recognition Challenge, a dataset used for
    image classification, and whose classes were referenced in the creation of FSS-1000.
  name: ILSVRC
  source_chunk_index: 0
  type: dataset
- description: The task of assigning a semantic label (e.g., 'car', 'person') to each
    pixel in an image, effectively partitioning the image into meaningful regions.
  name: Semantic Segmentation
  source_chunk_index: 0
  type: task
- description: A type of convolutional neural network (CNN) architecture designed
    for semantic segmentation, where all layers are convolutional, allowing for end-to-end
    training on dense pixel prediction tasks.
  name: Fully Convolutional Network (FCN)
  source_chunk_index: 0
  type: method
- description: A computer vision task that involves identifying and delineating individual
    object instances within an image, going beyond simple object detection to provide
    pixel-level masks for each object.
  name: Instance Segmentation
  source_chunk_index: 0
  type: task
