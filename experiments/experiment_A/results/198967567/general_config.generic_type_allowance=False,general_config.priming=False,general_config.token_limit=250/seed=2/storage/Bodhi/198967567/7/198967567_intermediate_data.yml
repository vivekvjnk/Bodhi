entities:
- description: A dataset designed for segmentation tasks, supporting instance-level
    segmentation with instance segmentation labels in a large number of classes.
  name: FSS-1000
  source_chunk_index: 0
  type: dataset
- description: The task of identifying and delineating individual objects within an
    image, providing both object detection and pixel-level segmentation.
  name: Instance segmentation
  source_chunk_index: 0
  type: task
- description: A dataset used for object detection and segmentation, serving as a
    point of comparison for FSS-1000.
  name: PASCAL VOC
  source_chunk_index: 0
  type: dataset
- description: A dataset used for object detection, segmentation, and captioning,
    also used for comparison with FSS-1000.
  name: MS COCO
  source_chunk_index: 0
  type: dataset
- description: The process of partitioning a digital image into multiple segments
    (sets of pixels), also known as image segmentation.
  name: Segmentation
  source_chunk_index: 0
  type: task
- description: A tool used for automatic object selection and segmentation, allowing
    users to refine selected areas.
  name: Photoshop "quick selection" tool
  source_chunk_index: 0
  type: method
- description: A segmentation approach where each pixel is classified as belonging
    to an object or the background, resulting in a binary representation.
  name: Pixelwise binary segmentation
  source_chunk_index: 0
  type: task
- description: The annotation principle adopted by the COCO dataset, which is relevant
    for comparison with the FSS-1000 dataset. This principle involves annotating at
    most 10 instances in a single image.
  name: COCO Annotation Principle
  source_chunk_index: 0
  type: method
