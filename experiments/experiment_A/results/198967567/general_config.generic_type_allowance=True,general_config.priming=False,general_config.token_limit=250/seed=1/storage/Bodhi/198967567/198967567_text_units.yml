    text_unit: .In this paper , we address the limitation of existing large - scale
      datasets in their biases and lack of scalability , and build the first few -
      shot segmentation dataset FSS - 1 0 0 0 emphasizing class diversity rather than
      dataset size .This baseline few - shot segmentation model , even trained exclusively
      on FSS - 1 0 0 0 without using pre - trained weights , achieves higher accuracy
      than previous methods .We further demonstrated the efficacy and potential of
      FSS - 1 0 0 0 in large - scale segmentation on totally unseen classes without
      re - training or fine - tuning , and showed its promise on few - shot instance
      segmentation and iterative few - shot recognition tasks .
