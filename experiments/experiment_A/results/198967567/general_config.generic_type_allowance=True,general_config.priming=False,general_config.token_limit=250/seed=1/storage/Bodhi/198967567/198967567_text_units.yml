      which allows users to loosely select an object automatically , and refined or
      corrected the selected area to produce the desired segmentation .This section
      summarizes the three desirable properties of FSS - 1 0 0 0 :Scalability To extend
      FSS - 1 0 0 0 to include a new class , all it takes are 1 0 images with pixelwise
      binary segmen - Figure 3 .This is significantly easier than other datasets such
      as PASCAL VOC and COCO .Instance FSS - 1 0 0 0 dataset supports instance - level
      segmentation with instance segmentation labels in 7 5 8 out of the 1, 0 0 0
      classes in the dataset , which are significantly more classes than PASCAL VOC
      and MS COCO .One major difference between our dataset and PASCAL VOC / MS COCO
      instance level segmentation is that our dataset only annotates one type of objects
      in one image , despite there may be other object categories appearing in the
      background .We annotate at most 1 0 instances in a single image , which follows
      the same instance annotation principle adopted by COCO .
