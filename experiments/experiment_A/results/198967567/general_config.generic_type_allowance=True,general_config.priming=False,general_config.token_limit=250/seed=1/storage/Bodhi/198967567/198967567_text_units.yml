      , FSS - 1 0 0 0 , which consists of 1 0 0 0 object classes with pixelwise annotation
      of ground - truth segmentation .We build our baseline model using standard backbone
      networks such as VGG - 1 6 , ResNet - 1 0 1 , and Inception .To
