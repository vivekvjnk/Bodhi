entities:
- description: A large-scale dataset for few-shot segmentation, containing 1,000 object
    classes, with 10 images labeled per class with binary segmentation annotations.
  name: FSS-1000
  source_chunk_index: 0
  type: DATASET
- description: A computer vision task where models learn to segment objects from a
    limited number of training examples.
  name: Few-Shot Segmentation
  source_chunk_index: 0
  type: TASK
- description: A dataset used for visual recognition tasks, containing image-level
    labels for 1,000 categories, used for training and evaluation.
  name: ImageNet (ILSVRC)
