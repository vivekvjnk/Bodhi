- description: A dataset containing 7,186 trainable distinct object classes for classification
    and 600 classes for detection, making it the largest existing dataset with object
    classes and location annotations.
  name: Open Image dataset
  source_chunk_index: 0
  type: dataset
- description: A fully convolutional network proposed to solve semantic segmentation,
    trained end-to-end on a fully convolutional network for dense pixel prediction.
  name: FCN
  source_chunk_index: 0
  type: method
- description: A segmentation dataset that includes more than 200,000 images with
    instance-wise semantic segmentation labels, used for comparison with FSS-1000.
  name: COCO
  source_chunk_index: 0
  type: dataset
- description: A backbone network (VGG-16) used in the study, particularly for dense
    pixel prediction in semantic segmentation. The paper mentions that the last layer
    feature maps from VGG-16 contain sufficient foreground features which can be decoded
    by the upsampling network to produce segmentation results.
  name: VGG-16
  source_chunk_index: 0
  type: method
- description: The ImageNet Large Scale Visual Recognition Challenge dataset, a subset
    of ImageNet, used for visual recognition tasks and object classification.
  name: ILSVRC
  source_chunk_index: 0
  type: dataset
- description: A two-branch network proposed to solve few-shot segmentation.
  name: OSLSM
  source_chunk_index: 0
  type: method
