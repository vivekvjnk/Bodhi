    tasks, focusing on semantic segmentation with pixelwise binary segmentation annotation
    for 1000 object classes, each with 10 images annotated.
  name: FSS-1000
  source_chunk_index: 0
  type: DATASET
- description: A computer vision task that involves assigning a class label to each
    pixel in an image.
  name: Semantic segmentation
  source_chunk_index: 0
  type: TASK
