- description: A dataset derived from PASCAL VOC 2012, used for few-shot segmentation.
    It involves converting the PASCAL VOC 2012 dataset by setting the desired foreground
    class label as positive and all others as negative, followed by a clean-up stage
    to binarize the labels. It contains 4,318 image and label pairs in 20 object classes.
  name: fsPASCAL
  source_chunk_index: 0
  type: dataset
- description: A dataset derived from the COCO dataset, used for few-shot segmentation.
    It involves converting the COCO dataset by setting the desired foreground class
    label as positive and all others as negative, followed by a clean-up stage to
    binarize the labels. It contains 48,015 image and label pairs in 80 object classes.
  name: fsCOCO
  source_chunk_index: 0
  type: dataset
- description: The primary few-shot segmentation dataset introduced in the paper,
